l model-implied valuation gain from buying the quoted calls, rounded to the nearest dollar?", "answer": "$130,117", "feedback": "Verdict: Correct\n\nAnalysis: The student's final answer matches my independently derived result. The scenario's inputs resolve cleanly: spot price of $100 (market cap \u00f7 shares), strike of $100 (VWAP = $1.250B \u00f7 12.500M shares), a continuously compounded risk-free rate of exactly 5% (the bond price is e^(\u22120.05) \u00d7 100), time to maturity of exactly 1 year under ACT/365, and an annualized volatility of exactly 20% (sample variance with n\u22121 = 251 divisor, annualized by 252, yields \u03c3\u00b2 = 0.04). Plugging these into Black\u2013Scholes gives d\u2081 = 0.35 and d\u2082 = 0.15, producing a model call value of approximately $10.4506 per share. The per-share edge over the $9.80 quote is approximately $0.6506, and across 200,000 shares (2,000 contracts \u00d7 100 shares) the total gain is approximately $130,117 when rounded to the nearest dollar. The student's answer of $130,117 is correct.\n\nAmbiguities: The phrase \"The sum of squared deviations of those daily log returns from their sample mean is 0.03984126984. Annualize the sample variance using 252 trading days per year\" could invite an alternative interpretation: dividing by n = 252 (population variance) instead of n \u2212 1 = 251 (sample variance). Using n = 252 would yield \u03c3\u00b2 \u2248 0.039841 (\u03c3 \u2248 0.19960), a slightly lower call value (~$10.4346), and a total gain of roughly $126,900. However, the explicit use of the term \"sample variance\" strongly signals the n \u2212 1 divisor, which is also clearly the intended construction since it produces the clean \u03c3\u00b2 = 0.04. Additionally, \"prior 252 trading days of log returns\" leaves a slight ambiguity as to whether 252 refers to the number of returns or the number of price observations, though the intended reading (252 returns, n \u2212 1 = 251) is evident from the engineered numbers.", "verdict": "Correct"}];

const VERDICTS = {
  "Correct": "correct",
  "Partially Correct due to rounding or minor variations": "partial",
  "Incorrect": "incorrect"
};

function cls(verdict) { return VERDICTS[verdict] || "incorrect"; }
function shortVerdict(v) { return v === "Partially Correct due to rounding or minor variations" ? "Partial" : v; }

let filter = "all";
let query = "";
let selected = null;

const statsEl = document.getElementById("stats");
const listPanel = document.getElementById("list-panel");
const detailPanel = document.getElementById("detail-panel");
const countLabel = document.getElementById("count-label");
const searchEl = document.getElementById("search");

// Build stats
const counts = { all: RAW.length, correct: 0, partial: 0, incorrect: 0 };
RAW.forEach(e => { counts[cls(e.verdict)]++; });

function renderStats() {
  statsEl.innerHTML = [
    { key: "all", label: `All  ${counts.all}` },
    { key: "correct", label: `Correct  ${counts.correct}` },
    { key: "partial", label: `Partial  ${counts.partial}` },
    { key: "incorrect", label: `Incorrect  ${counts.incorrect}` },
  ].map(s => `<div class="stat ${s.key} ${filter === s.key ? "active" : ""}" data-key="${s.key}">${s.label}</div>`).join("");

  statsEl.querySelectorAll(".stat").forEach(el => {
    el.addEventListener("click", () => { filter = el.dataset.key; selected = null; render(); });
  });
}

function highlight(text, q) {
  if (!q) return escHtml(text);
  const escaped = q.replace(/[.*+?^${}()|[\]\\]/g, "\\$&");
  return escHtml(text).replace(new RegExp(escaped, "gi"), m => `<mark>${m}</mark>`);
}

function escHtml(s) {
  return s.replace(/&/g,"&amp;").replace(/</g,"&lt;").replace(/>/g,"&gt;");
}

function getFiltered() {
  return RAW.filter(e => {
    if (filter !== "all" && cls(e.verdict) !== filter) return false;
    if (query) {
      const q = query.toLowerCase();
      return e.problem.toLowerCase().includes(q) || e.feedback.toLowerCase().includes(q) || e.answer.toLowerCase().includes(q);
    }
    return true;
  });
}

function parseFeedback(fb) {
  const sections = {};
  // Extract Verdict line
  const verdictMatch = fb.match(/^Verdict:\s*(.+)/m);
  if (verdictMatch) sections.verdict = verdictMatch[1].trim();
  
  // Extract Analysis
  const analysisMatch = fb.match(/Analysis:\s*([\s\S]*?)(?=\n\nAmbiguities:|$)/);
  if (analysisMatch) sections.analysis = analysisMatch[1].trim();
  
  // Extract Ambiguities
  const ambigMatch = fb.match(/Ambiguities:\s*([\s\S]*?)$/);
  if (ambigMatch) sections.ambiguities = ambigMatch[1].trim();
  
  return sections;
}

function renderDetail(entry) {
  const q = query;
  const fb = parseFeedback(entry.feedback);
  detailPanel.innerHTML = `
    <div class="detail-header">
      <h2>Entry #${entry.entry_id}</h2>
      <span class="badge ${cls(entry.verdict)}">${escHtml(shortVerdict(entry.verdict))}</span>
    </div>
    <div class="section">
      <div class="section-label">Problem</div>
      <div class="section-body">${highlight(entry.problem, q)}</div>
    </div>
    <div class="section">
      <div class="section-label">Answer</div>
      <div class="section-body answer">${highlight(entry.answer, q)}</div>
    </div>
    <div class="section">
      <div class="section-label">Feedback</div>
      <div class="feedback-block">
        ${fb.analysis ? `<div class="feedback-section"><div class="feedback-section-label">Analysis</div>${highlight(fb.analysis, q)}</div>` : ""}
        ${fb.ambiguities ? `<div class="feedback-section"><div class="feedback-section-label">Ambiguities</div>${highlight(fb.ambiguities, q)}</div>` : ""}
      </div>
    </div>
  `;
}

function render() {
  renderStats();
  const filtered = getFiltered();
  countLabel.textContent = `${filtered.length} of ${RAW.length} entries`;

  const rows = filtered.map(entry => {
    const snippet = entry.problem.replace(/\*\*/g,"").replace(/\*/g,"").replace(/\n/g," ").trim().slice(0, 90) + "…";
    const isSelected = selected === entry.entry_id;
    return `<div class="entry-row ${isSelected ? "selected" : ""}" data-id="${entry.entry_id}">
      <div class="entry-id">#${entry.entry_id}</div>
      <div class="entry-preview">
        <span class="badge ${cls(entry.verdict)}">${escHtml(shortVerdict(entry.verdict))}</span>
        <div class="snippet">${escHtml(snippet)}</div>
      </div>
    </div>`;
  }).join("");

  // Preserve scroll position
  const scrollTop = listPanel.scrollTop;
  listPanel.innerHTML = `<div class="count-label">${filtered.length} of ${RAW.length} entries</div>` + rows;
  listPanel.scrollTop = scrollTop;

  listPanel.querySelectorAll(".entry-row").forEach(el => {
    el.addEventListener("click", () => {
      selected = +el.dataset.id;
      const entry = RAW.find(e => e.entry_id === selected);
      renderDetail(entry);
      render();
      // scroll selected into view
      el.scrollIntoView({ block: "nearest" });
    });
  });

  if (selected !== null) {
    const entry = RAW.find(e => e.entry_id === selected);
    if (entry) renderDetail(entry);
  }
}

searchEl.addEventListener("input", () => { query = searchEl.value.trim(); selected = null; render(); });

render();
</script>
</body>
</html>
