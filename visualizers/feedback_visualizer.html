is projected. This $0.35 \u00d7 1,500 = $525 discrepancy precisely explains the gap between their answer and the correct one.\n\nAmbiguities: The phrase \"project that distance upward from the breakout level\" could conceivably be misread as projecting from the actual fill price ($72.75) rather than the resistance line ($72.40). However, the \"standard classical charting method\" explicitly referenced in the question projects from the horizontal resistance, making $79.70 the intended target. Notably, even under the alternative interpretation (target = $72.75 + $7.30 = $80.05, entry = $72.75), the profit would still be $7.30 \u00d7 1,500 = $10,950 \u2014 which matches the student's answer. So the student may have used this alternative reading rather than simply forgetting the entry premium; nonetheless, under the standard convention stipulated by the question, the answer is incorrect.", "verdict": "Incorrect"}, {"entry_id": 217, "problem": "* Scenario: An asset-swap desk is evaluating a matched 5-year asset swap on a corporate bond with $60,000,000 face value. The bond is quoted at a spread of 137 bps over the 5-year government benchmark yield of 4.18%. The fixed swap rate is quoted as the 5-year OIS par rate of 3.92% plus a 48 bps swap basis. The bond\u2019s clean purchase price is 101.35 per 100 of face value, and the desk treats the amount above par as the price premium percentage for the asset-swap-spread calculation. The risk committee requires a minimum asset swap spread of 0.15%. The desk defines annualized dollar excess versus the hurdle as:  \n  \\[\n  (\\text{asset swap spread} - \\text{hurdle spread}) \\times \\text{notional}\n  \\]\n  with percentage-point spreads converted to decimals.\n\n* The Core Question: What is the annualized dollar excess or shortfall versus the hurdle, rounded to the nearest whole dollar? Report a negative number if it is a shortfall.", "answer": "-$210,000", "feedback": "Verdict: Correct\n\nAnalysis: My independently derived result matches the student's answer of \u2212$210,000. Working internally: the bond's all-in yield is the benchmark plus its quoted spread (4.18% + 1.37% = 5.55%), the swap fixed rate is the OIS par rate plus the basis (3.92% + 0.48% = 4.40%), and the price premium percentage is the amount above par (101.35 \u2212 100 = 1.35%). Applying the question's stated treatment literally \u2014 subtracting the full price premium percentage in the asset-swap-spread calculation \u2014 gives 5.55% \u2212 4.40% \u2212 1.35% = \u22120.20%. The excess versus the 0.15% hurdle is (\u22120.20% \u2212 0.15%) \u00d7 $60,000,000 = \u2212$210,000, a shortfall, which the student correctly reported as a negative number. The student's answer is internally consistent with the question's prescribed methodology and the instruction to report shortfalls as negative values.\n\nAmbiguities: The phrase \"the desk treats the amount above par as the price premium percentage for the asset-swap-spread calculation\" is the principal source of ambiguity. In standard market practice, the simplified (yield-yield) asset swap spread amortizes the price premium over the bond's remaining life (i.e., 1.35% \u00f7 5 years = 0.27% per annum), which would yield an ASW spread of 0.88% and an excess of +$438,000. The question does not explicitly state whether the premium should be applied in full or amortized over the 5-year tenor, so a student applying the conventional amortized approach could defensibly arrive at a different answer. However, the literal reading of the question's stated formula \u2014 combined with the prompt's explicit instruction to \"report a negative number if it is a shortfall\" (which only matters under the non-amortized interpretation) \u2014 supports \u2212$210,000 as the intended answer.", "verdict": "Correct"}, {"entry_id": 218, "problem": "* Scenario: Apex Tech (APX) has formed an ascending triangle over the last two weeks. The flat upper resistance line is defined by three intraday highs at **$82.40**. The earliest swing low on the rising support line, representing the pattern\u2019s widest vertical distance from resistance, is **$76.15**. On the breakout day, APX closes above resistance at **$83.10**, and a fund buys **3,500 shares** at that closing price. The trading desk\u2019s rule defines the breakout point used for stop-loss placement as the broken resistance level itself, not the execution price. If the stop is later triggered, assume it is filled exactly at the computed stop-loss price, with no commissions, slippage, or taxes.\n\n* The Core Question: Using the ascending-triangle stop-loss rule, what is the fund\u2019s total dollar loss if the stop is triggered, rounded to the nearest whole dollar?", "answer": "**$24,325**", "feedback": "Verdict: Correct\n\nAnalysis: The student's final answer of **$24,325** matches my independently derived result. The pattern height is the vertical distance between the flat resistance ($82.40) and the earliest swing low ($76.15), i.e., $6.25. Applying the stop-loss rule from the broken resistance level (the defined breakout point of $82.40) rather than the execution price yields a stop at $76.15. Since the fund entered 3,500 shares at $83.10, the per-share loss upon a stop fill is $6.95, producing a total dollar loss of exactly $24,325. The student correctly used the breakout point ($82.40) \u2014 not the entry price ($83.10) \u2014 as the anchor for the stop calculation, while properly computing the realized loss relative to the actual purchase price. No rounding issues arise since the figures resolve to a whole dollar amount naturally.\n\nAmbiguities: The phrase \"Using the ascending-triangle stop-loss rule\" is the primary source of ambiguity, as no single universally standardized stop-loss rule exists for ascending triangles. Some practitioners place the stop **one-half** the pattern height below the breakout point (which would give a stop of $79.275 and a loss of $13,387.50 \u2014 or $13,388 rounded), while others place it just below the breakout level by a small buffer. The question implicitly expects the **full pattern height** measured down from the breakout point (coinciding here with the swing low at $76.15), but this convention is not explicitly stated. Additionally, the phrase \"the breakout point used for stop-loss placement as the broken resistance level itself\" clarifies the anchor but not the offset magnitude, leaving the rule's distance component open to interpretation.", "verdict": "Correct"}, {"entry_id": 219, "problem": "* Scenario:  \nA trader identifies an ascending triangle in shares of Orion Tech (OTC). During the pattern, the flat resistance line is defined by repeated intraday highs at **$48.60**. The lowest reaction low at the widest part of the triangle is **$42.15**.  \nOn the breakout day, the trader\u2019s buy-stop order is triggered when the stock first trades above resistance at **$49.05**. The breakout is upward.  \nThe trader buys **2,400 shares** at the breakout price and plans to sell all shares exactly at the classical ascending-triangle profit target. Brokerage commissions are **$0.005 per share per side**, with no other fees or slippage.\n\n* The Core Question:  \nWhat is the trader\u2019s **net dollar profit after round-trip commissions**, rounded to the nearest whole dollar?", "answer": "**$15,456**", "feedback": "Verdict: Incorrect\n\nAnalysis: The student's final answer of $15,456 does not match my independently derived result of **$14,376**. The classical measure rule for an ascending triangle adds the pattern height (resistance minus the lowest reaction low: $48.60 \u2212 $42.15 = $6.45) to the **resistance level** ($48.60), giving a target of $55.05. Since entry occurred at $49.05, the per-share gross gain is $6.00, yielding $14,400 gross on 2,400 shares, less $24 in round-trip commissions ($0.005 \u00d7 2 sides \u00d7 2,400 shares), for a net profit of $14,376. The student's figure of $15,456 corresponds exactly to ($6.45 \u2212 $0.01) \u00d7 2,400, which reveals their error: they projected the target from the **entry/breakout price** ($49.05 + $6.45 = $55.50) rather than from the resistance line. This is a common conceptual mistake \u2014 the measure rule projects from the breakout point of the pattern boundary (the flat resistance), not from the trader's actual fill price.\n\nAmbiguities: The phrase \"classical ascending-triangle profit target\" could arguably invite confusion, as some practitioners loosely describe the target as \"height added to the breakout point,\" and the question separately labels $49.05 as \"the breakout price.\" A student could latch onto that wording and project the height from $49.05. However, the standard textbook convention (e.g., Bulkowski, Edwards & Magee) is unambiguous that the height is added to the horizontal resistance line ($48.60), so the intended answer is well-defined; the question could be made airtight by explicitly stating \"measured from the resistance level.\"", "verdict": "Incorrect"}, {"entry_id": 220, "problem": "* Scenario: A company creates a monthly sinking fund to cover a technology upgrade scheduled for December 31, 2029. An employee earns a fixed annual salary of $90,000, paid evenly each month. The company contributes 8% of each month\u2019s salary payment into the sinking fund at the beginning of each month, starting January 1, 2025, with the final contribution made on December 1, 2029. The fund earns a nominal annual interest rate of 6%, compounded monthly. The upgrade will require exactly $45,000 on December 31, 2029.\n\n* The Core Question: After accumulating all monthly contributions with interest, what lump-sum dollar shortfall must the company contribute on December 31, 2029 to fully fund the upgrade, rounded to the nearest whole dollar?", "answer": "**$2,929**", "feedback": "Verdict: Correct\n\nAnalysis: The student's final answer of $2,929 matches my independently derived result. The monthly contribution is 8% of the $7,500 monthly salary ($600), accumulated as a 60-payment annuity-due (payments at the beginning of each month from January 1, 2025 through December 1, 2029) at a monthly rate of 0.5%, valued as of December 31, 2029. The accumulated fund value comes to approximately $42,071.33, leaving a shortfall of $45,000 \u2212 $42,071.33 \u2248 $2,928.67, which rounds to $2,929. The student correctly recognized the annuity-due structure (each payment earns interest through the end of the month in which it's made, with the final December 1, 2029 payment earning one month of interest by December 31, 2029).\n\nAmbiguities: The phrase \"contributes 8% of each month's salary payment into the sinking fund at the beginning of each month\" combined with the valuation date of December 31, 2029 is mostly clear, but a careless reader could misinterpret the timing convention. Specifically, \"with the final contribution made on December 1, 2029\" makes the annuity-due structure explicit; however, a student treating the cash flows as an ordinary annuity (payments at month-end, last payment December 31, 2029) would arrive at a shortfall of approximately $3,138 instead. Additionally, \"rounded to the nearest whole dollar\" is precise, but the problem does not specify whether intermediate values should be rounded, which could cause trivial penny-level variations. These do not affect the student's answer, which reflects the intended interpretation.", "verdict": "Correct"}, {"entry_id": 221, "problem": "* Scenario: An investor purchased 400 shares of Orion Tech on March 1, 2021, at $45.00 per share and paid a $100 purchase commission, which is included in tax basis. On June 1, 2023, Orion Tech completed a 2-for-1 stock split. On February 1, 2026, the investor sold 37.5% of the post-split shares at a quoted market price of $31.00 per share. The brokerage charged a flat $30 selling commission, deducted from the sale proceeds. The entire realized gain is taxed at a 15% long-term capital gains tax rate.\n\n* The Core Question: What is the federal long-term capital gains tax generated by this sale, rounded to the nearest cent?", "answer": "$372.38", "feedback": "Verdict: Correct\n\nAnalysis: The student's final answer of $372.38 matches my independently derived result. Working through it internally: the total tax basis (purchase cost plus commission) spread over the post-split share count yields a per-share basis of $22.625; selling 300 shares (37.5% of 800) produces net proceeds of $9,270.00 after the selling commission, a realized gain of $2,482.50, and a 15% tax of $372.375, which rounds to $372.38. The student correctly included the purchase commission in basis, correctly deducted the selling commission from proceeds, correctly adjusted for the split, and applied the rounding convention properly.\n\nAmbiguities: The question is largely precise, but two minor points invite alternative interpretations: (1) \"sold 37.5% of the post-split shares\" \u2014 37.5% of 800 conveniently yields a whole number (300 shares), so no fractional-share issue arises here, but the phrasing implicitly assumes shares are perfectly divisible; (2) the question does not specify a cost-basis method (e.g., FIFO, average cost), though since all shares come from a single lot with a uniform basis, this has no effect on the result.", "verdict": "Correct"}, {"entry_id": 222, "problem": "* Scenario: A credit fund is evaluating a one-year asset-swap package on **$25,000,000 face value** of a senior bond. Settlement occurs immediately after the annual coupon date, so **clean price equals dirty price** and there is **no accrued interest**. The bond matures exactly one year from settlement, pays one remaining annual coupon of **7.20% of par**, and redeems at **100**. It can be purchased at **101.00 per 100 of par**.  \n  The matched one-year swap rate is not directly quoted. The mid-market par swap curve shows **4.50% for 9 months** and **4.80% for 15 months**, and the desk uses linear interpolation by maturity. Any bond purchase price above par is treated as a premium paid over the one-year swap life.  \n  The investment committee requires the premium-adjusted asset-swap spread to exceed **35 basis points**.  \n\n* The Core Question: What is the **net annual dollar surplus over the 35 bp hurdle**, rounded to the nearest whole dollar? A positive value means the trade clears the hurdle.", "answer": "**$34,653**", "feedback": "Verdict: Incorrect\n\nAnalysis: My independently derived result does not match the student's answer. The interpolated one-year swap rate is 4.65% (midpoint of 4.50% at 9M and 4.80% at 15M). The premium-adjusted asset-swap spread under the standard simple treatment is the 7.20% coupon minus the 4.65% swap rate minus the 1.00% premium amortized over the one-year life, giving 1.55% (155 bp). The surplus over the 35 bp hurdle is 120 bp, which on $25,000,000 face value equals **$300,000**. Even under a more rigorous par-asset-swap construction (discounting cash flows at 4.65% and dividing the price gap by the one-period annuity), the spread is \u2248150.4 bp, a surplus of \u2248115.4 bp, or roughly **$288,400** \u2014 still nowhere near the student's figure. The student's answer of $34,653 implies a surplus of only ~13.9 bp (i.e., a spread of ~48.9 bp), which suggests a serious conceptual error \u2014 most likely the student incorrectly netted the full $250,000 dollar premium against the spread cash flow (or some discounted version of it) rather than treating the premium as a 100 bp annual amortization within the spread itself, and/or applied discounting to a dollar figure inconsistently. The result is off by roughly an order of magnitude from any defensible methodology.\n\nAmbiguities: The phrase \"premium-adjusted asset-swap spread\" combined with \"Any bond purchase price above par is treated as a premium paid over the one-year swap life\" does not specify whether the premium amortization should be a simple straight-line deduction (1.00% per annum, yielding a 155 bp spread and a $300,000 surplus) or whether the premium should be annuitized/discounted at the swap rate (yielding \u2248150.4 bp and \u2248$288,400). This invites two legitimately different final dollar figures. However, the student's answer of $34,653 is not consistent with either reasonable interpretation, so the ambiguity does not rescue the submission.", "verdict": "Incorrect"}, {"entry_id": 223, "problem": "* Scenario: A credit card billing cycle runs from May 1 through May 30, inclusive. The account has an opening balance of $1,200.00 at the start of May 1. The card issuer uses the average daily balance method, includes current-cycle purchases, and each transaction affects the balance beginning on its posting date. The APR is 21.90%, computed using a 365-day year. No fees apply, and finance charges are rounded to the nearest cent only when the statement is generated. Transactions during the cycle are:\n  * May 6: purchase of $300.00\n  * May 14: payment of $500.00\n  * May 21: purchase of $150.00\n\n  The account\u2019s credit limit is $1,170.00.\n\n* The Core Question: After the finance charge is posted at the end of the billing cycle, is the account over the credit limit, and if so, by how many dollars? Round to the nearest cent.", "answer": "$1.90 over the limit", "feedback": "Verdict: Correct\n\nAnalysis: The student's final answer matches my independently derived result. Working through the cycle internally: the balance segments are $1,200 (May 1\u20135), $1,500 (May 6\u201313), $1,000 (May 14\u201320), and $1,150 (May 21\u201330), yielding an average daily balance of exactly $1,216.666..., a finance charge of exactly $21.90 (the 365-day daily periodic rate of 0.0006 applied over 30 days), and an ending balance of $1,171.90. Against the $1,170.00 credit limit, the account is over by precisely $1.90. The student correctly identified both that the account exceeds the limit and the exact dollar amount of the excess.\n\nAmbiguities: The phrase \"the average daily balance method\" leaves some room for interpretation regarding whether payments are included in the daily balance calculation (some issuers compute ADB \"excluding payments\" or use the adjusted balance method), though the standard convention \u2014 which the question's phrasing \"includes current-cycle purchases, and each transaction affects the balance beginning on its posting date\" strongly implies \u2014 is to net all transactions daily. Additionally, \"finance charges are rounded to the nearest cent only when the statement is generated\" could invite a student to carry unrounded intermediate values, but since the charge here is exactly $21.90, no rounding discrepancy arises. Finally, one could question whether the finance charge multiplier should use 30 days versus interpreting the period differently, but \"May 1 through May 30, inclusive\" makes the 30-day cycle unambiguous.", "verdict": "Correct"}, {"entry_id": 224, "problem": "* Scenario: On 15 July 2026, a trader is evaluating a long equity trade in Meridian Robotics Inc. The trader would buy 1,800 shares at an expected execution price of **$84.25** per share. If the trade moves against the position, the stop-loss order is expected to sell the shares at **$81.65** per share. If the trade reaches the profit target, the take-profit order is expected to sell the shares at **$91.55** per share. The broker charges **$0.015 per share on every buy or sell execution**, so the evaluation must be net of all entry and exit trading fees. The trading desk permits only trades whose loss-to-potential-gain measure is **no greater than 0.3600**.\n\n* The Core Question: What is the trade\u2019s pass/fail decision, and by how many basis points does its loss-to-potential-gain measure fall below or exceed the desk\u2019s maximum allowed level? Round the basis-point difference to **2 decimal places**.", "answer": "**Fail; exceeds the maximum allowed level by 17.61 basis points.**", "feedback": "Verdict: Correct\n\nAnalysis: The student's final answer matches my independently derived result. Incorporating the $0.015 per-share fee on both the entry and each exit leg, the net per-share loss at the stop is the $2.60 price gap plus $0.03 in round-trip fees, and the net per-share gain at the target is the $7.30 price gap minus $0.03 in fees. The resulting loss-to-potential-gain ratio is approximately 0.361761, which exceeds the desk's 0.3600 limit. The excess of about 0.00176066, expressed in basis points (1 bp = 0.0001 of the ratio), rounds to 17.61 bp. The decision \"Fail\" and the magnitude \"exceeds by 17.61 basis points\" are both correct.\n\nAmbiguities: The phrase \"by how many basis points does its loss-to-potential-gain measure fall below or exceed the desk's maximum allowed level\" assumes the ratio itself is measured in basis-point units (1 bp = 0.0001 of the raw ratio), which is a nonstandard use of \"basis points\" (typically reserved for interest rates or percentage returns); a student could conceivably interpret the difference as a percentage of the limit instead. Additionally, \"loss-to-potential-gain measure\" is not explicitly defined as net-loss \u00f7 net-gain, though the instruction that \"the evaluation must be net of all entry and exit trading fees\" makes the intended fee treatment reasonably clear.", "verdict": "Correct"}, {"entry_id": 225, "problem": "* Scenario: A pension plan evaluates a liquid alternative fund over the most recent calendar year. On January 1, it invested $25,000,000. There were no additional contributions or withdrawals during the year. On December 31, the account\u2019s market value was $27,875,000, and the fund also paid the pension plan a $625,000 cash distribution that same day. For the same one-year horizon, a Treasury strip purchased on January 1 for exactly $95.2380952381 per $100 face value matured on December 31 at $100. The fund\u2019s monthly simple returns over the year had a sample standard deviation of 2.50% per month; annualize this volatility by multiplying by \u221a12. The investment committee requires the fund\u2019s annual Sharpe ratio to exceed a benchmark Sharpe ratio of 0.900.\n\n* The Core Question: What is the fund\u2019s signed Sharpe-ratio spread relative to the committee\u2019s benchmark, rounded to three decimals? A positive value means the fund exceeds the benchmark.", "answer": "+0.139", "feedback": "Verdict: Correct\n\nAnalysis: The student's final answer of +0.139 matches my independently derived result. The total return incorporates both the appreciation in market value and the cash distribution, the Treasury strip pricing implies the annual risk-free rate, and the annualized volatility follows from scaling the monthly standard deviation by \u221a12. The resulting Sharpe ratio of approximately 1.039, less the 0.900 benchmark, yields a spread of approximately +0.139 when rounded to three decimals. The sign convention (positive indicating outperformance) is also correctly applied.\n\nAmbiguities: The phrase \"the fund also paid the pension plan a $625,000 cash distribution that same day\" could conceivably invite confusion about whether the distribution is already included in the $27,875,000 ending market value, though the wording \"also paid\" reasonably implies it is in addition to the stated account value. Additionally, \"annualize this volatility by multiplying by \u221a12\" removes a common ambiguity, but the question does not specify whether the annual excess return should be computed arithmetically (R \u2212 Rf) or geometrically ((1+R)/(1+Rf) \u2212 1); the standard arithmetic convention yields the expected answer.", "verdict": "Correct"}, {"entry_id": 226, "problem": "* Scenario:  \nA U.S. C corporation is preparing an amended federal income tax return for tax year 2017 to claim the former Section 199 domestic production deduction. Assume the corporate tax rate is 35%, no credits or AMT apply, and taxable income before this deduction is high enough that no taxable-income cap binds.\n\n  During 2017, the corporation had the following domestic manufacturing activity:\n\n  * Gross receipts from products manufactured in the United States: $12,400,000  \n  * Customer returns and allowances on those products: $300,000  \n  * Cost of goods sold allocable to those products: $7,150,000  \n  * Other direct production expenses allocable to those products: $600,000  \n  * Allocable SG&A expenses related to those products: $900,000  \n\n  Its payroll records show the following amounts:\n\n  * W-2 wages paid to U.S. plant production employees: $420,000  \n  * W-2 wages paid to quality-control engineers working on the same domestic production: $110,000  \n  * W-2 wages paid to packaging and shipping employees for the domestic manufactured products: $80,000  \n  * W-2 wages paid to employees working only on imported resale products: $150,000  \n  * Payments to independent contractors assisting production: $70,000  \n\n  Under the former Section 199 rules, the domestic production deduction is subject to the statutory percentage of qualified production activities income and the W-2 wage limitation.\n\n* The Core Question:  \nWhat is the corporation\u2019s federal income tax reduction from claiming the domestic production deduction, rounded to the nearest dollar?", "answer": "$106,750", "feedback": "Verdict: Correct\n\nAnalysis: The student's final answer of $106,750 matches my independently derived result. The qualified production activities income (after reducing gross receipts by returns and subtracting COGS, direct production expenses, and allocable SG&A) yields a tentative deduction at the 9% statutory rate of $310,500. However, the W-2 wage limitation \u2014 50% of qualifying W-2 wages (production employees, quality-control engineers, and packaging/shipping employees, while properly excluding wages tied solely to imported resale products and payments to independent contractors, which are not W-2 wages) \u2014 caps the deduction at $305,000. Applying the 35% corporate rate to the capped deduction produces a tax reduction of exactly $106,750. The student correctly identified that the wage limitation binds and correctly excluded the non-qualifying compensation amounts.\n\nAmbiguities: The phrase \"W-2 wages paid to employees working only on imported resale products: $150,000\" could theoretically tempt a test-taker if the question did not make clear that only wages allocable to domestic production gross receipts count under the post-2005 rules; however, the scenario's framing (\"for the domestic manufactured products\" vs. \"only on imported resale products\") makes the intended allocation sufficiently clear. Similarly, \"Payments to independent contractors\" might confuse students about whether such payments count as W-2 wages, but by definition they do not, and the question's labeling is precise. Overall, the question is effectively unambiguous.", "verdict": "Correct"}, {"entry_id": 227, "problem": "* Scenario:  \nA manufacturing firm purchases a specialized machine. The supplier\u2019s list price is **$640,000**, but the firm receives a **10% trade discount**. The discounted purchase price is subject to a **5% nonrefundable sales tax**. The firm also pays **$18,200** for freight-in and **$17,000** for installation and testing. Separately, it pays **$6,000** for employee training and **$9,000** for the first year\u2019s maintenance contract; these two items are expensed immediately and are not capitalized.\n\nThe machine is placed into service at the beginning of fiscal year 2026 and will be used for **5 full fiscal years**, through the end of fiscal year 2030. At disposal, the firm expects to sell the machine for **$150,000** and incur **$10,000** of removal and selling costs.\n\nFor book and tax planning, the firm depreciates the machine using an accelerated declining-balance policy: the annual depreciation percentage equals **twice the straight-line rate over the asset\u2019s useful life**, and each year\u2019s depreciation is applied to the remaining unrecovered depreciable amount. The firm does **not** switch to straight-line depreciation.\n\nThe corporate tax rate is **25%**, tax savings are realized at each year-end, and the firm discounts these tax shields at **10% annually**.\n\n* The Core Question:  \nWhat is the **present value of the depreciation tax shields over the machine\u2019s 5-year life**, rounded to the nearest dollar?", "answer": "**$95,172**", "feedback": "Verdict: Correct\n\nAnalysis: The student's final answer of **$95,172** matches my independently derived result exactly. The capitalized cost works out to $640,000 (discounted price plus nonrefundable sales tax, freight-in, and installation; training and maintenance correctly excluded). Using a depreciable base net of expected net salvage ($150,000 \u2212 $10,000 = $140,000) yields a $500,000 depreciable amount, and applying the 40% double-declining rate to the remaining unrecovered depreciable balance each year produces depreciation of $200,000; $120,000; $72,000; $43,200; and $25,920. The resulting 25% tax shields ($50,000; $30,000; $18,000; $10,800; $6,480), discounted at 10% as year-end flows, sum to $95,171.71, which rounds to $95,172. The student correctly identified the capitalizable costs, correctly excluded the expensed items, applied the declining-balance method to the salvage-adjusted base as specified, and did not switch to straight-line. The answer is fully correct.\n\nAmbiguities: The phrase \"each year's depreciation is applied to the remaining unrecovered **depreciable amount**\" is the key potential ambiguity. Standard double-declining-balance practice applies the rate to the remaining **book value (cost basis)** and ignores salvage until a floor is reached, which would give Year 1 depreciation of 40% \u00d7 $640,000 = $256,000 and a materially different PV (~$121,820 before any salvage-floor adjustment). The question's wording \"depreciable amount\" implies cost minus net salvage ($500,000), which is the interpretation the student adopted and the one most consistent with the literal text \u2014 but a student trained on conventional DDB could reasonably apply the rate to the full cost. Additionally, \"expects to sell the machine for $150,000 and incur $10,000 of removal and selling costs\" requires the solver to infer that the **net** salvage of $140,000 reduces the depreciable base; the question never explicitly states that salvage should be netted into the depreciable amount.", "verdict": "Correct"}, {"entry_id": 228, "problem": "* Scenario: A pension plan is evaluating a long-only equity manager over the most recent calendar year. On January 1, the plan allocated \\$10,000,000 to the manager. There were no deposits or withdrawals during the year, and all dividends were reinvested. On December 31, the account value was \\$11,080,000.  \n  At the start of the year, a default-free 1-year zero-coupon Treasury bill with \\$1,000,000 face value was priced at \\$970,873.79.  \n  The risk team estimates annual volatility by taking the sample standard deviation of the manager\u2019s 12 monthly total returns and multiplying by \\(\\sqrt{12}\\). The monthly total returns were:  \n  \\[\n  1\\%,\\ 3\\%,\\ -1\\%,\\ 5\\%,\\ 0\\%,\\ 2\\%,\\ 4\\%,\\ -2\\%,\\ 6\\%,\\ 1\\%,\\ 3\\%,\\ -1\\%.\n  \\]  \n  The investment committee approves managers only if their annual excess-return-per-unit-risk score, defined as annual excess return divided by annualized volatility, exceeds 0.800.\n\n* The Core Question: What is the manager\u2019s score spread over the committee cutoff, and should the manager be approved? Round the spread to three decimals.", "answer": "Approve; +0.091", "feedback": "Verdict: Correct\n\nAnalysis: The student's final answer matches my independently derived result. Working internally: the annual total return on the account is 10.8%, the implied risk-free rate from the T-bill pricing is 3.0%, giving an annual excess return of 7.8%. The sample standard deviation of the 12 monthly returns (using n\u22121 = 11 in the denominator, as \"sample standard deviation\" dictates) annualizes via \u221a12 to approximately 8.754%. The resulting score is approximately 0.891, which exceeds the 0.800 cutoff by approximately 0.091. The student's spread of +0.091 and the \"Approve\" decision are both correct.\n\nAmbiguities: \n1. \"sample standard deviation\" \u2014 while this term conventionally implies the n\u22121 (Bessel-corrected) denominator, a student using the population formula (n = 12) would obtain a standard deviation of ~8.381% annualized, a score of ~0.931, and a spread of +0.131. The question would be more airtight if it explicitly stated the divisor (n\u22121).\n2. \"annual excess return\" \u2014 the question does not specify whether excess return should be computed arithmetically (10.8% \u2212 3.0% = 7.8%) or geometrically (1.108/1.03 \u2212 1 \u2248 7.573%). The geometric interpretation would yield a score of ~0.865 and a spread of +0.065. The arithmetic convention is standard for Sharpe-style ratios, but explicit phrasing would remove the ambiguity.\n3. Minor note: the score is computed from a mismatched pair \u2014 the numerator uses the actual annual return while the denominator uses volatility annualized from monthly data \u2014 which is conventional in practice but could be flagged as a methodological inconsistency; however, the question's defined procedure makes the intended calculation clear.", "verdict": "Correct"}, {"entry_id": 229, "problem": "* Scenario: A fund began the year with a market value of $250,000,000. During the year, there were no external capital contributions or withdrawals. On the final day of the year, the fund distributed $7,500,000 of cash income to investors, and after that distribution its ending market value was $275,000,000.  \n  At the annual risk measurement date, the portfolio consisted of $125,000,000 in Global Equity and $125,000,000 in Core Bonds. Global Equity has an annualized volatility of 12%, Core Bonds have an annualized volatility of 8%, and the correlation between the two sleeve returns is 0.25.  \n  The annual risk-free rate should be inferred from a one-year zero-coupon Treasury that was priced at $95.238095238 per $100 face value at the start of the year and matured at $100 at year-end.  \n  A peer benchmark has a Sharpe ratio of 0.85.\n\n* The Core Question: What is the fund\u2019s Sharpe-ratio spread over the peer benchmark, rounded to two decimal Sharpe-ratio units?", "answer": "0.15", "feedback": "Verdict: Correct\n\nAnalysis: The student's final answer of 0.15 matches my independently derived result. The fund's total return (including the distribution) works out to 13%, the implied risk-free rate from the zero-coupon Treasury is 5%, and the two-asset portfolio volatility (50/50 weights, 12% and 8% volatilities, 0.25 correlation) is exactly 8%. This yields a fund Sharpe ratio of (13% \u2212 5%) / 8% = 1.00, and the spread over the peer benchmark is 1.00 \u2212 0.85 = 0.15. The numbers in this problem are constructed to resolve cleanly, and the student arrived at the precise value with no rounding discrepancy.\n\nAmbiguities: The phrase \"the fund distributed $7,500,000 of cash income to investors, and after that distribution its ending market value was $275,000,000\" requires the solver to add the distribution back to compute total return \u2014 a reasonable but implicit assumption that the distribution is part of investment performance rather than an external withdrawal. Additionally, \"the portfolio consisted of $125,000,000 in Global Equity and $125,000,000 in Core Bonds\" at \"the annual risk measurement date\" implicitly assumes these point-in-time weights apply to the full-year volatility calculation; a stricter reading might question whether a single snapshot validly represents the year's risk. Neither ambiguity changes the intended answer.", "verdict": "Correct"}, {"entry_id": 230, "problem": "* Scenario: A treasury portfolio is being tested against an investment-policy limit on its **market-value-weighted average time to final maturity**. The valuation date is **July 1, 2026**, immediately after coupon payments, so quoted clean prices equal full prices. Prices are quoted per **$100 of par value**.\n\n  | Holding | Par Value | Price | Final Maturity Date |\n  |---|---:|---:|---|\n  | Bond A | $8,000,000 | 99.50 | July 1, 2028 |\n  | Bond B | $5,000,000 | 102.00 | July 1, 2031 |\n  | Bond C | $7,500,000 | 96.00 | July 1, 2036 |\n\n  The investment policy requires the portfolio\u2019s market-value-weighted average time to maturity to be **no more than 5.25 years**. Use unrounded intermediate calculations.\n\n* The Core Question: By how many **months** is the portfolio above or below the 5.25-year limit, and is the portfolio compliant? Round the month difference to the nearest **0.01 month**.", "answer": "**Non-compliant by 4.18 months**", "feedback": "Verdict: Correct\n\nAnalysis: The student's final answer matches my independently derived result. Using market values (par \u00d7 price/100), the portfolio's market-value-weighted average time to maturity comes out to approximately 5.598 years, which exceeds the 5.25-year limit by approximately 0.348 years. Converting to months (\u00d712) yields approximately 4.18 months when rounded to the nearest 0.01 month. The student correctly identified both the magnitude of the breach (4.18 months) and the compliance status (non-compliant, since the average exceeds the limit). Full credit.\n\nAmbiguities: The question is largely precise, but two minor points could invite alternative interpretations: (1) \"market-value-weighted\" could theoretically be misread as par-value-weighted by careless students, though the question explicitly forecloses this; the parenthetical condition \"quoted clean prices equal full prices\" cleanly removes accrued-interest ambiguity. (2) \"Round the month difference to the nearest 0.01 month\" is precise, but the question does not specify a day-count convention for converting years to months \u2014 though since all maturities fall on exact anniversary dates (July 1), maturities are whole years and the standard \u00d712 conversion is unambiguous in practice.", "verdict": "Correct"}, {"entry_id": 231, "problem": "* Scenario: A trader is evaluating a long equity trade. At 10:00 a.m., the stock\u2019s NBBO is bid $48.18 / ask $48.22, and the trader\u2019s market buy order fills at the ask. The broker charges $0.03 per share on both entry and exit. The trader will place a stop-loss sell order at $46.97 and a take-profit sell limit order at $51.45. Assume both exit orders would fill exactly at their stated prices with no slippage. The firm approves the trade only if its risk/reward ratio is no greater than 0.50.\n\n* The Core Question: Using the trade\u2019s all-in entry cost and net exit proceeds, by how many percentage points is the calculated risk/reward ratio below or above the firm\u2019s maximum allowed ratio? State whether the trade is approved, rounded to 2 decimal percentage points.", "answer": "Approved; 8.68 percentage points below the maximum allowed ratio.", "feedback": "Verdict: Correct\n\nAnalysis: The student's final answer matches my independently derived result. Working through it internally: the all-in entry cost is the ask price plus the per-share commission ($48.22 + $0.03 = $48.25); the net stop-loss proceeds are $46.97 \u2212 $0.03 = $46.94, yielding risk of $1.31 per share; the net take-profit proceeds are $51.45 \u2212 $0.03 = $51.42, yielding reward of $3.17 per share. The risk/reward ratio is $1.31 / $3.17 \u2248 0.4132, or 41.32%. Since 41.32% \u2264 50%, the trade is approved, and it sits 50.00% \u2212 41.32% = 8.68 percentage points below the firm's maximum (50 \u2212 41.3249... = 8.6751, which rounds to 8.68). The student correctly incorporated commissions on both legs, correctly identified the entry at the ask, and correctly stated both the approval decision and the margin below the threshold.\n\nAmbiguities: \n1. \"risk/reward ratio\" \u2014 While the conventional definition is risk \u00f7 reward (used here), some practitioners quote \"risk/reward\" as a ratio expressed as reward-to-risk (e.g., \"1:2.42\"). The threshold \"no greater than 0.50\" strongly implies risk \u00f7 reward, so the intended interpretation is recoverable, but the phrasing could momentarily mislead.\n2. \"by how many percentage points\" \u2014 The question asks for a difference in percentage points between two ratios that were never explicitly stated to be expressed as percentages (0.4132 vs. 0.50). A student could plausibly answer \"0.0868\" (in ratio units) rather than \"8.68 percentage points\"; specifying that the ratios should be converted to percentages first would remove this ambiguity.\n3. \"fills at the ask\" \u2014 The problem is clear here, but it does not explicitly state there is no slippage on entry (it only states this for the exit orders). The assumption of an exact ask-price fill is implied but not airtight.", "verdict": "Correct"}, {"entry_id": 232, "problem": "* Scenario: An auto manufacturer is analyzing its March vehicle demand. Dealer-reported March deliveries were:\n  * Sedans: 62,700 units  \n  * SUVs: 84,900 units  \n  * Pickup trucks: 38,400 units  \n  * Commercial vans: 21,000 units  \n\n  Historically, March demand is seasonally elevated: the March seasonal index is **1.15**, meaning March unadjusted sales are typically 15% above an average month due solely to seasonality. The company reports demand on a monthly basis and annualizes monthly seasonally adjusted demand to compare it with its annual production plan.\n\n  The manufacturer\u2019s annual production plan is **2,100,000 vehicles**. Each vehicle sold above the plan contributes **$1,250** in incremental contribution margin.\n\n* The Core Question: What is the annualized incremental contribution margin relative to the production plan, rounded to the nearest whole dollar?", "answer": "**$75,000,000**", "feedback": "Verdict: Correct\n\nAnalysis: The student's final answer of $75,000,000 matches my independently derived result exactly. The correct approach requires summing the four vehicle categories (207,000 total March units), deflating by the seasonal index of 1.15 to obtain seasonally adjusted monthly demand (180,000 units), annualizing by multiplying by 12 (2,160,000 units), comparing against the production plan of 2,100,000 (a surplus of 60,000 units), and applying the $1,250 incremental contribution margin per unit, yielding precisely $75,000,000. The student correctly divided by the seasonal index rather than multiplying \u2014 a common error point \u2014 and executed all subsequent steps without fault.\n\nAmbiguities: The phrase \"annualizes monthly seasonally adjusted demand\" could theoretically invite ambiguity about the annualization method (e.g., simple multiplication by 12 versus a weighted seasonal-pattern approach), though multiplying the seasonally adjusted figure by 12 is the standard and clearly intended convention. Additionally, \"Each vehicle sold above the plan\" mildly conflates projected annualized demand with actual sales, but in context the intended interpretation (annualized demand exceeding the plan) is unambiguous. These do not affect the answer.", "verdict": "Correct"}, {"entry_id": 233, "problem": "* Scenario: A manufacturing firm places a new CNC machine into service on January 1, 2026. The vendor invoice is $475,000, freight-in is $18,000, and installation/testing costs are $17,000; all three amounts are capitalized. A recycler has guaranteed $60,000 of residual proceeds when the machine is retired, and that residual amount is not depreciated. The machine will be used for five full fiscal years, ending December 31, 2030. For tax reporting, the firm uses an annual declining-balance percentage equal to twice the straight-line rate over the five-year life, applied each year to the remaining unrecovered depreciable base. There is no mid-year convention and no switch to straight-line depreciation. The firm\u2019s marginal tax rate is 25%, tax savings occur at each year-end, and the appropriate discount rate for these tax shields is 8% per year.\n\n* The Core Question: What is the present value on January 1, 2026 of the depreciation tax shields, rounded to the nearest whole dollar?", "answer": "$88,789", "feedback": "Verdict: Correct\n\nAnalysis: The student's final answer of $88,789 matches my independently derived result exactly. The capitalized cost ($510,000) less the non-depreciated residual ($60,000) yields a $450,000 depreciable base, to which the 40% double-declining rate is applied each year on the unrecovered balance. Discounting the resulting 25% tax shields at 8% for years one through five produces approximately $88,788.55, which rounds to $88,789. The student correctly excluded the salvage value from the declining-balance base (as explicitly instructed), correctly refrained from a straight-line switch, and correctly left the residual unrecovered base ($34,992) undepreciated at the end of year five.\n\nAmbiguities: The phrase \"an annual declining-balance percentage equal to twice the straight-line rate... applied each year to the remaining unrecovered depreciable base\" could invite an alternative interpretation, since standard double-declining-balance practice (and most tax codes) applies the rate to the full cost basis without subtracting salvage value. A student following conventional DDB mechanics might apply 40% to $510,000 instead of $450,000, yielding a different (incorrect, per this problem's framing) answer. However, the statement \"that residual amount is not depreciated\" combined with \"depreciable base\" reasonably signals the intended $450,000 base. Additionally, the question does not address the undepreciated residual base of $34,992 remaining after year five, which could prompt some students to wonder whether a final-year true-up deduction is required \u2014 though \"no switch to straight-line\" implies it is not.", "verdict": "Correct"}, {"entry_id": 234, "problem": "* Scenario:  \nAn executive received a cash-settled stock appreciation rights award on January 2, 2023. The award agreement states that the number of rights granted equals 2.5% of the company\u2019s 1,200,000-share incentive pool, rounded down to the nearest whole right. The grant-date stock price, which sets the base price for the award, was $48.20.\n\nThe rights vest in three equal annual installments on January 2 of 2024, 2025, and 2026, provided the executive remains employed. The executive remains employed and exercises all vested rights immediately after the January 2, 2025 vesting date. On the exercise date, the plan defines the settlement stock price as the average of the day\u2019s high and low trading prices. The stock traded at a high of $69.10 and a low of $67.70.\n\nThe SAR payout is made in cash and is subject to withholding of 22% federal tax, 6% state tax, and 1.45% Medicare tax. There are no other taxes, deductions, caps, or fees.\n\n* The Core Question:  \nWhat is the executive\u2019s net cash received from exercising the vested SARs, rounded to the nearest whole dollar?", "answer": "$276,942", "feedback": "Verdict: Incorrect\n\nAnalysis: My independently derived result is **$285,022** in net cash. The number of rights granted is 30,000 (2.5% of 1,200,000, no rounding needed). By January 2, 2025, two of the three installments have vested, so 20,000 rights are exercisable. The settlement price is the average of $69.10 and $67.70, i.e., $68.40, giving a per-right spread of $68.40 \u2212 $48.20 = $20.20. Gross payout is 20,000 \u00d7 $20.20 = $404,000. Total withholding is 22% + 6% + 1.45% = 29.45%, so net cash = $404,000 \u00d7 0.7055 = $285,022. The student's answer of $276,942 corresponds exactly to applying a total withholding rate of 31.45% rather than 29.45% ($404,000 \u00d7 0.6855 = $276,942). The most likely error is a simple arithmetic slip when summing the three tax rates (e.g., adding 2 percentage points incorrectly, perhaps mis-adding 22 + 6 as 30, or transposing digits), since every other component of their calculation (rights count, vested fraction, settlement price, gross payout) appears consistent with the correct $404,000 gross.\n\nAmbiguities: The question is largely precise, but two phrases merit note: (1) \"exercises all vested rights immediately after the January 2, 2025 vesting date\" \u2014 this clearly implies two vested installments (20,000 rights), but a careless reader might count all 30,000 rights or only one installment; (2) \"rounded down to the nearest whole right\" is a red herring here since 2.5% \u00d7 1,200,000 = 30,000 exactly, though it could mislead a student into manipulating the count. Neither ambiguity explains the student's specific error, which stems from the tax-rate summation.", "verdict": "Incorrect"}, {"entry_id": 235, "problem": "* Scenario: A hedge fund is being reviewed at year-end for compliance with a downside-risk mandate. At the start of the year, the fund had $20,000,000 in capital and no external cash flows during the year. Its quarterly returns were:\n\n  | Quarter | Return |\n  |---|---:|\n  | Q1 | +25.00% |\n  | Q2 | -8.00% |\n  | Q3 | 0.00% |\n  | Q4 | 0.00% |\n\n  The risk-free benchmark is a one-year zero-coupon Treasury that costs $970,873.7864 today and pays $1,000,000 at year-end. For downside risk, use a 0% quarterly minimum acceptable return and compute annualized downside deviation as: take each quarter\u2019s shortfall below 0%, square the shortfalls, average over the four quarters, then annualize by multiplying the quarterly downside deviation by \u221a4.\n\n  The fund\u2019s mandate requires its Sortino Ratio to be at least 1.40.\n\n* The Core Question: What is the fund\u2019s Sortino Ratio spread over the mandate minimum, rounded to two decimal Sortino-ratio points, and does the fund pass the mandate?", "answer": "`+0.10 Sortino-ratio points; Pass`", "feedback": "Verdict: Correct\n\nAnalysis: The student's final answer matches my independently derived result exactly. Working through it internally: the fund's annual return compounds to 15.00%, the Treasury implies a 3.00% risk-free rate, and the prescribed downside deviation methodology (only Q2's \u22128% shortfall counts, squared, averaged over four quarters, square-rooted, then scaled by \u221a4) yields an annualized downside deviation of 8.00%. The resulting Sortino Ratio is 1.50, which exceeds the 1.40 mandate by exactly +0.10 Sortino-ratio points, so the fund passes. Both the numerical spread and the pass/fail conclusion are correct.\n\nAmbiguities: The question is largely precise because it dictates the exact downside-deviation formula, but two phrasings merit note: (1) \"average over the four quarters\" \u2014 the question explicitly resolves the common ambiguity of dividing by all observations versus only the shortfall observations, so a careful reader should not stumble, but a student using only the one negative quarter (dividing by 1) would get a downside deviation of 16% and a Sortino of 0.75 (Fail); (2) \"compute annualized downside deviation as... multiplying the quarterly downside deviation by \u221a4\" \u2014 this is well-specified, though it differs from some textbook conventions that annualize returns and deviations differently, so adherence to the stated method is essential. The annual return calculation could also theoretically be interpreted as arithmetic (17% sum) rather than geometric (15% compounded), though geometric linking is the standard for a fund with no external flows; notably, the arithmetic interpretation would give a Sortino of 1.75 and a spread of +0.35, so the student's +0.10 confirms they correctly used geometric compounding.", "verdict": "Correct"}, {"entry_id": 236, "problem": "* Scenario: A hedge fund begins the year with an audited NAV of $80,000,000. During the year, it pays $2,000,000 in cash distributions to investors, and these distributions are not included in the year-end NAV. There are no investor subscriptions or redemptions during the year. At year-end, the audited NAV is $87,200,000.  \n  On the first day of the year, a 1-year Treasury bill with $10,000,000 face value trades for $9,765,625 and is held to maturity.  \n  For downside-risk reporting, the fund uses a 0% monthly minimum acceptable return. The only months with negative monthly returns are February at -2.0%, April at -3.0%, and July at -6.0%; all other months have zero downside shortfall. Annualized downside deviation is defined as:  \n  \\[\n  \\sqrt{12 \\times \\text{average of squared monthly downside shortfalls across all 12 months}}\n  \\]  \n  The fund\u2019s performance contract pays a risk-adjusted bonus only if its Sortino Ratio exceeds 1.10. The bonus is paid pro rata as:  \n  \\[\n  \\$750{,}000 \\times \\frac{\\text{Sortino Ratio} - 1.10}{0.10}\n  \\]  \n  if the Sortino Ratio is above 1.10, and $0 otherwise.\n\n* The Core Question: What is the fund\u2019s annual risk-adjusted bonus, rounded to the nearest whole dollar?", "answer": "$1,500,000", "feedback": "Verdict: Correct\n\nAnalysis: The student's final answer of $1,500,000 matches my independently derived result. Working internally: the fund's total annual return (accounting for the $2,000,000 distribution excluded from year-end NAV) is 11.5%; the T-bill implies a 2.4% risk-free rate, giving a 9.1% excess return. The annualized downside deviation, computed per the stated formula over all 12 months, comes to exactly 7.0%. The resulting Sortino Ratio is 1.30, which exceeds the 1.10 hurdle, and the pro-rata bonus formula yields $750,000 \u00d7 (1.30 \u2212 1.10)/0.10 = $1,500,000. The student's value is exact, with no rounding discrepancy.\n\nAmbiguities: The question relies on the term \"Sortino Ratio\" without explicitly defining its numerator. The textbook Sortino Ratio uses (portfolio return \u2212 MAR) in the numerator, and the question states the fund \"uses a 0% monthly minimum acceptable return.\" Under that strict definition, the numerator would be 11.5% \u2212 0% = 11.5%, giving a Sortino Ratio of \u22481.643 and a bonus of \u2248$4,071,429. The inclusion of the Treasury bill data strongly signals the intended numerator is (return \u2212 risk-free rate) = 9.1%, but the question never explicitly says \"use the T-bill yield as the threshold in the Sortino numerator.\" This invites two defensible interpretations; the problem would be precise if it stated, e.g., \"Sortino Ratio = (annual fund return \u2212 annual risk-free rate) / annualized downside deviation.\"", "verdict": "Correct"}, {"entry_id": 237, "problem": "* Scenario: Apex Instruments is a calendar-year company. An analyst is valuing the stock immediately after Q2 using rolling annual EPS, combining actual Q1\u2013Q2 results with estimated Q3\u2013Q4 results. All dollar amounts below are in millions except per-share figures.\n\n  Actual results:\n  * Q1 revenue was $520, total operating expenses were $410, and interest expense was $10.\n  * Q2 revenue was $560, total operating expenses were $430, and interest expense was $10.\n\n  Forecast results:\n  * Q3 revenue is estimated at $600, total operating expenses at $450, and interest expense at $12.\n  * Q4 revenue is estimated at $640, total operating expenses at $480, and interest expense at $12.\n\n  Additional information:\n  * The tax rate is 25% of pre-tax income in every quarter.\n  * There are no other income statement items.\n  * Apex has 2.4 million preferred shares outstanding for the entire rolling four-quarter period. Each preferred share has a $25 par value and a 6.0% annual dividend rate.\n  * For EPS purposes, common shares are averaged by month: 72 million shares were outstanding from January through March, 76 million from April through June, and 74 million from July through December.\n  * The sector valuation benchmark is 14.0\u00d7 rolling EPS.\n  * Apex\u2019s current stock price is $68.00.\n  * Use the same average common share count as the valuation share base.\n\n* The Core Question: What is the implied aggregate equity value difference, defined as fair equity value minus current equity value, rounded to the nearest whole dollar?", "answer": "+$230,600,000", "feedback": "Verdict: Correct\n\nAnalysis: The student's final answer of +$230,600,000 matches my independently derived result exactly. The figure is consistent with correctly computing the rolling four-quarter pre-tax income, applying the 25% tax rate, deducting the full annual preferred dividend (2.4M shares \u00d7 $25 par \u00d7 6.0%), dividing by the monthly-weighted average common share count of 74 million to get rolling EPS, applying the 14.0\u00d7 benchmark multiple to obtain fair value per share, subtracting the $68.00 current price, and multiplying the per-share difference by the same 74 million share base. Critically, the student appears to have carried full precision through the calculation rather than rounding EPS or the fair value per share at intermediate steps, which is the correct approach given the instruction to round only the final aggregate figure.\n\nAmbiguities: \n1. The instruction \"rounded to the nearest whole dollar\" applies only to the final aggregate; however, a student who rounds the intermediate EPS to the cent (e.g., $5.08) before applying the 14.0\u00d7 multiple would arrive at a slightly different aggregate (\u2248$230,880,000). The question does not explicitly prohibit intermediate rounding.\n2. \"Apex has 2.4 million preferred shares outstanding for the entire rolling four-quarter period\" combined with a \"6.0% annual dividend rate\" is precise, but a careless reader could question whether quarterly accrual conventions change the deduction \u2014 they do not, since the full year is covered, but explicit phrasing such as \"deduct one full year of preferred dividends\" would remove any doubt.\n3. \"Use the same average common share count as the valuation share base\" is clear in intent, but the phrase \"valuation share base\" is non-standard terminology; the question relies on the reader inferring that the aggregate equity values are computed as per-share values \u00d7 74 million rather than using period-end shares (74 million from July onward \u2014 which happens to coincide here, masking potential interpretation differences).", "verdict": "Correct"}, {"entry_id": 238, "problem": "* Scenario:  \nApex Components reports the following for fiscal year 2025:\n\n  * Revenue: $920,000,000  \n  * Cost of goods sold: $512,000,000  \n  * SG&A expense: $155,000,000  \n  * Depreciation expense: $34,000,000  \n  * R&D expense: $48,000,000  \n  * Interest expense on non-convertible debt: $9,000,000  \n  * Convertible notes: $120,000,000 face value, 5% annual coupon, with each $1,000 note convertible into 20 common shares  \n  * Corporate tax rate: 25%  \n  * Preferred stock: 600,000 shares, $50 par value, 6% annual dividend rate  \n  * Common shares outstanding:\n    * 38,000,000 shares from January 1 through March 31  \n    * 42,800,000 shares from April 1 through August 31  \n    * 40,400,000 shares from September 1 through December 31  \n\nFor diluted EPS, assume all convertible notes are converted and the after-tax interest saved on the convertible debt is added back to earnings. Apex\u2019s debt covenant requires diluted EPS of at least $2.8000.\n\n* The Core Question:  \nWhat is Apex\u2019s diluted EPS covenant cushion or shortfall, in dollars per share, rounded to the nearest $0.0001? Report a positive value for a cushion and a negative value for a shortfall.", "answer": "-$0.0292", "feedback": "Verdict: Correct\n\nAnalysis: The student's final answer matches my independently derived result exactly. Working through the problem internally: operating income comes to $171,000,000; after subtracting total interest expense of $15,000,000 (including the $6,000,000 convertible coupon) and applying the 25% tax rate, net income is $117,000,000. Subtracting preferred dividends of $1,800,000 yields $115,200,000 available to common. The weighted average share count is 40,800,000 basic shares; conversion adds 2,400,000 shares (120,000 notes \u00d7 20 shares) for 43,200,000 diluted shares, and the after-tax interest add-back of $4,500,000 brings the diluted numerator to $119,700,000. Diluted EPS = $2.7708 (rounded), which falls short of the $2.8000 covenant by $0.0292. The student's reported shortfall of -$0.0292, with the correct negative sign convention, is exactly right.\n\nAmbiguities: The question is largely precise, but two minor points invite alternative interpretations: (1) \"rounded to the nearest $0.0001\" \u2014 it is not explicitly stated whether the diluted EPS should be rounded *before* computing the cushion/shortfall, or whether only the final cushion figure should be rounded. Here both approaches converge to -$0.0292, so it is immaterial, but in edge cases it could matter. (2) The phrasing \"assume all convertible notes are converted\" implies conversion for the full year without requiring an if-converted dilution test (anti-dilution check); the instruction conveniently resolves this, but a strict GAAP treatment would also verify dilutiveness (it is dilutive here, so no conflict arises).", "verdict": "Correct"}, {"entry_id": 239, "problem": "* Scenario: Aurora Components has an EVA-based bonus plan for fiscal year 2025. All accounting amounts below are stated in millions of dollars.\n\n  During 2025, Aurora reported revenue of 250.0, raw materials/labor/overhead costs of 135.0, SG&A expense of 20.0, and depreciation expense of 25.0. The corporate tax rate is 30%.\n\n  At year-end, Aurora\u2019s balance sheet included current interest-bearing notes payable of 40.0, long-term bonds of 120.0, finance lease liabilities of 20.0, and common shareholders\u2019 equity of 220.0. The EVA plan excludes accounts payable, accrued expenses, and excess cash from capital employed.\n\n  For the firm\u2019s WACC, use market-value weights. The market value of equity is 300.0, and the market value of debt plus finance leases is 200.0. The cost of equity is 12.0%, the pretax cost of debt and leases is 5.0%, and the same 30% tax rate applies to the debt tax shield.\n\n  The bonus plan pays 8.0% of positive EVA in excess of a 10.0 million EVA benchmark; if EVA does not exceed 10.0 million, the bonus pool is zero.\n\n* The Core Question: What is the EVA-linked bonus pool in dollars, rounded to the nearest whole dollar?", "answer": "$368,000", "feedback": "Verdict: Correct\n\nAnalysis: The student's final answer of $368,000 matches my independently derived result exactly. Working through it internally: operating profit comes out to 70.0 million, NOPAT to 49.0 million after the 30% tax, capital employed (book value of interest-bearing debt, leases, and equity) to 400.0 million, and a market-value-weighted WACC of 8.6%. This yields a capital charge of 34.4 million, EVA of 14.6 million, an excess over the 10.0 million benchmark of 4.6 million, and a bonus pool of 8% of that excess \u2014 0.368 million, i.e., $368,000. The student has correctly applied book-value capital with a market-value-weighted WACC, after-tax cost of debt, and the benchmark hurdle structure.\n\nAmbiguities: The question is largely precise, but two points merit note: (1) \"use market-value weights\" for WACC while capital employed is implicitly book value could confuse students into computing the capital charge on the 500.0 million market value of capital rather than the 400.0 million book capital \u2014 the phrase \"capital employed\" with listed balance-sheet items signals book value, but this is not stated explicitly; (2) \"The EVA plan excludes accounts payable, accrued expenses, and excess cash from capital employed\" mentions exclusions for items not given numerically, which is benign but could prompt a student to wonder if adjustments are missing. Otherwise, the question is well-specified.", "verdict": "Correct"}, {"entry_id": 240, "problem": "* Scenario: A manufacturing firm reports the following for the most recent fiscal year, in millions of dollars: revenue of $1,400, cash operating costs excluding depreciation and amortization of $1,020, and depreciation and amortization of $130. The corporate tax rate is 20%.  \n  Its capital base consists of $120 in interest-bearing short-term debt, $430 in long-term bonds, $50 in capital lease liabilities, $300 in common stock and additional paid-in capital, and $600 in retained earnings.  \n  For discounting purposes, the firm uses a target market-value capital structure of 40% debt, including capital leases, and 60% equity. Its pre-tax cost of debt is 6.25%. The cost of equity is estimated using CAPM with a 3.0% risk-free rate, a beta of 1.40, and a 5.0% market risk premium.  \n  Analysts assume the firm\u2019s annual residual operating profit after charging for capital will remain constant forever. The present value of that residual operating profit is discounted at the firm\u2019s WACC, and implied enterprise value is calculated as invested capital plus the present value of future residual operating profit. The firm\u2019s current market enterprise value is $2,350 million.\n\n* The Core Question: What is the implied valuation gap, defined as implied enterprise value minus current market enterprise value, rounded to the nearest $1 million?", "answer": "$150 million", "feedback": "Verdict: Correct\n\nAnalysis: The student's final answer of $150 million matches my independently derived result exactly. Working through the problem: operating profit before tax is revenue less cash operating costs and D&A, which after applying the 20% tax rate yields NOPAT of $200 million. Invested capital sums to $1,500 million (debt of $600 million including short-term debt, bonds, and capital leases, plus equity of $900 million). The WACC computes to exactly 8.0% (after-tax cost of debt of 5.0% weighted at 40%, plus cost of equity of 10.0% via CAPM weighted at 60%). The annual residual operating profit is $200 \u2212 (8% \u00d7 $1,500) = $80 million, and as a level perpetuity its present value is $1,000 million. Implied enterprise value is $1,500 + $1,000 = $2,500 million, giving a valuation gap of $2,500 \u2212 $2,350 = $150 million. The student's answer is fully correct with no rounding discrepancies.\n\nAmbiguities: The question is largely precise, but two minor points could invite alternative interpretation: (1) \"Its capital base consists of...\" \u2014 the question relies on the reader knowing to use book invested capital ($1,500M) for the capital charge and the \"invested capital plus PV of residual profit\" formula, even though discounting weights are market-value targets; a student might erroneously try to infer market-value capital. (2) \"annual residual operating profit after charging for capital will remain constant forever\" \u2014 the timing convention (first residual profit received one year from now, valued as a standard perpetuity) is implied but not explicitly stated; however, the standard perpetuity treatment is the only reasonable reading and yields the intended answer.", "verdict": "Correct"}, {"entry_id": 241, "problem": "* Scenario: A manufacturing company is being evaluated at the end of FY2025. Its income statement for the year shows revenue of $900 million, cost of goods sold of $540 million, SG&A expense of $150 million, depreciation expense of $50 million, and interest expense of $30 million. The corporate tax rate is 25%.  \n   \n  At the beginning of FY2025, the company had $80 million of interest-bearing short-term debt, $300 million of long-term debt, $20 million of capital lease obligations, and $500 million of shareholders\u2019 equity.  \n   \n  For discount-rate purposes, the company\u2019s target market-value capital structure consists of $450 million of debt and $750 million of equity. Its pre-tax cost of debt is 6.0%, its cost of equity is 10.8%, and the same 25% corporate tax rate applies.  \n   \n  Assume the firm\u2019s annual residual operating income after charging for capital is expected to remain constant forever and should be discounted at the firm\u2019s weighted average cost of capital.\n\n* The Core Question: What is the implied market value created above the capital invested in the business, rounded to the nearest whole dollar?", "answer": "$522,222,222", "feedback": "Verdict: Correct\n\nAnalysis: The student's final answer of $522,222,222 matches my independently derived result exactly. Working internally: the operating profit base, after-tax operating income, beginning invested capital (including all interest-bearing debt, capital leases, and equity), the target-weight WACC of 8.4375%, the resulting constant residual operating income, and its capitalization as a perpetuity all combine to yield \u2248 $522.22 million, i.e., $522,222,222 when rounded to the nearest whole dollar. The student correctly excluded interest expense from the operating profit calculation (using NOPAT rather than net income), correctly used the book-value invested capital of $900 million for the capital charge while using the market-value target weights only for the discount rate, and correctly applied the perpetuity formula to the residual income rather than adding invested capital back (since the question asks only for value created *above* capital invested, i.e., the MVA, not total enterprise value).\n\nAmbiguities: The phrase \"market value created above the capital invested in the business\" is reasonably precise (it points to MVA = PV of residual income), but two elements invite alternative interpretations: (1) the question does not explicitly state whether the capital charge should be levied on *beginning-of-year* invested capital \u2014 it says \"At the beginning of FY2025, the company had...\" which strongly implies beginning capital, but a student could conceivably question whether average or ending capital was intended; and (2) \"rounded to the nearest whole dollar\" is slightly odd given all inputs are in millions \u2014 a student might defensibly report $522,222,222.22 truncated/rounded differently, or report $522 million. Neither ambiguity affects the correctness of this particular answer.", "verdict": "Correct"}, {"entry_id": 242, "problem": "* Scenario: A technical-risk desk is evaluating stock XYZ after the close on October 30, 2026. The desk computes Aroon Down using the full window of daily intraday lows shown below, ordered from oldest to newest. For the \u201cperiods since low\u201d count, the most recent row would count as 0 if it were the lowest low.\n\n| Trading Date | Intraday Low |\n|---|---:|\n| Sep 28, 2026 | 52.40 |\n| Sep 29, 2026 | 52.05 |\n| Sep 30, 2026 | 51.80 |\n| Oct 1, 2026 | 51.35 |\n| Oct 2, 2026 | 51.10 |\n| Oct 5, 2026 | 50.90 |\n| Oct 6, 2026 | 51.00 |\n| Oct 7, 2026 | 50.55 |\n| Oct 8, 2026 | 50.70 |\n| Oct 9, 2026 | 50.20 |\n| Oct 12, 2026 | 49.95 |\n| Oct 13, 2026 | 50.05 |\n| Oct 14, 2026 | 49.70 |\n| Oct 15, 2026 | 49.45 |\n| Oct 16, 2026 | 49.60 |\n| Oct 19, 2026 | 49.25 |\n| Oct 20, 2026 | 47.90 |\n| Oct 21, 2026 | 48.10 |\n| Oct 22, 2026 | 48.35 |\n| Oct 23, 2026 | 48.55 |\n| Oct 26, 2026 | 48.70 |\n| Oct 27, 2026 | 48.95 |\n| Oct 28, 2026 | 49.05 |\n| Oct 29, 2026 | 49.15 |\n| Oct 30, 2026 | 49.40 |\n\nThe desk\u2019s rule is: if Aroon Down exceeds 65.00, sell short $75,000 of index futures notional for each percentage point by which Aroon Down exceeds 65.00. If Aroon Down is 65.00 or lower, no short overlay is placed.\n\n* The Core Question: What dollar notional of futures should the desk sell short, rounded to the nearest whole dollar?", "answer": "$225,000", "feedback": "Verdict: Correct\n\nAnalysis: The student's final answer of $225,000 matches my independently derived result. The lowest intraday low in the window is 47.90 on Oct 20, 2026, which sits 8 trading days before the most recent observation (Oct 30 counting as 0). Using the standard Aroon Down formula with the 25-period window, ((25 \u2212 8)/25) \u00d7 100 yields an Aroon Down of 68.00. This exceeds the 65.00 threshold by 3.00 percentage points, and 3.00 \u00d7 $75,000 = $225,000 of short futures notional. The student's value is exact, with no rounding issues.\n\nAmbiguities: The phrase \"computes Aroon Down using the full window of daily intraday lows shown below\" leaves the lookback parameter implicit. A reader could interpret 25 data points as implying an Aroon period of N = 25 (the conventional reading, giving (25 \u2212 8)/25 = 68.00) or as N = 24 intervals between observations (giving (24 \u2212 8)/24 \u2248 66.67, which would yield $125,000 instead). The clarifying sentence \"the most recent row would count as 0 if it were the lowest low\" pins down the day-count convention for \"periods since low,\" but it does not explicitly fix the denominator of the Aroon formula. The conventional interpretation (N = 25) produces the intended answer, but stating the Aroon period explicitly would remove this potential for divergent results.", "verdict": "Correct"}, {"entry_id": 243, "problem": "* Scenario: A pension fund is evaluating a $12,000,000 one-year allocation to an actively managed equity portfolio. The broad market index is currently at 4,800. Analysts forecast the index will be 5,040 in one year and that investors will receive 120 index points in cash dividends during the year. A one-year zero-coupon Treasury security is currently priced at \\(25/26\\) of its face value. Historical return data show that the portfolio\u2019s covariance with the market is 0.00180, while the market return variance is 0.00120. The investment committee requires at least $600,000 of CAPM-based equity risk premium compensation on this allocation.\n\n* The Core Question: Using the CAPM equity risk premium function, what is the dollar surplus over the committee\u2019s required compensation, rounded to the nearest whole dollar? Use a positive value for a surplus and a negative value for a shortfall.", "answer": "$30,000", "feedback": "Verdict: Correct\n\nAnalysis: The student's final answer of $30,000 matches my independently derived result exactly. Working through the components internally: the zero-coupon Treasury pricing implies a risk-free rate of 4%, the index forecast with dividends implies an expected market return of 7.5%, and the covariance-to-variance ratio yields a beta of 1.5. The CAPM equity risk premium on the allocation comes to $630,000, which exceeds the committee's $600,000 requirement by exactly $30,000. The student correctly applied beta to the market risk premium (rather than the full market return), correctly included dividends in the market return calculation, and correctly converted the Treasury price into the implied risk-free rate. The sign convention (positive for surplus) was also followed properly.\n\nAmbiguities: The phrase \"CAPM-based equity risk premium compensation\" could conceivably be misread by a student as requiring the full expected excess return on the portfolio versus only the systematic risk premium \u2014 however, under CAPM these are identical (\u03b2 \u00d7 market risk premium), so no alternative numerical answer arises. Additionally, \"investors will receive 120 index points in cash dividends\" requires the solver to add dividends to the index appreciation when computing total market return; this is standard but a student could omit it. Otherwise, the question is precisely specified \u2014 the Treasury price of \\(25/26\\), the covariance (0.00180), and the variance (0.00120) all yield clean, unambiguous figures.", "verdict": "Correct"}, {"entry_id": 244, "problem": "* Scenario:  \nAres Components LLC is calculating its required annual term-loan cash sweep for the fiscal year ended December 31, 2025. Under its credit agreement, annual Excess Cash Flow is calculated as consolidated net income, plus non-cash charges included in earnings, plus any decrease in operating net working capital, minus non-cash gains included in earnings, cash capital expenditures, scheduled funded-debt principal payments, and permitted cash investments funded from internally generated cash flow.\n\nFor 2025, Ares reported the following income statement items, in millions of dollars:\n\n- Revenue: $420.0  \n- Cash cost of goods sold: $246.0  \n- Cash SG&A expense: $69.5  \n- Depreciation and amortization: $18.0  \n- Stock-based compensation expense: $4.0  \n- Non-cash impairment charge: $3.5  \n- Non-cash gain on remeasurement of an equity investment: $6.0  \n- Interest expense: $22.0  \n- Income tax expense: $11.5  \n\nOperating net working capital excludes cash, debt, and income-tax accounts. Its components were:\n\n| Item | Dec. 31, 2024 | Dec. 31, 2025 |\n|---|---:|---:|\n| Accounts receivable | $62.0 | $68.0 |\n| Inventory | $45.0 | $41.0 |\n| Prepaid operating expenses | $5.0 | $7.5 |\n| Accounts payable | $38.0 | $35.0 |\n| Accrued operating expenses | $20.0 | $23.0 |\n\nDuring 2025, Ares also:\n\n- Purchased $32.0 million of equipment, of which $5.0 million was vendor-financed at closing and the rest was paid in cash.  \n- Made $12.0 million of scheduled principal amortization payments on funded debt.  \n- Made a $10.0 million permitted strategic investment, of which $2.0 million was funded with newly issued equity and the balance with internally generated cash.  \n\nThe credit agreement requires a mandatory prepayment equal to 50% of positive Excess Cash Flow because Ares\u2019s year-end first-lien net leverage ratio is above the applicable threshold. There are no carryforwards, optional prepayment credits, or other offsets.\n\n* The Core Question:  \nWhat mandatory term-loan prepayment is due for 2025, rounded to the nearest whole dollar?", "answer": "$9,750,000", "feedback": "Verdict: Correct\n\nAnalysis: The student's final answer of $9,750,000 matches my independently derived result exactly. Working through the problem internally: net income comes to $51.5 million; non-cash charges added back (D&A, stock-based compensation, impairment) total $25.5 million; the non-cash remeasurement gain of $6.0 million is subtracted; operating net working capital increased from $54.0 million to $58.5 million, a $4.5 million increase that reduces Excess Cash Flow; cash capital expenditures are $27.0 million (excluding the $5.0 million vendor-financed portion); scheduled principal amortization is $12.0 million; and the internally funded portion of the permitted investment is $8.0 million (excluding the $2.0 million equity-funded portion). This yields Excess Cash Flow of $19.5 million, and 50% of that is $9.75 million. The student correctly handled all three of the common traps in this problem: excluding the vendor-financed capex, excluding the equity-funded portion of the investment, and treating the working capital change correctly (as a build that consumes cash).\n\nAmbiguities: The definition states Excess Cash Flow includes \"plus any decrease in operating net working capital\" but is silent on the treatment of an increase. A strictly literal reading would simply add zero when working capital increases (yielding ECF of $24.0 million and a prepayment of $12,000,000), whereas the conventional credit-agreement interpretation \u2014 and the one consistent with the cash-flow logic the question clearly intends \u2014 symmetrically subtracts the $4.5 million increase. The question would be airtight if it read \"plus any decrease (or minus any increase) in operating net working capital.\" Additionally, \"rounded to the nearest whole dollar\" is slightly odd phrasing given all inputs are in millions, though it creates no computational ambiguity here.", "verdict": "Correct"}, {"entry_id": 245, "problem": "* Scenario: Horizon Utilities Inc. is a mature dividend-paying company. During the most recent fiscal year, it pa
