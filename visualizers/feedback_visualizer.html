u2212$110.4M, since the DFL at the 2025 base is 115/95 \u2248 1.211, not 1.25). The student avoided that common trap.\n\nAmbiguities: The phrase \"the EPS sensitivity to EBIT implied by the 2024-to-2025 results\" is the main potential source of confusion. A student could reasonably interpret the instruction as simply recalculating 2026 EPS directly from the forecast EBIT (yielding EPS of $2.145 and a change of \u2212$110,400,000), since the income statement structure itself \"implies\" the sensitivity. The question intends the arc-elasticity approach (18.75% \u00f7 15% = 1.25), but the answer depends materially on which interpretation is chosen. Additionally, \"rounded to the nearest whole dollar\" is slightly odd phrasing for a figure naturally expressed in millions, though it does not affect this answer.", "verdict": "Correct"}, {"entry_id": 163, "problem": "* Scenario: On January 1, 2026, Orion Components purchased and placed into service a robotic welding machine. The supplier\u2019s list price was $1,200,000, but Orion received an 8% trade discount. Orion also paid $52,800 of nonrefundable sales tax, $18,200 for freight-in, and $29,000 for installation and calibration. Separately, Orion paid $12,000 for employee training and $24,000 for a two-year maintenance contract; these two items are expensed as incurred and are not part of the depreciable asset cost. Orion expects to use the machine through December 31, 2033, then sell it for $160,000 while paying $10,000 of removal and transport costs. Orion uses straight-line depreciation, and its corporate tax rate is 25%. Assume taxable income is sufficient to fully use the depreciation deduction.\n* The Core Question: What is the annual income tax reduction attributable solely to the machine\u2019s straight-line depreciation, rounded to the nearest dollar?", "answer": "$32,938", "feedback": "Verdict: Correct\n\nAnalysis: The student's final answer of $32,938 matches my independently derived result. The capitalized cost properly includes the discounted purchase price, sales tax, freight-in, and installation/calibration, while excluding training and maintenance. Netting the expected sale proceeds against removal costs yields the salvage value, and spreading the depreciable base over the 8-year service life (January 1, 2026 through December 31, 2033) produces the annual depreciation. Multiplying by the 25% tax rate gives $32,937.50, which correctly rounds to $32,938.\n\nAmbiguities: The phrase \"then sell it for $160,000 while paying $10,000 of removal and transport costs\" could conceivably be interpreted by some students as $160,000 being the net proceeds already, though the conventional reading is that salvage value is $160,000 \u2212 $10,000 = $150,000. Additionally, \"annual income tax reduction\" assumes book straight-line depreciation is the tax depreciation method, which the problem implies but does not state via an explicit tax depreciation schedule (e.g., MACRS). The instruction \"Assume taxable income is sufficient to fully use the depreciation deduction\" reasonably resolves this, but a tax-method distinction could invite alternative interpretations in a more realistic setting.", "verdict": "Correct"}, {"entry_id": 164, "problem": "* Scenario: A beverage manufacturer installs a new bottling line. The vendor\u2019s invoice price is $2,400,000, but the manufacturer receives a 7.5% purchase discount. To place the line into service, the company also pays $132,000 of nonrefundable purchase tax, $28,000 of inbound freight, and $180,000 for installation and testing. A separate $35,000 operator-training program is expensed immediately and is not capitalized. At the end of its useful life, the line is expected to be sold for $210,000, but removal and brokerage costs are expected to total $35,000. Engineering estimates the line will operate for 50,000 productive hours over its life, producing 12 accepted bottles per minute. During the current year, the line completed 2,400 batches, each initially containing 1,250 bottles; 2.0% of bottles failed final quality inspection and are not counted for depreciation purposes. The firm uses units-of-production depreciation for both book and tax reporting, has sufficient taxable income to use all deductions, and faces a 25% tax rate. Carry calculations without interim rounding.\n\n* The Core Question: What is the current-year reduction in income taxes from the units-of-production depreciation deduction, rounded to the nearest whole dollar?", "answer": "$48,694", "feedback": "Verdict: Correct\n\nAnalysis: The student's final answer of $48,694 matches my independently derived result. Working through the problem in my head: the capitalized cost includes the discounted invoice price, nonrefundable tax, freight, and installation (excluding the expensed training), yielding $2,560,000; net residual value of $175,000 (gross salvage less removal/brokerage) gives a depreciable base of $2,385,000. Lifetime output is 36,000,000 accepted bottles (50,000 hours \u00d7 12 bottles/min \u00d7 60 min/hr), producing a per-unit rate of $0.06625. Current-year accepted output is 2,940,000 bottles (2,400 batches \u00d7 1,250 bottles \u00d7 98% pass rate), giving depreciation of $194,775. Applying the 25% tax rate yields a tax shield of $48,693.75, which rounds to $48,694. The student handled every nuance correctly: capitalizing the right cost components, excluding training, netting removal costs against salvage, converting hours to bottle-units, and adjusting for the 2% rejection rate.\n\nAmbiguities: The phrase \"12 accepted bottles per minute\" could conceivably be questioned \u2014 it specifies that the lifetime capacity of 36,000,000 is already stated in *accepted* bottles, which is essential for consistently applying the 2% rejection adjustment only to current-year output. A less careful reader might double-adjust or fail to adjust. Additionally, \"removal and brokerage costs are expected to total $35,000\" requires the solver to infer these are netted against the $210,000 salvage value (i.e., net realizable residual value of $175,000), which is the standard treatment but is not explicitly instructed. Otherwise, the question is precise.", "verdict": "Correct"}, {"entry_id": 165, "problem": "* Scenario: Orion Components is preparing its fiscal-year 2025 EPS disclosure. For the year, it reported revenue of $500,000,000, cost of goods sold of $300,000,000, SG&A expense of $92,000,000, depreciation expense of $20,000,000, and interest expense of $8,000,000. There were no other income or expense items, and the corporate tax rate was 25%. Orion had 1,000,000 shares of nonconvertible preferred stock outstanding for the full year, with $25 par value and an 8% annual dividend rate. For common shares, Orion had 10,000,000 shares outstanding on January 1, issued 2,000,000 additional common shares on April 1, and repurchased 1,200,000 common shares on October 1. Use a 12-month weighting convention and treat share changes as effective at the start of the stated month. Orion also had 480,000 restricted stock units outstanding for the full year and granted an additional 720,000 restricted stock units on July 1; each unit converts into one common share, and all units are dilutive. There are no other potentially dilutive securities. An equity research model values Orion at 14.0\u00d7 diluted EPS multiplied by the same diluted share count used in the diluted EPS denominator. The preannouncement consensus used diluted EPS of $4.70 with that same actual diluted share count.\n\n* The Core Question: Using unrounded diluted EPS in the valuation calculation, what is the increase in Orion\u2019s implied equity value relative to consensus, rounded to the nearest whole dollar?", "answer": "$19,768,000 increase", "feedback": "Verdict: Correct\n\nAnalysis: The student's final answer of a $19,768,000 increase matches my independently derived result exactly. My hidden solution confirms net income available to common shareholders of $58,000,000 (after $2,000,000 of preferred dividends), a weighted average basic share count of 11,200,000, dilutive RSU shares of 840,000 (480,000 full-year plus 720,000 weighted at 6/12), yielding a diluted denominator of 12,040,000 shares. Using unrounded diluted EPS, the actual implied equity value collapses neatly to 14 \u00d7 $58,000,000 = $812,000,000, while the consensus implied value is 14 \u00d7 $4.70 \u00d7 12,040,000 = $792,232,000. The difference is precisely $19,768,000. The student correctly handled the share-weighting convention, the RSU time-weighting, the preferred dividend deduction, and\u2014critically\u2014used the unrounded EPS as instructed, avoiding the rounding trap (using EPS rounded to $4.82 would have produced a materially different answer).\n\nAmbiguities: The phrase \"treat share changes as effective at the start of the stated month\" combined with dates already given as the 1st of each month (April 1, October 1, July 1) is mildly redundant but not problematic. One could question whether the RSU grant on July 1 should also follow the \"12-month weighting convention\" stated for \"share changes\" \u2014 the question says all units \"are dilutive\" but does not explicitly state RSUs should be time-weighted; under the treasury stock/if-converted logic of ASC 260, weighting the July 1 grant at 6/12 is standard, and the answer key clearly assumes this. A reader who included all 720,000 RSUs for the full period would arrive at a different denominator (12,400,000) and a different answer. Otherwise, the question is precise.", "verdict": "Correct"}, {"entry_id": 166, "problem": "* Scenario:  \nA manufacturing firm acquires a packaging machine on January 1, 2026. The supplier invoice price is $1,200,000. The firm also pays $72,000 in nonrefundable sales tax, $38,000 for freight and rigging, and $90,000 for installation and testing before the machine is ready for use. Separately, it pays $25,000 for operator training and $18,000 for a one-year maintenance contract, both of which are expensed immediately and are not capitalized.\n\n  The machine is expected to operate from January 1, 2026 through December 31, 2033. At the end of its service period, the firm expects to sell the machine for $160,000 and incur $20,000 of removal and selling costs. The firm uses straight-line depreciation with no half-year convention. Its marginal tax rate is 24%.\n\n* The Core Question:  \nWhat is the firm\u2019s 2026 cash tax savings attributable solely to depreciation on this machine, rounded to the nearest whole dollar?", "answer": "$37,800", "feedback": "Verdict: Correct\n\nAnalysis: The student's final answer of $37,800 matches my independently derived result exactly. The correct solution requires capitalizing the invoice price, sales tax, freight/rigging, and installation/testing ($1,200,000 + $72,000 + $38,000 + $90,000 = $1,400,000), while excluding the training and maintenance costs as instructed. The expected salvage proceeds must be netted against removal/selling costs ($160,000 \u2212 $20,000 = $140,000) to obtain the net residual value. The depreciable base of $1,260,000 spread straight-line over the 8-year service life (2026\u20132033) yields annual depreciation of $157,500, and applying the 24% marginal tax rate produces a 2026 tax shield of $37,800. The student correctly handled all three potential traps: excluding the expensed items, netting the disposal costs against salvage, and using the full 8-year life with no convention adjustments.\n\nAmbiguities: The question contains a few points that invite alternative interpretations:\n1. \"cash tax savings attributable solely to depreciation\" \u2014 In actual U.S. tax practice, tax depreciation would follow MACRS (which ignores salvage value entirely), not book straight-line depreciation. The question implicitly assumes book and tax depreciation are identical, which a tax-savvy student might dispute. A MACRS-based answer would differ materially.\n2. \"expects to sell the machine for $160,000 and incur $20,000 of removal and selling costs\" \u2014 While netting these to $140,000 is the standard treatment, the question does not explicitly state that the salvage value used for depreciation is the net amount; a student could defensibly use the gross $160,000, yielding $156,250 \u00d7 0.24 = $37,500.\n3. \"expensed immediately\" for the training and maintenance \u2014 these items generate their own tax savings in 2026, but the phrase \"attributable solely to depreciation\" properly excludes them; less careful readers might still include them.", "verdict": "Correct"}, {"entry_id": 167, "problem": "* Scenario: A credit derivatives desk is evaluating a one-year digital basket contract referencing a pool of equal-notional corporate obligors: 4 industrial issuers, 3 energy issuers, and 3 retail issuers. Each obligor has $10,000,000 of reference notional. Defaults are independent, recovery is assumed to be 0%, and the market-implied one-year survival probability for each obligor is 92%.  \n  The contract pays $50,000,000 at maturity if and only if the pool\u2019s total default loss at maturity is exactly $20,000,000; otherwise it pays nothing. The desk can buy the contract by paying an upfront premium of $6,900,000 today. A one-year default-free zero-coupon bond trades at 96 per 100 of face value.\n\n* The Core Question: What is the buyer\u2019s net present value of the contract, rounded to the nearest whole dollar?", "answer": "$194,738", "feedback": "Verdict: Correct\n\nAnalysis: The student's final answer of $194,738 matches my independently derived result exactly. The problem reduces to identifying that a loss of exactly $20,000,000 with $10,000,000 notional per name and 0% recovery corresponds to exactly 2 defaults out of 10 independent obligors, each with a 0.08 default probability. The binomial probability of exactly 2 defaults is approximately 0.1478070, giving a risk-neutral expected payoff of about $7,390,352. Discounting at the zero-coupon bond price of 0.96 yields a present value of roughly $7,094,737.73, and subtracting the $6,900,000 premium gives an NPV of approximately $194,737.73, which rounds to $194,738. The student correctly handled the probability mass function, the discounting via the bond price (rather than treating the premium as if paid at maturity), and the rounding.\n\nAmbiguities: The breakdown of obligors into \"4 industrial issuers, 3 energy issuers, and 3 retail issuers\" is a distractor, since all obligors are statistically identical (same notional, same survival probability, independent defaults); a student could be misled into thinking sector composition matters. Additionally, the phrase \"pays $50,000,000 at maturity\" requires the student to recognize that the upfront premium of $6,900,000 is paid today while the payoff must be discounted \u2014 this is reasonably clear, but a careless reader could net the cash flows without discounting. Otherwise, the question is precise.", "verdict": "Correct"}, {"entry_id": 168, "problem": "* Scenario: A credit portfolio contains equal-sized one-year corporate loans: 4 healthcare loans, 5 software loans, 3 utility loans, and 8 consumer-products loans. Each loan has $10 million face value. If a borrower defaults by year-end, the loan recovery is 40% of face value; otherwise there is no loss. Defaults are independent and identically distributed under the risk-neutral measure.  \n  The market price of a comparable one-year risky zero-coupon bond is $93.12 per $100 face value. The bond pays $100 if there is no default and $40 if default occurs. The one-year risk-free discount factor is 0.96.  \n  A digital credit note pays $10,000,000 at year-end if the portfolio\u2019s total default loss is exactly $18,000,000, and pays nothing otherwise. The note costs an upfront premium of $500,000 today.\n\n* The Core Question: What is the net present value of buying the digital credit note, rounded to the nearest dollar?", "answer": "$71,989", "feedback": "Verdict: Correct\n\nAnalysis: The student's final answer matches my independently derived result. Working through the problem internally: the comparable bond price implies a risk-neutral default probability of 5% (since $93.12 / 0.96 = $97, and $97 = $100 \u2212 $60p gives p = 0.05). With 20 total loans and a loss-given-default of $6 million per loan (60% of $10M face), a total loss of exactly $18 million corresponds to exactly 3 defaults. The binomial probability C(20,3)(0.05)\u00b3(0.95)\u00b9\u2077 \u2248 0.0595821. Discounting the $10M contingent payoff at the 0.96 risk-free factor gives a present value of approximately $571,989, and subtracting the $500,000 premium yields an NPV of approximately $71,989. The student's answer of $71,989 is exactly right.\n\nAmbiguities: The phrasing is largely precise, but two minor points could invite alternative readings: (1) \"the loan recovery is 40% of face value\" combined with \"total default loss is exactly $18,000,000\" requires the solver to infer that \"loss\" means face value minus recovery ($6M per loan) rather than some discounted or market-value-based loss measure; (2) \"Defaults are independent and identically distributed\" implicitly asks the solver to apply the single bond's implied default probability uniformly across all four industry sectors, even though sector-specific probabilities might be expected in practice. Neither ambiguity affects the intended unique solution.", "verdict": "Correct"}, {"entry_id": 169, "problem": "* Scenario: On January 1, 2026, a credit derivatives desk is pricing a one-year digital default note referencing all issuers in a small portfolio: 4 regional banks, 3 insurers, and 3 utilities. Each issuer either defaults or does not default by January 1, 2027, and defaults are independent under the risk-neutral measure. The risk-neutral one-year survival probability for each issuer is 80%. The note pays $100,000,000 on January 1, 2027 only if exactly 7 referenced issuers remain non-defaulted at maturity; otherwise it pays $0. The one-year risk-free zero-coupon rate is 5.00% annual effective. A dealer offers the note today for $18,000,000.\n\n* The Core Question: What is the net dollar arbitrage profit available today from taking the correctly directed position, rounded to the nearest whole dollar?", "answer": "$1,173,961", "feedback": "Verdict: Correct\n\nAnalysis: The student's final answer matches my independently derived result. The probability of exactly 7 of 10 independent issuers surviving (each with survival probability 0.80) follows the binomial distribution, yielding approximately 0.2013266. Discounting the $100,000,000 contingent payoff at 5.00% effective gives a fair price of approximately $19,173,961.14. Since the dealer's offer of $18,000,000 is below fair value, the correct arbitrage direction is to buy the underpriced note (and replicate/short the synthetic equivalent), capturing a net profit of $19,173,961.14 \u2212 $18,000,000 \u2248 $1,173,961. The student's figure of $1,173,961 is exactly correct to the nearest dollar.\n\nAmbiguities: The phrase \"net dollar arbitrage profit available today\" could in principle be interpreted as a future-value profit at maturity rather than a present-value profit, though the word \"today\" makes the present-value interpretation the natural one. Additionally, \"exactly 7 referenced issuers remain non-defaulted\" is precise, but a careless reader might misread it as \"at least 7,\" which would change the payoff probability \u2014 the question's wording is sufficiently explicit that this is the reader's error, not the question's. Otherwise, the question is precise: independence, identical survival probabilities, and the discount convention are all clearly stated.", "verdict": "Correct"}, {"entry_id": 170, "problem": "* Scenario: A portfolio analyst is evaluating a stock using its adjusted month-end value series, where each adjusted value includes reinvested dividends. The analyst must compute each month\u2019s simple total return from consecutive adjusted values.\n\n  | Month-End Date | Stock Adjusted Value | Benchmark Adjusted Index |\n  |---|---:|---:|\n  | Dec 31 | 50.00000000 | 100.000000 |\n  | Jan 31 | 48.00000000 | 96.000000 |\n  | Feb 28 | 47.28000000 | 94.080000 |\n  | Mar 31 | 47.75280000 | 94.080000 |\n  | Apr 30 | 49.42414800 | 95.961600 |\n  | May 31 | 52.38959688 | 99.800064 |\n\n  After deriving the five monthly stock returns and five monthly benchmark returns, calculate the stock\u2019s beta relative to the benchmark using the beta function\u2019s population covariance and population variance method. Then use that beta in CAPM with a 4.00% annual risk-free rate and a 10.00% annual expected benchmark return. The analyst forecasts the stock will earn 12.10% over the next year on a planned $8,000,000 position.\n\n* The Core Question: What is the expected dollar alpha of the planned position versus its CAPM-required return, rounded to the nearest whole dollar?", "answer": "$48,000", "feedback": "Verdict: Correct\n\nAnalysis: The student's final answer of $48,000 matches my independently derived result exactly. Working through the data: the five monthly stock returns are \u22124.0%, \u22121.5%, +1.0%, +3.5%, and +6.0%, while the benchmark returns are \u22124.0%, \u22122.0%, 0.0%, +2.0%, and +4.0%. Using population covariance (0.001) divided by population variance of the benchmark (0.0008), beta equals exactly 1.25. The CAPM-required return is 4.00% + 1.25 \u00d7 (10.00% \u2212 4.00%) = 11.50%. The forecast of 12.10% yields an alpha of 0.60%, which on an $8,000,000 position produces 0.0060 \u00d7 $8,000,000 = $48,000. The data was clearly constructed to yield clean intermediate values, and the student arrived at the precise expected result with no rounding discrepancy.\n\nAmbiguities: The question is largely precise, but two minor points merit note. First, the phrase \"the beta function's population covariance and population variance method\" is slightly awkward phrasing (apparently referencing a spreadsheet-style SLOPE/beta computation), though the intended population-statistics approach is clear and, in this case, sample statistics would yield an identical beta since the n\u22121 factors cancel in the ratio. Second, the problem mixes monthly return data (for beta estimation) with annual rates (for CAPM), which could invite confusion about annualization; however, the question's structure makes clear that beta is unitless and applied directly to the annual CAPM inputs, so the intended path is unambiguous in practice.", "verdict": "Correct"}, {"entry_id": 171, "problem": "* Scenario: A pension plan is evaluating an equity manager over the last four quarters. There were no cash contributions or withdrawals during the period. The manager\u2019s portfolio value and its benchmark index level were recorded as follows:\n\n  | Date | Manager Portfolio Value | Benchmark Index Level |\n  |---|---:|---:|\n  | Start of Q1 | 100.000000 | 1000.000 |\n  | End of Q1 | 100.900000 | 1000.000 |\n  | End of Q2 | 104.229700 | 1020.000 |\n  | End of Q3 | 110.1707929 | 1060.800 |\n  | End of Q4 | 119.0946271 | 1124.448 |\n\n  For each quarter, the matching 3-month Treasury bill was purchased at the start of the quarter for $99.00990099 per $100 face value and matured at par at quarter-end.\n\n  Use arithmetic average quarterly returns. Compute the manager\u2019s beta using the standard CAPM definition: covariance of the manager\u2019s quarterly returns with the benchmark\u2019s quarterly returns divided by the variance of the benchmark\u2019s quarterly returns.\n\n  After calculating the manager\u2019s quarterly alpha, the pension plan wants to translate that alpha into dollar value added relative to the CAPM-implied required return on a $300,000,000 allocation.\n\n* The Core Question: What is the dollar value added by the manager\u2019s alpha on the $300,000,000 allocation, rounded to the nearest whole dollar?", "answer": "$3,300,000", "feedback": "Verdict: Correct\n\nAnalysis: The student's final answer of $3,300,000 matches my independently derived result. Working through the data: the manager's quarterly returns are 0.9%, 3.3%, 5.7%, and 8.1% (arithmetic mean = 4.5%), the benchmark's quarterly returns are 0%, 2%, 4%, and 6% (arithmetic mean = 3%), and the T-bill yields exactly 1.0% per quarter (100/99.00990099 \u2212 1). The covariance of returns is proportional to 24 (in %\u00b2 units) and the benchmark variance to 20, giving beta = 1.2. The CAPM-required quarterly return is 1.0% + 1.2 \u00d7 (3.0% \u2212 1.0%) = 3.4%, so quarterly alpha = 4.5% \u2212 3.4% = 1.1%. Applied to the $300,000,000 allocation: 0.011 \u00d7 $300,000,000 = $3,300,000. The student's figure is exactly correct on a per-quarter basis.\n\nAmbiguities: The phrase \"translate that alpha into dollar value added\" following \"the manager's quarterly alpha\" leaves the time horizon slightly open to interpretation \u2014 a grader could argue the dollar value added should reflect the full four-quarter evaluation period (e.g., 4 \u00d7 $3,300,000 = $13,200,000, or a compounded variant), rather than a single quarter. However, since the question explicitly anchors the calculation to \"the manager's quarterly alpha,\" the quarterly interpretation ($3,300,000) is the most defensible reading.", "verdict": "Correct"}, {"entry_id": 172, "problem": "* Scenario: A pension plan is evaluating a portfolio manager over the last five calendar years. The mandate measures performance using the arithmetic average of annual simple total returns. The manager\u2019s beta is defined as the regression slope of the manager\u2019s annual returns on the benchmark\u2019s annual returns over the same five observations.\n\n  | Year | Manager Return | Benchmark Return |\n  |---|---:|---:|\n  | 1 | 12.4% | 10.0% |\n  | 2 | 8.0% | 6.0% |\n  | 3 | -0.8% | -2.0% |\n  | 4 | 14.6% | 12.0% |\n  | 5 | 5.8% | 4.0% |\n\n  At the start of the evaluation period, a one-year Treasury bill with $1,000 face value could be purchased for $970.873786, and the mandate uses its annual holding-period yield as the risk-free rate.\n\n  The pension plan pays an incentive fee equal to 15% of positive CAPM risk-adjusted value added. Risk-adjusted value added is measured by applying the manager\u2019s annual risk-adjusted excess return to the plan\u2019s $75,000,000 average capital allocation.\n\n* The Core Question: What incentive fee is owed to the manager, rounded to the nearest dollar?", "answer": "$191,250", "feedback": "Verdict: Correct\n\nAnalysis: The student's final answer of $191,250 matches my independently derived result exactly. Working through the problem: the T-bill price of $970.873786 against $1,000 face implies a 3% annual risk-free rate; the manager's arithmetic mean return is 8.0% and the benchmark's is 6.0%; the regression slope (beta) computed from the five paired deviations is 1.1; Jensen's alpha is therefore 8.0% \u2212 [3% + 1.1 \u00d7 (6% \u2212 3%)] = 1.7%; applying this to $75,000,000 yields $1,275,000 of risk-adjusted value added; and 15% of that amount is $191,250. The student correctly identified that \"risk-adjusted excess return\" in the CAPM context means Jensen's alpha (not the raw excess return over the risk-free rate, which would have produced $562,500, nor the return over the benchmark, which would have produced $225,000). The final figure is exact with no rounding issues.\n\nAmbiguities: The phrase \"CAPM risk-adjusted value added\" and \"the manager's annual risk-adjusted excess return\" could conceivably be misread as the simple excess return over the risk-free rate or the excess return over the benchmark, rather than Jensen's alpha. However, the explicit invocation of CAPM and the deliberate provision of the beta-regression instructions strongly signal that Jensen's alpha is intended, so this is a minor interpretive risk rather than a genuine flaw. Additionally, the question specifies \"positive\" risk-adjusted value added, which is unambiguous here since alpha is positive, but a careful reader should note the fee would be zero if alpha were negative.", "verdict": "Correct"}, {"entry_id": 173, "problem": "* Scenario: Meridian Precision purchases a numerically controlled lathe for a new production line. The supplier\u2019s list price is $900,000, and the seller grants a 4% trade discount on the invoice. Meridian also pays a nonrefundable import duty of $36,000, freight-in of $12,000, and installation/testing costs of $48,000 before the machine is ready for use. A separate $15,000 employee training cost is expensed as incurred and is not capitalized. The machine is placed in service on January 1, 2026, and management plans to use it through December 31, 2035, then dispose of it. At disposal, a broker expects a gross resale price of $110,000; Meridian expects to pay $14,000 in removal/dismantling costs and $6,000 in selling commissions. Meridian depreciates equipment evenly over its service period down to estimated net disposal value. In 2026, the machine is expected to generate $1,250,000 of incremental revenue and $910,000 of incremental cash operating expenses, excluding depreciation. The corporate tax rate is 30%. Ignore the initial equipment purchase, the training outlay, and terminal disposal proceeds when computing 2026 operating cash flow.\n\n* The Core Question: What is the 2026 after-tax incremental operating cash flow attributable to the machine, rounded to the nearest dollar?", "answer": "$264,100", "feedback": "Verdict: Correct\n\nAnalysis: The student's final answer of $264,100 matches my independently derived result exactly. The capitalized cost of the machine (net of the 4% trade discount, plus import duty, freight-in, and installation/testing), the net disposal value (gross resale less removal costs and selling commissions), the resulting straight-line annual depreciation, and the after-tax operating cash flow computation (after-tax operating income plus the depreciation tax shield treatment) all reconcile precisely to $264,100. The student correctly excluded the $15,000 training cost from both the capitalized basis and the 2026 incremental operating cash flow, and correctly recognized depreciation as a non-cash deduction that affects taxes but is added back to arrive at cash flow.\n\nAmbiguities: The question is largely precise, but two phrasings merit note: (1) \"Meridian depreciates equipment evenly over its service period down to estimated net disposal value\" \u2014 a careless reader might use the gross resale price of $110,000 rather than the net disposal value of $90,000, which would yield a different depreciation figure ($85,000/year) and a final answer of $263,500; the word \"net\" resolves this, but it requires careful reading. (2) \"Ignore the initial equipment purchase... when computing 2026 operating cash flow\" could conceivably be misread as instruction to ignore depreciation entirely (since depreciation derives from the purchase), which would change the tax computation; however, standard capital budgeting convention makes clear that depreciation's tax shield must still be included, and the student interpreted this correctly.", "verdict": "Correct"}, {"entry_id": 174, "problem": "* Scenario: A fixed-income portfolio manager settles a bond purchase today immediately after a coupon payment, so accrued interest is zero. Each bond has a face value of $1,000, an annual coupon rate of 6.00% paid semiannually, and exactly 2 years remaining to maturity. The market yield to maturity is quoted as 4.00% nominal annual yield with semiannual compounding. The portfolio holds 1,000 identical bonds. The risk desk estimates the impact of yield changes by first computing the bond\u2019s Macaulay duration from present-value-weighted cash-flow timing, converting it to modified duration, and then applying the first-order duration price-change approximation. Immediately after valuation, the quoted yield rises by 25 basis points, with the same compounding convention.\n\n* The Core Question: What is the estimated dollar change in the total market value of the 1,000-bond position, rounded to the nearest whole dollar? Use a negative sign for a loss.", "answer": "-$4,875", "feedback": "Verdict: Correct\n\nAnalysis: The student's final answer of \u2212$4,875 matches my independently derived result. Pricing the bond at the 2% semiannual yield gives a price of approximately $1,038.08 per bond, with a Macaulay duration of roughly 1.9161 years, which converts to a modified duration of about 1.8785 years (dividing by 1.02). Applying the first-order approximation \u0394P \u2248 \u2212D_mod \u00d7 \u0394y \u00d7 P with \u0394y = 0.0025 yields a loss of about $4.875 per bond, or approximately \u2212$4,875 across the 1,000-bond position when rounded to the nearest whole dollar. The student's value is exactly correct under the prescribed methodology.\n\nAmbiguities: The phrasing is largely precise, but one element invites minor interpretive variation: \"converting it to modified duration\" with a \"4.00% nominal annual yield with semiannual compounding\" requires dividing the Macaulay duration (in years) by (1 + y/2) = 1.02. A student who incorrectly divided by (1 + y) = 1.04 or who failed to convert at all (using Macaulay duration directly) would arrive at approximately \u2212$4,783 or \u2212$4,973, respectively. The question's explicit instruction to compute Macaulay duration first and then convert resolves this, but the compounding-adjustment step is the most common source of divergent answers. Additionally, \"rounded to the nearest whole dollar\" could in principle be applied per-bond before scaling (giving \u2212$5,000), though the natural reading\u2014rounding the total\u2014is what the student correctly used.", "verdict": "Correct"}, {"entry_id": 175, "problem": "* Scenario: A technical trading desk is evaluating a possible double-bottom reversal in Orion Semiconductor shares after a prior downtrend. The desk defines:\n  * The first bottom as the lowest intraday trade during the first reversal window.\n  * The intervening peak as the highest intraday trade after the first bottom and before the second bottom.\n  * The second bottom as the lowest intraday trade during the retest window.\n  * If breakout-day volume is at least 190% of the 20-day average volume, the desk uses its aggressive target; otherwise, it uses the conservative target.\n\n  Market data:\n  * First reversal window: the lowest intraday trade was $48.20.\n  * Between the two bottoms: the highest intraday trade was $55.75.\n  * Retest window: the lowest intraday trade was $49.05.\n  * Breakout day: shares broke above the intervening peak, with volume of 3.96 million shares versus a 20-day average of 2.00 million shares.\n  * The fund bought 18,000 shares at a breakout execution price of $56.10.\n  * Round-trip trading costs are $0.01 per share on entry and $0.01 per share on exit.\n  * Ignore taxes, financing costs, and slippage beyond the stated execution price and trading costs.\n\n* The Core Question: If the fund exits exactly at the double-bottom target price implied by the desk\u2019s rule, what is the net dollar trading profit, rounded to the nearest whole dollar?", "answer": "$265,140", "feedback": "Verdict: Correct\n\nAnalysis: The student's final answer of $265,140 matches my independently derived result under the most coherent reading of the desk's rule. The pattern height is $7.55 (intervening peak $55.75 minus first bottom $48.20). Breakout volume of 3.96M versus a 2.00M average is 198% of the average, which satisfies the \u2265190% threshold, so the aggressive target applies. Interpreting the conservative target as the standard measured-move projection (peak + 1\u00d7 height = $63.30) and the aggressive target as a 2\u00d7 height projection (peak + 2 \u00d7 $7.55 = $70.85), the per-share net profit is $70.85 \u2212 $56.10 \u2212 $0.02 = $14.73, and 18,000 \u00d7 $14.73 = $265,140 exactly. The student's figure is internally consistent with this interpretation with no rounding error. Note that if a grader instead treated the \"aggressive\" target as the standard 1\u00d7 measured move ($63.30), the answer would be $129,240 \u2014 so the student clearly committed to the 2\u00d7 aggressive projection, which is the only interpretation that makes the conservative/aggressive distinction meaningful given the volume trigger in the question.\n\nAmbiguities: The question states the desk \"uses its aggressive target; otherwise, it uses the conservative target,\" but never numerically defines either target. The standard double-bottom convention (target = intervening peak + pattern height) is unstated, and the aggressive multiplier (presumably 2\u00d7 the pattern height) must be inferred. Additionally, \"breaks above the intervening peak\" implies the breakout level is $55.75, but the projection base (peak vs. execution price vs. second bottom) is not specified, which could materially change the target and thus the profit figure.", "verdict": "Correct"}, {"entry_id": 176, "problem": "* Scenario:  \nA publicly traded manufacturing firm is evaluating a new 3-year product line. All cash flows occur at year-end except initial outlays, which occur today.\n\n  * The equipment has an installed cost of **$1,200,000** today and will be depreciated straight-line to zero over 3 years.\n  * The project requires an immediate increase in net working capital of **$200,000**, fully recovered at the end of year 3.\n  * Expected annual operating data:\n\n| Year | Units Sold | Price per Unit | Variable Cost per Unit | Fixed Cash Costs |\n|---:|---:|---:|---:|---:|\n| 1 | 50,000 | $50 | $25 | $500,000 |\n| 2 | 55,000 | $52 | $26 | $520,000 |\n| 3 | 60,000 | $54 | $27 | $540,000 |\n\n  * At the end of year 3, the equipment is expected to be sold for **$150,000**.\n  * The corporate tax rate is **25%**, and taxes are paid in the same year as the associated cash flows.\n  * The firm\u2019s capital structure target is **60% equity and 40% debt** by market value.\n  * The risk-free rate is **4%**, the market risk premium is **5%**, the project equity beta is **1.2**, and the pre-tax cost of debt is **5%**.\n  * The firm has **500,000 shares outstanding**, and the project was not previously anticipated by the market.\n\n* The Core Question:  \nAssuming the market immediately capitalizes the project\u2019s value creation into equity value and debt value is unchanged, by how much should the firm\u2019s stock price change per share? Round to the nearest cent.", "answer": "**+$1.75 per share**", "feedback": "Verdict: Correct\n\nAnalysis: The student's final answer of **+$1.75 per share** matches my independently derived result. Working internally: the project's discount rate (WACC built from a 10% cost of equity via CAPM and a 3.75% after-tax cost of debt at the 60/40 target weights) is 7.5%. Discounting the three years of operating cash flows (which incorporate straight-line depreciation tax shields), the after-tax salvage of the equipment, and the recovery of net working capital, then netting against the $1,400,000 initial outlay, yields an NPV of approximately $877,470. Dividing by 500,000 shares gives roughly $1.7549 per share, which rounds to $1.75. The student's value is consistent with a correct and complete treatment of all components (after-tax salvage at zero book value, NWC recovery, and the after-tax cost of debt in the WACC).\n\nAmbiguities: The phrase \"the firm's capital structure target is 60% equity and 40% debt\" could invite debate over whether the project should be discounted at the firm's WACC versus an unlevered/project-specific rate, since \"project equity beta is 1.2\" presumes the project is financed at the target structure. Additionally, \"debt value is unchanged\" implicitly directs the entire NPV to equity, but a student could question whether only 60% of value creation accrues to equity holders given the financing mix. As stated, the conventional interpretation (full NPV to existing shareholders, discounted at WACC) is clearly intended, and the question otherwise specifies all parameters precisely.", "verdict": "Correct"}, {"entry_id": 177, "problem": "* Scenario: A fixed-income desk holds $5,000,000 face value of a newly issued 2-year corporate bond. The bond pays a 6% annual coupon in equal semiannual installments, has a $1,000 par value per bond, and was purchased at par on the issue date, so there is no accrued interest. Immediately after purchase, the market yield curve shifts upward in parallel by 25 basis points. The risk manager requires the standard first-order duration approximation, with no convexity adjustment, to estimate the portfolio\u2019s price impact.\n\n* The Core Question: What is the estimated dollar loss on the portfolio from the 25 bp yield increase, rounded to the nearest whole dollar?", "answer": "$23,232 loss", "feedback": "Verdict: Correct\n\nAnalysis: The student's final answer of a $23,232 loss matches my independently derived result. Working from a par bond (yield = coupon = 6%, semiannual compounding at 3% per period), the Macaulay duration comes out to approximately 1.9143 years, giving a modified duration of approximately 1.8586 years (dividing by 1.03). Applying the first-order approximation, \u0394P \u2248 \u2013D_mod \u00d7 \u0394y \u00d7 Portfolio Value = \u20131.8586 \u00d7 0.0025 \u00d7 $5,000,000 \u2248 \u2013$23,232. The student's value rounds exactly to my result, indicating they correctly identified the bond as priced at par (yield = 6%), correctly used semiannual periods to compute Macaulay duration, properly converted to modified duration with the per-period yield, and applied the duration approximation without a convexity adjustment as instructed.\n\nAmbiguities: The question is largely precise, but two minor points could invite alternative interpretations: (1) \"the market yield curve shifts upward in parallel by 25 basis points\" \u2014 it is implied but not explicitly stated whether the 25 bp applies to the bond-equivalent (semiannually compounded) yield; if a student interpreted the shock as 12.5 bp per semiannual period applied differently, or used an effective annual yield, results would deviate slightly. (2) \"standard first-order duration approximation\" \u2014 the question does not explicitly state whether modified duration or Macaulay duration should be used; a student using Macaulay duration directly (without dividing by 1.03) would obtain approximately $23,929, a plausible distractor. The student here correctly used modified duration, which is the standard convention for price-impact estimation.", "verdict": "Correct"}, {"entry_id": 178, "problem": "* Scenario: A technical analyst is evaluating a potential double-bottom reversal in shares of Meridian Robotics (MRDX). The analyst defines:\n  * The first bottom as the lowest intraday low during the first pullback window.\n  * The second bottom as the lowest intraday low during the second pullback window.\n  * The neckline as the highest intraday high between the two bottoms.\n  * The aggressive target rule is used only if breakout-day volume is at least 1.75 times the 20-day average volume; otherwise, the conservative target rule is used.\n\n  All prices are in dollars.\n\n  First pullback window intraday lows:\n\n  | Date | Intraday Low |\n  |---|---:|\n  | Jan 8 | 42.40 |\n  | Jan 9 | 41.85 |\n  | Jan 10 | 42.10 |\n  | Jan 11 | 42.25 |\n  | Jan 12 | 42.70 |\n\n  Intermediate rally intraday highs:\n\n  | Date | Intraday High |\n  |---|---:|\n  | Jan 15 | 47.20 |\n  | Jan 16 | 48.15 |\n  | Jan 17 | 49.30 |\n  | Jan 18 | 48.90 |\n  | Jan 19 | 50.10 |\n  | Jan 22 | 51.25 |\n  | Jan 23 | 50.80 |\n  | Jan 24 | 49.95 |\n  | Jan 25 | 50.45 |\n  | Jan 26 | 50.60 |\n\n  Second pullback window intraday lows:\n\n  | Date | Intraday Low |\n  |---|---:|\n  | Jan 29 | 43.25 |\n  | Jan 30 | 42.80 |\n  | Jan 31 | 42.95 |\n  | Feb 1 | 43.10 |\n  | Feb 2 | 43.45 |\n\n  On Feb 8, MRDX breaks above the neckline and closes at $52.10. Breakout-day volume is 3.6 million shares, while the 20-day average volume is 2.0 million shares.\n\n  A trading fund buys 12,000 shares at the Feb 8 closing price and exits exactly at the double-bottom target price. The fund pays a commission of $0.005 per share on both entry and exit.\n\n* The Core Question: What is the fund\u2019s net dollar trading profit, rounded to the nearest whole dollar?", "answer": "$215,280", "feedback": "Verdict: Correct\n\nAnalysis: The student's final answer of $215,280 matches my independently derived result under the most natural reading of the question's structure. Working through it internally: the first bottom is $41.85 (Jan 9), the second bottom is $42.80 (Jan 30), and the neckline is $51.25 (Jan 22). The pattern height measured from the neckline to the lowest bottom is $9.40. The breakout-day volume ratio is 3.6M / 2.0M = 1.80, which meets the 1.75 threshold, triggering the aggressive target rule. Under the convention that the aggressive rule projects twice the pattern height above the neckline (versus the conservative single measured move), the target is $51.25 + 2 \u00d7 $9.40 = $70.05. Per-share gain: $70.05 \u2212 $52.10 = $17.95. Gross profit: 12,000 \u00d7 $17.95 = $215,400. Round-trip commissions: 12,000 \u00d7 $0.005 \u00d7 2 = $120. Net profit: $215,400 \u2212 $120 = $215,280. The student's figure matches exactly, including the correct use of the lower of the two bottoms, the correct neckline, the correct triggering of the aggressive rule, and proper commission treatment on both legs.\n\nAmbiguities: The question references \"the aggressive target rule\" and \"the conservative target rule\" but never explicitly defines either projection formula. If a grader assumes the standard single measured-move target (neckline + height = $60.65) even for the \"aggressive\" case, the answer would instead be $102,480. Additionally, the phrase \"the lowest intraday low\" across both pullback windows leaves open whether the pattern height should be measured from the first bottom ($41.85), the second bottom ($42.80), or an average of the two \u2014 each choice produces a different target. Finally, \"breaks above the neckline and closes at $52.10\" leaves the precise breakout/entry mechanics implied rather than stated, though the question does clarify entry occurs at the closing price.", "verdict": "Correct"}, {"entry_id": 179, "problem": "* Scenario: A trading desk is evaluating a Targeted Accrual Redemption Note position consisting of 250 certificates, each with a face value of $1,000. The note observes monthly. At each observation date, the coupon accrual rate equals the 1-month reference rate of 0.50% plus a fixed spread of 0.30%, adjusted by any simulated monthly interest-rate change; negative accruals are floored at zero. The note terminates as soon as cumulative coupon accrual reaches 3.20%. Over the historical calibration window, every monthly interest-rate change was exactly 0.00%, so the volatility used for monthly rate changes is 0. The desk\u2019s simplified valuation convention is to discount the par redemption by the number of monthly observations required to hit the target, using the monthly coupon accrual rate as the per-period discount rate. The desk runs 10,000 valuation paths, but because volatility is zero, every path is identical. The note can currently be purchased at 96.50% of par.\n\n* The Core Question: What is the expected net dollar profit from buying the note at the quoted price, rounded to the nearest whole dollar?", "answer": "$907", "feedback": "Verdict: Correct\n\nAnalysis: The student's final answer of $907 matches my independently derived result. With zero volatility, every path produces a deterministic monthly accrual of 0.50% + 0.30% = 0.80%. Reaching the cumulative target of 3.20% requires exactly 4 monthly observations (4 \u00d7 0.80% = 3.20%). Under the desk's stated convention, the fair value per certificate is par discounted for 4 periods at 0.80% per period, i.e., $1,000 / (1.008)^4 \u2248 $968.63. The purchase price is 96.50% of par = $965.00 per certificate, giving a per-certificate profit of approximately $3.63. Multiplied across 250 certificates, the expected net profit is approximately $907.42, which rounds to $907. The student's value is exactly correct.\n\nAmbiguities: \n1. \"discount the par redemption by the number of monthly observations required to hit the target\" \u2014 this convention values only the discounted par redemption and appears to ignore the accrued coupons themselves as a cash flow. A student could reasonably ask whether the 3.20% accrued coupon should also be paid at termination and included in the valuation, which would change the answer substantially. The phrase \"simplified valuation convention\" signals this is intentional, but it invites alternative interpretations.\n2. \"cumulative coupon accrual reaches 3.20%\" \u2014 it is implicit but not explicitly stated whether accrual exactly equal to the target (as occurs here at month 4) triggers termination, versus requiring the target to be strictly exceeded. The word \"reaches\" supports inclusion at equality, but a stricter reading (\"exceeds\") would imply 5 months.\n3. The note count and face value structure (\"250 certificates, each with a face value of $1,000\") is precise, but the question does not state whether transaction costs or accrued interest at purchase apply \u2014 a reasonable assumption of none is required.", "verdict": "Correct"}, {"entry_id": 180, "problem": "* Scenario: A technical analyst is evaluating a potential double bottom reversal in shares of MNO Corp. After a prior downtrend, the stock\u2019s first trough occurred on March 4, when the lowest intraday trade was $42.80. The stock then rallied, and before the next trough occurred, its highest intraday trade was $49.60. On March 28, the stock made its second trough, with a lowest intraday trade of $43.95. On April 2, the stock broke above the interim high on volume equal to 165% of its 20-day average volume. The trading desk\u2019s rule is to use the aggressive double-bottom target if breakout volume is at least 150% of average; otherwise, it uses the conservative target. The desk buys 8,000 shares at an execution price of $50.25 per share and plans to sell all shares exactly at the calculated target price. Brokerage commission is $0.015 per share on both the purchase and the sale.\n* The Core Question: What is the net dollar trading profit after commissions, rounded to the nearest whole dollar?", "answer": "$103,360", "feedback": "Verdict: Incorrect\n\nAnalysis: The student's final answer of $103,360 does not match my independently derived result of **$48,960**. The correct logic: the pattern height using the lower (more aggressive) trough is $49.60 \u2212 $42.80 = $6.80, and since breakout volume (165%) meets the \u2265150% threshold, the aggressive target applies: $49.60 + $6.80 = $56.40. Gross profit is ($56.40 \u2212 $50.25) \u00d7 8,000 = $49,200, less total commissions of $0.015 \u00d7 8,000 \u00d7 2 = $240, yielding $48,960. The student's figure implies a sale price of $63.20 (since $103,360 + $240 = $103,600, or $12.95/share gross). That price equals $49.60 + 2 \u00d7 $6.80, strongly suggesting the student interpreted \"aggressive target\" as projecting the pattern height *twice* above the breakout level (a 2\u00d7 measured-move projection), rather than using the deeper trough for a single height projection. They did, however, correctly handle the round-trip commission of $240.\n\nAmbiguities: The terms \"aggressive double-bottom target\" and \"conservative target\" are not explicitly defined in the question. The most natural reading\u2014given that two distinct trough lows ($42.80 and $43.95) are provided\u2014is that the aggressive target uses the lower trough and the conservative target uses the higher trough for the measured-move height. However, a reader could plausibly interpret \"aggressive\" as a multiple (e.g., 2\u00d7) of the standard measured move, which appears to be the interpretation the student adopted. Defining the target formulas explicitly (e.g., \"aggressive target = interim high + (interim high \u2212 lower trough)\") would remove this ambiguity. Additionally, \"breaking above the interim high\" is implicitly the breakout/neckline level, which is standard but could be stated more precisely.", "verdict": "Incorrect"}, {"entry_id": 181, "problem": "* Scenario: An analyst is valuing a mature manufacturing company at the end of its explicit 5-year forecast. In forecast Year 5, the company is projected to have revenue of **$600 million**, an **EBITDA margin of 22%**, depreciation and amortization of **$27 million**, capital expenditures of **$48.75 million**, and an increase in net working capital of **$7 million**. The corporate tax rate is **25%**.  \n  The company\u2019s target capital structure is based on market values of **$600 million of equity** and **$400 million of debt**. The risk-free rate is **3%**, the equity beta is **1.2**, the equity market risk premium is **5%**, and the pre-tax cost of debt is **6%**.  \n  For the stable period after Year 5, the company assumes perpetual nominal growth equal to the sum of long-run real GDP growth of **1.5%** and long-run inflation of **1.7%**.  \n  A strategic buyer has offered to purchase the business at the end of Year 5 for **$1.18 billion**. The valuation committee instead applies the perpetuity growth terminal value method using Year 5 free cash flow and WACC.\n\n* The Core Question: What is the dollar amount by which the committee\u2019s modeled terminal value exceeds the buyer\u2019s offer, rounded to the nearest whole dollar?", "answer": "**$70,000,000**", "feedback": "Verdict: Incorrect\n\nAnalysis: My independently derived result is **$110,000,000**, which does not match the student's answer of $70,000,000. Working through the problem: Year 5 unlevered free cash flow comes to $50 million (EBITDA of $132M, less D&A of $27M gives EBIT of $105M; after-tax at 25% gives NOPAT of $78.75M; adding back D&A and subtracting capex of $48.75M and NWC increase of $7M yields $50M). The WACC is 7.2% (cost of equity of 9% via CAPM weighted at 60%, plus after-tax cost of debt of 4.5% weighted at 40%). With perpetual growth g = 1.5% + 1.7% = 3.2%, the Gordon growth terminal value requires growing the Year 5 FCF one period forward: TV = $50M \u00d7 1.032 / (0.072 \u2212 0.032) = $51.6M / 0.04 = **$1,290 million**. The excess over the $1,180 million offer is therefore **$110 million**.\n\nThe student's answer of $70 million corresponds exactly to a terminal value of $1,250 million, i.e., TV = $50M / 0.04. This reveals the likely error: the student failed to grow the Year 5 free cash flow by (1 + g) before capitalizing it. The perpetuity growth (Gordon) method values the cash flow stream beginning in Year 6, so the numerator must be FCF\u2085 \u00d7 (1 + g). Using FCF\u2085 directly in the numerator while still subtracting g in the denominator is internally inconsistent \u2014 a classic and common terminal value mistake. All other components (FCF build-up, WACC, growth rate) appear to have been computed correctly, since $70M is precisely the result one obtains with this single omission.\n\nAmbiguities: The phrase \"applies the perpetuity growth terminal value method **using Year 5 free cash flow** and WACC\" could be read literally as instructing the student to place the Year 5 FCF (ungrown) in the numerator, which would yield exactly $70,000,000. However, the standard and academically correct application of the perpetuity growth method requires the next-period cash flow, FCF\u2085 \u00d7 (1 + g), in the numerator; the phrase \"using Year 5 free cash flow\" conventionally just identifies the base cash flow input. A more precise formulation would have stated: \"using Year 5 free cash flow grown one period at the perpetual growth rate.\" Given this wording, the student's answer reflects a defensible literal reading, but under standard valuation convention it remains incorrect.", "verdict": "Incorrect"}, {"entry_id": 182, "problem": "* Scenario: An analyst is valuing Meridian Tools using a 5-year DCF ending in fiscal year 2031. For FY2031, Meridian is projected to generate revenue of $2,000 million with an EBITDA margin of 25%. Depreciation and amortization will be $80 million, capital expenditures will be $85 million, and net working capital will increase from $260 million at the end of FY2030 to $270 million at the end of FY2031. The corporate tax rate is 25%, and unlevered free cash flow is calculated as:  \n  \\[\n  \\text{FCF}=\\text{EBIT}(1-\\text{tax rate})+\\text{D\\&A}-\\text{Capex}-\\Delta \\text{NWC}\n  \\]  \n  Meridian\u2019s target market capital structure is based on 40 million shares trading at $20 per share and $200 million of debt trading at par. The cost of equity is derived using CAPM with a 4.0% risk-free rate, a beta of 1.10, and a 5.0% market risk premium. The pretax cost of debt is 6.0%. The terminal growth assumption equals expected long-run inflation of 2.0% plus mature-sector real growth of 0.5%. A comparable buyout benchmark values similar stable businesses at 9.8\u00d7 FY2031 EBITDA.\n\n* The Core Question: Using the perpetuity growth terminal value method, what is the dollar spread, in millions, between Meridian\u2019s perpetuity-based terminal value and the comparable buyout benchmark terminal enterprise value? Report the spread as positive if the perpetuity-based value is higher, rounded to the nearest $1 million.", "answer": "$100 million", "feedback": "Verdict: Incorrect\n\nAnalysis: The student's answer of $100 million does not match my independently derived result of $225 million. Working through the problem: FY2031 unlevered FCF is $300 million (EBIT of $420M taxed at 25% gives $315M NOPAT, plus $80M D&A, less $85M capex, less $10M NWC increase). The WACC is 8.5% (80% equity at a 9.5% CAPM cost of equity, 20% debt at a 4.5% after-tax cost). With terminal growth of 2.5%, the perpetuity terminal value is $300M \u00d7 1.025 / (0.085 \u2212 0.025) = $5,125 million. The benchmark value is 9.8 \u00d7 $500M EBITDA = $4,900 million, yielding a spread of +$225 million. The student's $100 million result is the classic signature error of failing to grow the final-year cash flow by (1 + g) before capitalizing: $300M / 0.06 = $5,000M, minus $4,900M = $100M. This is a conceptual error in applying the Gordon Growth formula \u2014 the perpetuity must begin with the first cash flow *after* the terminal year (FCF\u2082\u2080\u2083\u2082 = FCF\u2082\u2080\u2083\u2081 \u00d7 1.025), not the terminal year's cash flow itself.\n\nAmbiguities: The phrase \"perpetuity growth terminal value method\" applied to \"FY2031\" FCF could arguably be read as treating the $300M as the first perpetuity cash flow (i.e., as if it were already the year-after cash flow), which would justify $300M / 0.06 = $5,000M and a $100M spread. However, standard DCF convention \u2014 where FY2031 is explicitly stated to be the final forecast year of the 5-year DCF \u2014 requires growing the terminal-year FCF by (1 + g). The question could have been more precise by stating \"grow the final-year FCF by the terminal growth rate\" to eliminate this interpretation gap, but under conventional methodology the student's answer remains incorrect.", "verdict": "Incorrect"}, {"entry_id": 183, "problem": "* Scenario:  \nAn investor buys 1,000 Targeted Accrual Redemption Notes, each with a $1,000 denomination. The note accrues coupons monthly. The stated annual coupon is 12%, compounded through monthly accrual observations, so each monthly coupon accrual is based on the annual rate divided by 12. The note automatically redeems once cumulative accrued coupons reach $50 per $1,000 note.  \n\nFor the valuation date, the interest-rate shock volatility used for the monthly accrual path is assumed to be 0 basis points, and the valuation desk averages over 10,000 equally weighted paths. For each path, the redemption-only present value is computed by discounting the total par amount back over the number of monthly periods until redemption using the monthly coupon accrual rate as the per-period discount rate.  \n\nThe notes were issued at 95.00% of par.\n\n* The Core Question:  \nWhat is the net dollar mark-to-model gain, defined as redemption-only present value minus issue proceeds, rounded to the nearest whole dollar?", "answer": "$1,466", "feedback": "Verdict: Correct\n\nAnalysis: The student's final answer of $1,466 matches my independently derived result. With zero shock volatility, every one of the 10,000 paths is identical: the monthly accrual is $10 per $1,000 note (12%/12 = 1%), so the $50 cumulative cap is hit at exactly month 5, triggering redemption. Discounting the full par amount ($1,000,000 across 1,000 notes) back 5 monthly periods at the 1% per-period rate yields approximately $951,465.69. Subtracting the issue proceeds of $950,000 (95% of par) gives a net mark-to-model gain of approximately $1,465.69, which rounds to $1,466. The student's figure is exact to the nearest dollar.\n\nAmbiguities: The question is largely self-contained, but a few phrasings invite alternative readings: (1) \"redemption-only present value\" \u2014 the question defines discounting of \"the total par amount,\" which implies coupons themselves are excluded from the PV; a reader could mistakenly include the $50 of accrued coupons in the redemption cash flow, yielding a different answer (~$999,039 PV and a ~$49,039 \"gain\"). (2) \"once cumulative accrued coupons reach $50\" \u2014 it is implicit but not explicitly stated whether redemption occurs at the end of the month in which the cap is reached (month 5) versus the following period; the intended reading is end of month 5. (3) \"averages over 10,000 equally weighted paths\" is decorative given 0 bp volatility, which could momentarily mislead a reader into expecting path dispersion. None of these materially changes the intended answer given the explicit definition provided.", "verdict": "Correct"}, {"entry_id": 184, "problem": "* Scenario: A valuation team is preparing a year-5 terminal value estimate for a mature manufacturing company. All dollar amounts are in millions. In year 5, the company is projected to generate revenue of $600, with cash operating expenses excluding depreciation of $420, depreciation and amortization of $40, capital expenditures of $50, and net working capital rising from $155 at the start of the year to $166 at the end of the year. The corporate tax rate is 25%.  \n  The firm\u2019s capital structure uses only common equity and straight debt. The market value of equity is $900 and the market value of debt is $300. The risk-free rate is 3.0%, the company\u2019s equity beta is 1.4, the equity market risk premium is 5.0%, and the pre-tax cost of debt is 8.0%. The valuation team uses after-tax debt cost in WACC.  \n  For terminal growth, the valuation manual defines long-run nominal growth as the arithmetic sum of expected long-run price inflation and sustainable real unit growth. Expected inflation is 1.8% and sustainable real unit growth is 1.2%.  \n  A potential buyer has set a required minimum end-of-year-5 going-concern value of $1.35 billion.\n\n* The Core Question: Using the perpetuity growth terminal value method, what is the terminal value surplus or shortfall relative to the buyer\u2019s required minimum value, in millions of dollars, rounded to the nearest whole million? Use a positive number for a surplus and a negative number for a shortfall.", "answer": "+$50 million", "feedback": "Verdict: Incorrect\n\nAnalysis: My independently derived result is a surplus of **+$92 million**. Working internally: year-5 free cash flow to the firm comes out to $84 million (EBIT of $140, taxed at 25% to give NOPAT of $105, plus D&A of $40, less capex of $50, less the $11 increase in net working capital). The WACC is 9.0% (cost of equity of 10.0% from CAPM weighted at 75%, after-tax debt cost of 6.0% weighted at 25%). Terminal growth is 3.0% (1.8% + 1.2%). The standard Gordon growth terminal value at end of year 5 requires the year-6 cash flow: $84 \u00d7 1.03 = $86.52, divided by (9.0% \u2212 3.0%) = 6.0%, giving $1,442 million. Against the $1,350 million required minimum, the surplus is +$92 million.\n\nThe student's answer of +$50 million corresponds exactly to using the *ungrown* year-5 cash flow in the perpetuity numerator: $84 / 0.06 = $1,400 million, less $1,350 million = +$50 million. The likely error is conceptual: the student failed to grow the year-5 free cash flow by one period (1 + g) before capitalizing it. A terminal value measured at end of year 5 must be based on the year-6 cash flow, since the year-5 cash flow is already realized at that valuation date. All other components (FCFF of $84, WACC of 9%, g of 3%) appear to have been computed correctly, as the +$50 figure is only reachable with those exact intermediate values.\n\nAmbiguities: The question states \"Using the perpetuity growth terminal value method\" and asks for the \"end-of-year-5 going-concern value,\" but it never explicitly instructs the candidate to apply TV\u2085 = FCFF\u2085 \u00d7 (1 + g) / (WACC \u2212 g) versus TV = FCFF\u2085 / (WACC \u2212 g). While the former is the universally accepted convention in valuation practice (the cash flow in the numerator must be the first cash flow *after* the valuation date), the absence of an explicit \"grow the final-year cash flow one period\" instruction invites the alternative interpretation the student appears to have adopted. A stricter phrasing such as \"based on year-6 free cash flow\" would have eliminated this ambiguity. Nonetheless, under standard financial engineering convention, the omission of the (1 + g) growth factor is a substantive conceptual error, not a defensible alternative reading.", "verdict": "Incorrect"}, {"entry_id": 185, "problem": "* Scenario: A portfolio manager is evaluated over the calendar year using time-weighted return because the client made external cash flows during the year. The portfolio values and cash flows are as follows:\n\n  - January 1: Portfolio begins with a market value of $2,000,000.\n  - March 31: Immediately before any cash flow, the portfolio is valued at $2,120,000. The client then contributes $380,000.\n  - June 30: Immediately before any cash flow, the portfolio is valued at $2,450,000. The client then withdraws $250,000.\n  - September 30: Immediately before any cash flow, the portfolio is valued at $2,310,000. The client then contributes $90,000.\n  - December 31: The final portfolio market value is $2,568,000.\n\n  The manager\u2019s contract pays a performance bonus equal to 10% of positive excess time-weighted return above a 14.00% annual benchmark, applied to a fixed fee notional of $10,000,000.\n\n* The Core Question: What is the manager\u2019s performance bonus in dollars, rounded to the nearest whole dollar?", "answer": "$27,092", "feedback": "Verdict: Correct\n\nAnalysis: I independently computed the four sub-period holding period returns by valuing the portfolio immediately before each cash flow and adjusting the beginning value of each subsequent period for the flows. Chain-linking the four sub-period growth factors yields an annual time-weighted return of approximately 16.7092%. The excess return over the 14.00% benchmark is approximately 2.7092%, and applying the 10% bonus rate to the $10,000,000 fee notional gives a bonus of $27,091.80, which rounds to $27,092. The student's final answer matches my independently derived result exactly, indicating they correctly geometrically linked the sub-period returns (rather than averaging them arithmetically) and correctly adjusted period beginning values for contributions and withdrawals.\n\nAmbiguities: The question is largely precise, but two minor points merit note: (1) the phrase \"Immediately before any cash flow\" clearly establishes that valuations precede the flows, which is essential and well-stated; however, (2) \"10% of positive excess time-weighted return above a 14.00% annual benchmark, applied to a fixed fee notional\" could conceivably be misread as 10% of a dollar excess amount rather than 10% of the excess return rate times the notional \u2014 though both interpretations are mathematically equivalent here (10% \u00d7 (TWR \u2212 14%) \u00d7 $10,000,000). Additionally, the problem does not specify intermediate rounding conventions for the sub-period returns, but using full precision (as the student evidently did) is the standard expectation.", "verdict": "Correct"}, {"entry_id": 186, "problem": "* Scenario: A corporate treasurer observes the following default-free zero-coupon Treasury STRIPS prices, each quoted per $100 of face value:\n  * A STRIP maturing in exactly 1 year trades at **$96.153846**.\n  * A STRIP maturing in exactly 2 years trades at **$90.702948**.\n\n  The treasurer assumes the pure expectations theory of the term structure holds, with annual compounding. The company expects to borrow **$40,000,000** for one year, starting exactly one year from today and ending two years from today. A bank offers to lock in that future one-year borrowing rate at **5.75%**.\n\n* The Core Question: Based on the term structure-implied expected one-year rate for the second year, what is the company\u2019s expected dollar savings from locking in the bank\u2019s rate instead of borrowing at the implied expected rate, rounded to the nearest dollar?", "answer": "**$103,846**", "feedback": "Verdict: Correct\n\nAnalysis: The student's final answer of **$103,846** matches my independently derived result. The STRIPS prices imply a 1-year spot rate of 4.00% and a 2-year spot rate of 5.00% (annual compounding). Under pure expectations theory, the implied forward one-year rate for year two is (1.05)\u00b2/(1.04) \u2212 1 \u2248 6.009615%. Locking in 5.75% instead saves the company 40,000,000 \u00d7 (0.06009615 \u2212 0.0575) \u2248 $103,846.15, which rounds to $103,846. The student executed all steps correctly \u2014 extracting spot rates from prices, computing the implied forward rate, and calculating the interest differential on the notional.\n\nAmbiguities: The question is largely precise, but one minor point invites alternative interpretation: the phrase \"expected dollar savings\" does not specify *when* the savings is measured. The natural reading (interest differential paid at the end of year two) yields $103,846, but a stricter treatment could discount that amount back to today or to year one, producing a slightly smaller present-value figure. Since the question says \"based on the term structure-implied expected one-year rate\" and asks for the dollar savings without mentioning present value, the undiscounted interpretation is the intended one.", "verdict": "Correct"}, {"entry_id": 187, "problem": "* Scenario: A manufacturer uses a two-bin system for a low-value consumable part. Over the last 90 calendar days, the stockroom issued 18,900 units, with usage assumed uniform across calendar days. A replenishment purchase order released at 9:00 a.m. on July 1 is contractually delivered at 9:00 a.m. on July 8. The controller\u2019s policy requires a safety buffer equal to the greater of 80 units or 20% of normal consumption during the supplier wait. Each unit has a capitalized inventory cost of $37.50, and the approved working-capital budget for the reserve bin is $65,000.\n* The Core Question: Using the reserve-stock calculation, what is the dollar amount by which the required reserve-bin inventory value is over or under the approved budget, rounded to the nearest whole dollar? State \u201cover\u201d or \u201cunder.\u201d", "answer": "$1,150 over", "feedback": "Verdict: Correct\n\nAnalysis: The student's final answer matches my independently derived result exactly. Daily usage works out to 210 units per calendar day, the supplier wait is exactly 7 days (9:00 a.m. July 1 to 9:00 a.m. July 8), giving lead-time consumption of 1,470 units. The safety buffer is the greater of 80 units or 20% of 1,470 (= 294 units), so 294 applies. The reserve bin requirement is 1,470 + 294 = 1,764 units, valued at 1,764 \u00d7 $37.50 = $66,150. Compared with the $65,000 budget, this is $1,150 over. The student's answer of \"$1,150 over\" is fully correct in both magnitude and direction.\n\nAmbiguities: The phrase \"reserve-stock calculation\" could be interpreted two ways: (1) reserve bin = lead-time consumption plus safety buffer (the standard two-bin reorder-point quantity, which yields $66,150 and the answer given), or (2) reserve bin = safety buffer only (294 units \u00d7 $37.50 = $11,025, which would be $53,975 under budget). The question's reference to \"the reserve-bin inventory value\" alongside a sizable $65,000 budget strongly implies interpretation (1), but the term \"safety buffer\" being defined separately invites the alternative reading. Additionally, \"normal consumption during the supplier wait\" is precise only because the dates fix the lead time at exactly 7 days; had the dates been ambiguous (e.g., inclusive day-counting yielding 8 days), the answer would change.", "verdict": "Correct"}, {"entry_id": 188, "problem": "* Scenario: On January 1, 2026, the Treasury STRIPS market shows the following default-free zero-coupon bond prices, both quoted for a $1,000,000 face value and using annual compounding:\n\n  * A 1-year zero-coupon Treasury maturing January 1, 2027, trades for $952,380.952381.\n  * A 2-year zero-coupon Treasury maturing January 1, 2028, trades for $873,438.728273.\n\n  Assume pure expectations theory holds, with no term premium or liquidity premium.\n\n  A firm knows it must borrow $100,000,000 for exactly one year, from January 1, 2027 to January 1, 2028. A bank offers today to lock in that future borrowing rate at 8.60%, with interest paid at the end of the borrowing year.\n\n* The Core Question: Using the Treasury STRIPS prices to infer the expected one-year rate for January 1, 2027 to January 1, 2028, what is the firm\u2019s expected dollar interest savings from locking in the bank\u2019s 8.60% rate instead of paying the forecasted market rate? Round to the nearest whole dollar.", "answer": "$438,095", "feedback": "Verdict: Correct\n\nAnalysis: The student's final answer of $438,095 matches my independently derived result. The STRIPS prices imply a 1-year spot rate of 5.00% and a 2-year spot rate of 7.00%, which under pure expectations theory yield a forward one-year rate of (1.07\u00b2/1.05) \u2212 1 \u2248 9.0381% for the 2027\u20132028 period. The interest savings on $100,000,000 is (0.0903810 \u2212 0.0860) \u00d7 $100,000,000 \u2248 $438,095.24, which rounds to $438,095. The student correctly extracted both spot rates, computed the implied forward rate without taking the common shortcut of approximating it as 2y\u2082 \u2212 y\u2081 = 9.00% (which would have given an incorrect savings of $400,000), and correctly applied the rate differential to the notional.\n\nAmbiguities: The question is largely precise, but two minor points could invite alternative interpretations: (1) \"expected dollar interest savings\" could conceivably be interpreted as a present value as of January 1, 2026 (discounting the $438,095 back two years would give roughly $382,640), rather than the nominal savings realized on January 1, 2028 \u2014 the phrase \"with interest paid at the end of the borrowing year\" suggests the nominal figure is intended, but this is not stated explicitly; (2) the question does not explicitly state the day-count or that the forward rate should be computed exactly rather than via the linear approximation, though \"using annual compounding\" reasonably implies the exact geometric forward calculation.", "verdict": "Correct"}, {"entry_id": 189, "problem": "* Scenario:  \nA manufacturing company is calculating its FY2025 management bonus based on **underlying profit**, using a policy that removes non-recurring financial impacts from performance measurement.\n\nDuring FY2025, the company:\n  * Sold **120,000 standard units** at **$480 per unit**.\n  * Sold **35,000 premium units** at **$1,150 per unit**.\n  * Earned **$9,750,000** in recurring maintenance-service fees.\n\nIts recurring operating costs for the year were:\n  * Raw materials: **$31,600,000**\n  * Direct labor: **$12,800,000**\n  * Factory rent and utilities: **$4,250,000**\n  * Administrative salaries: **$9,900,000**\n  * Recurring depreciation: **$3,700,000**\n  * Ordinary SG&A: **$6,100,000**\n\nThe following non-recurring events were also recorded in accounting profit, with gains treated as positive and charges/expenses treated as negative:\n  * One-time gain on sale of a warehouse: **+$5,400,000**\n  * Litigation settlement expense: **\u2212$2,250,000**\n  * Restructuring charge: **\u2212$3,100,000**\n\nUnder the bonus plan, management receives **6% of the amount by which underlying profit exceeds $38,500,000**.\n\n* The Core Question:  \nWhat is the management bonus accrual for FY2025, rounded to the nearest whole dollar?", "answer": "**$42,000**", "feedback": "Verdict: Incorrect\n\nAnalysis: The student's final answer of $42,000 does not match my independently derived result of **$45,000**. The correct path: total recurring revenue is $107,600,000 (standard units $57,600,000 + premium units $40,250,000 + service fees $9,750,000), total recurring costs are $68,350,000, yielding an underlying profit of $39,250,000. Since the non-recurring items (gain of +$5,400,000, litigation \u2212$2,250,000, restructuring \u2212$3,100,000) must all be excluded under the policy, none affect the underlying figure. The excess over the $38,500,000 hurdle is $750,000, and 6% of that is $45,000. The student's answer of $42,000 implies an excess of only $700,000 (i.e., underlying profit of $39,200,000), suggesting a $50,000 arithmetic slip somewhere in summing revenues or costs \u2014 most likely a transcription or addition error rather than a conceptual one, since incorrectly including the non-recurring items (net +$50,000) would have *raised* the bonus to $48,000, not lowered it.\n\nAmbiguities: None of material consequence. The question is precise: it explicitly defines underlying profit as removing \"non-recurring financial impacts,\" lists the non-recurring items separately with signs, and clearly states the bonus formula (\"6% of the amount by which underlying profit exceeds $38,500,000\"). One could pedantically note that the question does not state whether interest or taxes exist, but since none are mentioned, the only reasonable interpretation is that the listed items are exhaustive.", "verdict": "Incorrect"}, {"entry_id": 190, "problem": "* Scenario: An endowment evaluates an active equity manager over a single confirmed rising-market quarter, from January 1 to March 31.  \n  * The benchmark equity index level increased from 5,000 to 5,550 during the quarter. The index also paid dividend cash flows equivalent to 50 index points over the same period.  \n  * The manager\u2019s fund NAV per share increased from $20.00 to $22.70. The fund also paid $0.10 per share in cash distributions during the quarter, which are not included in the ending NAV.  \n  * The investment policy requires the manager to capture at least 115% of the benchmark\u2019s gain during rising markets to pass the quarterly review.\n\n* The Core Question: By how many percentage points did the manager exceed or fall short of the 115% policy threshold, and did the manager pass or fail? Round the percentage-point difference to two decimals.", "answer": "Exceeded by 1.67 percentage points; Pass.", "feedback": "Verdict: Correct\n\nAnalysis: The student's final answer matches my independently derived result
