ropriation.\n\n* The Core Question: What is the projected net impact on the FY2026 state budget, rounded to the nearest $1 million? Use a negative sign if it is a net budget deficit.", "answer": "-$1,605,000,000", "feedback": "Verdict: Correct\n\nAnalysis: The student's final answer matches my independently derived result exactly. Working through the problem internally: the historical data implies a spending multiplier of exactly 3 (income rose $9.120B from a $3.040B spending increase). Applying this multiplier to the $1.875B appropriation yields an induced income increase of $5.625B, generating incremental tax revenue of 4.8% \u00d7 $5.625B = $0.270B. The net budget impact is $0.270B \u2212 $1.875B = \u2212$1.605B, i.e., \u2212$1,605,000,000 \u2014 a net deficit. The student's value and sign convention are both correct, and no rounding issues arise since the figures resolve exactly to the nearest million.\n\nAmbiguities: The question is largely precise, but two minor points invite alternative readings: (1) \"Assume the same multiplier effect applies\" could conceivably be misread as applying the same absolute income change rather than the same ratio, though the standard interpretation (multiplier = \u0394Y/\u0394G = 3) is clearly intended; (2) \"income tax equal to 4.8% of the induced increase in state domestic income\" explicitly restricts taxation to the *induced* income change, foreclosing any interpretation involving taxing total income or the appropriation itself \u2014 so this phrasing actually resolves rather than creates ambiguity. No interpretation materially threatens the unique answer.", "verdict": "Correct"}, {"entry_id": 81, "problem": "* Scenario: An investor opened a private investment account on January 1, 2022 by purchasing fund units for $100,000. All subsequent cash movements occur at year-end.\n\n  * December 31, 2022: The investor received a $4,000 cash distribution and immediately made an additional $20,000 contribution.\n  * December 31, 2023: The investor received a $5,000 cash distribution and also redeemed part of the holding for $30,000.\n  * December 31, 2024: The investor received a final $4,500 cash distribution and liquidated the remaining position for $102,333.60.\n\n  The investor evaluates performance using the annual money-weighted return over the full three-year period. The account\u2019s required annual hurdle rate is 6.75%.\n\n* The Core Question: What is the account\u2019s annual performance spread over the hurdle rate, in basis points, rounded to the nearest whole basis point?", "answer": "125 basis points", "feedback": "Verdict: Correct\n\nAnalysis: The student's final answer matches my independently derived result. Setting up the money-weighted return (IRR) equation with the correct net cash flows at each date \u2014 the initial outlay, the year-1 net contribution (distribution received less the additional contribution), the year-2 net inflow (distribution plus partial redemption), and the year-3 terminal inflow (final distribution plus liquidation proceeds) \u2014 yields an IRR of exactly 8.00% per annum (the cash flows were evidently engineered to produce this clean solution; the NPV at 8% is effectively zero). Subtracting the 6.75% hurdle rate gives a spread of 1.25%, which is 125 basis points. The student correctly netted the simultaneous distributions and contributions/redemptions at each year-end, solved the cubic IRR equation accurately, and converted the spread to basis points.\n\nAmbiguities: The phrase \"performance spread over the hurdle rate\" could in principle be interpreted geometrically (i.e., (1+IRR)/(1+hurdle) \u2212 1 \u2248 1.171%, or ~117 bps) rather than as a simple arithmetic difference; however, the arithmetic difference is the standard convention for quoting spreads in basis points, so the intended interpretation is reasonably clear. Additionally, \"received a $4,000 cash distribution\" could conceivably be read as a distribution reinvested rather than withdrawn, but the explicit framing as \"cash movements\" and \"received... cash\" makes the external-cash-flow treatment the natural reading. Otherwise, the question is precise.", "verdict": "Correct"}, {"entry_id": 82, "problem": "* Scenario: A proprietary trading desk is reviewing a 5-minute Heikin-Ashi chart bar for Orion Semiconductor shares from 10:00:00 through 10:04:59. Only last-sale execution prices count; bid/ask quotes are ignored. The eligible trade prints during the interval are:\n\n  | Time | Execution Price |\n  |---|---:|\n  | 10:00:03 | $72.40 |\n  | 10:00:41 | $73.10 |\n  | 10:01:26 | $71.95 |\n  | 10:02:18 | $74.25 |\n  | 10:03:09 | $72.80 |\n  | 10:04:14 | $70.85 |\n  | 10:04:58 | $73.60 |\n\n  The desk\u2019s risk system marks a 42,000-share inventory position at the actual final execution price of the bar. Its strategy dashboard instead marks the same position at the standard Heikin-Ashi close for the bar.\n\n* The Core Question: What is the dollar amount by which the risk-system mark exceeds the strategy-dashboard mark, rounded to the nearest whole dollar?", "answer": "$34,650", "feedback": "Verdict: Correct\n\nAnalysis: The student's final answer matches my independently derived result. The actual bar's OHLC values yield a Heikin-Ashi close (the average of open, high, low, and close), and the difference between the actual final execution price and that HA close, multiplied by the 42,000-share position, produces exactly $34,650. The risk-system mark indeed exceeds the dashboard mark, so the sign convention is also correctly handled.\n\nAmbiguities: The phrase \"standard Heikin-Ashi close\" is precise in formula terms \u2014 (O+H+L+C)/4 of the current bar \u2014 but a fully rigorous Heikin-Ashi construction also involves a recursively defined HA open from prior bars; while the HA close itself does not depend on prior bars, a student might wonder whether prior-bar data was needed (it is not, since only the HA close is requested). Additionally, \"marks a 42,000-share inventory position\" implicitly assumes a long position; a short position would flip the sign, though the question's phrasing \"exceeds\" makes the intended magnitude unambiguous.", "verdict": "Correct"}, {"entry_id": 83, "problem": "* Scenario:  \nA quant desk is running a one-trading-day Euler step under a square-root stochastic-volatility equity model:\n\n\\[\n\\Delta S = rS\\Delta t+\\sqrt{v}S\\Delta W_S\n\\]\n\n\\[\n\\Delta v=\\kappa(\\theta-v)\\Delta t+\\eta\\sqrt{v}\\Delta W_v\n\\]\n\nAt today\u2019s close, the company\u2019s total equity market value is \\$9.6 billion and it has 96.0 million shares outstanding. The desk sets the current instantaneous variance equal to the square of the current short-maturity annualized volatility quote, which is 20.00%.\n\nThe continuously compounded risk-free account grows \\$1.00 into \\$1.030454534 over one year. Use 252 trading days per year. The long-run annualized volatility level is 30.00%. The mean-reversion calibration says that when variance is 0.0100 below its long-run level, its deterministic pull toward that level is +0.0200 variance units per year. At the current variance level, the variance diffusion loading is 0.100 per square-root year.\n\nFor the next trading day, the standardized shocks are \\(-0.50\\) for the stock and \\(+0.80\\) for the variance process; convert each to a Brownian increment by multiplying by \\(\\sqrt{\\Delta t}\\). Ignore correlation adjustments.\n\nThe desk\u2019s book is long 10,000 shares and short a one-day variance note. The note pays its long holder at tomorrow\u2019s close:\n\n\\[\n\\$2{,}000{,}000 \\times (v_{\\text{next}}-v_{\\text{today}})\n\\]\n\nThere are no other cash flows.\n\n* The Core Question:  \nWhat is the book\u2019s total one-day P&L in dollars, rounded to the nearest whole dollar? Use positive for a gain and negative for a loss.", "answer": "**-\\$17,053**", "feedback": "Verdict: Correct\n\nAnalysis: The student's final answer of **\u2212$17,053** matches my independently derived result exactly. Working through it internally: the share price is $100 (=$9.6B / 96M shares), initial variance v\u2080 = 0.04, the risk-free rate implied by the growth factor is r = 3% continuously compounded, \u0394t = 1/252, \u03ba = 2.0 (from pull of +0.02 per 0.01 variance gap), \u03b8 = 0.09, and \u03b7\u221av\u2080 = 0.100. The one-day stock move combines a small positive drift (~+$0.0119) with a negative diffusion term (~\u2212$0.6299), giving \u0394S \u2248 \u2212$0.61804 per share, or \u2248 \u2212$6,180.36 on 10,000 shares. The variance increment combines drift (~+0.000397) and diffusion (~+0.005040) for \u0394v \u2248 +0.0054364; being short the note, the desk pays $2,000,000 \u00d7 \u0394v \u2248 $10,872.70. Total P&L \u2248 \u2212$6,180.36 \u2212 $10,872.70 \u2248 \u2212$17,053.06, which rounds to \u2212$17,053. The student's number is exactly right.\n\nAmbiguities: \n1. \"The desk sets the current instantaneous variance equal to the square of the current short-maturity annualized volatility quote, which is 20.00%\" \u2014 slightly convoluted phrasing, though the intended v\u2080 = 0.04 is recoverable.\n2. \"At the current variance level, the variance diffusion loading is 0.100 per square-root year\" \u2014 it is mildly ambiguous whether \"diffusion loading\" means \u03b7 itself or the full term \u03b7\u221av. The phrase \"at the current variance level\" signals it is \u03b7\u221av\u2080 = 0.100, but a reader could misread it as \u03b7 = 0.100 (which would yield a different answer of \u2248 \u2212$14,652).\n3. \"Ignore correlation adjustments\" \u2014 clear in intent (use the shocks as independent), but a stricter wording such as \"treat \u0394W_S and \u0394W_v as uncorrelated\" would remove any doubt.\n4. The note's reference variance \"v_today\" could conceivably be questioned, but it unambiguously equals v\u2080 = 0.04 given the setup, so the payoff is well-defined.", "verdict": "Correct"}, {"entry_id": 84, "problem": "* Scenario: On January 2, 2026, a non-dividend-paying stock has total equity market capitalization of \\$400,000,000 and 4,000,000 shares outstanding. A European put option on this stock expires on January 2, 2027, and allows the holder to sell one share for \\$100 at expiration. Use an ACT/365 convention. A default-free zero-coupon Treasury maturing on the same date has face value \\$100 and trades today for \\$95.12294245. The stock\u2019s annualized log-return variance is quoted as 0.0400. The put is currently quoted in the market at \\$5.10 per share, and a fund holds 500 put contracts, each covering 100 shares.\n\n* The Core Question: Using the Black-Scholes European put value as the mark-to-model price, what is the fund\u2019s total mark-to-model gain relative to the market quote, rounded to the nearest whole dollar?", "answer": "\\$23,676", "feedback": "Verdict: Correct\n\nAnalysis: The student's final answer matches my independently derived result. Working through the problem: the share price is $100 (market cap divided by shares outstanding), the strike is $100, the time to expiry is exactly one year under ACT/365 (365 days from Jan 2, 2026 to Jan 2, 2027), the volatility is \u03c3 = 0.20 (square root of the quoted variance 0.0400), and the implied continuously compounded risk-free rate from the zero-coupon bond is exactly 5% (since 95.12294245 = 100e^(\u22120.05)). This yields d\u2081 = 0.35 and d\u2082 = 0.15, giving N(\u2212d\u2081) \u2248 0.3631694 and N(\u2212d\u2082) \u2248 0.4403823. The Black-Scholes put value is approximately $5.573526 per share. The per-share gain over the $5.10 market quote is $0.473526, and across 500 contracts \u00d7 100 shares = 50,000 shares, the total mark-to-model gain is approximately $23,676.31, which rounds to **$23,676**. The student's answer is exactly right. Note that a student using less precise normal CDF tables (e.g., four-decimal table values) could land on $23,677, so the submitted figure reflects high-precision computation.\n\nAmbiguities: The question is largely precise, but two minor points invite interpretation: (1) \"annualized log-return variance is quoted as 0.0400\" requires the solver to recognize that \u03c3 = \u221a0.0400 = 0.20 rather than using 0.04 directly as volatility \u2014 a common trap, though arguably intentional; (2) \"rounded to the nearest whole dollar\" does not specify whether rounding should occur at the per-share level before scaling or only at the final total. Since the exact total ($23,676.31) sits near a rounding boundary depending on normal CDF precision, answers of $23,676 vs. $23,677 could both arise from defensible computations.", "verdict": "Correct"}, {"entry_id": 85, "problem": "* Scenario: In a regional fiber-broadband market, the regulator defines market share using annual in-market revenue. For the most recent year, the six providers reported the following revenues: Apex $360 million, Beacon $240 million, Cascade $160 million, Delta $120 million, Echo $80 million, and Frontier $40 million. Apex acquires Echo, and no customer losses or revenue changes occur before the regulator measures the post-closing market concentration. Under the consent order, if the post-closing HHI exceeds 2,500, Apex must place into escrow $25,000 for each HHI point above 2,500; otherwise, no escrow is required.\n* The Core Question: What is the required escrow amount in dollars, rounded to the nearest whole dollar?", "answer": "$10,700,000", "feedback": "Verdict: Correct\n\nAnalysis: The student's final answer of $10,700,000 matches my independently derived result exactly. Working with total market revenue of $1,000 million, the post-merger shares (in percent) yield a post-closing HHI of 2,928. This exceeds the 2,500 threshold by 428 points, and at $25,000 per point, the escrow obligation is precisely $10,700,000. The student correctly combined Apex and Echo into a single entity before squaring (a common error would be to keep them separate or to merely add the pre-merger HHI delta incorrectly), and they used whole-percentage market shares as is conventional for HHI computations. No rounding issues arise since the shares are exact integers.\n\nAmbiguities: The question is largely precise, but one phrase invites a possible alternative interpretation: \"market share using annual in-market revenue\" does not explicitly state that shares should be expressed as whole percentages (the standard HHI convention, yielding values from 0 to 10,000) rather than decimal fractions (yielding values from 0 to 1). However, the threshold of \"2,500\" strongly implies the conventional percentage-point scale, so a competent student should resolve this correctly, as this one did. Additionally, \"each HHI point above 2,500\" could theoretically include fractional points, but here the excess (428) is a whole number, rendering the issue moot.", "verdict": "Correct"}, {"entry_id": 86, "problem": "* Scenario: A quant fund marks a one-period trading book using the standard one-step Euler discretization of the risk-neutral Heston stochastic volatility model, where the variance\u2014not volatility\u2014is the state variable. The fund owns 10,000 shares of an ETF currently marked at a total market value of $1,000,000. The marking horizon is 3.65 calendar days under ACT/365. Over this same horizon, a risk-free cash account earns 0.05% simple interest. The ETF\u2019s current instantaneous annualized volatility is 20%, and its long-run annualized volatility level is 30%. The variance mean-reversion calibration implies that, if the variance Brownian shock were zero, the variance would increase by 0.0015 variance units over this horizon due solely to mean reversion. The vol-of-vol calibration implies that, at the current variance level, a +0.10 Brownian variance increment would add +0.0100 variance units before mean reversion. The realized standardized shocks over the horizon are -0.50 for the ETF price and +1.20 for the variance process; convert standardized shocks to Brownian increments using the square root of the year fraction. Use no variance floor, truncation, or correlation adjustment. The fund is also long a variance-linked forward that pays at the end of the same horizon  \n  \\[\n  \\$1{,}000{,}000 \\times (V_{\\text{end}} - 0.0500),\n  \\]\n  where \\(V_{\\text{end}}\\) is the end-of-horizon variance. The forward has zero initial value.\n\n* The Core Question: What is the fund\u2019s total dollar P&L over the horizon, including both the ETF position and the variance-linked forward payoff, rounded to the nearest whole dollar? Positive means gain and negative means loss.", "answer": "-$6,000", "feedback": "Verdict: Correct\n\nAnalysis: The student's final answer of -$6,000 matches my independently derived result. Working through the Euler scheme internally: the ETF leg loses $9,500 (the risk-free drift contributes +0.05% while the diffusion term, computed from 20% volatility, a year fraction of 0.01, and the -0.50 standardized shock, contributes -1.00%, for a net -0.95% on $1,000,000). The variance leg ends at V_end = 0.0400 + 0.0015 (mean reversion) + 0.0120 (vol-of-vol diffusion, since the +0.10-increment calibration implies a coefficient of 0.10 per unit Brownian increment, applied to dW_v = 1.20 \u00d7 0.10 = 0.12), giving V_end = 0.0535. The forward pays $1,000,000 \u00d7 (0.0535 - 0.0500) = +$3,500, and with zero initial value this is pure gain. Total: -$9,500 + $3,500 = -$6,000. The student's number is exactly right, indicating correct handling of the drift, the square-root-of-time conversion of standardized shocks, and the vol-of-vol calibration.\n\nAmbiguities:\n1. \"a risk-free cash account earns 0.05% simple interest\" \u2014 it is stated to apply \"over this same horizon,\" but a careless reader could interpret 0.05% as an annualized rate, which would change the drift term to 0.0005 \u00d7 0.01 and shift the ETF P&L to approximately -$9,995 (total \u2248 -$6,495). The intended reading appears to be 0.05% over the horizon.\n2. \"The vol-of-vol calibration implies that, at the current variance level, a +0.10 Brownian variance increment would add +0.0100 variance units\" \u2014 this defines the diffusion coefficient implicitly (0.10 per unit of Brownian increment) rather than stating \u03c3 directly; a solver could conceivably misread \"+0.10 Brownian increment\" as the standardized shock rather than the Brownian increment, altering the scaling.\n3. The problem does not state whether the variance-forward payoff should be discounted back or whether P&L is simply measured at the horizon; since the horizon is identical for both legs and the forward has zero initial value, the natural reading (undiscounted horizon P&L) is what the answer requires, but this is not made fully explicit.", "verdict": "Correct"}, {"entry_id": 87, "problem": "* Scenario: On January 1, 2022, an investor opens a fund account by buying 4,000 fund units at $24.875 per unit, with no other opening costs. All subsequent cash movements occur exactly one year apart at year-end:\n  * December 31, 2022: the investor receives a $4,200 cash dividend paid out to her bank account, and on the same day contributes $14,200 of new cash into the fund.\n  * December 31, 2023: the investor sells part of the holding and withdraws $11,500 to her bank account; she also receives an $8,500 cash distribution paid out to her bank account.\n  * December 31, 2024: the investor fully liquidates the remaining fund units. Gross liquidation proceeds are $116,250, and a closing transaction fee of $214.80 is deducted before cash is paid to the investor.\n  \n  A comparable benchmark annual return over the same 3-year horizon is 6.50%. Use the money-weighted rate of return implied by these dated cash movements, treating contributions as investor outflows and withdrawals/distributions/liquidation proceeds as investor inflows.\n\n* The Core Question: What is the portfolio\u2019s annual money-weighted excess return over the benchmark, in basis points, rounded to the nearest whole basis point?", "answer": "150 basis points", "feedback": "Verdict: Incorrect\n\nAnalysis: My independently derived money-weighted rate of return uses the dated investor cash flows: an initial outflow of $99,500 (4,000 \u00d7 $24.875) at t=0; a net outflow of $10,000 at t=1 ($14,200 contribution less $4,200 dividend received); an inflow of $20,000 at t=2 ($11,500 withdrawal plus $8,500 distribution); and a net liquidation inflow of $116,035.20 at t=3 ($116,250 gross less the $214.80 fee). The IRR satisfying these flows is approximately 8.18% per annum (NPV is about +$500 at 8.00% and about \u2013$56 at 8.20%, so 8.00% is verifiably not the root). The arithmetic excess over the 6.50% benchmark is therefore approximately 168 basis points (or roughly 158 bp if computed geometrically). The student's answer of 150 bp corresponds to an assumed MWRR of exactly 8.00%, which does not solve the IRR equation \u2014 the equation has a positive NPV of roughly $500 at that rate. The likely error is that the student either stopped at a \"clean\" trial rate of 8% without iterating to convergence, or mishandled one of the cash flows (e.g., netting the closing fee incorrectly, or partially mis-netting the year-1 dividend against the contribution), which nudged their solution toward a round 8.00% and a tidy 150 bp spread.\n\nAmbiguities: The phrase \"annual money-weighted excess return over the benchmark\" does not specify whether the excess should be computed arithmetically (MWRR \u2212 6.50% \u2248 168 bp) or geometrically ((1+MWRR)/(1.065) \u2212 1 \u2248 158 bp). However, neither interpretation produces 150 bp, so this ambiguity does not rescue the student's answer. All cash flow directions and dates are otherwise precisely specified (\"treating contributions as investor outflows and withdrawals/distributions/liquidation proceeds as investor inflows\").", "verdict": "Incorrect"}, {"entry_id": 88, "problem": "* Scenario: A manufacturing firm estimates monthly machine-maintenance costs using the high-low method. In the most recent year, the lowest-activity month was April with 6,200 machine-hours and total maintenance cost of $49,900. The highest-activity month was October with 14,600 machine-hours and total maintenance cost of $79,300.  \n  The firm is evaluating a special order for 10,500 units. Each unit requires 1.2 machine-hours, and the order also requires one mandatory calibration run totaling 900 machine-hours. The customer will pay $24 per unit. Other costs for the order are direct materials of $7.50 per unit, direct labor of $3.50 per unit, and a one-time outsourced inspection fee of $12,000.\n\n* The Core Question: Using the high-low method to estimate maintenance cost, what is the net profit from accepting the special order, rounded to the nearest whole dollar?", "answer": "$49,050", "feedback": "Verdict: Incorrect\n\nAnalysis: The student's final answer of $49,050 does not match my independently derived result of **$77,250**. The discrepancy is exactly $28,200, which corresponds to the fixed-cost component of the maintenance cost equation derived via the high-low method. The student evidently applied the full cost function (fixed component plus variable rate \u00d7 machine-hours) to the special order, rather than treating only the variable maintenance cost as incremental. In a special-order (relevant cost) decision, fixed costs are unavoidable and unchanged by acceptance of the order, so only the variable maintenance rate ($3.50 per machine-hour, applied to the 13,500 total machine-hours including the calibration run) should be charged against the order. Including the $28,200 of fixed maintenance cost is a classic conceptual error in incremental analysis, not an arithmetic slip \u2014 every other component of the student's calculation (revenue, direct materials, direct labor, inspection fee, total machine-hours, and the variable rate) appears to have been computed correctly.\n\nAmbiguities: The phrase \"Using the high-low method to estimate maintenance cost\" is the primary source of ambiguity. It could be read as instructing the student to apply the *entire* estimated cost function (y = fixed + variable rate \u00d7 hours) to the order, rather than isolating only the incremental variable portion. The question never explicitly states that fixed costs are unavoidable or that only incremental costs should be considered; the words \"net profit from accepting the special order\" imply incremental analysis, but a stricter phrasing such as \"assume fixed costs are unaffected by the order\" would have removed the alternative interpretation that produced the student's $49,050 figure.", "verdict": "Incorrect"}, {"entry_id": 89, "problem": "* Scenario: At Monday\u2019s close, Cerulean Robotics has an equity market capitalization of $4.000 billion and 40.000 million shares outstanding. Its option surface quotes a 20.00% annualized instantaneous volatility, while the calibrated long-run annualized volatility is 30.00%. The flat continuously compounded risk-free curve is implied by a 1-year zero-coupon Treasury paying $100 and trading at $94.1764533584. At today\u2019s variance level, the calibrated deterministic variance drift toward the long-run variance is +0.1500 variance units per year. Also at today\u2019s variance level, the variance process diffusion coefficient\u2014the coefficient multiplying the Brownian increment in variance units per square-root year\u2014is 0.1000. Assume 252 trading days per year. For the next trading day, the simulation engine reports standardized shocks of +1.50 for the asset price and \u22120.50 for the variance; convert these to Brownian increments by multiplying by \\(\\sqrt{dt}\\).  \n   \n  At Monday\u2019s close, a fund buys 20,000 shares, financing the full stock purchase with a one-day loan accruing at the simple Euler rate \\(r \\cdot dt\\). The fund also enters a long one-day variance forward with notional $2,000,000 per 1.00 variance unit, struck at the current instantaneous variance. At Tuesday\u2019s close, update the asset price and variance using the Heston model dynamics, repay the stock-financing loan, and mark the variance forward as:  \n  \\[\n  \\text{Variance forward P\\&L} = \\text{notional} \\times (\\text{updated variance} - \\text{strike variance}).\n  \\]  \n  Ignore transaction costs and all other discounting.\n\n* The Core Question: What is the fund\u2019s net dollar P&L at Tuesday\u2019s close, rounded to the nearest whole dollar?", "answer": "$32,688", "feedback": "Verdict: Correct\n\nAnalysis: My independently derived solution proceeds as follows (computed internally): the implied stock price is $100.00, the risk-free rate implied by the zero-coupon bond is exactly 6.00% continuously compounded, and the initial variance is 0.0400. Applying the Euler\u2013Heston update with dt = 1/252 and the given standardized shocks yields an updated stock price of approximately $101.9136 and an updated variance of approximately 0.0374455. The stock leg produces a gain of roughly $38,272.64 against loan interest of about $476.19, netting roughly $37,796.45. The variance forward marks at approximately \u2212$5,108.93. The combined net P&L is approximately $32,687.52, which rounds to $32,688. The student's final answer of $32,688 matches my hidden result exactly, indicating correct application of the Euler discretization for both the asset and variance processes, correct conversion of standardized shocks via \u221adt, and correct treatment of the simple-interest loan repayment.\n\nAmbiguities: \n1. \"update the asset price and variance using the Heston model dynamics\" \u2014 the question does not explicitly state whether the asset drift should be the risk-free rate r (risk-neutral measure) or some physical drift; however, the loan-financing context and the stated rate strongly imply r, and the question gives no alternative drift, so the intended reading is recoverable.\n2. \"the calibrated deterministic variance drift toward the long-run variance is +0.1500 variance units per year\" \u2014 the long-run volatility of 30% and instantaneous volatility of 20% are provided, but \u03ba is never given; a student might attempt to back out \u03ba(\u03b8 \u2212 v\u2080) themselves rather than using the stated +0.1500 directly. (Note: \u03ba = 0.15/(0.09 \u2212 0.04) = 3 is consistent, so the figures are internally coherent, but the redundant parameters could mislead.)\n3. \"Euler rate r\u00b7dt\" for the loan versus continuous compounding elsewhere \u2014 the question does specify simple accrual, but the mixture of conventions could invite a student to use e^{r\u00b7dt} instead (the dollar difference is negligible here, well under $1).", "verdict": "Correct"}, {"entry_id": 90, "problem": "* Scenario: A manufacturer wants to estimate the cost of fulfilling a special one-month customer order. Its finance team uses the high-low cost estimation approach based on the last six months of production activity and total mixed fulfillment cost:\n\n  | Month | Units Produced | Total Mixed Fulfillment Cost |\n  |---|---:|---:|\n  | January | 8,000 | $146,000 |\n  | February | 10,500 | $167,250 |\n  | March | 7,500 | $141,750 |\n  | April | 13,500 | $192,750 |\n  | May | 9,000 | $154,500 |\n  | June | 12,000 | $180,000 |\n\n  A customer offers to buy 560 cases next month, with 20 units per case, at a price of $17.25 per unit. Assume there are no other incremental revenues or costs beyond the mixed fulfillment cost estimated from the high-low approach.\n\n* The Core Question: What is the projected incremental profit from accepting the order, rounded to the nearest whole dollar?", "answer": "$20,000", "feedback": "Verdict: Correct\n\nAnalysis: The student's final answer of $20,000 matches my independently derived result. Using the high-low method (high: April at 13,500 units/$192,750; low: March at 7,500 units/$141,750) yields a variable cost of $8.50 per unit and fixed costs of $78,000 per month. The order is 560 cases \u00d7 20 units = 11,200 units, generating revenue of 11,200 \u00d7 $17.25 = $193,200. Applying the full mixed cost equation for the month \u2014 $78,000 + ($8.50 \u00d7 11,200) = $173,200 \u2014 gives a projected profit of $193,200 \u2212 $173,200 = $20,000. The student correctly identified the high and low activity points (avoiding the common trap of using high/low cost months if they differed), correctly converted cases to units, and applied the full mixed cost function as the question directs.\n\nAmbiguities: The phrase \"projected incremental profit\" combined with \"no other incremental revenues or costs beyond the mixed fulfillment cost estimated from the high-low approach\" is genuinely ambiguous. In standard managerial accounting, a special-order \"incremental\" analysis would exclude fixed costs (since they are not incremental), yielding $193,200 \u2212 ($8.50 \u00d7 11,200) = $98,000. However, the question's instruction that the entire \"mixed fulfillment cost estimated from the high-low approach\" constitutes the relevant cost implies including the $78,000 fixed component, yielding $20,000. A well-prepared student could defensibly arrive at $98,000 under the conventional relevant-cost interpretation. The question should explicitly state whether the monthly fixed cost is to be treated as incremental (i.e., avoidable) for this order.", "verdict": "Correct"}, {"entry_id": 91, "problem": "* Scenario: Today is March 31, 2026. A non-dividend-paying stock is quoted at a bid of $99.90 and an ask of $100.10, and your desk marks the stock at the bid-ask midpoint. A European put option on this stock expires exactly one year from today under ACT/365 day count and gives the holder the right to sell 100 shares at $100 per share.  \n\n  The risk report states that the sample variance of one-trading-day log returns is \\(0.16/252\\), and the desk annualizes volatility using 252 trading days per year. A one-year zero-coupon Treasury maturing on the option expiration date has a face value of $100 and currently trades for $100; rates are interpreted with continuous compounding.  \n\n  A dealer offers 150 contracts of this European put at a premium of $14.50 per share.\n\n* The Core Question: Using the standard no-dividend European option valuation framework, what is the aggregate model-implied dollar gain from buying the full block at the dealer\u2019s quoted premium and immediately marking it to model value? Round to the nearest whole dollar.", "answer": "$20,279", "feedback": "Verdict: Correct\n\nAnalysis: The student's final answer of $20,279 matches my independently derived result. Working through the inputs internally: the spot is the bid-ask midpoint ($100.00), the strike is $100, T = 1 year, the annualized volatility comes out to 40% (daily variance of 0.16/252 scaled by 252 trading days), and the zero-coupon bond trading at par implies a continuously compounded risk-free rate of exactly 0%. Plugging these into the Black\u2013Scholes put formula yields a model value of approximately $15.852 per share. The edge over the dealer's $14.50 premium is about $1.3519 per share, and across 150 contracts \u00d7 100 shares = 15,000 shares, the aggregate gain is approximately $20,279 when rounded to the nearest dollar. The student correctly handled the midpoint marking convention, the zero-rate inference from the par bond, the variance annualization, and the contract multiplier.\n\nAmbiguities: The phrase \"sample variance of one-trading-day log returns is 0.16/252\" could in principle invite a degrees-of-freedom adjustment debate (sample vs. population variance), but since no sample size is given, the only workable interpretation is direct annualization to \u03c3\u00b2 = 0.16. Additionally, \"marks the stock at the bid-ask midpoint\" cleanly resolves what could otherwise be a spot-price ambiguity, and \"trades for $100\" against a $100 face value unambiguously fixes r = 0. Overall, the question is effectively precise \u2014 no ambiguity materially affects the answer.", "verdict": "Correct"}, {"entry_id": 92, "problem": "* Scenario: A firm is evaluating a three-year data-platform contract. Today, it must pay a $900,000 software license fee and a $100,000 integration charge. There are no other time-0 cash flows. At each year-end, the contract generates customer collections equal to the number of active accounts multiplied by the annual subscription price, and the firm pays the stated cash operating disbursements:\n\n  | Year | Active accounts | Subscription price per account | Cash operating disbursements |\n  |---:|---:|---:|---:|\n  | 1 | 11,000 | $50 | $220,000 |\n  | 2 | 12,100 | $50 | $121,000 |\n  | 3 | 13,310 | $50 | $133,100 |\n\n  All operating amounts are after-tax nominal cash flows, and there is no salvage value or working-capital recovery. The firm discounts this project at its WACC. Its target capital structure is 50% debt and 50% equity by market value. The pre-tax cost of debt is 8%, the corporate tax rate is 25%, the risk-free rate is 4%, the project equity beta is 1.25, and the market risk premium is 8%. A mutually exclusive automation project has an independently verified NPV of $75,000.\n\n* The Core Question: Using the NPV function\u2019s timing convention, what is the incremental shareholder value of selecting the data-platform contract instead of the mutually exclusive automation project, rounded to the nearest whole dollar?", "answer": "$25,000", "feedback": "Verdict: Correct\n\nAnalysis: The student's final answer of $25,000 matches my independently derived result. Working internally: the WACC computes to exactly 10% (the after-tax cost of debt weighted at 50% plus the CAPM-derived cost of equity weighted at 50%). The annual net cash flows (collections minus disbursements) of $330,000, $484,000, and $532,400 discount back to a present value of exactly $1,100,000 against the $1,000,000 time-0 outlay, yielding an NPV of $100,000 for the data-platform contract. Subtracting the mutually exclusive alternative's NPV of $75,000 gives an incremental value of exactly $25,000. The numbers in this problem are constructed cleanly (cash flows grow 10% per year and the discount rate is 10%, so each discounted cash flow is a round figure), leaving no room for rounding discrepancies. The student's answer is exactly right.\n\nAmbiguities: The phrase \"Using the NPV function's timing convention\" is mildly ambiguous. It presumably refers to the spreadsheet convention (e.g., Excel's NPV function) in which the first cash flow in the argument list is discounted one period, requiring the time-0 outlay to be added separately outside the function. A student who misreads this and includes the $1,000,000 outlay inside the NPV function would discount it one period and arrive at a different (incorrect) figure (\u2248$115,909 project NPV \u2192 $40,909 incremental). The question would be more precise if it explicitly stated \"with the initial outlay occurring at time 0 and the first operating cash flow at the end of Year 1.\" Additionally, \"incremental shareholder value of selecting X instead of Y\" could conceivably be misread as just the chosen project's NPV rather than the difference in NPVs, though the phrase \"instead of\" reasonably signals the differential interpretation.", "verdict": "Correct"}, {"entry_id": 93, "problem": "* Scenario: A trading desk monitors a 12,000-share position in XYZ using 30-minute Heikin-Ashi candles. The previous completed Heikin-Ashi candle had an open of **$96.80** and a close of **$99.20**.  \n  During the next 30-minute interval, the time-and-sales tape for XYZ is as follows, with no other trades occurring outside the listed prices:\n\n  | Time | Trade Price |\n  |---|---:|\n  | 10:00 | $101.40 |\n  | 10:03 | $101.95 |\n  | 10:09 | $104.20 |\n  | 10:16 | $102.10 |\n  | 10:22 | $100.60 |\n  | 10:28 | $102.70 |\n  | 10:30 | $103.40 |\n\n  The desk\u2019s risk policy sets a Heikin-Ashi low floor of **$99.25** for the interval. If the current interval\u2019s Heikin-Ashi low is below the floor, the desk records a dollar risk reserve equal to:\n\n  \\[\n  12{,}000 \\times \\max(0,\\; 99.25 - \\text{current Heikin-Ashi low})\n  \\]\n\n* The Core Question: Using standard Heikin-Ashi candle construction, what is the required dollar risk reserve, rounded to the nearest whole dollar?", "answer": "**$15,000**", "feedback": "Verdict: Correct\n\nAnalysis: The student's final answer of $15,000 matches my independently derived result exactly. The current Heikin-Ashi open is the average of the prior HA open and close ($96.80 and $99.20), yielding $98.00. The HA close is the average of the interval's actual OHLC ($101.40 open, $104.20 high, $100.60 low, $103.40 close), yielding $102.40. The HA low is the minimum of the actual low, HA open, and HA close \u2014 here, $98.00 (the HA open dominates because the prior candle's midpoint sits below all traded prices in the interval). Since $98.00 falls below the $99.25 floor, the reserve is 12,000 \u00d7 ($99.25 \u2212 $98.00) = 12,000 \u00d7 $1.25 = $15,000. The student correctly recognized the key subtlety: the Heikin-Ashi low can lie below every traded price in the interval because it incorporates the smoothed HA open. A common error would have been using the raw session low ($100.60), which would (incorrectly) yield a reserve of $0; the student avoided this trap.\n\nAmbiguities: The phrase \"with no other trades occurring outside the listed prices\" is doing important work \u2014 it implicitly defines the interval's actual high ($104.20) and low ($100.60) from the tape. While reasonably interpretable, a more precise question would explicitly state the OHLC of the 30-minute bar. Additionally, \"standard Heikin-Ashi candle construction\" is well-defined in practice, but the question could note explicitly that HA Low = min(Low, HA Open, HA Close), since some simplified references omit the HA open/close from the low calculation. These are minor; the intended interpretation is clear.", "verdict": "Correct"}, {"entry_id": 94, "problem": "* Scenario: A manufacturing plant wants to estimate next month\u2019s maintenance and utilities cost using the high-low method. Over the past year, the highest activity month had 12,000 machine-hours and total maintenance/utilities cost of $214,000. The lowest activity month had 7,000 machine-hours and total maintenance/utilities cost of $139,000. Next month, the plant expects to operate at 10,500 machine-hours. Management has approved a maintenance/utilities budget of $190,000 for next month.\n\n* The Core Question: Using the high-low method, by how many dollars will the estimated maintenance/utilities cost be over or under the approved budget? State \u201cover\u201d or \u201cunder\u201d and round to the nearest whole dollar.", "answer": "$1,500 over", "feedback": "Verdict: Correct\n\nAnalysis: My independently derived estimate matches the student's answer. The high-low method yields a variable cost rate and fixed cost component that, when applied to 10,500 machine-hours, produce an estimated cost of $191,500. Compared against the approved budget of $190,000, the estimate exceeds the budget by $1,500. The student correctly identified both the magnitude ($1,500) and the direction (\"over\"). Full credit.\n\nAmbiguities: None. The question precisely specifies the high and low activity points, the projected activity level, the budget figure, and explicitly requests both the dollar difference and the direction (\"over\" or \"under\"), leaving no room for alternative interpretation.", "verdict": "Correct"}, {"entry_id": 95, "problem": "* Scenario: A portfolio manager establishes an options income position on 60 option spreads, with each option contract covering 100 shares. At initiation, the stock is trading at $88.00. The manager sells the exchange-listed put option with the nearest $5 strike above the current stock price, and buys the exchange-listed put option exactly $10 lower than that sold strike, with the same expiration date. The quoted market for the higher-strike put is $3.80 bid / $4.10 ask, and the quoted market for the lower-strike put is $1.15 bid / $1.35 ask. The manager executes immediately using the bid when selling and the ask when buying. At expiration, the stock settles at $83.40. Ignore commissions, taxes, and financing costs.\n\n* The Core Question: What is the total dollar profit or loss on the full position at expiration, rounded to the nearest dollar?", "answer": "-$24,300", "feedback": "Verdict: Incorrect\n\nAnalysis: My independently derived result is a total loss of **\u2212$24,900**. The position is a bull put spread: sell the $90 put (nearest $5 strike above $88.00) at the bid of $3.80, buy the $80 put at the ask of $1.35, for a net credit of $2.45 per share. At expiration with the stock at $83.40, the short $90 put is exercised against the manager for $6.60 of intrinsic value, while the long $80 put expires worthless. Per-share loss = $6.60 \u2212 $2.45 = $4.15, and across 60 spreads \u00d7 100 shares = \u2212$24,900. The student's answer of \u2212$24,300 implies a per-share loss of $4.05, i.e., a net credit of $2.55. This corresponds to paying the **midpoint price of $1.25** (rather than the ask of $1.35) on the purchased $80 put, while correctly selling the $90 put at the $3.80 bid. The likely error is failing to apply the bid/ask execution rule consistently to both legs \u2014 the question explicitly requires buying at the ask.\n\nAmbiguities: The phrase \"the nearest $5 strike above the current stock price\" is slightly informal \u2014 with the stock at $88.00, it clearly means $90, but a careless reader could conceivably misread it as the nearest $5-multiple strike (which would also be $90 here, so no impact). Likewise, \"buys the exchange-listed put option exactly $10 lower than that sold strike\" unambiguously yields the $80 strike. The execution instruction \"using the bid when selling and the ask when buying\" is precise. Overall, the question is effectively unambiguous; the student's deviation stems from execution-price misapplication, not from question wording.", "verdict": "Incorrect"}, {"entry_id": 96, "problem": "* Scenario:  \nA portfolio manager buys a corporate bond on June 30, 2026, immediately after that day\u2019s coupon has been paid, so there is no accrued interest. The bond has a $5,000,000 face value, an 8.00% annual coupon paid semiannually, and matures on June 30, 2030. The broker confirms that the total cash paid for the bond, excluding any transaction fees, is $5,350,984.61. A Treasury security with the same maturity is quoted at a 4.35% bond-equivalent yield, compounded semiannually.\n\n* The Core Question:  \nWhat is the corporate bond\u2019s yield spread over the matched-maturity Treasury, in basis points, rounded to the nearest whole basis point?", "answer": "165 bps", "feedback": "Verdict: Correct\n\nAnalysis: The student's final answer matches my independently derived result. Working backward from the purchase price of $5,350,984.61 with semiannual coupons of $200,000 over 8 periods and a $5,000,000 redemption value, the bond's yield to maturity solves to exactly 6.00% on a bond-equivalent (semiannually compounded) basis \u2014 the given price is consistent to the penny with a 3.00% periodic discount rate. Subtracting the matched-maturity Treasury yield of 4.35% gives a spread of 6.00% \u2212 4.35% = 1.65%, or 165 basis points. The student's answer of 165 bps is exactly right.\n\nAmbiguities: None of substance. The question is well-posed: the phrase \"total cash paid for the bond, excluding any transaction fees\" combined with \"immediately after that day's coupon has been paid, so there is no accrued interest\" makes clear that the full price equals the clean price, eliminating any dirty-price ambiguity. Both yields are explicitly stated or solvable on a semiannual bond-equivalent basis, so the spread comparison is apples-to-apples. One could pedantically note that \"yield spread over the matched-maturity Treasury\" is the nominal G-spread/benchmark spread rather than a Z-spread, but the phrasing and single Treasury quote make the intended nominal spread interpretation unambiguous.", "verdict": "Correct"}, {"entry_id": 97, "problem": "* Scenario: A fund values European equity options using the no-dividend Black-Scholes framework. Today is March 15, 2026, and a put option expires on March 15, 2027. The underlying stock pays no dividends. A block of 4,000 shares of the stock is currently worth $400,000. Each put contract gives the holder the right to sell 100 shares for a total exercise amount of $10,000 per contract. A default-free zero-coupon Treasury maturing on the option expiration date pays $1,000,000 and currently trades for $951,229.4245. The stock\u2019s annualized variance of continuously compounded returns is 0.0400. The fund currently holds 250 of these put contracts, carried on its books at the exchange midquote of $5.20 per share.\n\n* The Core Question: Using the model value rather than the exchange midquote, what is the required total dollar adjustment to the fund\u2019s carrying value for the 250 put contracts, rounded to the nearest dollar? State whether it is an increase or decrease.", "answer": "Increase by $9,338", "feedback": "Verdict: Correct\n\nAnalysis: My independently derived model inputs are S = $100 (i.e., $400,000 / 4,000 shares), K = $100 per share ($10,000 / 100 shares), T = 1 year, \u03c3 = 0.20 (from variance 0.04), and a continuously compounded risk-free rate of 5% implied by the Treasury price ($951,229.4245 / $1,000,000 = e^(\u20130.05)). This yields d\u2081 = 0.35 and d\u2082 = 0.15, giving a Black-Scholes put value of approximately $5.5735 per share. Compared to the carrying value of $5.20 per share, the model value is higher by about $0.3735 per share. Applied across 250 contracts \u00d7 100 shares = 25,000 shares, the required adjustment is approximately +$9,338 (an increase). The student's final answer of \"Increase by $9,338\" matches my hidden result exactly, both in magnitude and direction.\n\nAmbiguities: The question is largely precise, but two minor points invite alternative interpretations: (1) \"the exchange midquote of $5.20 per share\" requires the solver to infer that the carrying value scales by 100 shares per contract \u2014 a careless reading could treat $5.20 as a per-contract price; and (2) \"annualized variance of continuously compounded returns is 0.0400\" requires recognizing that volatility \u03c3 = \u221a0.04 = 0.20, not \u03c3 = 0.04 \u2014 a common trap. Additionally, the exact value of N(\u00b7) depends on the normal table or precision used, so answers in the range of roughly $9,335\u2013$9,340 could arise from rounding of the cumulative normal values; the student's figure falls squarely within acceptable precision.", "verdict": "Correct"}, {"entry_id": 98, "problem": "* **Scenario:**  \nA manufacturing firm is evaluating a 3-year equipment project. The equipment costs **$1,200,000 installed today** and will be depreciated straight-line to a book value of zero over 3 years. The project also requires an immediate **$100,000 increase in net working capital**, which will be fully recovered at the end of year 3.  \n\n  Each year, the project is expected to generate **$1,200,000 in sales revenue** and incur **$500,000 in cash operating expenses**, excluding depreciation. At the end of year 3, the equipment is expected to be sold for **$180,000**. Because its book value will be zero, the entire sale price is taxable. The corporate tax rate is **25%**. Assume all operating cash flows occur at year-end, taxes are paid in the same year, and there are no other cash flows.  \n\n  The firm uses its after-tax weighted average cost of capital for projects of this risk. Its target capital structure is **60% equity and 40% debt**. The risk-free rate is **4.0%**, the equity beta is **1.10**, the market risk premium is **5.0%**, and the firm\u2019s pre-tax cost of debt is **6.0%**.\n\n* **The Core Question:**  \nThe board will approve the project only if its value creation exceeds a minimum benchmark of **$500,000**. By how many dollars does the project exceed or fall short of that benchmark, rounded to the nearest whole dollar, and does it pass the board\u2019s requirement?", "answer": "** Exceeds the benchmark by **$14,494**; the project passes.", "feedback": "Verdict: Correct\n\nAnalysis: The student's final answer matches my independently derived result. Working through the problem internally: the WACC comes to 7.50% (cost of equity of 9.5% via CAPM weighted at 60%, after-tax cost of debt of 4.5% weighted at 40%); the initial investment is $1,300,000 (equipment plus NWC); annual operating cash flow is $625,000 (after applying the 25% tax rate to EBIT of $300,000 and adding back $400,000 depreciation); and the year-3 terminal cash flow is $235,000 ($100,000 NWC recovery plus $135,000 after-tax salvage). Discounting these at 7.5% yields an NPV of approximately $514,494, which exceeds the $500,000 benchmark by **$14,494**. The student correctly identified both the dollar amount and the pass/fail conclusion. The figure of $14,494 confirms they handled every component correctly: the fully taxable salvage value, the NWC recovery, the depreciation tax shield, and the after-tax cost of debt in the WACC.\n\nAmbiguities: The phrase \"value creation\" is the only mildly imprecise term \u2014 it is not explicitly defined as NPV, though NPV is the universally standard interpretation in this context and the only metric consistent with a dollar-denominated benchmark. Additionally, \"the firm uses its after-tax weighted average cost of capital\" implicitly requires the student to apply the corporate tax rate (25%) to the cost of debt, which is stated but could theoretically be confused if a student assumed the 6.0% was already after-tax. Neither ambiguity materially affects a competent reading of the question.", "verdict": "Correct"}, {"entry_id": 99, "problem": "* Scenario: A manufacturer is evaluating a 4-year automation project. Today, it must pay a supplier invoice of $1,950,000, installation costs of $100,000, and an immediate working-capital deposit of $150,000. The working capital will be fully recovered at the end of Year 4. All operating cash flows occur at year-end. The project is expected to generate the following after-tax cash receipts and cash operating costs:\n\n  | Year | Cash Receipts | Variable Cash Costs | Fixed Cash Costs |\n  |---:|---:|---:|---:|\n  | 1 | $1,000,000 | $350,000 | $50,000 |\n  | 2 | $1,150,000 | $380,000 | $70,000 |\n  | 3 | $1,250,000 | $420,000 | $80,000 |\n  | 4 | $1,200,000 | $400,000 | $50,000 |\n\n  At the end of Year 4, the equipment will also be sold for $300,000. The project has the same risk as the firm\u2019s existing assets. The firm\u2019s market value of equity is $50,000,000 and its market value of debt is $50,000,000. Its equity beta is 1.5, the risk-free rate is 5%, the expected market risk premium is 6%, the firm\u2019s pre-tax cost of debt is 8%, and its corporate tax rate is 25%. Management will approve the project only if its NPV exceeds a required value-creation cushion of $250,000.\n\n* The Core Question: What is the project\u2019s dollar surplus or shortfall versus management\u2019s $250,000 NPV requirement, rounded to the nearest whole dollar?", "answer": "$57,069 surplus", "feedback": "Verdict: Partially Correct due to rounding or minor variations\n\nAnalysis: My independently derived result is a surplus of approximately $57,070 (the unrounded figure is $57,069.87). The student's answer of $57,069 matches my result in substance \u2014 they clearly used the correct WACC (10%, from a 14% cost of equity, 6% after-tax cost of debt, and 50/50 market-value weights), the correct initial outlay of $2,200,000, the correct annual net operating flows ($600,000; $700,000; $750,000; $750,000), and correctly added the $150,000 working-capital recovery and $300,000 equipment sale proceeds in Year 4. The only flaw is that they truncated $57,069.87 to $57,069 rather than rounding to the nearest whole dollar ($57,070) as the question explicitly requires. This is a trivial final-step rounding error, not a conceptual or computational mistake.\n\nAmbiguities: \n1. \"the equipment will also be sold for $300,000\" \u2014 the question does not state the equipment's book value or depreciation schedule, so it is unclear whether the sale proceeds should be taxed at the 25% corporate rate. The intended interpretation (which the student adopted) is that $300,000 is an after-tax or tax-neutral cash flow, but a defensible alternative reading would tax a gain on sale, changing the answer materially.\n2. \"after-tax cash receipts and cash operating costs\" \u2014 since the figures are stated as already after-tax, the 25% tax rate is needed only for the cost of debt; however, providing the tax rate alongside untaxed-looking operating figures could lead some students to incorrectly apply taxes again to the operating flows.", "verdict": "Partially Correct due to rounding or minor variations"}, {"entry_id": 100, "problem": "* Scenario: Econland is compiling its 2025 annual national accounts. All figures are in **billions of dollars** and are measured before subtracting imports from expenditure categories. Households purchased $420.8 of durable goods, $685.4 of nondurable goods, and $1,894.6 of services. They also bought $63.0 of existing homes from other households, with no brokerage fees. The government recorded $312.5 in defense purchases, $228.0 in nondefense purchases, and $618.7 in state/local purchases; it also paid $390.0 in transfer payments and $74.0 in interest on public debt. Private domestic investment consisted of $475.3 in equipment, $238.9 in intellectual property products, $188.4 in nonresidential structures, $295.1 in new residential construction, and a $22.7 decrease in private inventories. Econland exported $540.6 of goods and $312.8 of services, while importing $705.1 of goods and $195.3 of services. Econland\u2019s fiscal rule says that if actual GDP is below potential GDP of $5,500.0 billion, the automatic stabilization transfer equals **20% of the dollar GDP shortfall**.\n* The Core Question: What is the automatic stabilization transfer, in **billions of dollars**, rounded to the nearest **$0.1 billion**?", "answer": "**$42.4 billion**", "feedback": "Verdict: Correct\n\nAnalysis: The student's final answer of $42.4 billion matches my independently derived result exactly. My hidden calculation yields consumption of $3,000.8 billion (correctly excluding the $63.0 of existing home sales, which are not current production), government purchases of $1,159.2 billion (correctly excluding transfer payments and interest on public debt), gross private domestic investment of $1,175.0 billion (correctly subtracting the inventory decrease), and net exports of \u2212$47.0 billion. This produces GDP of $5,288.0 billion, a shortfall of $212.0 billion against the $5,500.0 billion potential, and a stabilization transfer of 20% \u00d7 $212.0 = $42.4 billion. The student evidently handled all the classic GDP-accounting traps correctly: excluding secondhand home sales, excluding transfers and debt interest from G, treating the inventory change as negative, and netting out imports.\n\nAmbiguities: The phrase \"measured before subtracting imports from expenditure categories\" could mildly confuse a reader, but it is the standard convention (imports are netted in NX, not within C, I, or G) and the question handles it consistently. One could also question whether \"automatic stabilization transfer\" should be included in the GDP calculation itself (creating circularity), but since transfers are not part of GDP, this is not a genuine issue. Otherwise, the question is precise: \"the automatic stabilization transfer equals **20% of the dollar GDP shortfall**\" leaves no room for alternative interpretation.", "verdict": "Correct"}, {"entry_id": 101, "problem": "* Scenario: A GBP/USD grid-trading bot is initialized on 5 June 2026 at 09:00 London time. The bot\u2019s base price is defined as the midpoint of the current executable bid and ask. At initialization, GBP/USD is quoted at 1.2648 bid and 1.2652 ask. The grid interval is defined as 40% of the 5-day average true range; the current 5-day ATR is 0.0050. The number of grid levels is the largest whole number such that the furthest order is no more than 0.0060 price units away from the base price. The bot uses a \u201cwith-the-trend\u201d grid if the 30-minute EMA is above the 120-minute EMA, and an \u201cagainst-the-trend\u201d grid otherwise. At initialization, the 30-minute EMA is 1.2678 and the 120-minute EMA is 1.2642.  \n  Each filled grid order is for 100,000 GBP. After the grid is placed, GBP/USD rises monotonically to 1.2725 and is then liquidated at 1.2720; it never trades below the base price. Unfilled orders are canceled. Assume all triggered orders fill exactly at their grid prices, with no slippage or financing costs. The broker charges $4 when each order is opened and $4 when each filled order is liquidated.\n* The Core Question: What is the net USD trading profit after liquidation, rounded to the nearest whole dollar?", "answer": "$876", "feedback": "Verdict: Correct\n\nAnalysis: The student's final answer of $876 matches my independently derived result exactly. My hidden computation confirms: the base price is the bid-ask midpoint (1.2650), the grid interval is 0.0020 (40% of the 0.0050 ATR), and the maximum distance constraint of 0.0060 permits exactly 3 grid levels. Since the 30-minute EMA (1.2678) exceeds the 120-minute EMA (1.2642), the bot deploys a with-the-trend grid with buy-stop orders above the base price at 1.2670, 1.2690, and 1.2710. The monotonic rise to 1.2725 fills all three orders, and liquidation at 1.2720 yields gross gains of 50, 30, and 10 pips respectively on 100,000 GBP each, for a gross profit of $900. Deducting commissions of $8 round-trip per filled order (3 \u00d7 $8 = $24) gives a net profit of $876. The student's number is exact, indicating they correctly identified the grid direction, level count, fill prices, and commission treatment.\n\nAmbiguities: \n1. \"The broker charges $4 when each order is opened\" \u2014 it is unclear whether \"opened\" refers to an order being *placed* on the grid or a position being *opened* (i.e., filled). If charged at placement, and if the grid also placed unfilled or opposite-side orders, the commission total could differ. The intended reading (commission applies only to filled/opened positions, consistent with \"each filled order is liquidated\") yields $876.\n2. The phrase \"with-the-trend grid\" is not explicitly defined in terms of order placement \u2014 the solver must infer that a with-the-trend grid places buy-stop orders *above* the base price (rather than sell orders below, or orders on both sides). An \"against-the-trend\" interpretation would place buy limits below, none of which would fill since price \"never trades below the base price.\"\n3. \"The number of grid levels is the largest whole number such that the furthest order is no more than 0.0060 away\" \u2014 strictly precise here (3 levels at 0.0020, 0.0040, 0.0060), but the boundary case where the furthest order sits *exactly* at 0.0060 requires the solver to honor the \"no more than\" (\u2264) condition rather than a strict inequality, which would give only 2 levels and a different answer ($784).", "verdict": "Correct"}, {"entry_id": 102, "problem": "* Scenario:  \nA condo investor is evaluating a unit under contract for **$624,000**. The subject unit\u2019s finished interior footprint is rectangular, measuring **30 feet by 40 feet**.  \n\nThe investor\u2019s valuation analyst uses a comparable-sales adjustment method. For each comparable sale:\n\n1. Compute the comparable\u2019s sale price per square foot.  \n2. Compute the subject\u2019s contract price per square foot.  \n3. For each comparable, calculate a per-square-foot adjustment as:  \n\n\\[\n(\\text{Comparable price per sf} - \\text{Subject price per sf})\n+ 0.05(\\text{bedrooms}-1)\n+ 0.05(\\text{bathrooms}-1)\n\\]\n\nThen add:\n- **+$0.10/sf** if the comparable has an unobstructed view, otherwise **\u2212$0.10/sf**\n- **+$0.10/sf** if the comparable includes in-suite appliances, otherwise **\u2212$0.10/sf**\n- **\u2212$0.10/sf** if the comparable requires renovations, otherwise **+$0.10/sf**\n\nAverage the per-square-foot adjustments across all comparables, add that average to the subject\u2019s contract price per square foot, and multiply by the subject\u2019s finished square footage to obtain the indicated market value.\n\nComparable sales data:\n\n| Comparable | Sale Price | Finished Area | Bedrooms | Bathrooms | View? | In-Suite Appliances? | Requires Renovations? |\n|---|---:|---:|---:|---:|---|---|---|\n| A | $675,000 | 1,250 sf | 2 | 2 | Yes | Yes | No |\n| B | $585,000 | 1,170 sf | 1 | 1 | No | Yes | Yes |\n| C | $660,000 | 1,200 sf | 2 | 1 | Yes | No | No |\n| D | $612,000 | 1,200 sf | 1 | 2 | No | No | Yes |\n\nThe acquisition committee will approve the purchase only if the indicated market value exceeds the contract price by at least **1.00% of the contract price**.\n\n* The Core Question:  \nWhat is the dollar surplus or shortfall versus the committee\u2019s required value threshold, rounded to the nearest dollar, and should the purchase be approved?", "answer": "**-$180; No, the purchase should not be approved.**", "feedback": "Verdict: Correct\n\nAnalysis: My independently derived indicated market value comes to $630,060 (subject contract price per sf of $520, average per-sf adjustment of +$5.05 across the four comparables, applied to 1,200 sf). The committee's threshold is 101% of $624,000, i.e., $630,240. The indicated value falls short by exactly $180, so the purchase should not be approved. The student's final answer of \u2212$180 and \"No\" matches my hidden result precisely, including the sign convention indicating a shortfall and the correct approval decision.\n\nAmbiguities: The phrase \"exceeds the contract price by at least 1.00% of the contract price\" is slightly open to interpretation \u2014 strictly, \"exceeds... by at least 1.00%\" sets the threshold at $630,240 (contract \u00d7 1.01), which is the natural reading; however, a careless reader might interpret the threshold as merely \"exceeds the contract price\" with 1% as a buffer measured differently. Additionally, the adjustment formula mixes a dollar-magnitude term (price per sf difference, in tens of dollars) with token amenity adjustments (in cents per sf), which could lead some solvers to question whether the bedroom/bathroom/amenity adjustments were intended in dollars rather than the literal cents stated; the question as written, though, is mathematically unambiguous if followed literally.", "verdict": "Correct"}, {"entry_id": 103, "problem": "* Scenario: In fiscal year 2025, the national accounts office of Solandia reports the following annual expenditure data, all in billions of dollars:\n  * Household purchases of durable goods: 460\n  * Household purchases of nondurable goods: 730\n  * Household purchases of services: 1,190\n  * Nonprofit institutions serving households: 70\n  * Federal defense purchases: 420\n  * Federal non-defense purchases: 260\n  * State and local government purchases: 510\n  * Government infrastructure and equipment investment: 180\n  * Government transfer payments: 350\n  * Government interest payments: 90\n  * Business fixed investment in structures, equipment, and intellectual property: 740\n  * New residential construction: 310\n  * Change in private inventories: -45\n  * Purchases of existing homes: 220\n  * Corporate share buybacks: 150\n  * Goods exports: 690\n  * Services exports: 260\n  * Goods imports: 820\n  * Services imports: 310\n\n  Under Solandia\u2019s stabilization treaty, if expenditure-approach GDP exceeds the treaty benchmark of $4.600 trillion, the country must pay 0.75% of the excess into a regional stabilization fund. If GDP is below the benchmark, no payment is made.\n\n* The Core Question: What stabilization fund payment must Solandia make, rounded to the nearest million dollars?", "answer": "$338 million", "feedback": "Verdict: Correct\n\nAnalysis: The student's final answer of $338 million matches my independently derived result. Solving internally: consumption (durables, nondurables, services, plus nonprofit institutions serving households), government purchases (defense, non-defense, state/local, and government investment \u2014 excluding transfers and interest payments), gross private investment (business fixed investment, residential construction, and the negative inventory change \u2014 excluding existing home sales and share buybacks), and net exports (goods and services exports minus imports) yield a GDP of $4,645 billion. The excess over the $4,600 billion benchmark is $45 billion, and 0.75% of that excess is $337.5 million, which rounds to $338 million under standard rounding conventions. The student correctly excluded the distractor items (transfer payments, interest payments, existing home purchases, and share buybacks) and correctly handled the negative inventory change.\n\nAmbiguities: The exact computed payment is $337.5 million, which sits precisely at the rounding midpoint. The instruction \"rounded to the nearest million dollars\" does not specify a tie-breaking convention; under \"round half up\" the answer is $338 million, but under \"round half to even\" (banker's rounding) the answer would also be $338 million in this case, so the ambiguity is harmless here \u2014 though an answer of $337 million or $337.5 million could arguably be defended. Additionally, \"Government infrastructure and equipment investment: 180\" could conceivably be misread as already included in the listed federal/state purchases, but standard national accounts treatment supports adding it as a separate component of G.", "verdict": "Correct"}, {"entry_id": 104, "problem": "* Scenario: The Republic of Lydora is computing its national-income-based contribution to an international development fund. All figures below are in **billions of Lydoran dollars** for the same calendar year.\n\n  National final-expenditure data:\n  * Household final consumption: 410.4\n  * Gross private domestic investment: 126.8\n  * Government purchases of goods and services: 154.6\n  * Exports of goods and services: 101.5\n  * Imports of goods and services: 134.3\n\n  Cross-border income-flow data:\n  * Wages earned by Lydoran residents from foreign employers: 9.7\n  * Dividends, interest, and rents earned by Lydoran residents on overseas assets: 18.4\n  * Reinvested earnings of foreign affiliates owned by Lydoran residents: 6.9\n  * Wages paid by Lydoran firms to nonresident workers: 7.8\n  * Dividends, interest, and rents earned by foreign owners of Lydoran assets: 24.6\n  * Reinvested earnings of Lydoran affiliates owned by foreigners: 5.1\n\n  Product and import tax/subsidy data:\n  * VAT and excise taxes collected: 46.2\n  * Customs/import duties collected: 5.8\n  * Other product taxes collected: 3.6\n  * Energy subsidies paid: 8.9\n  * Agricultural subsidies paid: 4.2\n  * Transport subsidies paid: 2.5\n\n  The development fund charges Lydora **0.80% of the amount by which its Gross National Income exceeds 680.0 billion Lydoran dollars**. If GNI does not exceed 680.0, the contribution is zero.\n\n* The Core Question: What is Lydora\u2019s required development-fund contribution, **rounded to the nearest million Lydoran dollars**?", "answer": "**132 million Lydoran dollars**", "feedback": "Verdict: Incorrect\n\nAnalysis: The student's final answer of 132 million Lydoran dollars does not match my independently derived result of **0 (zero contribution)**. Under standard national-accounting conventions, the expenditure approach (C + I + G + X \u2212 M) yields GDP **at market prices**, which here equals 659.0 billion. Adjusting for net primary income from abroad (receipts of 35.0 billion against payments of 37.5 billion, i.e., \u22122.5 billion net) gives GNI = 656.5 billion. Since 656.5 < 680.0, the required contribution is zero, and the tax/subsidy block functions as distractor data.\n\nThe student's specific figure of 132 million reveals exactly where they went wrong: they added net taxes on products and imports (55.6 billion in taxes minus 15.6 billion in subsidies = 40.0 billion) on top of the expenditure-based GDP, producing GNI = 696.5 billion, an excess of 16.5 billion over the threshold, and 0.80% \u00d7 16.5 = 0.132 billion = 132 million. This constitutes double counting: VAT, excises, duties, and product subsidies are already embedded in the market prices at which consumption, investment, government purchases, and trade flows are recorded. Adding net product taxes is only valid when converting Gross Value Added at **basic prices** to GDP at market prices \u2014 not when starting from final expenditures.\n\nAmbiguities: The question labels the first block simply as \"National final-expenditure data\" without explicitly stating whether the components are valued **at market prices** (the standard convention) or **at basic prices**. Because the question then supplies a detailed block of \"Product and import tax/subsidy data,\" a student could reasonably infer the data were meant to be added (i.e., that the expenditure figures were quoted at basic prices), which would yield exactly 132 million. If the examiner intended the basic-price interpretation, the student's answer would be correct; the question should explicitly state \"all expenditure figures are valued at market prices\" to eliminate this alternative reading. Additionally, the threshold condition \"If GNI does not exceed 680.0, the contribution is zero\" is precise, but its presence hints that a zero answer is plausible \u2014 supporting the interpretation that the tax data are distractors.", "verdict": "Incorrect"}, {"entry_id": 105, "problem": "* Scenario: A pension fund is evaluating a Treasury note on a coupon-payment date, so accrued interest is zero and the quoted clean price equals the full price. The note matures exactly 4 years from today and pays coupons semi-annually. Its stated annual coupon rate is 6.00% on a $1,000 face value. The market quote is 93.2673 per $100 of face value. The fund\u2019s investment policy requires the bond\u2019s nominal annual yield, compounded semi-annually, to exceed a 7.50% hurdle rate.\n\n* The Core Question: Does the bond meet the fund\u2019s hurdle rate, and by how many basis points does its yield exceed or fall short of the hurdle? Round the spread to the nearest basis point.", "answer": "Meets the hurdle; +50 basis points.", "feedback": "Verdict: Correct\n\nAnalysis: Solving independently, the bond's semiannual yield that equates the present value of the eight remaining $3 (per $100 face) coupons plus the $100 redemption to the price of 93.2673 is exactly 4.00% per period, giving a nominal annual yield of 8.00% compounded semi-annually. Compared to the 7.50% hurdle, the bond exceeds the requirement by exactly 50 basis points. The student's final answer \u2014 \"Meets the hurdle; +50 basis points\" \u2014 matches my independently derived result precisely, including the correct directional conclusion.\n\nAmbiguities: The phrase \"nominal annual yield, compounded semi-annually\" is precise and standard (bond-equivalent yield), and \"on a coupon-payment date, so accrued interest is zero and the quoted clean price equals the full price\" removes any clean/dirty price ambiguity. The face value of $1,000 versus the quote \"per $100 of face value\" requires the solver to recognize the standard quoting convention, but this is conventional and not genuinely ambiguous. Therefore: None.", "verdict": "Correct"}, {"entry_id": 106, "problem": "* Scenario:  \nA trader holds a long position in Apex Robotics ETF. The ETF has been in a confirmed rising Parabolic SAR trend for the last 9 completed sessions, and the desk uses the following simplified rising-trend SAR convention:\n\n  * The extreme point is the highest intraday high reached so far during the current rising trend.\n  * The acceleration factor starts at 0.02 when the rising trend begins and increases by 0.02 each time a new highest high is set, with ties not counted and a maximum of 0.20.\n  * The next SAR level is computed as:  \n    \\[\n    \\text{New SAR}=\\text{Prior SAR}+\\text{AF}\\times(\\text{Prior EP}-\\text{Prior SAR})\n    \\]\n  * If today sets a new high, that affects the acceleration factor only after today\u2019s SAR is computed.\n  * Assume no trend reversal occurs and ignore any two-bar high/low adjustment rule.\n\nYesterday\u2019s completed SAR level printed below the price chart was **$74.20**. The intraday highs from the first day of the current rising trend through yesterday were:\n\n\\[\n75.00,\\ 76.40,\\ 76.10,\\ 77.25,\\ 77.25,\\ 78.80,\\ 78.30,\\ 79.60,\\ 79.10\n\\]\n\nToday, the ETF reaches an intraday high of **$80.15** and closes at **$79.40**. The trader owns **25,000 shares** and sets tomorrow\u2019s protective sell-stop equal to today\u2019s newly computed SAR level. The risk policy caps mark-to-stop exposure at **$80,000**, measured from today\u2019s close to the stop level.\n\n* The Core Question:  \nBy how many dollars is the trader\u2019s mark-to-stop exposure above or below the $80,000 risk cap? Round to the nearest whole dollar and state whether it is above or below the cap.", "answer": "**$36,500 above the cap**", "feedback": "Verdict: Correct\n\nAnalysis: The student's final answer of **$36,500 above the cap** matches my independently derived result exactly. Working through the convention internally: the acceleration factor, starting at 0.02, increments only on the four genuinely new highs after day one (76.40, 77.25, 78.80, 79.60 \u2014 the tie on day 5 and the lower highs on days 3, 7, and 9 are excluded), yielding an AF of 0.10 going into today's calculation. Applying the SAR formula with the prior SAR of $74.20 and the prior EP of $79.60 gives today's SAR (and thus the stop) of $74.74. Today's new high of $80.15 correctly does not affect this computation per the stated rule. The mark-to-stop exposure is (79.40 \u2212 74.74) \u00d7 25,000 shares = $116,500, which exceeds the $80,000 cap by exactly $36,500. The student correctly handled the AF increment counting (excluding the tie), correctly deferred today's new high, and performed the exposure arithmetic accurately.\n\nAmbiguities: The phrase \"the acceleration factor starts at 0.02 when the rising trend begins and increases by 0.02 each time a new highest high is set\" is slightly ambiguous as to whether the first day's high (75.00) itself counts as \"setting a new highest high,\" which would make the AF 0.12 instead of 0.10 and change the answer. The conventional Wilder interpretation (first high establishes the initial EP without incrementing AF) is the most defensible reading and is what the student used, but the question would be tightened by explicitly stating that the initial EP does not trigger an increment. Additionally, \"Yesterday's completed SAR level printed below the price chart was $74.20\" implicitly tells the solver to take prior SAR as given rather than reconstruct it from the price series, which is clear enough but could invite some students to attempt an unnecessary (and underdetermined) reconstruction since daily lows are not provided.", "verdict": "Correct"}, {"entry_id": 107, "problem": "* **Scenario:**  \n  A corporate bond settles immediately after its June 30, 2026 coupon has been paid, so there is no accrued interest. The bond matures on June 30, 2029 and pays coupons semiannually. It has a total face value of \\$2,500,000 and an annual coupon rate of 4.80%. The bond is quoted at a clean price of 98.088175 per \\$100 of face value. A same-maturity government benchmark yield is 4.20%, quoted as an annual nominal rate compounded semiannually.\n\n* **The Core Question:**  \n  What is the bond\u2019s annualized nominal yield spread over the benchmark, rounded to the nearest basis point?", "answer": "** 130 basis points", "feedback": "Verdict: Correct\n\nAnalysis: The student's final answer of 130 basis points matches my independently derived result. Solving for the semiannual yield that equates the present value of six semiannual coupons of $2.40 (per $100 face) plus the $100 redemption to the clean price of 98.088175 yields a periodic rate of exactly 2.75%, i.e., a nominal annual yield of 5.50% compounded semiannually. Subtracting the benchmark yield of 4.20% (quoted on the same semiannual-bond-equivalent basis) gives a nominal spread of 1.30%, or 130 basis points. The student's answer is precisely correct with no rounding discrepancy \u2014 the price appears to have been constructed to produce a clean 5.50% yield.\n\nAmbiguities: The question is largely precise, but two minor points merit mention: (1) \"annualized nominal yield spread\" presumes both yields are quoted on the same semiannual compounding convention \u2014 this is stated for the benchmark (\"annual nominal rate compounded semiannually\") but only implied for the corporate bond's yield-to-maturity; a student could conceivably compute an effective annual yield and take the spread on that basis, obtaining a slightly different number. (2) The total face value of \"$2,500,000\" is extraneous to the spread calculation, since both price and coupons scale per $100 of face \u2014 its inclusion could be viewed as a deliberate distractor rather than an ambiguity per se.", "verdict": "Correct"}, {"entry_id": 108, "problem": "* Scenario: A U.S.-based FX dealer treats USD as the d
