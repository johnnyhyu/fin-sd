omestic currency and quotes exchange rates in **euros per U.S. dollar**. Today, a spot transaction exchanges **$1,250,000** for **\u20ac1,215,000**. In the one-year risk-free money markets, depositing **$800,000** today returns **$864,000** in one year, while depositing **\u20ac600,000** today returns **\u20ac660,000** in one year. A bank is quoting a one-year forward rate of **\u20ac0.9945 per $1**. Define one pip as **0.0001 EUR/USD**.\n\n* The Core Question: Using no-arbitrage covered interest parity, what is the signed spread between the bank\u2019s quoted one-year forward rate and the no-arbitrage one-year forward rate, in pips, where a positive spread means the bank quote is above parity? Round to the nearest **0.01 pip**.", "answer": "**+45.00 pips**", "feedback": "Verdict: Correct\n\nAnalysis: The student's final answer of **+45.00 pips** matches my independently derived result. The spot rate implied by the transaction is \u20ac0.9720/USD, the implied USD interest rate is 8% and the EUR interest rate is 10%, yielding a no-arbitrage forward of \u20ac0.9900/USD. The bank's quote of \u20ac0.9945 sits 0.0045 above parity, which at 0.0001 EUR/USD per pip is exactly +45.00 pips. The sign is also correct, as the bank quote exceeds the parity forward and the question defines a positive spread as the quote being above parity.\n\nAmbiguities: None of substance. The question is precise: it specifies the quoting convention (\"euros per U.S. dollar\"), defines the pip size (\"one pip as 0.0001 EUR/USD\"), and explicitly fixes the sign convention (\"a positive spread means the bank quote is above parity\"). One could note minor pedantic looseness in that the spot rate and interest rates must be inferred from transaction amounts rather than stated directly, but the inferences are unambiguous and yield exact values.", "verdict": "Correct"}, {"entry_id": 109, "problem": "* Scenario: A margin-account customer trades during the five consecutive business days from Monday through Friday, with no market holidays. For regulatory monitoring, count each executed order as one trade. A \u201cday trade\u201d occurs when the customer opens and closes a position in the same security in the same margin account on the same business day; each such same-day round trip counts as one day trade.\n\n  During the week, the customer\u2019s blotter shows the following:\n\n  | Day | Same-day round-trip activity | Other executed orders that did **not** form same-day round trips |\n  |---|---:|---:|\n  | Monday | Bought and sold AAPL the same day | 11 |\n  | Tuesday | Bought and sold TSLA the same day | 12 |\n  | Wednesday | Shorted and covered NVDA the same day | 10 |\n  | Thursday | None | 13 |\n  | Friday | Bought and sold AMD the same day | 12 |\n\n  Each same-day round trip consists of exactly two executed orders. At the Friday close, the account equity is $21,375. The broker requires any account meeting the pattern day-trader criteria to maintain at least $25,000 in equity before further day trading is permitted.\n\n* The Core Question: What cash deposit is required to restore the account\u2019s eligibility for further day trading, rounded to the nearest whole dollar?", "answer": "$3,625", "feedback": "Verdict: Correct\n\nAnalysis: The student's final answer of $3,625 matches my independently derived result. The customer executed 4 day trades (AAPL, TSLA, NVDA, AMD) within five business days. Total executed orders for the week are 58 non-round-trip orders plus 8 orders from the four round trips (2 each), giving 66 total trades. The day trades represent 4/66 \u2248 6.06%, which exceeds the 6% threshold, so the pattern day-trader designation applies. The required deposit to restore day-trading eligibility is $25,000 \u2212 $21,375 = $3,625. The student's number is exact, with no rounding issues.\n\nAmbiguities: The question's effectiveness hinges on the implicit FINRA pattern day-trader rule (4+ day trades in 5 business days AND day trades exceeding 6% of total trades), which is never explicitly stated. The phrase \"any account meeting the pattern day-trader criteria\" assumes the test-taker knows the 6%-of-total-trades component; a student unaware of it would still flag the account (4 day trades in 5 days) and reach the same dollar answer, so the trade-count detail (which makes the ratio 6.06%, just above 6%) only matters if the grader intends the percentage test to be checked. Additionally, \"restore the account's eligibility\" presumes equity must reach exactly the $25,000 minimum with no buffer, which the question does state via \"maintain at least $25,000,\" so that part is precise.", "verdict": "Correct"}, {"entry_id": 110, "problem": "* Scenario: In 2025, the Republic of Calidora reported the following national accounts, all in billions of local currency units except population:\n  * Household final consumption expenditure: 1,240\n  * Gross private domestic investment: 430\n  * Government purchases of goods and services: 520\n  * Exports of goods and services: 310\n  * Imports of goods and services: 380\n  * Wages earned by Calidora residents working for foreign employers: 46\n  * Dividends, interest, and rents earned by Calidora residents on foreign assets: 74\n  * Wages paid by Calidora firms to nonresident workers: 22\n  * Profits, interest, and rents earned by foreign owners of Calidora-based assets: 95\n  * Product and import taxes collected: 88\n  * Product and import subsidies paid: 31\n  * Population: 200 million people\n\n  A development-bank rule states that a country qualifies for \u201cupper-income treatment\u201d if its national income per capita is at least 10,750 local currency units.\n\n* The Core Question: By how many local currency units per person does Calidora exceed or fall short of the 10,750 threshold? State whether it qualifies, rounded to the nearest whole local currency unit per person.", "answer": "Exceeds by 150 local currency units per person; qualifies.", "feedback": "Verdict: Incorrect\n\nAnalysis: The student's final answer (exceeds the threshold by 150 per person, i.e., 10,900 per capita, implying an aggregate of 2,180 billion) does not match my independently derived result. Working from expenditure-side GDP, adjusting to gross national income with net factor income from abroad, and then converting to national income by removing net product/import taxes (taxes minus subsidies \u2014 no depreciation figure is given, so NNP equals GNP), I obtain a national income of 2,066 billion, or 10,330 per person across 200 million people. Calidora therefore falls short of the 10,750 threshold by 420 local currency units per person and does not qualify. The student's figure of 2,180 billion corresponds exactly to adding the net indirect taxes (57 billion) to GNI of 2,123 billion rather than subtracting them \u2014 a sign error in the GNI-to-national-income adjustment. This flipped not only the magnitude but the qualification verdict itself: the student concluded \"qualifies\" when the correct conclusion is \"does not qualify.\" Even under the alternative interpretation that \"national income\" means GNI at market prices (2,123 billion \u2192 10,615 per capita, short by 135), the student's answer is still wrong in both magnitude and direction.\n\nAmbiguities: The phrase \"national income per capita is at least 10,750 local currency units\" is the main source of ambiguity. \"National income\" can mean (a) national income at factor cost (GNI minus net indirect taxes, the textbook NI concept \u2014 supported here by the inclusion of \"Product and import taxes collected: 88\" and \"Product and import subsidies paid: 31\"), or (b) gross national income at market prices, as used in actual development-bank (World Bank) income classifications. The question also omits any depreciation/consumption of fixed capital figure, forcing the solver to assume NNP = GNP, which is a minor imprecision. However, under neither interpretation does the country exceed the threshold, so the student's verdict is wrong regardless.", "verdict": "Incorrect"}, {"entry_id": 111, "problem": "* Scenario: A food-packaging company is evaluating a new automated packaging line. At purchase, the vendor\u2019s equipment invoice is $1,350,000, but the company receives an 8% cash discount. The company must also pay $28,000 for freight, $145,000 for an electrical upgrade, and $85,000 for installation. The existing packaging machine will be traded in immediately for $260,000 in cash.  \n  Over the next four representative operating years, the new line is expected to allow additional unit sales of 80,000, 90,000, 100,000, and 110,000 units, respectively. Each additional unit sells for $18.00 and has cash variable costs of $14.80. The line also eliminates two temporary positions, each working 2,000 hours per year at $27 per hour. However, the new line requires an annual service contract of $56,000 and incremental annual utilities of $36,000. Ignore taxes, depreciation, financing costs, and time value of money.  \n  The company\u2019s lender requires the simple payback period to be no more than 3.75 years.\n\n* The Core Question: Using simple payback, what is the covenant margin in months, where a positive value means the project is faster than the lender\u2019s maximum and a negative value means it exceeds the maximum? Round to the nearest 0.01 month and state whether the project passes or fails the covenant.", "answer": "-1.50 months; fails", "feedback": "Verdict: Incorrect\n\nAnalysis: My independently derived result is **\u22121.70 months (project fails the covenant)**. The correct net initial investment is $1,240,000 (invoice net of the 8% discount, plus freight, electrical, and installation, less the $260,000 trade-in). The annual incremental cash flows are uneven \u2014 $272,000, $304,000, $336,000, and $368,000 \u2014 yielding a cumulative recovery of $912,000 by end of Year 3, so payback = 3 + 328,000/368,000 \u2248 3.8913 years. The margin is 3.75 \u2212 3.8913 = \u22120.1413 years \u2248 \u22121.70 months.\n\nThe student's answer of \u22121.50 months corresponds to a payback of exactly 3.875 years, which is what one obtains by dividing the investment by the *average* annual cash flow ($1,240,000 \u00f7 $320,000 = 3.875). This is the likely error: the student applied an average-cash-flow shortcut rather than the cumulative cash flow method, which is the standard (and correct) approach for simple payback with uneven annual flows. The student did correctly compute the net investment and total cash flows, and correctly concluded the project **fails** \u2014 but the numerical margin is wrong.\n\nAmbiguities: The phrase \"Using simple payback\" could arguably invite the average-annual-cash-flow approximation that the student appears to have used, since some introductory texts present payback as \"investment \u00f7 average annual inflow.\" However, with explicitly uneven year-by-year cash flows given (\"80,000, 90,000, 100,000, and 110,000 units, respectively\"), the cumulative method is the conventionally correct interpretation. Additionally, \"four representative operating years\" could be read as implying a steady-state average, though the word \"respectively\" tied to distinct annual volumes points clearly to the cumulative treatment.", "verdict": "Incorrect"}, {"entry_id": 112, "problem": "* Scenario: A U.S.-based treasury desk treats USD as the domestic currency and EUR as the foreign currency. Today, the desk observes that exchanging USD 10,000,000 in the spot market would deliver EUR 9,250,000. A one-year USD deposit grows USD 1.00 into USD 1.0480, while a one-year EUR deposit grows EUR 1.00 into EUR 1.0185. A bank is quoting a one-year forward contract at EUR 0.9100 per USD. The firm expects to receive USD 25,000,000 in one year and wants to sell those dollars forward for euros.\n\n* The Core Question: Using one-year covered interest parity, what is the incremental euro amount the firm would receive under the bank\u2019s quoted forward rate compared with the parity-implied forward rate? Round to the nearest euro.", "answer": "\u20ac275,942", "feedback": "Verdict: Correct\n\nAnalysis: The student's final answer of \u20ac275,942 matches my independently derived result exactly. The spot rate implied by the scenario is EUR 0.9250 per USD, and applying covered interest parity (spot \u00d7 foreign growth factor \u00f7 domestic growth factor) yields a parity-implied forward of approximately EUR 0.8989623 per USD. The bank's quote of EUR 0.9100 is richer for the dollar seller, and the per-dollar advantage applied to USD 25,000,000 gives an incremental euro amount of approximately \u20ac275,942 (the unrounded figure is roughly \u20ac275,942.37, so rounding to the nearest euro is properly executed). The student also correctly identified the direction of the comparison (bank quote minus parity rate), as the bank's forward is more favorable to the firm. Full marks.\n\nAmbiguities: Minor points worth noting: (1) The phrase \"incremental euro amount\" presumes the bank's quote exceeds the parity rate; if the sign had been reversed, students might be unsure whether to report a negative value or an absolute difference. Here the bank's quote is favorable, so this does not affect the answer. (2) The question says \"exchanging USD 10,000,000 in the spot market would deliver EUR 9,250,000,\" which unambiguously fixes the spot at 0.9250 EUR/USD, but a careless reader could invert the quote (\u22481.0811 USD/EUR) and misapply parity. (3) The question implicitly assumes the parity comparison uses the same EUR-per-USD quoting convention as the bank's forward, which is the natural reading. Overall, the question is precise enough that these are not material ambiguities.", "verdict": "Correct"}, {"entry_id": 113, "problem": "* Scenario: A manufacturer is considering replacing an old packaging machine on January 1 with a new automated line. The new line has a list price of $1,200,000, and the supplier offers a 5% upfront discount. Freight and installation will cost $90,000. The project also requires an immediate $70,000 increase in net working capital. The old machine can be sold immediately for $110,000; its tax book value is $90,000. The firm\u2019s tax rate is 25%, and any tax on the sale is paid immediately.\n\n  For tax purposes, the new line\u2019s depreciable basis equals its discounted purchase price plus freight and installation, depreciated straight-line to zero over 5 years. Each year, the new line is expected to add 40,000 units of sales at a contribution margin of $8.50 per unit. It will also require a $38,000 annual maintenance contract and a $42,000 annual supervisor salary, but it will reduce annual scrap-disposal costs by $35,000. Assume these annual operating effects are constant each year and that the firm evaluates recovery speed using undiscounted average annual after-tax cash inflow.\n\n  Management\u2019s policy is to approve only projects that recover the initial net investment within 54 months.\n\n* The Core Question: Does the project meet management\u2019s recovery-speed policy, and by how many months does it beat or miss the 54-month cutoff? Round the month difference to the nearest 0.1 month.", "answer": "Within policy by 3.3 months.", "feedback": "Verdict: Correct\n\nAnalysis: The student's final answer matches my independently derived result. My hidden calculation yields a depreciable basis of $1,230,000 (discounted price plus freight/installation), an initial net investment of $1,195,000 (after adding the $70,000 working capital and subtracting the $105,000 after-tax salvage proceeds from the old machine, which includes the $5,000 tax on the $20,000 gain), and an annual after-tax cash inflow of $282,750 (incorporating the depreciation tax shield on $246,000 of annual depreciation). The resulting payback period is approximately 50.7 months, which beats the 54-month cutoff by approximately 3.3 months. The student's conclusion \u2014 \"Within policy by 3.3 months\" \u2014 is exactly correct in both direction (meets policy) and magnitude (3.3 months when rounded to the nearest 0.1 month).\n\nAmbiguities: The question is largely precise, but two phrases merit note: (1) \"undiscounted average annual after-tax cash inflow\" \u2014 since annual cash flows are stated to be constant, \"average\" is redundant here and creates no ambiguity in practice, but in a variant problem it could invite an average-based versus cumulative payback distinction; (2) \"initial net investment\" \u2014 the question does not explicitly state whether the net working capital increase is included in the recoverable base, though standard convention (and the word \"net investment\" combined with \"immediate\" requirement) supports including it, as the student evidently did. A student excluding NWC would have obtained a payback of about 47.7 months and answered \"beats by 6.3 months,\" so the question's phrasing does technically permit that alternative reading.", "verdict": "Correct"}, {"entry_id": 114, "problem": "* Scenario: A credit desk is considering buying a 9-month binary credit-linked note on a portfolio of 50 comparable corporate issuers. Historical data show that, over the last 4 years, a benchmark universe of 200 similar issuers experienced 80 defaults. Assume defaults occur independently at a constant rate proportional to issuer-years, and model the portfolio\u2019s 9-month default count using a Poisson distribution. The note pays $15,000,000 at maturity if the number of defaults during the 9-month period equals the number of issuers currently on the desk\u2019s red-watch list: Arden, Blake, Cobalt, and Deltan. The upfront premium to buy the note is $2,600,000. Ignore discounting.\n\n* The Core Question: What is the buyer\u2019s net expected dollar profit from the note, rounded to the nearest whole dollar?", "answer": "$302,055", "feedback": "Verdict: Incorrect\n\nAnalysis: My independently derived result is a net expected profit of approximately **$306,704** (based on a default intensity of 0.10 per issuer-year, giving a Poisson parameter \u03bb = 50 \u00d7 0.10 \u00d7 0.75 = 3.75, a probability of exactly 4 defaults of \u2248 0.193780, an expected payoff of \u2248 $2,906,704, less the $2,600,000 premium). The student's answer of $302,055 implies a probability of exactly 4 defaults of about 0.19347, which is too low by roughly 0.0003. This is too large a gap to attribute to terminal rounding of the final dollar figure; it almost certainly results from premature rounding of an intermediate quantity (most likely truncating e^(\u22123.75) \u2248 0.023518 to fewer significant digits, or rounding the Poisson probability before multiplying by the $15,000,000 notional). The conceptual setup (Poisson model, \u03bb = 3.75, k = 4, subtracting the premium) appears to have been executed correctly, but the numerical precision error produces a final answer roughly $4,650 below the correct value, which exceeds acceptable rounding tolerance for a question asking for the nearest whole dollar.\n\nAmbiguities: The question is largely precise, but two phrasings invite minor interpretive risk: (1) \"equals the number of issuers currently on the desk's red-watch list: Arden, Blake, Cobalt, and Deltan\" requires the reader to count the named issuers to determine k = 4 rather than stating it explicitly \u2014 a careless reader could miscount or assume the defaults must be those specific firms; (2) \"9-month period\" leaves open whether to use 9/12 = 0.75 years or a day-count convention such as 270/365 \u2248 0.7397 years, which would materially change \u03bb and the final answer. The intended reading (0.75 years, exactly 4 defaults of any issuers in the portfolio) is the standard one, but the question could state both explicitly.", "verdict": "Incorrect"}, {"entry_id": 115, "problem": "* Scenario: On 30 June 2026, immediately after the semiannual coupon has been paid, accrued interest is exactly zero. A trading desk holds 2,000 identical fixed-rate notes, each redeeming $1,000 of principal at maturity on 30 June 2029. The notes pay a 6.00% annual coupon on principal in equal semiannual installments on 30 June and 31 December. The desk\u2019s pricing system shows a clean quote of 94.7578631432535 per $100 of principal, and because accrued interest is zero, the invoice value equals the clean value. The desk\u2019s annual nominal benchmark rate, compounded semiannually for the same maturity, is 7.25%.\n\n* The Core Question: Using `calculate_zero_coupon_rate` on the whole position, with the number of periods equal to the remaining semiannual cash-flow dates, what is the spread of the calculated rate above the 7.25% benchmark, in basis points, rounded to the nearest whole basis point?", "answer": "75 basis points", "feedback": "Verdict: Correct\n\nAnalysis: The student's final answer of 75 basis points matches my independently derived result. The clean price of 94.7578631432535 per $100, with six remaining semiannual cash flows (coupon of $3 per period per $100 face, redemption of $100), is exactly consistent with a semiannual discount rate of 4.00% per period \u2014 i.e., an annual nominal rate, compounded semiannually, of 8.00%. The spread over the 7.25% benchmark is 8.00% \u2212 7.25% = 0.75% = 75 basis points. Scaling to the full position (2,000 notes \u00d7 $1,000 face, invoice value $1,895,157.26 vs. aggregate cash flows) leaves the implied rate unchanged, since the rate is scale-invariant. The price was clearly engineered so the implied semiannually compounded rate lands exactly on 8.00%, and the student correctly recovered it and computed the spread.\n\nAmbiguities: The phrase \"Using `calculate_zero_coupon_rate` on the whole position, with the number of periods equal to the remaining semiannual cash-flow dates\" is materially ambiguous. A function literally named `calculate_zero_coupon_rate` typically implements (FV/PV)^(1/n) \u2212 1, which ignores intermediate coupons. Applied naively with FV = $2,000,000 (principal only) and PV = $1,895,157.26 over n = 6 periods, it would yield roughly 0.90% per period (\u22481.80% nominal annual), implying a large *negative* spread; applied with FV = total undiscounted cash flows ($2,360,000), it would yield \u22487.45%, a spread of \u224820 bp. Only interpreting the instruction as \"solve for the internal rate of return / yield to maturity of the coupon-bearing cash flows\" produces the clean 8.00% result. Additionally, the question does not explicitly state the annualization convention (multiply the periodic rate by 2 versus compounding to an effective annual rate), though \"annual nominal benchmark rate, compounded semiannually\" for the 7.25% figure strongly implies the \u00d72 convention should be applied symmetrically.", "verdict": "Correct"}, {"entry_id": 116, "problem": "* Scenario: A hedge fund is evaluating a six-month credit event-count note referencing a diversified portfolio of 100 corporate names. Each name has a quoted risk-neutral credit-event intensity of 200 basis points per year. Market convention for this note models total credit-event arrivals in the portfolio as independent events occurring at a constant aggregate intensity equal to the sum of the individual annual intensities.  \n  The note pays **$1,000,000 at maturity if exactly three credit events occur** during the six-month period, and pays nothing otherwise. The continuously compounded risk-free rate is **4% per year**, and the note is offered today for an upfront premium of **$55,000**.\n\n* The Core Question: What is the note\u2019s net present value to the buyer after paying the upfront premium, rounded to the nearest whole dollar?", "answer": "**$5,099**", "feedback": "Verdict: Correct\n\nAnalysis: The student's final answer matches my independently derived result. Modeling the aggregate arrivals as a Poisson process with intensity 100 \u00d7 2% = 2 per year, the expected number of events over the six-month horizon is 1. The risk-neutral probability of exactly three events is e\u207b\u00b9/3! \u2248 0.0613132. Discounting the $1,000,000 contingent payoff at the continuously compounded rate (discount factor e\u207b\u2070\u00b7\u2070\u00b2 \u2248 0.980199) gives a present value of approximately $60,099. Subtracting the $55,000 upfront premium yields an NPV of $5,099 to the buyer, matching the student's submission exactly.\n\nAmbiguities: The phrase \"independent events occurring at a constant aggregate intensity equal to the sum of the individual annual intensities\" strongly implies a Poisson process for the total count, but it does not explicitly say \"Poisson.\" A student could conceivably model each name as a Bernoulli default with probability 1 \u2212 e\u207b\u2070\u00b7\u2070\u00b9 over six months and use a Binomial(100, p) distribution, which would yield a slightly different probability (\u22480.06099 vs. 0.06131) and hence a slightly different NPV (\u2248$4,786). The intended convention (Poisson) is, however, the most natural reading of \"constant aggregate intensity.\" Additionally, \"pays $1,000,000 at maturity if exactly three credit events occur\" is precise, but the question could have clarified that the payoff is discounted from the six-month maturity date \u2014 though this is the standard assumption.", "verdict": "Correct"}, {"entry_id": 117, "problem": "* Scenario: Today is **March 1, 2026**. A trader is evaluating a European call option on Zeta Corp. The stock is trading at **$78.50** per share, and the option has a **$72.00 strike price** and expires on **September 1, 2026**. Use an **ACT/365** day-count convention.  \n  The desk estimates the option\u2019s unadjusted extrinsic component as the sum of a **$1.35 calendar-value reserve** and a **$1.15 liquidity/positioning reserve**, both quoted per share. The relevant annualized implied volatility is quoted as **32 vol points**.  \n  The same option is currently offered in the market at **$9.05 per share**. One options contract controls **100 shares**, and the trader can buy **40 contracts** with no transaction costs.\n\n* The Core Question: What is the total dollar valuation edge from buying the 40 contracts, rounded to the nearest whole dollar?", "answer": "**$1,413**", "feedback": "Verdict: Incorrect\n\nAnalysis: The student's final answer of **$1,413** does not match my independently derived result. The fair value of the option is the intrinsic value ($78.50 \u2212 $72.00 = $6.50) plus the stated extrinsic reserves ($1.35 + $1.15 = $2.50), giving a fair value of **$9.00 per share**. Since the option is offered at $9.05, the valuation edge is actually **negative**: ($9.00 \u2212 $9.05) \u00d7 100 shares \u00d7 40 contracts = **\u2212$200**. The trader would be overpaying, not capturing positive edge. The implied volatility (32 vol points) and the ACT/365 day-count details are distractors \u2014 all valuation components were already provided directly in dollar terms. The student's figure of $1,413 (\u2248 $0.353 per share of edge) suggests they likely attempted to \"adjust\" the extrinsic reserve using the volatility and/or the time-to-expiry fraction (184/365 \u2248 0.504, \u03c3\u221aT \u2248 0.227), inflating the fair value above the offer price \u2014 a conceptual error, since the question describes the $2.50 as the extrinsic component to be used, and no model-based recomputation is warranted. The student also missed the sign of the edge entirely.\n\nAmbiguities: The phrase \"**unadjusted extrinsic component**\" is the primary source of confusion \u2014 the word \"unadjusted\" could invite a reader to believe an adjustment (perhaps using the \"**annualized implied volatility... quoted as 32 vol points**\") is required before computing fair value, even though no adjustment formula is provided. Additionally, \"**total dollar valuation edge from buying**\" does not explicitly state whether a negative edge should be reported as a negative number or whether the question presumes a positive edge exists. The inclusion of \"**Use an ACT/365 day-count convention**\" alongside the volatility quote strongly implies a calculation involving time-to-expiry that is, in fact, never needed \u2014 a potentially misleading distractor.", "verdict": "Incorrect"}, {"entry_id": 118, "problem": "* Scenario: A hedge fund is evaluating a European call option on a stock on **January 1, 2026**. The stock is trading at **$126.75**, and the call has a strike price of **$120.00**. The option expires on **June 30, 2026**. The desk uses an **ACT/360** convention, excluding the trade date and including the expiry date, so the relevant maturity is based on the calendar days between those dates.  \n  The desk\u2019s baseline extrinsic reserve per share is built from two components: an event-risk charge equal to **2.0% of the current stock price** plus a liquidity reserve of **$0.465 per share**. The risk system reports the stock\u2019s **annualized variance** as **0.0625**.  \n  An execution venue is currently bidding **$10.48 per share** for the same call option. The fund can create/hedge the option at the model premium and immediately sell into that bid for **400 option contracts**, with each contract covering **100 shares**. Ignore transaction costs and financing costs.\n\n* The Core Question: What is the net dollar arbitrage profit, rounded to the nearest whole dollar?", "answer": "**$14,200**", "feedback": "Verdict: Incorrect\n\nAnalysis: My independently derived result is **$29,200**. The model premium per share is the option's intrinsic value plus the desk's baseline extrinsic reserve: intrinsic value = $126.75 \u2212 $120.00 = $6.75; extrinsic reserve = (2.0% \u00d7 $126.75) + $0.465 = $2.535 + $0.465 = $3.00; model premium = $9.75. The day-count exercise (ACT/360, 180 days from Jan 1 to Jun 30, T = 0.5) and the annualized variance (\u03c3\u00b2 = 0.0625, \u03c3 = 0.25) are distractors that do not feed the stated reserve formula. The arbitrage edge per share = $10.48 \u2212 $9.75 = $0.73, and total shares = 400 contracts \u00d7 100 = 40,000, giving 0.73 \u00d7 40,000 = **$29,200**. The student's answer of $14,200 implies an edge of only $0.355 per share (i.e., a model premium of $10.125), which does not follow from the question's stated reserve construction. The most plausible errors are (a) inflating the model premium by improperly incorporating the variance figure or a time-scaled adjustment into the reserve, or (b) roughly halving the per-share edge (e.g., misapplying T = 0.5 to the profit spread or to the position size). Either way, the final number is materially wrong.\n\nAmbiguities: The question states \"The risk system reports the stock's **annualized variance** as **0.0625**\" but never specifies how (or whether) this feeds the \"model premium,\" which invites students to attempt a Black-Scholes or volatility-based time-value calculation \u2014 yet no risk-free rate is provided, making such an approach incomplete. Additionally, the phrase \"the fund can create/hedge the option at the model premium\" presumes the reader infers that \"model premium\" = intrinsic value + extrinsic reserve, which is implied but never explicitly defined. Finally, the elaborate ACT/360 day-count instruction (\"excluding the trade date and including the expiry date\") suggests maturity matters to the answer, when in fact it is irrelevant to the stated reserve formula \u2014 a potentially misleading distractor.", "verdict": "Incorrect"}, {"entry_id": 119, "problem": "* Scenario: Today is January 1, 2026. A distressed-debt investor is evaluating the purchase of a legal receivable that will be paid in one lump sum on January 1, 2029. The receivable arises from a court award originally set at $950,000 on January 1, 2024, and it accrues statutory simple interest of 4.00% per year through the payment date. Comparable 3-year Treasury spot yields are 3.25% effective annually, and investors require an additional 1.75% annual credit/liquidity premium for this type of receivable. The seller is asking $960,000 today, and the investor would also pay $12,500 in immediate legal and transfer costs.\n\n* The Core Question: What is the net dollar value surplus or shortfall from purchasing the receivable today, rounded to the nearest dollar? Use a positive number for a surplus and a negative number for a shortfall.", "answer": "$12,275 surplus", "feedback": "Verdict: Correct\n\nAnalysis: The student's final answer of a $12,275 surplus matches my independently derived result. The future receivable on January 1, 2029 reflects five years of simple statutory interest on the $950,000 award (yielding $1,140,000), discounted back three years at the 5.00% effective annual required rate (the 3.25% Treasury spot plus the 1.75% credit/liquidity premium), giving a present value of approximately $984,775. Netting the total acquisition cost of $972,500 ($960,000 purchase price plus $12,500 legal/transfer costs) produces a surplus of approximately $12,275 when rounded to the nearest dollar. The student correctly identified the five-year simple interest accrual period (a common trap is using only three years), correctly combined the discount rate components, and correctly included the transaction costs in the outlay.\n\nAmbiguities:\n1. \"accrues statutory simple interest of 4.00% per year through the payment date\" \u2014 while reasonably clear, a careless reader might assume interest accrues only from today (January 1, 2026) rather than from the original award date (January 1, 2024), yielding a 3-year rather than 5-year accrual.\n2. \"investors require an additional 1.75% annual credit/liquidity premium\" \u2014 the question implies arithmetic addition to the 3.25% spot yield (5.00% total), but a stricter interpretation could compound the rates multiplicatively (1.0325 \u00d7 1.0175 \u2212 1 \u2248 5.057%), which would slightly lower the present value and the resulting surplus.\n3. The question does not explicitly state that the combined required rate should be applied as an effective annual compound discount rate, though \"effective annually\" on the Treasury yield strongly implies this convention.", "verdict": "Correct"}, {"entry_id": 120, "problem": "* Scenario: Today is January 1, 2026. A non-dividend-paying stock has a quoted market cost of **$9,800 for 100 shares**. European call and put options on this stock both expire on January 1, 2027, both have a strike price of **$105 per share**, and each option contract controls **100 shares**. The quoted premium for one call contract is **$1,000**, and the quoted premium for one put contract is **$1,150**. The one-year risk-free borrowing and lending rate is **5% effective annually**. There are no transaction costs, short-sale constraints, margin costs, or bid-ask spreads. A trader can trade exactly **100 option contracts** on each side, with the matching number of shares and risk-free borrowing or lending.\n\n* The Core Question: Using the no-arbitrage relationship between the stock, the European call, the European put, and the risk-free asset, what is the **risk-free dollar profit at option expiration** that the trader can lock in, rounded to the nearest whole dollar? If no arbitrage exists, report **$0**.", "answer": "**$5,250**", "feedback": "Verdict: Correct\n\nAnalysis: The student's final answer of $5,250 matches my independently derived result exactly. Checking put-call parity on a per-share basis: the fiduciary call (C + PV(K) = $10 + $105/1.05 = $110) is priced above the protective put (P + S = $11.50 + $98 = $109.50), so an arbitrage exists. The conversion strategy \u2014 buy the stock, buy the put, write the call, financing the net cost of $99.50 per share by borrowing at 5% \u2014 guarantees $105 per share at expiration against a loan repayment of $104.475, locking in $0.525 per share. Scaled across 100 contracts \u00d7 100 shares = 10,000 shares, the risk-free profit at expiration is exactly $5,250. The student correctly identified the direction of the mispricing, executed the parity arbitrage at the proper scale, and computed the profit at the expiration date (not present value), as the question demands.\n\nAmbiguities: The phrase \"risk-free dollar profit at option expiration\" is largely precise, but a few items merit note: (1) Some students might report the present value of the arbitrage profit ($5,250/1.05 = $5,000) instead of the future value; the phrase \"at option expiration\" resolves this, but a less careful reader could conflate the two. (2) \"A trader can trade exactly 100 option contracts on each side\" is slightly unusual phrasing \u2014 \"each side\" presumably means 100 call contracts and 100 put contracts, but it could conceivably be misread as 100 total split across positions. (3) The strike is quoted per share ($105) while premiums and stock cost are quoted per 100-share contract, requiring careful unit reconciliation; this is fair but is the most likely source of scaling errors (e.g., answers of $52.50 or $525).", "verdict": "Correct"}, {"entry_id": 121, "problem": "* Scenario: A logistics company is evaluating whether to replace a diesel yard loader with an electric loader. The company\u2019s capital-budgeting policy defines the initial investment as all cash paid at time 0 for the new asset and required setup, less any same-day cash proceeds from selling the replaced asset. On January 1, the company will pay $925,000 for the electric loader, $120,000 to install the charging bay, and $35,000 for mandatory upfront operating software. The old diesel loader will be sold the same day for $80,000.  \n  The company defines average annual cash flow as the arithmetic average of the project\u2019s full-year net operating cash inflows. Projected annual operating effects are:  \n  - Year 1: diesel fuel savings of $330,000, maintenance savings of $95,000, electricity cost of $62,000, and service contract cost of $33,000.  \n  - Year 2: diesel fuel savings of $350,000, maintenance savings of $105,000, electricity cost of $65,000, and service contract cost of $35,000.  \n  - Year 3: diesel fuel savings of $365,000, maintenance savings of $110,000, electricity cost of $68,000, and service contract cost of $37,000.  \n  The lender will approve the project only if the simple payback period is no more than 36 months.\n* The Core Question: Using the simple payback period method, by how many months is the project\u2019s payback period below or above the lender\u2019s 36-month maximum, rounded to two decimal places, and does the project qualify?", "answer": "Qualifies; 1.88 months below the 36-month maximum.", "feedback": "Verdict: Correct\n\nAnalysis: The student's final answer matches my independently derived result. Using the company's stated definitions, the net initial investment comes to $1,000,000, and the arithmetic average of the three years' net operating cash inflows is approximately $351,666.67. Dividing investment by average annual cash flow yields a payback of about 2.8436 years, or 34.12 months. This is 1.88 months below the lender's 36-month threshold, so the project qualifies. The student's conclusion (\"Qualifies; 1.88 months below\") is exactly correct in both the quantitative margin and the qualification decision.\n\nAmbiguities: The question states the company \"defines average annual cash flow as the arithmetic average of the project's full-year net operating cash inflows,\" strongly implying the averaging method should be used for payback. However, the phrase \"simple payback period method\" could alternatively invite the cumulative (year-by-year) recovery approach, which would yield approximately 34.22 months and a margin of about 1.78 months below the maximum. A student using the cumulative method would arrive at a different (and arguably defensible) numerical answer, though the explicit definition of \"average annual cash flow\" signals the intended approach and supports 1.88 as the expected result.", "verdict": "Correct"}, {"entry_id": 122, "problem": "* Scenario:  \nOn January 1, 2026, a pension fund receives cash from selling a bond portfolio with a quoted market value of $1,250,000. The broker charges a transaction fee equal to 0.8% of the sale proceeds, and the fund invests the remaining net cash immediately. The chosen investment strategy is expected to earn the same annual total return as a reference fund that rose from 50.00 to 53.00 over the prior year, with returns compounded annually. The pension fund will hold the investment until January 1, 2030, when it must make a lump-sum benefit payment of $1,560,000.\n\n* The Core Question:  \nWhat is the pension fund\u2019s dollar surplus or shortfall on January 1, 2030, rounded to the nearest whole dollar?", "answer": "$5,071 surplus", "feedback": "Verdict: Incorrect\n\nAnalysis: My independently derived result is a **surplus of $5,471** (net invested amount of $1,240,000 after the 0.8% fee, grown for 4 years at the reference fund's 6% annual return of 53/50 \u2212 1, yielding approximately $1,565,471 against the $1,560,000 obligation). The student's answer of $5,071 does not match. The student appears to have correctly identified the direction (surplus) and is in the right magnitude range, suggesting they correctly netted the fee ($1,240,000), correctly identified the 6% return, and used a 4-year horizon. The $400 discrepancy most plausibly stems from an arithmetic slip in computing or applying the compound growth factor 1.06\u2074 \u2248 1.26247696 \u2014 for example, a truncation or transcription error in the fourth decimal place of the factor (using roughly 1.26215 instead of 1.26248) or a multiplication error in the final product. The error is not large enough to indicate a conceptual mistake (such as a 3-year horizon, which would produce a shortfall, or fee mishandling), but it exceeds any acceptable rounding tolerance for a nearest-dollar answer.\n\nAmbiguities: The phrase \"a transaction fee equal to 0.8% of the sale proceeds\" could theoretically be read two ways: (1) the fee is 0.8% of the quoted gross value of $1,250,000 (the standard interpretation, giving $1,240,000 net), or (2) the fee is 0.8% of the *net* proceeds, implying net = $1,250,000 / 1.008 \u2248 $1,240,079. The second interpretation yields a surplus of approximately $5,572, which also does not match the student's answer, so the discrepancy cannot be attributed to this ambiguity. Additionally, \"expected to earn the same annual total return as a reference fund that rose from 50.00 to 53.00\" assumes no distributions/dividends in the reference fund, but the phrase \"total return\" and the given price points make the 6% figure reasonably unambiguous.", "verdict": "Incorrect"}, {"entry_id": 123, "problem": "* Scenario: On April 1, 2026, you are evaluating whether to buy a short-dated SaaS receivable package. The package consists of 40 identical customer subscriptions. Each subscription is billed at $600 per month, but invoices are issued and paid three months in advance on the first day of each calendar quarter. A collection agent retains 2.5% of each invoice before remitting cash to the receivable owner. The remaining scheduled remittance dates are April 1, 2026; July 1, 2026; October 1, 2026; January 1, 2027; April 1, 2027; July 1, 2027; October 1, 2027; and January 1, 2028. The appropriate market discount quote is 8.00% nominal annual compounded quarterly. The seller requires a lump-sum price of $522,000 paid on April 1, 2026, just before the first remittance is received. Ignore taxes, default risk, and transaction costs.\n* The Core Question: Using the present value of an annuity due and then subtracting the seller\u2019s required price, what is the net acquisition surplus in dollars, rounded to the nearest whole dollar?", "answer": "$2,534", "feedback": "Verdict: Correct\n\nAnalysis: The student's final answer of $2,534 matches my independently derived result. The quarterly remittance is $70,200 (40 subscriptions \u00d7 $1,800 per quarter, less the 2.5% agent retention), discounted as an 8-payment annuity due at 2% per quarter. The resulting present value is approximately $524,533.77, and subtracting the $522,000 purchase price yields a net acquisition surplus of approximately $2,533.77, which rounds to $2,534. The student correctly identified the annuity-due structure (first payment received immediately on April 1, 2026), applied the net-of-fee cash flow, and used the correct periodic rate.\n\nAmbiguities: The phrase \"paid on April 1, 2026, just before the first remittance is received\" could momentarily cause confusion about whether the April 1, 2026 remittance accrues to the buyer; however, the explicit listing of April 1, 2026 among the \"remaining scheduled remittance dates\" and the instruction to use \"the present value of an annuity due\" resolve this in favor of including it. Additionally, \"8.00% nominal annual compounded quarterly\" is precise, but a careless reader might misapply it as an effective annual rate; the question's wording is technically unambiguous on this point.", "verdict": "Correct"}, {"entry_id": 124, "problem": "* Scenario: A finance company is considering purchasing a single receivable today. The receivable will pay a customer balance of $1,250,000 exactly 4 years from today, plus a contractual maturity bonus equal to 6% of that balance. The appropriate annual required return for this receivable is the current 4-year Treasury yield of 3.40% plus a credit and illiquidity spread of 2.10%, compounded annually. The seller is asking $1,070,000 today for the receivable.\n* The Core Question: What is the net dollar value created by purchasing the receivable at the seller\u2019s asking price, rounded to the nearest whole dollar?", "answer": "-$437", "feedback": "Verdict: Partially Correct due to rounding or minor variations\n\nAnalysis: My independently derived result for the net value created (NPV) is **\u2212$438** (specifically, approximately \u2212$437.81). The student's answer of \u2212$437 has the correct sign, magnitude, and clearly reflects the correct methodology: grossing up the balance by the 6% maturity bonus to get a terminal cash flow of $1,325,000, discounting at the combined required return of 5.50% (3.40% + 2.10%) for 4 years, and subtracting the $1,070,000 asking price. The $1 discrepancy almost certainly arises from intermediate rounding \u2014 most likely the student rounded the present value of the cash flow up to $1,069,563 (or truncated/rounded the discount factor, e.g., using 1.055\u2074 \u2248 1.23882) before computing the difference, rather than carrying full precision through to the final step. Since the unrounded answer is \u2212$437.81, rounding to the nearest whole dollar should yield \u2212$438, not \u2212$437. The student understood the problem completely; the error is purely a precision artifact.\n\nAmbiguities: None of consequence. The question is precise about the cash flow (\"$1,250,000 exactly 4 years from today, plus a contractual maturity bonus equal to 6% of that balance\"), the discount rate construction (\"3.40% plus a credit and illiquidity spread of 2.10%, compounded annually\"), and the price ($1,070,000). One could note that \"net dollar value created\" is informal phrasing, but it unambiguously points to NPV (PV of inflows minus purchase price), and the negative result correctly indicates value destruction at the asking price.", "verdict": "Partially Correct due to rounding or minor variations"}, {"entry_id": 125, "problem": "* Scenario:  \nA trading desk is evaluating 500 European call option contracts on Lydian Tech. Each contract controls 100 shares. The valuation date is April 1, 2026, and the options expire on October 1, 2026. Use ACT/365 for the maturity period.\n\n  Lydian Tech closed yesterday at $79.20. Today, the stock rose by 6.25% and then went ex-dividend for a $0.50 special cash dividend. The call option strike price is $80.00.\n\n  A volatility-neutral reference quote for this same call is $5.40 per share. The desk defines the residual time component as the excess of this reference quote over the call\u2019s immediate exercise value.\n\n  The stock\u2019s daily return standard deviation is 1.25%, and the desk annualizes volatility using 256 trading days.\n\n  The desk marks the option premium per share as:\n\n  intrinsic value plus the residual time component multiplied by \\(1 +\\) annualized volatility \\(\\times\\) ACT/365 years to expiry.\n\n  The market ask price is $5.32 per share. Ignore transaction costs and assume the desk can buy all 500 contracts at the ask.\n\n* The Core Question:  \nWhat is the desk\u2019s total mark-to-market gain in dollars from buying the 500 contracts, rounded to the nearest whole dollar?", "answer": "$12,774", "feedback": "Verdict: Correct\n\nAnalysis: The student's final answer of $12,774 matches my independently derived result exactly. The computation chain works out as follows: the cum-dividend price moves to $84.15, and the ex-dividend stock price of $83.65 yields an intrinsic value of $3.65 against the $80 strike. The residual time component ($5.40 \u2212 $3.65 = $1.75) is scaled by the factor (1 + 20% \u00d7 183/365), where the 20% annualized volatility comes from 1.25% \u00d7 \u221a256 and the 183-day ACT/365 period spans April 1 to October 1, 2026. This produces a desk mark of approximately $5.5755 per share, a per-share gain of about $0.2555 over the $5.32 ask, and a total gain of $12,773.97 across 50,000 shares, which rounds to $12,774. The student correctly handled the dividend adjustment (subtracting the dividend after applying the 6.25% return), the volatility annualization, and the day count.\n\nAmbiguities: \n1. \"Today, the stock rose by 6.25% and then went ex-dividend\" \u2014 the sequencing is stated, but a careless reader might apply the 6.25% to the post-dividend price or ignore the dividend entirely, since \"went ex-dividend\" does not explicitly say \"subtract $0.50 from the price.\" The intended interpretation (79.20 \u00d7 1.0625 \u2212 0.50) is implied but not mechanically spelled out.\n2. \"Use ACT/365 for the maturity period\" \u2014 the actual day count from April 1 to October 1, 2026 is 183 days, but some solvers may approximate the half-year as 182 days or 0.5 years, leading to small deviations in the final figure.\n3. \"intrinsic value\" \u2014 the question relies on the solver recognizing that intrinsic value must be computed off the ex-dividend price ($83.65), not the post-rally cum-dividend price ($84.15); the phrase itself does not specify which spot price to use.", "verdict": "Correct"}, {"entry_id": 126, "problem": "* Scenario: A credit derivatives desk is evaluating a 6-month digital default note referencing a pool of 500 equal corporate exposures. The portfolio\u2019s aggregate default arrivals are modeled using the standard independent constant-intensity credit-count framework, with each reference name contributing an annual default-arrival intensity of 0.80%.  \n   \n  Each defaulted exposure produces a loss of $6,000,000 at the 6-month settlement date. The note pays $10,000,000 at settlement only if the pool\u2019s total default losses exactly exhaust a $18,000,000 reserve account; if losses are below or above that amount, the note pays nothing.  \n   \n  The continuously riskless market is approximated for this deal using a 4.00% annual simple discount rate over the 6-month horizon. The note is offered today for $1,600,000.\n\n* The Core Question: What is the model-implied net present value advantage of buying one note, rounded to the nearest whole dollar, and should the desk buy it?", "answer": "$169,089; Buy", "feedback": "Verdict: Correct\n\nAnalysis: The student's final answer of $169,089 matches my independently derived result. The framework implies a pooled Poisson default count with aggregate intensity of 500 \u00d7 0.80% = 4.0 per annum, giving a 6-month mean of 2.0. The payout condition (losses exactly exhausting $18,000,000 at $6,000,000 per default) requires exactly 3 defaults, an event whose Poisson probability is e\u207b\u00b2 \u00b7 2\u00b3/3! \u2248 0.1804470. The expected payoff is therefore \u2248 $1,804,470, which, discounted over 6 months at the 4% simple rate (dividing by 1 + 0.04 \u00d7 0.5 = 1.02), gives \u2248 $1,769,089. Subtracting the $1,600,000 offer price yields an NPV of \u2248 $169,089, indicating the desk should buy. The student's number and recommendation are both consistent with this computation.\n\nAmbiguities: The phrase \"a 4.00% annual simple discount rate over the 6-month horizon\" is ambiguous. Read strictly as a simple *discount* rate, the discount factor would be 1 \u2212 0.04 \u00d7 0.5 = 0.98, yielding an NPV of \u2248 $168,381. Read as a simple *interest* rate used for discounting (factor 1/1.02), it yields $169,089, which is the convention the student (correctly, per the expected answer) applied. Additionally, \"total default losses exactly exhaust a $18,000,000 reserve account\" requires interpreting the trigger as exactly 3 defaults \u2014 this is reasonably clear given the loss-per-default granularity, but the phrasing \"exhaust\" could conceivably be misread as \"meet or exceed.\"", "verdict": "Correct"}, {"entry_id": 127, "problem": "* Scenario: A pension plan evaluates an external equity manager over a one-year mandate. At the start of the year, the portfolio market value was \\$50,000,000. There were no external contributions or withdrawals during the year. By year-end, the portfolio\u2019s remaining securities were worth \\$54,250,000, and the manager had distributed \\$1,750,000 in cash income to the pension plan during the year.  \n  Over the same one-year period, a default-free Treasury investment required \\$10,000,000 at the start of the year and paid \\$10,300,000 at year-end. The pension plan\u2019s risk department estimates the manager\u2019s annual return volatility using the annualized variance quote of 0.0144.  \n  The manager earns a performance bonus only if its excess-return-per-unit-of-volatility score exceeds the pension plan\u2019s hurdle of 0.60. The bonus is \\$200,000 for each 0.01 by which the score exceeds 0.60.\n\n* The Core Question: What performance bonus, in dollars, should the manager receive, rounded to the nearest whole dollar?", "answer": "\\$1,600,000", "feedback": "Verdict: Incorrect\n\nAnalysis: My independently derived result is **$3,000,000**, not $1,600,000. The total portfolio return (including the distributed cash income) is 12%, the risk-free rate from the Treasury investment is 3%, and the annualized volatility is the square root of the 0.0144 variance, i.e., 12%. This yields a Sharpe ratio of (0.12 \u2212 0.03)/0.12 = 0.75, which exceeds the 0.60 hurdle by 0.15, or fifteen increments of 0.01, producing a bonus of 15 \u00d7 $200,000 = $3,000,000. The student's answer of $1,600,000 implies a Sharpe ratio of 0.68 (eight increments above the hurdle). This likely stems from a compounded error \u2014 possibly mishandling the cash distribution in the total return (e.g., partial inclusion or treating it as reinvested at some rate) or computing a geometric excess return with an additional arithmetic slip. There is no single clean, standard miscalculation that yields exactly 0.68, suggesting either a multi-step computational error or an arbitrary figure. Notably, if the student had wholly excluded the $1,750,000 distribution, the score would have been roughly 0.458 (below the hurdle, bonus = $0), so the error is not a simple omission of the cash income either.\n\nAmbiguities: The phrase \"excess-return-per-unit-of-volatility score\" is slightly informal, but in context it unambiguously denotes the Sharpe ratio. One could argue mild imprecision in \"annualized variance quote of 0.0144\" \u2014 a careless reader might treat 0.0144 as the volatility (standard deviation) itself rather than the variance, which would yield a Sharpe ratio of 6.25 and an implausibly large bonus; the wording \"variance\" does, however, make the intended interpretation clear. Otherwise, the question is precise: no cash flows complicate the return calculation, and the bonus formula is stated exactly.", "verdict": "Incorrect"}, {"entry_id": 128, "problem": "* Scenario: On January 1, 2026, a manufacturing firm must decide whether to lease or buy a specialized machine. The lease runs from January 1, 2026 through December 31, 2030. Lease rent is quoted as $120,000 per year, payable in equal quarterly installments at the beginning of each calendar quarter. The firm\u2019s discount rate is an 8% nominal annual rate compounded quarterly. Alternatively, the firm can buy the machine outright on January 1, 2026 for $485,000. Ignore taxes, maintenance, residual value, and all other costs.\n* The Core Question: What is the dollar amount by which buying the machine is cheaper than leasing it on a present-value basis, rounded to the nearest whole dollar?", "answer": "$15,354", "feedback": "Verdict: Correct\n\nAnalysis: The student's final answer of $15,354 matches my independently derived result. The lease constitutes a 20-quarter annuity-due of $30,000 per quarter discounted at 2% per quarter, yielding a present value of approximately $500,353.86. Subtracting the $485,000 purchase price gives a savings from buying of $15,353.86, which rounds to $15,354. The student correctly identified the beginning-of-period payment timing (annuity-due), the correct periodic rate (8%/4 = 2%), and the correct number of periods (5 years \u00d7 4 = 20 quarters). A common error \u2014 treating the payments as an ordinary annuity \u2014 would have produced a PV of roughly $490,543 and a difference of about $5,543, which the student avoided.\n\nAmbiguities: None. The question precisely specifies \"payable in equal quarterly installments at the beginning of each calendar quarter,\" the \"8% nominal annual rate compounded quarterly,\" the exact lease term (\"January 1, 2026 through December 31, 2030\"), and instructs to \"Ignore taxes, maintenance, residual value, and all other costs,\" leaving no room for alternative interpretation.", "verdict": "Correct"}, {"entry_id": 129, "problem": "* Scenario: A bank is evaluating a one-month operational-risk note tied to critical fixed-income settlement failures. Over the last 504 trading days, the bank recorded 84 critical settlement failures. Assume these failures occur independently at a constant average rate per trading day.  \n  The note\u2019s observation window is the next 24 trading days. It pays $2,500,000 at the end of the window only if the number of critical settlement failures during the window exactly matches the number of failed high-value repo tickets listed in today\u2019s reconciliation report. Today\u2019s report lists four failed tickets: R-118, R-204, R-377, and R-451.  \n  The risk-free discount rate for this one-month horizon is 0.00%, and the dealer quotes an upfront premium of $500,000 for the note.\n\n* The Core Question: What is the dealer quote\u2019s dollar overpricing versus the actuarially fair premium, rounded to the nearest whole dollar?", "answer": "$11,583", "feedback": "Verdict: Correct\n\nAnalysis: The student's final answer of $11,583 matches my independently derived result exactly. Working internally: the empirical failure rate combined with the 24-day window yields a Poisson intensity of \u03bb = 4 for the observation period; the probability of exactly 4 failures is e\u207b\u2074\u00b74\u2074/4! \u2248 0.1953668. Multiplying by the $2,500,000 payoff (no discounting, since the rate is 0.00%) gives a fair premium of approximately $488,417. The dealer's quote of $500,000 therefore overprices the note by $500,000 \u2212 $488,417 = $11,583, which agrees with the student's submission to the nearest dollar. The student correctly identified the Poisson framework, the matching condition (exactly 4 events), and the overpricing calculation.\n\nAmbiguities: The question contains mild ambiguity in the phrase \"exactly matches the number of failed high-value repo tickets listed in today's reconciliation report.\" A careless reader could be distracted by the ticket identifiers (R-118, R-204, R-377, R-451) and wonder whether specific ticket matching is intended, though the count of four is clearly the operative number. Additionally, \"Assume these failures occur independently at a constant average rate per trading day\" implicitly directs the student to a Poisson model, but does not say \"Poisson\" explicitly \u2014 a student could conceivably model daily failures as a Binomial with p = 84/504 = 1/6 per day over 24 days (Binomial(24, 1/6)), which gives P(X=4) \u2248 0.2136 and a fair premium of \u2248 $534,000, implying underpricing rather than overpricing. The intended Poisson interpretation is the standard one given \"constant average rate,\" but the phrasing admits this alternative reading.", "verdict": "Correct"}, {"entry_id": 130, "problem": "* Scenario: A regional bank is pricing a one-year, interest-only revolving credit facility for a manufacturing borrower. The facility will be fully drawn at **$10,000,000** for the entire first year, with simple annual interest and no fees.\n\n  The bank sets its base prime lending rate at **300 basis points above the upper bound** of the Federal funds target range. On the loan closing date, the Federal funds target range is **5.25%\u20135.50%**.\n\n  The borrower\u2019s applicable credit-pricing adjustments are determined from the following grid, using closing-date financials. Only these listed adjustments apply:\n\n  | Pricing Factor | Condition | Rate Adjustment |\n  |---|---:|---:|\n  | Total funded debt / EBITDA | \u2264 2.50x | \u22120.20 percentage points |\n  |  | > 2.50x and \u2264 3.50x | +0.15 percentage points |\n  |  | > 3.50x | +0.55 percentage points |\n  | Current ratio | \u2265 1.50x | \u22120.10 percentage points |\n  |  | \u2265 1.20x and < 1.50x | +0.10 percentage points |\n  |  | < 1.20x | +0.35 percentage points |\n  | Collateral coverage ratio | \u2265 1.40x | \u22120.15 percentage points |\n  |  | \u2265 1.10x and < 1.40x | +0.05 percentage points |\n  |  | < 1.10x | +0.40 percentage points |\n  | Quarterly reporting plus lockbox cash dominion accepted | Yes | \u22120.25 percentage points |\n  |  | No | 0.00 percentage points |\n\n  Closing-date borrower data:\n\n  * Post-closing total funded debt: **$31,200,000**\n  * Trailing adjusted EBITDA: **$9,000,000**\n  * Current assets: **$14,700,000**\n  * Current liabilities: **$10,500,000**\n  * Eligible accounts receivable: **$8,400,000**\n  * Inventory: **$8,000,000**\n  * For collateral coverage, eligible collateral equals eligible accounts receivable plus **50% of inventory**\n  * The borrower accepts quarterly reporting and lockbox cash dominion.\n\n  Management had budgeted first-year interest expense of **$840,000** for this facility.\n\n* The Core Question: What is the net first-year dollar variance versus management\u2019s budget, rounded to the nearest whole dollar? Use a positive number if actual interest expense is above budget and a negative number if below budget.", "answer": "**+$15,000**", "feedback": "Verdict: Correct\n\nAnalysis: The student's final answer of +$15,000 matches my independently derived result. Working internally: the prime rate is anchored to the upper bound of the Fed funds range plus 300 bps (yielding 8.50%); the leverage ratio falls in the middle tier (+0.15), the current ratio of exactly 1.40x falls in the middle tier (+0.10), the collateral coverage ratio (eligible A/R plus half of inventory, measured against the $10,000,000 facility) lands in the middle tier (+0.05), and the reporting/lockbox acceptance earns \u22120.25. The net adjustment of +0.05 percentage points produces an all-in rate of 8.55%, first-year simple interest of $855,000, and a variance of +$15,000 above the $840,000 budget. The student's sign convention (positive for above budget) is also correctly applied.\n\nAmbiguities: The question states \"Collateral coverage ratio\" with the note that \"eligible collateral equals eligible accounts receivable plus 50% of inventory,\" but it never explicitly defines the denominator of the ratio. The intended interpretation \u2014 eligible collateral divided by the $10,000,000 facility amount \u2014 is the natural reading, but a stricter drafting would state \"collateral coverage ratio = eligible collateral \u00f7 total facility commitment.\" Additionally, \"Current ratio \u2265 1.20x and < 1.50x\" places the computed value of exactly 1.40x unambiguously in the middle tier, but boundary values like 1.40x for collateral (which receives \u22120.15 at \"\u2265 1.40x\") show how sensitive the grid is to edge cases; here the computed collateral ratio (1.24x) avoids that boundary, so no actual conflict arises.", "verdict": "Correct"}, {"entry_id": 131, "problem": "* Scenario: On January 1, 2026, a university endowment is planning for a lab renovation scheduled for January 1, 2030. The endowment owns 1,200 zero-coupon notes, each paying $1,000 at maturity on the renovation date. The current construction cost target, stated in January 1, 2026 purchasing-power dollars, is $1,000,000. The CPI is 250.0 today and is forecast to be 260.0 exactly one year from today, with that same annual inflation rate assumed to persist through the renovation date.\n\n* The Core Question: Using the inflation-adjusted real value formula, what is the endowment\u2019s purchasing-power surplus or shortfall relative to the $1,000,000 target, rounded to the nearest whole dollar?", "answer": "$25,765 surplus", "feedback": "Verdict: Correct\n\nAnalysis: The student's final answer matches my independently derived result. The implied annual inflation rate from the CPI forecast (250.0 \u2192 260.0) is 4.0%, persisting over the four-year horizon from January 1, 2026 to January 1, 2030. The nominal payoff of $1,200,000 (1,200 notes \u00d7 $1,000), deflated to January 1, 2026 purchasing-power dollars via the real value formula, yields a real value of approximately $1,025,765. Comparing this against the $1,000,000 target produces a purchasing-power surplus of $25,765, exactly as the student stated. The rounding to the nearest whole dollar is also handled correctly.\n\nAmbiguities: The question contains a few points that could invite alternative interpretations:\n1. \"that same annual inflation rate assumed to persist through the renovation date\" \u2014 this is reasonably clear, but a careless reader might apply a single year of inflation or use a CPI ratio of 260/250 only once rather than compounding 4% over four years.\n2. \"stated in January 1, 2026 purchasing-power dollars\" \u2014 the intended approach (deflate the 2030 nominal payoff back to 2026 real dollars) is implied, but an alternative interpretation would be to inflate the $1,000,000 target forward to 2030 nominal dollars ($1,169,859) and compare against $1,200,000 nominally, yielding a nominal surplus of $30,141 \u2014 a different but defensible framing. The phrase \"Using the inflation-adjusted real value formula\" steers the solver toward the deflation approach, which the student correctly followed.\n3. The zero-coupon notes' current market price/yield is never given, which is fine for this purchasing-power question but could momentarily confuse students expecting a discounting-at-yield problem.", "verdict": "Correct"}, {"entry_id": 132, "problem": "* Scenario: Meridian Components has 40 million shares outstanding and its stock is trading at $45 per share. Over the last twelve months, the company earned net income of $120 million. Analysts expect next fiscal year\u2019s EPS to be $3.75. The investment committee evaluates the stock using the standard price/earnings-to-growth measure, with the earnings growth rate entered in percentage-point form, and compares the result to a benchmark of 1.00.\n* The Core Question: What is the signed spread, in PEG points, between Meridian\u2019s price/earnings-to-growth measure and the 1.00 benchmark, calculated as measure minus benchmark, rounded to the nearest hundredth?", "answer": "0.00", "feedback": "Verdict: Incorrect\n\nAnalysis: The student's answer of 0.00 does not match my independently derived result. Working from the given data \u2014 trailing EPS of $3.00 ($120M \u00f7 40M shares), forward EPS of $3.75, implying expected earnings growth of 25% \u2014 the P/E ratio divided by the growth rate (in percentage-point form, i.e., 25) yields a PEG well below 1.00. Using the trailing P/E of 15 ($45 \u00f7 $3.00), the PEG is 0.60, giving a signed spread of \u22120.40. Using the forward P/E of 12 ($45 \u00f7 $3.75), the PEG is 0.48, giving a spread of \u22120.52. Under no defensible interpretation does the PEG equal exactly 1.00, which is what a spread of 0.00 would require. The student likely either confused the benchmark comparison conceptually (assuming the stock is \"fairly valued\" and asserting parity), or made a computational error such as dividing the P/E of 15 by a mistakenly computed growth rate of 15%. Either way, the final answer is wrong.\n\nAmbiguities: The phrase \"the standard price/earnings-to-growth measure\" is ambiguous as to whether the trailing P/E (based on the $120 million LTM net income) or the forward P/E (based on the $3.75 expected EPS) should be used in the numerator. This materially changes the answer (\u22120.40 vs. \u22120.52). Additionally, the growth rate itself must be inferred (trailing EPS to forward EPS, i.e., 25%) rather than being stated explicitly, which the question phrasing (\"earnings growth rate entered in percentage-point form\") presumes but does not define. However, neither interpretation rescues the student's answer of 0.00.", "verdict": "Incorrect"}, {"entry_id": 133, "problem": "* Scenario: On January 1, 2026, Meridian Components sells a non-core warehouse for $4,800,000. The warehouse has a tax book value of $3,200,000. At closing, Meridian pays a broker fee equal to 1.25% of the sale price and immediately pays capital gains tax equal to 20% of the excess of the sale price over the tax book value. The remaining cash is invested the same day in a low-risk fund quoted at a nominal annual return of 5.6%, compounded quarterly. Meridian plans to use the accumulated investment balance on January 1, 2032, to make a required debt maturity payment of $6,150,000.\n\n* The Core Question: What is Meridian\u2019s dollar surplus or shortfall on January 1, 2032, after making the debt maturity payment? Round to the nearest whole dollar and state whether it is a surplus or shortfall.", "answer": "Surplus of $20,805", "feedback": "Verdict: Partially Correct due to rounding or minor variations\n\nAnalysis: My independently derived result is a **surplus of $20,682** (net invested principal of $4,420,000 after the $60,000 broker fee and $320,000 capital gains tax, grown for 24 quarters at 1.4% per quarter, yields approximately $6,170,682, versus the $6,150,000 debt payment). The student's answer of a surplus of $20,805 correctly identifies the direction (surplus) and is in the right vicinity, but is off by roughly $123. This discrepancy is almost certainly caused by premature rounding of the quarterly compounding factor \u2014 using approximately 1.39611 instead of the full-precision 1.396082 for (1.014)^24. A factor difference of ~0.000028 multiplied by the $4,420,000 principal accounts almost exactly for the ~$123 gap. The conceptual setup (fee, tax base, net proceeds, quarterly compounding over 6 years) appears entirely correct; only precision handling failed. Since the question explicitly requires rounding to the nearest whole dollar, the stated figure does not match the exact answer, but the error is purely one of intermediate rounding, not method.\n\nAmbiguities: The question is largely precise, but one phrase merits note: \"capital gains tax equal to 20% of the excess of the sale price over the tax book value.\" This explicitly bases the tax on the gross sale price, which forecloses the (real-world plausible) interpretation that the broker fee reduces the taxable gain. A student applying real-world tax treatment (taxing $4,800,000 \u2212 $60,000 \u2212 $3,200,000 = $1,540,000) would get a surplus of ~$37,435 \u2014 the student did not make this error, but the phrasing could trip up test-takers who default to practical tax conventions rather than the literal wording. Otherwise, the timing (\"invested the same day,\" exactly 6 years to January 1, 2032) and rate convention (\"nominal annual return of 5.6%, compounded quarterly\") are unambiguous.", "verdict": "Partially Correct due to rounding or minor variations"}, {"entry_id": 134, "problem": "* Scenario:  \nA SaaS company sells a monthly analytics add-on. In September, the add-on was priced at **$40.00 per month**, and customers purchased **25,000 subscriptions**. In October, the company raised the price to **$46.00 per month**, and monthly subscriptions fell to **22,750**. Assume no other demand drivers changed.  \n\n  The company measures percentage changes relative to the original baseline level and reports demand responsiveness as a positive magnitude. Management now considers raising the current October price by an additional **10%** for November. Use the demand responsiveness implied by the September-to-October change to estimate the November quantity sold, then compute the incremental monthly revenue versus October.\n\n* The Core Question:  \nWhat is the estimated incremental monthly revenue from the proposed November price increase, rounded to the nearest dollar?", "answer": "**$35,581**", "feedback": "Verdict: Correct\n\nAnalysis: The student's final answer of **$35,581** matches my independently derived result exactly. The implied demand responsiveness (price elasticity magnitude) from the September-to-October change, computed against the original baseline, is 0.6 (a 9% quantity drop relative to 25,000 divided by a 15% price increase relative to $40.00). Applying that elasticity to a 10% November price increase yields a 6% quantity decline from October's 22,750 subscriptions, giving 21,385 subscriptions at a new price of $50.60. November revenue of $1,082,081 versus October revenue of $1,046,500 produces an incremental revenue of exactly $35,581. The student correctly used baseline (point) percentage changes rather than midpoint/arc elasticity, as the question explicitly instructs, and correctly applied the elasticity multiplicatively to the October quantities and price.\n\nAmbiguities: The question is largely well-specified, but one phrase invites a minor alternative interpretation: \"The company measures percentage changes relative to the original baseline level.\" For the November projection, \"original baseline\" could conceivably be read as September's levels rather than October's, though the instruction to compute \"incremental monthly revenue versus October\" and the phrase \"raising the current October price by an additional 10%\" strongly imply October is the new baseline for the second change. Additionally, the quantity result (21,385) happens to be a whole number here, but the question does not specify how to handle fractional subscription counts had they arisen \u2014 a potential ambiguity in similar problems.", "verdict": "Correct"}, {"entry_id": 135, "problem": "* Scenario:  \nOn August 12, 2026, a natural gas peaker plant sells electricity into the ERCOT real-time market during a 3-hour scarcity event. The plant injects **42,000 MWh** into the grid. The clearing energy price is composed of a base real-time price of **$118.50/MWh**, a scarcity adder of **$27.25/MWh**, and a congestion premium of **$4.75/MWh**. ERCOT applies a **2% settlement loss factor**, meaning only 98% of injected MWh are paid, while production costs are incurred on the full injected quantity.\n\n  The plant\u2019s incremental production cost for the event consists of:\n  * Natural gas fuel burn: **7.2 MMBtu/MWh**\n  * Natural gas price: **$6.10/MMBtu**\n  * Variable operations and maintenance: **$8.40/MWh**\n  * Emissions allowance cost: **$3.75/MWh**\n\n  Under the plant\u2019s tolling agreement, the asset owner must pay the tolling counterparty **15% of any producer surplus above $4,000,000** for this event.\n\n* The Core Question:  \nWhat is the tolling counterparty payment, rounded to the nearest whole dollar?", "answer": "**$300,495**", "feedback": "Verdict: Incorrect\n\nAnalysis: My independently derived result is **$0**. The all-in clearing price is $150.50/MWh, paid on 98% of the 42,000 MWh injected (41,160 MWh), yielding revenue of $6,194,580. Incremental cost is $56.07/MWh (fuel of 7.2 \u00d7 $6.10 = $43.92, plus $8.40 VOM, plus $3.75 emissions) applied to the full 42,000 MWh, yielding $2,354,940. Producer surplus is therefore $3,839,640, which is **below** the $4,000,000 threshold, so the tolling counterparty payment is $0. The student's answer of $300,495 implies a computed surplus of approximately $6,003,300 ($300,495 \u00f7 0.15 + $4,000,000), meaning they overstated surplus by roughly $2.16 million. The most plausible error is a drastic understatement of production costs \u2014 for example, omitting most of the fuel burn cost (the largest cost component at $43.92/MWh, or ~$1.84 million) and/or applying costs to only a fraction of the injected volume \u2014 combined with a smaller revenue-side discrepancy. The student also failed to recognize that the threshold acts as a hurdle: even a moderate calculation error should have triggered a sanity check against the $4,000,000 floor.\n\nAmbiguities: The phrase \"**15% of any producer surplus above $4,000,000**\" could conceivably be read two ways: (a) 15% \u00d7 max(0, surplus \u2212 $4,000,000), the standard \"excess over threshold\" interpretation, or (b) 15% of the *entire* surplus if it exceeds $4,000,000. However, under either reading the payment here is $0 because the surplus does not reach the threshold, so the ambiguity does not affect the verdict. Additionally, \"**producer surplus**\" is not formally defined in the problem, but the explicit statement that \"only 98% of injected MWh are paid, while production costs are incurred on the full injected quantity\" makes the intended revenue and cost bases unambiguous.", "verdict": "Incorrect"}, {"entry_id": 136, "problem": "* Scenario:  \nA corporate bond is evaluated immediately after its coupon payment on **30 June 2026**, so accrued interest is **zero**. The bond has **$100 par value**, a **5.00% annual coupon paid semiannually**, and matures on **30 June 2029**. It is quoted at a **clean price of 100.000 per $100 par**.  \n\n  Treasury STRIPS maturing exactly on each of the bond\u2019s next six coupon dates imply a **flat annual nominal Treasury spot rate of 3.50%, compounded semiannually**, for all six maturities.  \n\n  A portfolio desk is considering buying **$25,000,000 face value** of the bond. The desk\u2019s internal credit model says that a fair constant spread over the Treasury spot curve for this issuer should be **125 basis points**.  \n\n* The Core Question:  \nUsing the bond\u2019s market-implied constant spread over the Treasury spot curve, determine the bond\u2019s **mark-to-model dollar mispricing** versus the desk\u2019s fair-spread valuation. Report the result as a **positive dollar amount if the bond is undervalued**, rounded to the nearest dollar.", "answer": "**$172,851 undervalued**", "feedback": "Verdict: Correct\n\nAnalysis: My independent solution proceeds as follows (internally): the bond trades at par with a 5% semiannual coupon, so its market yield is 5%, implying a market-implied constant (Z-) spread of 150 bp over the flat 3.50% Treasury spot curve. The desk's fair spread is 125 bp, so the fair-value discount rate is 4.75% nominal semiannual (2.375% per period). Discounting the six semiannual coupons of
