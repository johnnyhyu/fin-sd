confirmation does not trigger. Both the numerical spread and the signal determination are correct.\n\nAmbiguities: The question is largely precise, but a few phrasings invite minor interpretive risk: (1) \"the price of the final regular-session trade print\" assumes the prints are listed in chronological order, which is implied but not explicitly stated; (2) \"the final VPT spread over or under the 100,000-unit confirmation threshold\" does not specify a sign convention \u2014 a student could defensibly report \"4,000 units under\" rather than \"\u22124,000,\" though the student's signed format clearly communicates the same result; (3) the question does not explicitly state the VPT formula (cumulative sum of volume \u00d7 percentage price change), though this is the standard definition and the \"VPT = 0 starting point\" instruction reinforces it.", "verdict": "Correct"}, {"entry_id": 25, "problem": "* Scenario:  \n  Meridian Tools Inc. is preparing its fiscal-year 2025 cash budget. Its accrual income statement shows the following items for the year:\n\n  * Revenue: $12,400,000  \n  * Cost of goods sold, excluding depreciation: $6,720,000  \n  * SG&A cash expenses: $2,180,000  \n  * Depreciation expense: $640,000  \n  * Amortization expense: $90,000  \n  * Interest expense: $210,000  \n  * Income tax expense: $520,000  \n\n  During the year, Meridian sold old equipment for $260,000 cash. The equipment had a carrying value of $185,000 at the time of sale, and the resulting gain was included in accrual pre-tax income.\n\n  Meridian\u2019s operating working capital accounts changed as follows from January 1, 2025 to December 31, 2025:\n\n  * Accounts receivable increased from $1,130,000 to $1,485,000  \n  * Inventory decreased from $910,000 to $780,000  \n  * Prepaid expenses increased from $150,000 to $205,000  \n  * Accounts payable increased from $760,000 to $940,000  \n  * Accrued expenses decreased from $320,000 to $260,000  \n  * Income taxes payable increased from $85,000 to $125,000  \n\n  Meridian began the year with $415,000 of cash. Apart from the equipment sale proceeds, it also paid $3,100,000 for new equipment, paid $525,000 in cash dividends, and repaid $400,000 of debt principal. There were no other cash flows. Management requires ending cash of exactly $300,000, and any shortfall will be funded with a revolver draw.\n\n* The Core Question:  \n  Using the indirect method to calculate cash flow from operations, what is the minimum revolver draw required to end the year with exactly $300,000 of cash? Round to the nearest dollar.", "answer": "$1,000,000", "feedback": "Verdict: Correct\n\nAnalysis: The student's final answer of $1,000,000 matches my independently derived result. Working internally: net income comes to $2,115,000 (including the $75,000 gain on equipment sale, net of all expenses and taxes). Adding back depreciation ($640,000) and amortization ($90,000), subtracting the non-operating gain ($75,000), and incorporating the net working capital change (\u2013$120,000) yields cash flow from operations of $2,650,000. Investing activities total \u2013$2,840,000 ($260,000 sale proceeds less $3,100,000 capex), and pre-revolver financing activities total \u2013$925,000 (dividends and debt repayment). Pre-revolver ending cash is $415,000 + $2,650,000 \u2013 $2,840,000 \u2013 $925,000 = \u2013$700,000. To reach the required $300,000 ending balance, the revolver draw must be exactly $1,000,000. The student correctly handled the two most common traps in this problem: removing the equipment-sale gain from CFO (placing the full $260,000 proceeds in investing) and netting all six working capital movements, including the income taxes payable increase.\n\nAmbiguities: None. The question explicitly specifies the indirect method, states the gain \"was included in accrual pre-tax income,\" confirms \"there were no other cash flows,\" and fixes the required ending cash at \"exactly $300,000,\" leaving no room for alternative interpretations.", "verdict": "Correct"}, {"entry_id": 26, "problem": "* Scenario:  \nAtlas Components is evaluating a new expansion project. Its current capital market data are as follows:\n\n  * Atlas has 25,000,000 common shares outstanding, trading at $40 per share.\n  * It has 500,000 bonds outstanding, each with $1,000 face value, currently quoted at 95% of face value.\n  * The risk-free rate is 3.00%, Atlas\u2019s equity beta is 1.20, and the expected market risk premium is 6.00%.\n  * Atlas\u2019s outstanding bonds currently have a yield to maturity of 6.50%.\n  * Last year, Atlas reported taxable income of $200,000,000 and paid corporate income taxes of $50,000,000.\n\nThe expansion project requires an upfront investment of $280,000,000 today and is expected to generate level annual free cash flow of $25,000,000 forever, starting one year from today. Use Atlas\u2019s WACC as the discount rate.\n\n* The Core Question:  \nWhat is the project\u2019s net present value, rounded to the nearest whole dollar?", "answer": "$14,631,710", "feedback": "Verdict: Correct\n\nAnalysis: The student's final answer of $14,631,710 matches my independently derived result exactly. Working through the components: the market value of equity ($1.0 billion) and debt ($475 million, using the 95% quote) yield capital structure weights of approximately 67.8% equity and 32.2% debt. The CAPM cost of equity is 10.20%, the effective tax rate from last year's data is 25%, giving an after-tax cost of debt of 4.875%. The resulting WACC is approximately 8.4852% (exactly 125.15625/1475). Valuing the level perpetuity of $25,000,000 at this rate gives a present value of approximately $294,631,710, and subtracting the $280,000,000 initial investment yields an NPV of $14,631,710 when rounded to the nearest whole dollar. The student correctly handled all the key conceptual steps: using market values (not book values) for weights, inferring the tax rate from the income statement data, applying the tax shield only to the cost of debt, and using the perpetuity formula.\n\nAmbiguities: The question is largely precise, but two minor points invite alternative interpretations: (1) \"Last year, Atlas reported taxable income of $200,000,000 and paid corporate income taxes of $50,000,000\" requires the solver to infer that the historical effective rate (25%) is the appropriate marginal tax rate going forward \u2014 this is a standard exam convention, but the question does not explicitly state to use this rate; (2) \"expected to generate level annual free cash flow of $25,000,000 forever\" implicitly assumes these are unlevered free cash flows consistent with WACC discounting, which is the intended reading but is not explicitly stated. Neither ambiguity affects the unique intended answer.", "verdict": "Correct"}, {"entry_id": 27, "problem": "* Scenario:  \nA company sells a non-core software license on January 1, 2026, for **$18,500,000** in cash. The license has a GAAP carrying value of **$6,200,000**, and the company pays **$300,000** of directly related closing costs. For GAAP purposes, the entire gain is recognized immediately in 2026.  \n\n  For tax purposes, the gain is reported in **equal annual installments** over the tax years **2026 through 2030**, inclusive. The applicable tax regime consists of a **21% federal tax rate** and a **6% state tax rate**, with state taxes deductible for federal tax purposes, so the combined effective tax rate must be derived accordingly.  \n\n  Under the acquisition agreement, the buyer starts with a gross equity purchase price of **$64,000,000** but deducts the full deferred tax liability dollar-for-dollar at closing.\n\n* The Core Question:  \nWhat is the **net closing equity purchase price after deducting the deferred tax liability**, rounded to the nearest whole dollar?", "answer": "**$61,528,960**", "feedback": "Verdict: Correct\n\nAnalysis: The student's final answer of **$61,528,960** matches my independently derived result exactly. Working backward from their figure, the implied chain of logic is sound: the realized gain is $12,000,000 (proceeds of $18,500,000 less carrying value of $6,200,000 less $300,000 closing costs); the combined effective tax rate, with state taxes deductible federally, is 6% + 21% \u00d7 (1 \u2212 0.06) = 25.74%; the 2026 installment ($2,400,000) is a current tax item, leaving $9,600,000 (installments for 2027\u20132030) as the deferred taxable amount; the DTL is therefore $9,600,000 \u00d7 25.74% = $2,471,040; and the net closing price is $64,000,000 \u2212 $2,471,040 = $61,528,960. All components \u2014 the gain calculation, the bonneted federal-state rate derivation, the deferred (vs. current) tax split, and the final subtraction \u2014 are consistent with the correct solution.\n\nAmbiguities: The phrase \"deducts the **full deferred tax liability** dollar-for-dollar at closing\" invites an alternative interpretation. Since the sale and the closing both occur on January 1, 2026, one could argue that at the moment of closing **all five** installments (including 2026's) remain unpaid, making the \"full\" DTL $12,000,000 \u00d7 25.74% = $3,088,800 and yielding $60,911,200. The conventional GAAP treatment \u2014 classifying the current-year installment as a current tax payable rather than a deferred liability \u2014 supports the student's answer, but the question would be more precise if it specified whether the 2026 installment should be treated as current tax expense or included in the deferred balance at closing.", "verdict": "Correct"}, {"entry_id": 28, "problem": "* Scenario: A manufacturer is performing an impairment review on a specialized packaging line as of year-end. The line\u2019s capitalized cost consists of a $1,600,000 purchase price, $250,000 of installation and freight, and a $110,000 capitalized safety retrofit. Accumulated depreciation recorded to date is $860,000.  \n\n  Management now expects to operate the line for three more years. Forecasts for those years are:\n\n  | Year | Units Sold | Selling Price per Unit | Variable Cash Cost per Unit | Line-Specific Annual Cash Maintenance |\n  |---|---:|---:|---:|---:|\n  | 1 | 52,000 | $28.00 | $17.00 | $180,000 |\n  | 2 | 48,000 | $27.00 | $18.00 | $175,000 |\n  | 3 | 42,000 | $26.00 | $18.50 | $160,000 |\n\n  At the end of Year 3, the line is expected to be sold for $210,000, with a broker commission equal to 5% of the selling price. Ignore taxes, discounting, interest expense, and allocated corporate overhead. For this impairment review, measure the asset\u2019s recoverable value using the undiscounted net cash generated from operations plus the expected net disposal amount.\n\n* The Core Question: What impairment loss, if any, should be recognized at year-end, rounded to the nearest whole dollar?", "answer": "$126,500", "feedback": "Verdict: Incorrect\n\nAnalysis: My independently derived impairment loss is **$96,500**. The carrying amount is $1,100,000 (total capitalized cost of $1,960,000 less accumulated depreciation of $860,000), and the undiscounted recoverable value is $1,003,500 (operating cash flows of $392,000 + $257,000 + $155,000 = $804,000, plus net disposal proceeds of $199,500 after the 5% commission). The student's answer of $126,500 is exactly $30,000 too high, implying their recoverable value was $973,500 instead of $1,003,500. The most likely cause is an arithmetic slip in the Year 3 contribution margin \u2014 computing 42,000 \u00d7 $7.50 as $285,000 rather than $315,000 (equivalent to using 38,000 units). Alternative errors (e.g., omitting the commission or a maintenance figure) do not produce a $30,000 discrepancy, so a Year 3 calculation error is the most plausible diagnosis.\n\nAmbiguities: The question is largely precise, but two phrasings could invite minor alternative readings: (1) \"measure the asset's recoverable value using the undiscounted net cash generated from operations plus the expected net disposal amount\" \u2014 this is a non-standard hybrid of US GAAP recoverability testing and IFRS terminology (\"recoverable value\"), though the instruction is explicit enough to follow mechanically; (2) \"Accumulated depreciation recorded to date is $860,000\" \u2014 it is implicitly assumed this applies against all three capitalized components ($1,960,000 total), which is the only reasonable reading but is not stated outright. Neither ambiguity explains the student's $30,000 error.", "verdict": "Incorrect"}, {"entry_id": 29, "problem": "* Scenario: A company sells surplus equipment for gross cash proceeds of $1,240,000. At closing, it pays a transaction fee equal to 2.5% of the gross proceeds and sets aside $9,000 for legal costs. The remaining cash is placed into a bank deposit on January 31. The deposit earns a nominal annual rate of 7.2%, with interest compounded monthly and credited at the end of each month. The deposit is held through July 31, with no withdrawals. At maturity, the company pays a 24% tax on the interest earned. It then uses the after-tax interest to make a required $33,000 vendor payment.\n\n* The Core Question: What is the company\u2019s cash surplus after making the vendor payment, rounded to the nearest whole dollar? If there is a shortfall, report it as a negative number.", "answer": "$328", "feedback": "Verdict: Correct\n\nAnalysis: The student's final answer of $328 matches my independently derived result. Working internally: the net deposit after the 2.5% fee ($31,000) and the $9,000 legal set-aside is $1,200,000; growing this at 0.6% per month for the six monthly compounding periods from January 31 to July 31 yields interest of approximately $43,853.22; after the 24% tax, after-tax interest is approximately $33,328.45; subtracting the $33,000 vendor payment leaves a surplus of approximately $328.45, which rounds to $328. The student correctly identified the deduction structure (fee on gross proceeds, fixed legal set-aside), the number of compounding periods (6), the tax applied only to interest, and the proper rounding convention.\n\nAmbiguities: \n1. \"sets aside $9,000 for legal costs\" \u2014 it is implied but not explicitly stated that this set-aside is removed from cash before the deposit is made; a student could conceivably argue the $9,000 remains as available cash, which would change the answer.\n2. \"The deposit is held through July 31\" with placement on \"January 31\" \u2014 the phrase \"held through\" could be misread as including a July-to-August period or as only 5 months if a student counts calendar months incorrectly; the intended reading (interest credited at the end of each of 6 monthly periods: February through July) is the natural one but not airtight.\n3. \"uses the after-tax interest to make a required $33,000 vendor payment\" \u2014 this implies the surplus/shortfall is measured against after-tax interest only (not touching principal), which the question relies on but states only implicitly. The student interpreted all of these as intended.", "verdict": "Correct"}, {"entry_id": 30, "problem": "* Scenario: A company is evaluating a one-year pilot project for a new accessory line. It expects to sell 12,500 units at $140 per unit. In addition, 40% of customers are expected to buy a maintenance package for $25 each. The project will require annual cash operating outflows of $44 per unit for materials, $18 per unit for labor, $210,000 for warehouse leasing, $160,000 for marketing, and $35,000 for insurance. To launch the project, the company must pay upfront cash costs of $390,000 for specialized machinery, $45,000 for delivery and installation, and $25,000 for project-specific software. Ignore taxes, depreciation, financing costs, and salvage value. The board requires the project\u2019s incremental cash flow to be at least $170,000.\n\n* The Core Question: Using the incremental cash flow definition `revenues - expenses - initial_cost`, what is the project\u2019s dollar spread versus the board\u2019s required minimum, calculated as incremental cash flow minus $170,000, rounded to the nearest whole dollar?", "answer": "-$15,000", "feedback": "Verdict: Incorrect\n\nAnalysis: The student's final answer of -$15,000 does not match my independently derived result of **+$65,000**. The correct incremental cash flow is $235,000 (total revenues of $1,875,000 \u2014 including both the $1,750,000 in unit sales and the $125,000 from the maintenance packages \u2014 less $1,180,000 in total expenses and $460,000 in initial costs), giving a spread of $235,000 \u2212 $170,000 = $65,000. The student's answer implies an incremental cash flow of $155,000, which is $80,000 below the correct figure. A likely source of this discrepancy is double-counting roughly $80,000 of costs \u2014 for example, subtracting the $45,000 delivery/installation and $35,000 insurance figures twice (once as part of grouped totals and again individually), or some similar misallocation of fixed/upfront costs. The student also correctly avoided the most common trap (omitting the $125,000 maintenance revenue), since that error alone would have produced -$60,000, not -$15,000. Regardless of the exact mechanism, the sign and magnitude are both wrong: the project actually exceeds the board's threshold rather than falling short of it.\n\nAmbiguities: The phrase \"incremental cash flow definition `revenues - expenses - initial_cost`\" is somewhat unconventional, as it nets a one-time upfront capital outlay directly against one year of operating cash flow rather than treating it as a Year 0 investment in an NPV framework. However, the question explicitly defines the formula to be used, so the calculation path is unambiguous. Additionally, \"40% of customers\" could in principle be read as distinct from \"40% of units sold,\" but with 12,500 units the standard interpretation (5,000 maintenance packages) is clearly intended. These do not excuse the student's numerical error.", "verdict": "Incorrect"}, {"entry_id": 31, "problem": "* Scenario: On April 4, 2025, a fund is evaluating whether to buy a single trade receivable. The receivable will be paid on October 1, 2025. The contractual amount due is based on a $2,375,000 invoice, reduced by a 2.0% rebate already earned by the debtor, plus a fixed $25,000 settlement fee payable at maturity. The fund discounts this counterparty\u2019s cash flows at the current OIS rate of 4.10% plus a counterparty spread of 90 basis points, using actual/365 annual compounding. Count calendar days from the valuation date to the payment date, excluding April 4 and including October 1. The receivable can be purchased today for $2,300,000 with no transaction costs.\n\n* The Core Question: Using the present-value function, what is the net dollar value impact of buying the receivable today, rounded to the nearest whole dollar? A positive value means the receivable is underpriced.", "answer": "-$3,428", "feedback": "Verdict: Correct\n\nAnalysis: The student's final answer of \u2212$3,428 matches my independently derived result. The maturity cash flow is $2,375,000 less the 2.0% rebate ($47,500) plus the $25,000 fee, giving $2,352,500. The day count from April 4 to October 1 (excluding the start date, including the end date) is 180 days. Discounting at the all-in rate of 5.00% (4.10% OIS + 90 bps) with actual/365 annual compounding yields a present value of approximately $2,296,572. Subtracting the $2,300,000 purchase price gives a net value of \u2212$3,428, indicating the receivable is overpriced. The student's number is exact to the dollar.\n\nAmbiguities: The phrase \"actual/365 annual compounding\" is mostly precise, but some practitioners might misread it as simple interest discounting (which would give a different result of roughly \u2212$3,500). The day-count instruction \"excluding April 4 and including October 1\" removes the usual ambiguity in counting days, which is helpful. Additionally, \"reduced by a 2.0% rebate already earned by the debtor\" could conceivably be misapplied to the total including the fee, though the natural reading (rebate applies to the invoice only) is the intended one.", "verdict": "Correct"}, {"entry_id": 32, "problem": "* Scenario: A company sells surplus equipment for $480,000. A broker takes a 2.5% transaction fee from the sale proceeds. From the remaining cash, the company immediately repays a $75,000 short-term note and sets aside $30,000 as a non-invested liquidity reserve. The rest is deposited into a money-market account on January 15, 2026. The account pays a 7.2% nominal annual rate, compounded monthly, with interest credited once per month on the 15th; the first credit occurs on February 15, 2026, and the final credit occurs on April 15, 2027. At withdrawal, the company pays a 21% tax on the compound interest earned only. The after-tax interest is then used to pay a $25,000 maintenance bill.\n\n* The Core Question: What is the net dollar surplus or shortfall after paying the maintenance bill, rounded to the nearest whole dollar? Report a surplus as positive and a shortfall as negative.", "answer": "$1,922", "feedback": "Verdict: Correct\n\nAnalysis: The student's final answer of $1,922 (surplus) matches my independently derived result. Working through the cash flows: the broker fee leaves 97.5% of the sale proceeds, then subtracting the note repayment and the liquidity reserve yields a deposit of $363,000. With interest credited monthly at 0.6% per month from February 15, 2026 through April 15, 2027, there are exactly 15 compounding periods. The compound interest earned comes to approximately $34,078.48, which after the 21% tax leaves about $26,922.00 in after-tax interest. Paying the $25,000 maintenance bill leaves a net surplus of approximately $1,922 when rounded to the nearest whole dollar. The student correctly handled the order of deductions (fee on gross proceeds, then note and reserve), the period count, the tax applied to interest only, and the sign convention.\n\nAmbiguities: The question is largely precise, but two phrasings invite minor interpretive risk: (1) \"the final credit occurs on April 15, 2027\" \u2014 a careless reader might count months from January to April (15 months) versus counting credit events from February to April inclusive; fortunately both interpretations yield 15 periods here, but the dual specification could confuse. (2) \"a 21% tax on the compound interest earned only\" \u2014 this is clear, though one could question whether \"interest earned\" means nominal credited interest (the intended reading) or some other basis. Neither ambiguity changes the answer under reasonable interpretations.", "verdict": "Correct"}, {"entry_id": 33, "problem": "* Scenario: On April 1, 2026, a company raises cash by selling 12,000 treasury shares at $58.75 per share. The underwriter deducts a 1.6% fee from the gross proceeds, and the company immediately sets aside $120,000 for working capital. The remaining cash is invested in a certificate of deposit that pays a 7.2% nominal annual rate, compounded monthly, and matures on October 1, 2027. Interest income is taxed at 21% when the investment matures. As an alternative, the company could have invested the same initial cash amount in a note paying 7.2% annual simple interest over the same period, with the same 21% tax treatment on interest.\n\n* The Core Question: What is the after-tax incremental dollar advantage of choosing the monthly compounded certificate of deposit instead of the simple-interest note, rounded to the nearest whole dollar?", "answer": "$2,569", "feedback": "Verdict: Partially Correct due to rounding or minor variations\n\nAnalysis: My independently derived result is **$2,578** (after-tax incremental advantage of the CD over the simple-interest note). The setup the student appears to have followed is correct: gross proceeds of $705,000, less the 1.6% underwriting fee ($11,280) yields $693,720, less the $120,000 working-capital set-aside leaves $573,720 invested for 18 months (April 1, 2026 \u2013 October 1, 2027). The CD grows at 0.6% per month for 18 months (factor \u2248 1.1136883), producing \u2248 $65,225 of interest, while the simple-interest note yields $573,720 \u00d7 7.2% \u00d7 1.5 = $61,961.76. The pre-tax difference is \u2248 $3,263.48, and applying the 79% after-tax retention gives \u2248 $2,578.15 \u2192 **$2,578**.\n\nThe student's answer of $2,569 is about $9 too low (a ~0.35% error). Since the principal, time period, simple-interest figure, and tax treatment all appear to have been handled correctly (otherwise the deviation would be far larger), the most likely culprit is **premature rounding/truncation of the monthly compounding factor (1.006)^18** \u2014 e.g., carrying it as approximately 1.11367 instead of 1.1136883 \u2014 before computing the interest differential. Small truncation in this factor gets amplified when multiplied by the $573,720 principal. The methodology appears sound; the final figure is off only due to intermediate-step precision.\n\nAmbiguities: The question is largely precise, but two phrasings could invite alternative interpretations:\n1. \"matures on October 1, 2027\" \u2014 the holding period could be counted in exact days (e.g., 548/365 years) rather than 18 whole months, which would change the simple-interest accrual; the conventional reading (18 months) is what both my solution and the student evidently used.\n2. \"7.2% annual simple interest over the same period\" \u2014 it is implied but not explicitly stated that the simple-interest accrual uses t = 1.5 years on the same principal; a day-count convention (actual/360 or actual/365) reading would yield a slightly different result.", "verdict": "Partially Correct due to rounding or minor variations"}, {"entry_id": 34, "problem": "* Scenario: A company holds a single customer receivable on its books at a carrying amount of **$2,425,000** as of the close of **March 15, 2026**. The customer has agreed to settle the receivable in one lump sum on **September 11, 2026**. The settlement amount equals the original invoice principal of **$2,400,000** plus a contractual late-payment fee of **2.5%** of that principal. Market participants value this receivable using an annual effective discount yield equal to the **1-year Treasury yield of 4.10%** plus a debtor-specific credit spread of **320 basis points**. Use an **ACT/365** day count, excluding the valuation date and including the payment date.\n\n* The Core Question: What is the dollar amount of the fair-value remeasurement **gain or loss** the company should recognize on March 15, 2026, rounded to the nearest whole dollar?", "answer": "**$49,009 loss**", "feedback": "Verdict: Correct\n\nAnalysis: The student's final answer matches my independently derived result. Working internally: the settlement cash flow is $2,400,000 \u00d7 1.025 = $2,460,000, the day count from March 16 through September 11, 2026 is 180 days, and the discount rate is 4.10% + 3.20% = 7.30% annual effective. Discounting the $2,460,000 at (1.073)^(180/365) yields a fair value of approximately $2,375,991, which compared to the $2,425,000 carrying amount produces a remeasurement loss of approximately $49,009 (my precise calculation gave $49,008.8, rounding to $49,009). The student correctly identified both the magnitude and the direction (loss). Their answer is exactly right under the effective annual compounding interpretation explicitly demanded by the question.\n\nAmbiguities: The phrase \"annual effective discount yield equal to the 1-year Treasury yield of 4.10% plus a debtor-specific credit spread of 320 basis points\" is mostly precise, but two minor points invite alternate readings: (1) a solver could mistakenly apply simple (non-compounded) discounting, i.e., PV = $2,460,000 / (1 + 0.073 \u00d7 180/365), yielding a loss of roughly $50,483 \u2014 the word \"effective\" rules this out, but careless readers may miss it; (2) the term \"discount yield\" could be confused with a bank-discount-basis rate (i.e., PV = FV \u00d7 (1 \u2212 d \u00d7 t)), which is a distinct money-market convention. The day-count instruction (\"excluding the valuation date and including the payment date\") is admirably unambiguous.", "verdict": "Correct"}, {"entry_id": 35, "problem": "* Scenario: A money-market fund buys a 1-year zero-coupon government note today for **$952.38 per $1,000 of face value** and will receive the full face value in exactly one year. Over the same one-year period, the economics team expects the CPI to rise from **300.0 to 309.0**. The fund allocates **$4,000,000** to this note. Its investment mandate requires a minimum real return of **1.25%** for the year. Use the Fisher approximation implemented as: real interest rate = nominal interest rate \u2212 inflation rate.\n* The Core Question: What is the fund\u2019s **dollar surplus real return above its mandate**, rounded to the nearest whole dollar?", "answer": "**$70,008**", "feedback": "Verdict: Incorrect\n\nAnalysis: My independently derived result is approximately **$30,000** (about $30,002\u2013$30,004 if one carries the exact yield implied by the $952.38 price rather than the clean 5.00%). The components are: nominal yield \u2248 5.00% (1,000 \u00f7 952.38 \u2212 1), inflation = 3.00% (309 \u00f7 300 \u2212 1), Fisher-approximate real return = 2.00%, surplus over the 1.25% mandate = 0.75%, and 0.75% \u00d7 $4,000,000 \u2248 $30,000. The student's answer of **$70,008** does not match. The most likely source of error: the student appears to have computed a surplus rate of ~1.75% instead of 0.75% \u2014 i.e., a subtraction slip in 2.00% \u2212 1.25% (a borrowing error yielding 1.75%), or equivalently subtracting only 3.25 percentage points from the nominal yield instead of the required 4.25 (3% inflation + 1.25% mandate). Applying 1.7502% (using the exact implied yield of ~5.0001%) to $4,000,000 produces almost exactly $70,008. The conceptual setup (Fisher approximation, dollar conversion on the $4M principal) appears intact, but the final subtraction is wrong, more than doubling the answer.\n\nAmbiguities: The phrase \"**dollar surplus real return above its mandate**\" leaves the dollar base slightly open to interpretation: it could be applied to the **$4,000,000** invested principal (the standard reading, \u2192 ~$30,000) or to the face value purchased (~$4,200,004 of face, \u2192 ~$31,500). Additionally, the price \"**$952.38 per $1,000 of face value**\" implies a yield of 5.0001%, not exactly 5.00%, which can shift the answer by a few dollars depending on rounding conventions ($30,000 vs. $30,002\u2013$30,004). The instruction to \"Use the Fisher approximation\" does, however, clearly rule out the exact Fisher relation (1.05/1.03 \u2212 1), removing one major potential ambiguity.", "verdict": "Incorrect"}, {"entry_id": 36, "problem": "* Scenario: On January 1, a pension fund buys a 1-year zero-coupon government bill for **$950,000**. The bill pays **$1,000,000** at maturity exactly one year later. The fund measures the bill\u2019s annual nominal return as the holding-period return: cash received minus purchase price, divided by purchase price. Over the same year, the relevant CPI basket is expected to rise from **250.0** to **260.0**. The pension fund requires a minimum approximate real interest gain equal to **1.10% of the original amount invested**.\n\n* The Core Question: Using the Fisher-effect approximation implemented by `calculate_real_interest_rate`, what is the dollar amount by which the investment\u2019s approximate real interest gain exceeds the required real gain, rounded to the nearest whole dollar?", "answer": "**$1,550**", "feedback": "Verdict: Correct\n\nAnalysis: The student's final answer matches my independently derived result. The holding-period nominal return is 5.2632% ($50,000 gain on $950,000), the expected inflation rate is 4.00% (CPI rising from 250.0 to 260.0), and the Fisher approximation yields a real rate of approximately 1.2632%. The excess over the required 1.10% is approximately 0.16316%, which applied to the original $950,000 investment gives exactly $1,550 when rounded to the nearest whole dollar. The student correctly applied the additive Fisher approximation (real \u2248 nominal \u2212 inflation), correctly computed inflation from the CPI levels, and correctly converted the percentage excess into a dollar amount based on the original invested principal.\n\nAmbiguities: The question is largely precise, but two phrasings invite minor alternative interpretations: (1) \"the Fisher-effect approximation implemented by `calculate_real_interest_rate`\" references a function whose exact implementation is not shown \u2014 a grader must assume it uses the standard subtraction approximation (nominal \u2212 inflation) rather than the exact Fisher relation ((1+n)/(1+i) \u2212 1), which would yield a real rate of ~1.2146% and a different excess (~$1,089); (2) \"1.10% of the original amount invested\" is clear that the dollar base is $950,000, but a careless reader might apply percentages to the $1,000,000 face value instead. Under the stated approximation and the $950,000 base, $1,550 is the unambiguous answer.", "verdict": "Correct"}, {"entry_id": 37, "problem": "* Scenario: An endowment is evaluating a one-year risk-free fixed-income investment. A benchmark one-year zero-coupon government security is currently priced at **$980,000** and will pay **$1,029,000** at maturity in exactly one year. Over the same one-year period, economists expect the CPI index to rise from **312.50** to **325.00**. The endowment uses the standard Fisher approximation for annual real returns and has a required real hurdle rate of **0.75%**. It plans to allocate **$20,000,000** at the same implied nominal annual return as the benchmark security.\n\n* The Core Question: What is the endowment\u2019s **one-year real dollar surplus above its hurdle rate**, rounded to the nearest whole dollar?", "answer": "**$50,000**", "feedback": "Verdict: Correct\n\nAnalysis: The student's final answer of $50,000 matches my independently derived result. The implied nominal return on the benchmark security is 5%, expected inflation from the CPI figures is 4%, and the Fisher approximation gives a real return of 1%. The excess over the 0.75% real hurdle rate is 0.25%, which applied to the $20,000,000 allocation yields exactly $50,000. The computation chain is internally consistent and the rounding instruction is trivially satisfied since the result is a whole number.\n\nAmbiguities: The phrase \"one-year real dollar surplus\" could invite an alternative interpretation: a student might deflate the nominal dollar surplus back into beginning-of-period purchasing power (i.e., dividing by 1.04), which would yield approximately $48,077. Additionally, although the question mandates the \"standard Fisher approximation,\" a student using the exact Fisher relation (1.05/1.04 \u2212 1 \u2248 0.9615%) would obtain a surplus of roughly $42,308, so the explicit instruction is essential to disambiguate. The phrase \"above its hurdle rate\" also assumes the hurdle is subtracted as a simple spread from the real return rather than compounded, though the simple-spread reading is the conventional one.", "verdict": "Correct"}, {"entry_id": 38, "problem": "* Scenario: A pension fund places **$8,000,000** into a one-year guaranteed investment contract. At maturity, the contract will pay **$8,400,000**. Over the same year, the CPI index is expected to rise from **250.0** to **257.5**. The pension fund\u2019s policy requires a minimum **real return of 1.40%** over the year.\n\n* The Core Question: What is the pension fund\u2019s **dollar surplus or shortfall relative to its required real return**, rounded to the nearest whole dollar?", "answer": "**$48,000 surplus**", "feedback": "Verdict: Incorrect\n\nAnalysis: The student's answer of **$48,000 surplus** does not match my independently derived result of **$44,640 surplus** (measured in year-end nominal dollars). The contract delivers a 5.00% nominal return, while inflation is 3.00% (257.5/250.0). Using the exact Fisher relation, the required nominal payoff is $8,000,000 \u00d7 (1.014)(1.03) = $8,355,360, leaving a surplus of $8,400,000 \u2212 $8,355,360 = **$44,640**. (Equivalently, in beginning-of-year real dollars, the surplus is $8,400,000/1.03 \u2212 $8,000,000 \u00d7 1.014 \u2248 $43,340.) The student's figure of $48,000 reveals a classic conceptual error: they used the **additive approximation** of the Fisher equation \u2014 real return \u2248 5% \u2212 3% = 2%, then (2% \u2212 1.4%) \u00d7 $8,000,000 = $48,000. This shortcut ignores the cross-product term (multiplicative compounding of the required real return with inflation), overstating the surplus by roughly $3,360. At this level of precision (\"rounded to the nearest whole dollar\"), the exact multiplicative method is clearly expected, so the approximation cannot be accepted.\n\nAmbiguities: The phrase \"**dollar surplus or shortfall relative to its required real return**\" is mildly ambiguous as to whether the surplus should be expressed in **year-end nominal dollars** ($44,640) or **beginning-of-year real (deflated) dollars** (\u2248 $43,340). The question would be more precise if it specified, e.g., \"the difference between the actual maturity payoff and the nominal payoff required to achieve the 1.40% real return.\" However, neither valid interpretation yields the student's $48,000, so the verdict is unaffected.", "verdict": "Incorrect"}, {"entry_id": 39, "problem": "* Scenario:  \n  Meridian Tools Inc. plans to fund a new expansion entirely by issuing common stock. The firm will sell 3,000,000 new shares and expects total gross proceeds, before any issuance expenses, of $150,000,000. Its investment bank will charge an underwriting spread equal to 4.0% of gross proceeds, and Meridian will also pay $1,800,000 in legal, registration, and listing fees.  \n\n  Meridian just paid an annual dividend of $2.50 per share. Management expects the firm to maintain a 40% earnings retention ratio and earn a 12.0% return on equity indefinitely, so dividends are expected to grow at the sustainable growth rate.  \n\n  The expansion is expected to earn an 11.10% annual return on the equity capital raised. Meridian\u2019s investment committee requires the expansion\u2019s expected return to exceed the cost of newly issued equity, including flotation costs, by at least 75 basis points.\n\n* The Core Question:  \n  By how many basis points does the expansion\u2019s expected return exceed Meridian\u2019s cost of newly issued equity, including flotation costs? Round to the nearest basis point, and state whether the project satisfies the 75-basis-point approval rule.", "answer": "77 basis points; Yes, it satisfies the approval rule.", "feedback": "Verdict: Correct\n\nAnalysis: The student's final answer matches my independently derived result. Working internally with a $50 share price (=$150M / 3M shares), total flotation costs of 5.2% of gross proceeds ($6M underwriting spread plus $1.8M in fees), a sustainable growth rate of 4.8% (0.40 \u00d7 12.0%), and an expected dividend D\u2081 of $2.62, the cost of newly issued equity comes to approximately 10.327%. The expansion's expected return of 11.10% therefore exceeds the flotation-adjusted cost of equity by approximately 77 basis points, which exceeds the 75-basis-point hurdle. The student's \"77 basis points; Yes\" answer is correct on both the quantitative result and the qualitative approval determination.\n\nAmbiguities: The phrase \"cost of newly issued equity, including flotation costs\" could in principle be handled two ways: (1) adjusting the net price in the dividend growth model (the approach implied here, dividing D\u2081 by net proceeds per share of $47.40), or (2) adjusting project cash flows for flotation costs instead \u2014 a method many corporate finance texts argue is more correct. Additionally, the question does not explicitly state whether the $1.8M in legal/registration/listing fees should be included in the per-share flotation adjustment alongside the underwriting spread, though including them (total 5.2%) is the natural reading and is what yields exactly 77 bps. If a student used only the 4.0% spread, they would obtain roughly 84 bps, so the question would benefit from explicitly stating that all issuance expenses count as flotation costs.", "verdict": "Correct"}, {"entry_id": 40, "problem": "* Scenario:  \nA commodity trading desk is evaluating an oil cash-and-carry opportunity on **January 2, 2026** for delivery on **July 1, 2026**. Use an **ACT/360** day-count convention and continuous compounding.\n\n  The desk can buy crude oil in the cash market at a quoted hub price of **$78.35 per barrel**. To make the barrels deliverable against the July forward contract, the desk must also pay immediately:\n  * pipeline tariff: **$1.15 per barrel**\n  * quality/location adjustment: **$0.50 per barrel**\n\n  Storage is charged continuously at **0.60% per year** of spot value, and insurance is charged continuously at **0.40% per year** of spot value.\n\n  The relevant risk-free rate must be inferred from a Treasury zero-coupon bill that matures on **July 1, 2026**, pays **$10,000,000** at maturity, and is priced today at **$9,753,099.12**.\n\n  A broker is currently quoting the July forward contract at **$83.24 per barrel**. The desk can transact **25,000 barrels** and faces no transaction costs, taxes, bid-ask spreads, or credit constraints.\n\n* The Core Question:  \nWhat is the desk\u2019s **net dollar arbitrage profit at maturity**, rounded to the nearest whole dollar?", "answer": "**$20,091**", "feedback": "Verdict: Correct\n\nAnalysis: The student's final answer of **$20,091** matches my independently derived result. Working internally: the day count from January 2 to July 1, 2026 is 180 actual days, giving T = 0.5 under ACT/360; the T-bill price implies a continuously compounded risk-free rate of exactly 5%; the all-in deliverable spot cost is $80.00 per barrel ($78.35 + $1.15 + $0.50); the combined continuous carry rate is 6% (5% financing + 0.60% storage + 0.40% insurance), producing a fair forward of 80 \u00d7 e^(0.03) \u2248 $82.4364. The broker's quote of $83.24 exceeds fair value, so the cash-and-carry yields \u2248 $0.8036 per barrel \u00d7 25,000 barrels \u2248 $20,090.93, which rounds to $20,091. The student executed every step correctly: the day count, the rate inference, the capitalization of the immediately-paid delivery costs into the spot leg, and the application of storage/insurance to the full adjusted spot value.\n\nAmbiguities: The phrase \"Storage is charged continuously at **0.60% per year** of spot value, and insurance is charged continuously at **0.40% per year** of spot value\" is slightly ambiguous: \"spot value\" could be read as the quoted hub price of $78.35 only, rather than the all-in deliverable cost of $80.00. Under the alternative reading (carry costs accruing only on $78.35, with the $1.65 in tariff/adjustment costs financed at the risk-free rate alone), the answer would be approximately $20,303. The standard cost-of-carry convention \u2014 and the answer the question clearly intends \u2014 treats the full $80.00 as the effective spot, which the student correctly applied.", "verdict": "Correct"}, {"entry_id": 41, "problem": "* Scenario: Today is April 1, and a forward contract on heating oil matures exactly 6 months from today. The exchange defines this maturity as 0.5 years. A refinery can buy 2,000 barrels of heating oil in the spot market today for a total cash price of $150,000. A Treasury zero-coupon instrument maturing on the same date as the forward costs $0.960000 today per $1.000000 paid at maturity. Over the 6-month holding period, warehouse and insurance charges are quoted as a continuously compounded cumulative carrying-charge factor of 1.015 on the oil\u2019s spot value. The market forward price for the same maturity is quoted at $81.00 per barrel. A trader can enter forward contracts on 120,000 barrels and can borrow/lend at the Treasury-implied continuously compounded rate.\n\n* The Core Question: Using the forward-pricing function, determine the cash-and-carry arbitrage profit at maturity in dollars, rounded to the nearest whole dollar.", "answer": "$204,375", "feedback": "Verdict: Correct\n\nAnalysis: The student's final answer of $204,375 matches my independently derived result exactly. The fair forward price per barrel comes out to $79.296875 (spot of $75 per barrel, grossed up by the Treasury-implied growth factor of 1/0.96 and the carrying-charge factor of 1.015). The market forward of $81.00 exceeds this, so the cash-and-carry arbitrage (buy spot with borrowed funds, pay carrying costs, sell forward) yields $1.703125 per barrel at maturity. Scaled to the 120,000-barrel position, the riskless profit at maturity is exactly $204,375 \u2014 no rounding discrepancy at all. The student correctly identified the direction of the arbitrage, applied the discount factor as a growth factor rather than discounting, incorporated the carrying-charge factor multiplicatively, and used the trader's position size (120,000 barrels) rather than the refinery's 2,000-barrel spot purchase, which is a common trap in this question.\n\nAmbiguities: \n1. \"a continuously compounded cumulative carrying-charge factor of 1.015\" \u2014 the phrase \"continuously compounded\" alongside a stated cumulative *factor* is potentially confusing. A student might interpret 1.015 as a rate (i.e., compute e^0.015\u00b7something or e^1.015\u00d70.5) rather than as the multiplicative factor itself. The intended reading is that the factor 1.015 is applied directly, but the wording invites misapplication.\n2. \"A refinery can buy 2,000 barrels... for a total cash price of $150,000\" vs. \"A trader can enter forward contracts on 120,000 barrels\" \u2014 the question mixes two actors and two quantities. The 2,000 barrels serves only to establish the $75 spot price, but a careless reader might compute the profit on 2,000 barrels (yielding $3,406.25) instead of 120,000.\n3. \"borrow/lend at the Treasury-implied continuously compounded rate\" \u2014 since the discount factor 0.96 is given directly, extracting and re-applying the continuous rate is unnecessary; the factor 1/0.96 suffices. The mention of continuous compounding could prompt students to compute r = \u2212ln(0.96)/0.5 and introduce rounding errors, though done correctly it yields the identical result.", "verdict": "Correct"}, {"entry_id": 42, "problem": "* Scenario: A pension fund holds **8,000 identical corporate bonds**. Each bond has a **$1,000 face value**, pays a **6.00% annual coupon**, and has exactly **3 years remaining** to maturity. Settlement occurs immediately after today\u2019s coupon payment, so the next coupon is due exactly one year from today and there is no accrued interest. The matched-maturity effective annual Treasury yield is **4.10%**, and the bond\u2019s issuer spread is **90 basis points**, with annual compounding. Compute the bond\u2019s Macaulay duration from its discounted cash flows, then compute modified duration using the derived annual yield. Immediately afterward, the issuer spread widens by **35 basis points** while the Treasury yield is unchanged. Use the first-order modified-duration approximation and ignore convexity.\n\n* The Core Question: What is the estimated **dollar change in the portfolio\u2019s market value**, rounded to the nearest dollar?", "answer": "**-$77,680**", "feedback": "Verdict: Correct\n\nAnalysis: The student's final answer of **-$77,680** matches my independently derived result. Working through it internally: the annual yield is the Treasury yield plus spread (4.10% + 0.90% = 5.00%); the bond prices to approximately $1,027.23; the Macaulay duration from discounted cash flows is approximately 2.8358 years; modified duration is approximately 2.7007; applying the first-order approximation \u0394P \u2248 -D_mod \u00d7 \u0394y \u00d7 P with \u0394y = 0.0035 gives roughly -$9.71 per bond, and scaling by 8,000 bonds yields approximately -$77,680 when rounded to the nearest dollar. The student's value is exact under the intended methodology.\n\nAmbiguities: Minor points only. The phrase \"Use the first-order modified-duration approximation\" is precise, but a student could conceivably reprice the bond exactly at the new 5.35% yield (which would give a slightly different number, around -$77,260), though the question explicitly forbids this by saying \"ignore convexity\" and mandating the first-order approximation. Additionally, \"the matched-maturity effective annual Treasury yield... and the bond's issuer spread is 90 basis points, with annual compounding\" is clear that spreads add directly to form a 5.00% annually compounded yield, but the construction \"with annual compounding\" attached to the spread clause could momentarily confuse a reader about whether any compounding-convention conversion is needed (it is not). These do not affect the intended unique answer.", "verdict": "Correct"}, {"entry_id": 43, "problem": "* Scenario:  \nAurum Components is reviewing its cash generation for the fiscal year ended December 31, 2025. All dollar figures below are in millions unless otherwise stated.\n\n  During 2025, Aurum reported:\n  - Revenue: $480.0  \n  - Cash cost of goods sold: $250.0  \n  - Cash SG&A expense: $74.0  \n\n  Depreciation and amortization are operating expenses but are not included in the cash cost figures above.\n\n  Fixed-asset and intangible-asset schedules show:\n  - Gross PP&E increased from $485.0 to $540.0, with no disposals or acquisitions of businesses.\n  - Accumulated depreciation increased from $170.0 to $196.0.\n  - Gross finite-lived intangible assets stayed constant at $120.0.\n  - Accumulated amortization increased from $50.0 to $56.0.\n\n  Operating working capital balances were:\n\n  | Item | Dec. 31, 2024 | Dec. 31, 2025 |\n  |---|---:|---:|\n  | Accounts receivable | $62.0 | $71.0 |\n  | Inventory | $88.0 | $96.0 |\n  | Prepaid operating expenses | $10.0 | $12.0 |\n  | Accounts payable | $52.0 | $58.0 |\n  | Accrued operating liabilities | $28.0 | $31.0 |\n\n  Working capital excludes cash, debt, and tax balances. Aurum\u2019s tax rate is based on a 21% federal rate and a 4% state/local rate, with state/local taxes deductible for federal tax purposes. Assume taxable operating income equals EBIT.\n\n  Aurum must make a scheduled debt principal repayment of $58.0 million at year-end. Its lender covenant requires the company to retain at least $3.5 million of cash after that repayment.\n\n* The Core Question:  \nWhat is Aurum\u2019s cash surplus or shortfall relative to the required post-repayment covenant cushion, rounded to the nearest dollar?", "answer": "**-$458,400 shortfall**", "feedback": "Verdict: Correct\n\nAnalysis: The student's final answer of a $458,400 shortfall matches my independently derived result exactly. Working internally through the problem: cash operating income, less the depreciation charge (derived from the change in accumulated depreciation) and amortization charge (from the change in accumulated amortization), yields EBIT; applying the combined tax rate with state taxes deductible federally (i.e., state rate plus federal rate on the post-state base, giving 24.16%) produces after-tax operating profit; adding back non-cash D&A, subtracting the net increase in operating working capital ($10.0 million use), and subtracting capital expenditures (the $55.0 million increase in gross PP&E, valid given no disposals) gives free cash flow of approximately $61.0416 million. After the $58.0 million principal repayment, remaining cash is about $3.0416 million versus the $3.5 million covenant requirement \u2014 a shortfall of $0.4584 million, i.e., $458,400. The student correctly handled the trickiest elements: the tax-on-tax deductibility (avoiding the naive 25% combined rate), deriving D&A from balance sheet rollforwards, and using gross PP&E change for capex.\n\nAmbiguities: The question contains a few points that invite alternative interpretations: (1) It does not state Aurum's beginning cash balance, so the solver must assume the covenant test is applied solely against cash generated during 2025 (effectively a zero opening cash assumption); a beginning balance would change the answer. (2) \"Aurum must make a scheduled debt principal repayment\" implies debt exists, yet no interest expense is given \u2014 the solver must assume interest is either zero or excluded, and that \"taxable operating income equals EBIT\" governs taxes despite presumable interest deductibility. (3) \"Rounded to the nearest dollar\" is slightly awkward given all figures are \"in millions unless otherwise stated,\" requiring the solver to convert $0.4584 million into $458,400.", "verdict": "Correct"}, {"entry_id": 44, "problem": "* Scenario:  \nTalos Components reports the following for the fiscal year ended December 31:\n\n  * Revenue: \\$875.0 million  \n  * Cost of goods sold: \\$514.0 million  \n  * SG&A expense: \\$146.5 million  \n  * Depreciation and amortization: \\$28.0 million  \n  * Interest expense: \\$15.5 million  \n  * Corporate tax rate: 24%  \n  * No other income, expenses, gains, or losses occurred.\n\n  The company also has 2.0 million shares of nonconvertible preferred stock outstanding for the full year. Each preferred share has a \\$25 par value and pays a 6.0% annual dividend.\n\n  At year-end, Talos has 58.0 million common shares issued, of which 11.2 million are held in treasury.\n\n  In addition, under a fully converted common-equivalent convention, the following securities are treated as creating additional common shares, with no assumed share repurchase from proceeds:\n\n  * 3.1 million restricted stock units, each converting into 1 common share  \n  * 2.4 million in-the-money warrants, each exercisable into 1 common share  \n  * 3.0 million in-the-money employee options, each exercisable into 1 common share  \n\n  An equity analyst assigns Talos a target valuation of 18.0\u00d7 fully diluted EPS. Talos\u2019s current market price is \\$39.50 per share. For both the target valuation and the current market value comparison, use the fully converted share count.\n\n* The Core Question:  \nWhat is Talos\u2019s total dollar valuation gap, defined as target equity value minus current fully converted market value, rounded to the nearest whole dollar?", "answer": "\\$100,930,000", "feedback": "Verdict: Correct\n\nAnalysis: The student's final answer of \\$100,930,000 matches my independently derived result exactly. Working through it internally: operating income flows down to a pre-tax income of \\$171.0 million, after-tax net income of \\$129.96 million, and net income available to common of \\$126.96 million after preferred dividends of \\$3.0 million (2.0M \u00d7 \\$25 \u00d7 6%). The fully converted share count is 55.3 million (46.8M outstanding after treasury, plus 3.1M RSUs, 2.4M warrants, and 3.0M options with no treasury-stock-method offset). Target equity value is 18.0 \u00d7 \\$126.96M = \\$2,285.28 million; current fully converted market value is \\$39.50 \u00d7 55.3M = \\$2,184.35 million. The gap is \\$100.93 million, i.e., \\$100,930,000. The student correctly handled the preferred dividend deduction, the treasury share subtraction, the \"no assumed repurchase\" convention, and applied the multiple to total earnings (equivalently, target price \u00d7 fully converted shares).\n\nAmbiguities: The question is largely well-specified, but two phrasings invite minor interpretation risk: (1) \"current fully converted market value\" \u2014 applying the current market price of \\$39.50 to the fully converted share count (55.3M) rather than to actual shares outstanding (46.8M) is mandated only by the clause \"For both the target valuation and the current market value comparison, use the fully converted share count,\" which a careless reader might miss, yielding a gap of \\$436.68 million instead. (2) \"with no assumed share repurchase from proceeds\" \u2014 this explicitly suspends the treasury stock method for warrants and options, but a student trained on standard diluted EPS conventions might instinctively apply TSM if exercise prices were inferred; the question prevents this by withholding exercise prices, so this is adequately controlled. Otherwise, the question is precise.", "verdict": "Correct"}, {"entry_id": 45, "problem": "* Scenario: Meridian Office Supply makes all sales on credit and uses an income-statement approach to estimate uncollectible accounts at year-end. For fiscal 2025, its accounting records show gross invoice sales of $20,000,000, sales returns of $520,000, sales allowances of $180,000, and sales discounts taken by customers of $300,000.  \n   \n  Meridian estimates the current-year uncollectible rate using the aggregate relationship between actual write-offs and net sales over the prior three fiscal years:\n\n  | Year | Gross Invoice Sales | Sales Returns | Sales Allowances | Sales Discounts | Actual Write-Offs |\n  |---|---:|---:|---:|---:|---:|\n  | 2022 | $15,000,000 | $300,000 | $100,000 | $100,000 | $217,500 |\n  | 2023 | $16,500,000 | $350,000 | $100,000 | $50,000 | $240,000 |\n  | 2024 | $18,000,000 | $400,000 | $150,000 | $50,000 | $261,000 |\n\n  Meridian\u2019s marginal tax rate is 25%. An equity analyst values the company using a 16.0\u00d7 multiple of after-tax net income. Assume this year-end estimate is the only adjustment being considered.\n\n* The Core Question: What is the decrease in Meridian\u2019s implied equity value due solely to the year-end uncollectible-account estimate, rounded to the nearest whole dollar?", "answer": "$3,420,000", "feedback": "Verdict: Correct\n\nAnalysis: The student's final answer of $3,420,000 matches my independently derived result exactly. The historical aggregate write-off rate computed from prior-year net sales (gross sales less returns, allowances, and discounts) works out to a clean 1.5%. Applied to 2025 net sales of $19,000,000, this yields a bad debt expense of $285,000. After-tax (at 25%, leaving 75% of the expense as the net income reduction), the income impact is $213,750, and multiplied by the 16.0\u00d7 valuation multiple, the implied equity value decrease is exactly $3,420,000. The student correctly used net sales (rather than gross sales) in both the historical rate calculation and the current-year application, correctly applied the tax shield, and correctly applied the multiple.\n\nAmbiguities: The phrase \"aggregate relationship between actual write-offs and net sales over the prior three fiscal years\" could conceivably be interpreted as the simple average of the three annual ratios rather than total write-offs divided by total net sales. However, the word \"aggregate\" strongly signals the pooled (sum-over-sum) approach, and in this problem the data are constructed such that the pooled rate (1.5%) is the intended figure \u2014 the year-by-year rates (1.5%, 1.5%, 1.5%) happen to be identical, so both interpretations converge and the ambiguity is harmless here. Additionally, \"income-statement approach\" is standard terminology (percentage-of-sales method) and is precise. The instruction \"this year-end estimate is the only adjustment being considered\" appropriately rules out any allowance-account true-up considerations.", "verdict": "Correct"}, {"entry_id": 46, "problem": "* Scenario: On 1 July 2026, an Australian bank floating-rate note resets its quarterly coupon. During the official BBSW observation window, the following annualized prime bank bill yields are recorded: 30-day bills at 4.22%, 60-day bills at 4.28%, 90-day bills at 4.35%, and 180-day bills at 4.41%. The bank\u2019s treasury policy requires a risk premium equal to 60% of the observed 1-year senior bank CDS-over-OIS spread plus a fixed domestic liquidity add-on. The CDS-over-OIS spread is 52 bps, and the liquidity add-on is 6 bps. The note pays a coupon of calculated BBSW plus a contractual margin of 120 bps on a face value of AUD 250,000,000. The coupon period is 92 days, using an Actual/365 day-count convention.\n\n* The Core Question: What is the cash coupon interest payment for this reset period, rounded to the nearest whole Australian dollar?", "answer": "AUD 3,709,616", "feedback": "Verdict: Incorrect\n\nAnalysis: The student's final figure of AUD 3,709,616 does not match my independently derived result of AUD 3,731,671. For a quarterly (\u22483-month) coupon reset, the relevant BBSW reference is the 90-day prime bank bill yield of 4.35%; the 30-day, 60-day, and 180-day quotes are distractors. Adding the treasury risk premium of 37.2 bps (60% \u00d7 52 bps + 6 bps) and the contractual margin of 120 bps yields an all-in coupon rate of 5.922%, which applied to AUD 250,000,000 over 92/365 days gives AUD 3,731,671. Reverse-engineering the student's answer reveals their implied all-in rate was 5.887%, i.e., they used 4.315% as the BBSW base \u2014 exactly the simple arithmetic average of all four quoted tenor yields (4.22 + 4.28 + 4.35 + 4.41)/4. The conceptual error is treating BBSW as an average across tenors during the observation window, rather than selecting the single tenor (90-day) matching the quarterly reset. The student did correctly compute the risk premium add-on, the margin, and the Actual/365 day-count fraction.\n\nAmbiguities: The question contains some genuinely ambiguous phrasing. First, \"a coupon of calculated BBSW plus a contractual margin of 120 bps\" \u2014 the word \"calculated\" invites the interpretation that BBSW must be derived from the listed yields (potentially via averaging or interpolation), rather than simply read off as the 90-day rate; the question never explicitly states which tenor applies. Second, it is not unambiguous whether the treasury policy risk premium (60% of CDS-over-OIS plus the liquidity add-on) forms part of the \"calculated BBSW\" coupon rate or is merely an internal pricing/valuation adjustment irrelevant to the contractual cash coupon \u2014 a strict reading of \"coupon of calculated BBSW plus a contractual margin of 120 bps\" could exclude it, yielding AUD 3,497,260 instead. Third, the 92-day period slightly exceeds the 90-day quote, which could invite linear interpolation between the 90-day and 180-day yields (giving \u22484.3513% and a marginally different answer). These ambiguities explain plausible alternative answers, but none of them supports averaging across all four tenors as the student did.", "verdict": "Incorrect"}, {"entry_id": 47, "problem": "* Scenario: On 2 July 2026, an AUD swap desk must set the benchmark floating rate for a 91-day interest period using its BBSW calculation policy. Four eligible bank bill transactions are observed. For each maturity, the bank bill rate equals the matched OIS rate plus the quoted bank-bill spread:\n\n  | Maturity | OIS rate, p.a. | Bank-bill spread |\n  |---|---:|---:|\n  | 30 days | 3.94% | 22 bps |\n  | 60 days | 3.98% | 26 bps |\n  | 90 days | 4.01% | 24 bps |\n  | 180 days | 4.05% | 28 bps |\n\n  The desk\u2019s additional market risk premium is defined as the difference between the A-rated bank CDS index and the AA-rated bank CDS index. The A-rated bank CDS index is 0.63% p.a., and the AA-rated bank CDS index is 0.45% p.a.\n\n  The calculated BBSW is then used in a 91-day AUD 80,000,000 receive-floating/pay-fixed swap settlement. The floating leg pays calculated BBSW plus 12 bps. The fixed leg pays 4.60% p.a. Interest uses ACT/365 day count. Rates must be used as decimals in the calculation.\n\n* The Core Question: What is the net dollar cash flow to the receive-floating swap desk for the 91-day period, rounded to the nearest whole dollar? Use a negative sign if the desk must pay.", "answer": "-$10,970", "feedback": "Verdict: Correct\n\nAnalysis: The student's final answer of -$10,970 matches my independently derived result. The methodology implied by the question is: (1) compute the four bank bill rates as OIS + spread (4.16%, 4.24%, 4.25%, 4.33%), (2) average the four eligible transactions to get 4.245%, (3) add the market risk premium of 0.18% (A-rated CDS 0.63% minus AA-rated CDS 0.45%) to arrive at a calculated BBSW of 4.425%, (4) set the floating leg at BBSW + 12 bps = 4.545% versus the fixed leg at 4.60%, and (5) compute the net settlement as the rate differential of -0.055% applied to AUD 80,000,000 \u00d7 91/365 \u2248 AUD 19,945,205.48, yielding -$10,969.86, which rounds to -$10,970. The sign is also correct: the receive-floating desk receives less than it pays fixed, so it makes a net payment.\n\nAmbiguities: The question states \"Four eligible bank bill transactions are observed\" but never explicitly specifies how the desk's \"BBSW calculation policy\" aggregates them into a single 91-day benchmark. At least three defensible interpretations exist: (a) a simple average of all four transaction rates (yielding -$10,970, the apparent intended answer); (b) using only the 90-day rate as the nearest tenor to the 91-day period (BBSW = 4.43%, net \u2248 -$9,973); or (c) linear interpolation between the 90-day and 180-day rates for the 91-day point (net \u2248 -$9,795). The phrase \"the benchmark floating rate for a 91-day interest period\" arguably invites tenor-matching or interpolation rather than averaging, so the question should explicitly state that the policy averages all eligible transactions. Additionally, \"Rates must be used as decimals\" is precise, but the question could clarify whether the risk premium is added before or after any tenor selection \u2014 though here the result is unaffected by that ordering.", "verdict": "Correct"}, {"entry_id": 48, "problem": "* Scenario: A manufacturer is being valued after its fiscal year ended December 31, 2025. All figures below are in millions of dollars unless stated otherwise.\n\n  During 2025, the company reported:\n  * Net sales: 125.0  \n  * Cash cost of goods sold, excluding depreciation: 66.4  \n  * Cash SG&A expense, excluding depreciation: 18.6  \n  * No amortization, no asset impairments, no non-operating income or expense, and no gains or losses on asset sales.\n\n  Its property, plant, and equipment records show:\n  * Gross PP&E on January 1, 2025: 82.0  \n  * Gross PP&E on December 31, 2025: 101.0  \n  * Accumulated depreciation on January 1, 2025: 23.0  \n  * Accumulated depreciation on December 31, 2025: 30.5  \n  * There were no PP&E disposals, no acquisitions of other companies, and all PP&E additions were paid in cash.\n\n  The tax authority charges $1 of tax for every $4 of operating taxable income.\n\n  Operating working capital balances were:\n\n  | Account | Jan. 1, 2025 | Dec. 31, 2025 |\n  |---|---:|---:|\n  | Accounts receivable | 14.2 | 16.8 |\n  | Inventory | 18.1 | 20.7 |\n  | Operating prepaids | 1.0 | 1.3 |\n  | Accounts payable | 12.4 | 13.6 |\n  | Accrued operating liabilities | 5.5 | 6.1 |\n\n  Cash, short-term investments, taxes payable, and all debt balances are excluded from operating working capital.\n\n  Investment bankers value the firm as a growing perpetuity, using next-12-month normalized unlevered free cash flow equal to the 2025 amount. The WACC is 8.5%, and the perpetual growth rate is 3.0%. A buyer has offered an enterprise value of $180.0 million.\n\n* The Core Question: By how many dollars does the buyer\u2019s offer price exceed the intrinsic enterprise value implied by these assumptions? Round to the nearest whole dollar.", "answer": "$13,181,818", "feedback": "Verdict: Correct\n\nAnalysis: The student's final answer matches my independently derived result. Working through the problem internally: depreciation expense is derived from the change in accumulated depreciation (7.5), EBIT comes out to 32.5, and applying the 25% tax rate ($1 per $4) gives NOPAT of 24.375. Adding back depreciation, subtracting capital expenditures (the 19.0 increase in gross PP&E, valid since there were no disposals), and subtracting the 3.7 increase in operating working capital yields unlevered free cash flow of 9.175. Capitalizing this as a growing perpetuity at (8.5% \u2212 3.0%) = 5.5% gives an intrinsic enterprise value of approximately 166.818 million. The buyer's offer of 180.0 million exceeds this by approximately 13.1818 million, which rounds to $13,181,818 \u2014 exactly the student's answer. The student correctly handled the key traps: using the change in accumulated depreciation rather than guessing depreciation, computing capex from gross PP&E changes, signing the working capital change correctly, and not applying an extra year of growth to the numerator (since the question specifies next-12-month FCF equals the 2025 amount).\n\nAmbiguities: The phrase \"using next-12-month normalized unlevered free cash flow equal to the 2025 amount\" could conceivably tempt a reader to grow the 2025 FCF by (1 + g) before capitalizing, but the explicit statement that NTM FCF \"equal[s] the 2025 amount\" resolves this \u2014 the numerator should be 9.175 with no growth adjustment. Additionally, \"Round to the nearest whole dollar\" requires the solver to convert from millions to dollars, which is slightly unusual but unambiguous once noticed. Otherwise, the question is precise.", "verdict": "Correct"}, {"entry_id": 49, "problem": "* Scenario: On January 15, a commodities trading desk evaluates a cash-and-carry trade in gold maturing on October 15 of the same year, which this market treats as exactly 9 months. Spot gold is quoted at $2,079.50 bid / $2,080.50 ask per ounce. A default-free zero-coupon Treasury maturing on October 15 is priced at $970.4455335 per $1,000 face value. Gold storage costs are 0.80% per year and insurance costs are 0.40% per year, both quoted as continuously compounded annual rates proportional to the spot value. The October 15 forward market is quoted at $2,172.00 bid / $2,174.00 ask per ounce. The desk can trade up to 5,000 ounces, can borrow or lend at the Treasury-implied continuously compounded rate, and faces no other transaction costs or margin requirements.\n\n* The Core Question: If the desk executes the maximum profitable arbitrage available, what is the net dollar arbitrage profit at maturity, rounded to the nearest whole dollar?", "answer": "$43,786", "feedback": "Verdict: Partially Correct due to rounding or minor variations\n\nAnalysis: My independent solution proceeds as follows: the Treasury price implies a continuously compounded annual rate of exactly 4.00% (the discount factor over 9 months equals e^(\u22120.03)). The total continuous cost of carry is 4.00% + 0.80% + 0.40% = 5.20% per annum. The cash-and-carry arbitrage requires buying spot gold at the ask ($2,080.50), financing and carrying it for 0.75 years at 5.20%, giving a total cost at maturity of $2,080.50 \u00d7 e^(0.039) \u2248 $2,163.2425 per ounce, and simultaneously selling forward at the bid ($2,172.00). The profit per ounce is approximately $8.7575, and on the maximum 5,000 ounces this yields $43,787.56, which rounds to **$43,788**. The student's answer of $43,786 differs by roughly $1.50\u2013$2.00, a discrepancy of about 0.004%. This is almost certainly the result of rounding intermediate values (e.g., truncating e^(0.039) or the per-ounce carrying cost to too few decimal places before multiplying by 5,000 ounces, which amplifies small rounding errors). The student's methodology \u2014 identifying the correct arbitrage direction (cash-and-carry, since the forward bid exceeds fair value), using the correct bid/ask sides, the correct implied rate, and the full carry rate \u2014 appears sound, as no plausible conceptual error (e.g., wrong bid/ask side, omitting insurance, simple instead of continuous compounding) produces a number this close to the true answer.\n\nAmbiguities: The question is largely precise, but two phrasings invite minor interpretive variation: (1) \"storage costs are 0.80% per year and insurance costs are 0.40% per year, both quoted as continuously compounded annual rates proportional to the spot value\" \u2014 this is the standard convention implying a total carry exponent of (r + u)T, but a student could conceivably interpret carry costs as accruing on spot and paid separately (lump sum at maturity) rather than compounding within the exponent, which would alter the final figure; (2) \"maturing on October 15 of the same year, which this market treats as exactly 9 months\" \u2014 this clearly fixes T = 0.75, but a student using actual day counts (Jan 15 to Oct 15 = 273/365) would obtain a slightly different rate and forward cost. Neither ambiguity explains the student's specific $43,786, which points instead to intermediate rounding.", "verdict": "Partially Correct due to rounding or minor variations"}, {"entry_id": 50, "problem": "* Scenario: An Australian corporate borrower is choosing between a 91-day floating-rate AUD facility and a 91-day fixed-rate AUD facility on a principal of A$80,000,000.  \n  At the reset date, the RBA cash rate is 4.10% p.a. The eligible bank-accepted bill quotes are expressed as spreads over the cash rate:\n\n  | Bill maturity | Spread over cash |\n  |---|---:|\n  | 30 days | 10 bps |\n  | 60 days | 14 bps |\n  | 90 days | 17 bps |\n  | 180 days | 21 bps |\n\n  The bank-sector risk premium is inferred from the difference between an unsecured major-bank CDS quote of 53 bps and a Commonwealth reference CDS quote of 36 bps.\n\n  The floating facility\u2019s all-in annual rate equals the constructed BBSW benchmark plus a 75 bps lending margin. The fixed-rate alternative is quoted at 5.30% p.a. All interest is simple interest on an actual/365 basis. Do not round intermediate rates.\n\n* The Core Question: What is the net dollar interest saving from choosing the floating-rate facility instead of the fixed-rate facility over the 91-day term, rounded to the nearest whole Australian dollar?", "answer": "A$24,932", "feedback": "Verdict: Incorrect\n\nAnalysis: My independently derived result does not match the student's submission. The correct construction takes the cash rate (4.10%), adds the term-appropriate bill spread \u2014 the 90-day quote of 17 bps (or a 91-day interpolated value of \u224817.04 bps) \u2014 plus the bank-sector risk premium of 17 bps (53 \u2212 36), giving a constructed BBSW of 4.44%. Adding the 75 bps lending margin yields a floating all-in rate of 5.19% p.a., versus the fixed 5.30% p.a., for an annual saving of 11 bps. The dollar saving is A$80,000,000 \u00d7 0.0011 \u00d7 91/365 \u2248 **A$21,940** (or \u2248A$21,851 if the 91-day spread is linearly interpolated). The student's figure of A$24,932 implies an annual rate saving of exactly 12.5 bps, which corresponds to a floating all-in rate of 5.175% and a BBSW of 4.425%. This reverse-engineers precisely to using the *average of all four bill spreads* \u2014 (10 + 14 + 17 + 21)/4 = 15.5 bps \u2014 instead of selecting the 90-day spread relevant to the 91-day facility. This is a conceptual error: BBSW for a given tenor is constructed from bills of the matching maturity, not an average across the entire spread curve. The arithmetic downstream of that error (adding the 17 bps risk premium, the 75 bps margin, and applying 91/365 day count on A$80m) was executed correctly, but the benchmark construction was wrong.\n\nAmbiguities: The question states the facility is \"91-day\" while the bill quotes are given for 30, 60, 90, and 180 days, without specifying whether the borrower should use the 90-day quote directly or linearly interpolate between 90 and 180 days for a 91-day rate \u2014 this permits two slightly different defensible answers (\u2248A$21,940 vs \u2248A$21,851). Additionally, the phrase \"the constructed BBSW benchmark\" does not explicitly state how the bank-sector risk premium enters the construction (added to the cash-plus-spread rate, or already embedded in the bill quotes), which invites alternative interpretations. However, neither ambiguity supports averaging all four spreads, so the student's answer remains incorrect under any reasonable reading.", "verdict": "Incorrect"}, {"entry_id": 51, "problem": "* Scenario: A manufacturing firm is preparing its fiscal-year 2025 FCFF covenant test. All figures below are in millions of dollars unless stated otherwise. Revenue was $128.400. Cash cost of goods sold was $73.250, cash SG&A was $18.600, and cash R&D was $5.100; these cash operating costs exclude depreciation. Accumulated depreciation increased from $46.200 at the start of the year to $53.700 at year-end, with no asset disposals or impairments. During the year, the firm purchased $14.800 of production equipment and acquired a $2.400 operating patent; for FCFF purposes, treat these as long-term investments, with no other long-lived operating asset purchases or sales.  \n   \n  The firm pays a 6% state corporate tax, and state taxes are deductible for federal tax purposes; the federal corporate tax rate is 21%. Operating working capital excludes cash, marketable securities, short-term debt, and current maturities of long-term debt. Operating current asset balances were: accounts receivable $12.100 to $14.800, inventory $16.400 to $15.500, and prepaid expenses $1.600 to $2.000. Operating current liability balances were: accounts payable $9.300 to $10.700, accrued payroll/taxes $3.800 to $4.100, and unearned revenue $0.800 to $0.500.  \n   \n  The lender\u2019s FCFF covenant requires FCFF of at least $7.500 million for the year.\n\n* The Core Question: Using FCFF = EBIT \u00d7 (1 \u2212 tax rate) + depreciation \u2212 long-term investments \u2212 investment in working capital, what is the firm\u2019s excess FCFF over the covenant requirement, computed as FCFF minus $7.500 million, rounded to the nearest whole dollar?", "answer": "-$214,730", "feedback": "Verdict: Correct\n\nAnalysis: The student's final answer of \u2212$214,730 matches my independently derived result exactly. Working internally: cash operating costs total $96.950M, yielding EBITDA of $31.450M; depreciation is the $7.500M increase in accumulated depreciation (no disposals), giving EBIT of $23.950M. The combined effective tax rate, accounting for state tax deductibility at the federal level, is 6% + 21%(1 \u2212 6%) = 25.74%, so after-tax EBIT is $17.78527M. Long-term investments are $17.200M ($14.800M equipment + $2.400M patent). The investment in operating working capital is $0.800M (operating current assets rose $2.200M; operating current liabilities rose $1.400M). FCFF = 17.78527 + 7.500 \u2212 17.200 \u2212 0.800 = $7.28527M, which falls short of the $7.500M covenant by $0.21473M, i.e., \u2212$214,730 when expressed to the nearest whole dollar. The student correctly handled the two subtlest elements: the layered state/federal tax structure (rather than naively adding 6% + 21% = 27%, which would have produced a different shortfall) and the inclusion of the patent acquisition as a long-term investment.\n\nAmbiguities: The question is largely precise, but two phrasings invite minor interpretive risk: (1) \"rounded to the nearest whole dollar\" requires the solver to convert from millions to dollars, which could trip up a student who reports \u2212$0.215M or \u2212$214,730.00 in millions-based units inconsistently; the question would be cleaner stating \"express your answer in dollars, not millions.\" (2) \"state taxes are deductible for federal tax purposes\" correctly implies the effective rate formula t = t_s + t_f(1 \u2212 t_s), but a less careful reader might simply sum the rates to 27%; the question is technically precise here, though the layered computation is left implicit rather than spelled out.", "verdict": "Correct"}, {"entry_id": 52, "problem": "* Scenario:  \nOrion Components is be
