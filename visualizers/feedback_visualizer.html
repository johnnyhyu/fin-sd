ing valued at the end of fiscal year 2025. During 2025, it sold 120,000 units at $250 per unit. Its cash manufacturing costs, excluding depreciation, were $14,400,000, and its cash SG&A expenses were $5,100,000.  \n\n  Orion\u2019s only depreciable assets at the start of 2025 had an original cost of $12,000,000, zero salvage value, and an 8-year straight-line depreciable life. No assets were sold during the year. During 2025, Orion paid $3,800,000 in cash for new long-term production equipment.  \n\n  The combined corporate tax rate applicable to operating income is 24%.  \n\n  Operating working capital balances were as follows:\n\n  | Item | Dec. 31, 2024 | Dec. 31, 2025 |\n  |---|---:|---:|\n  | Accounts receivable | $2,800,000 | $3,200,000 |\n  | Inventory | $3,400,000 | $3,900,000 |\n  | Accounts payable | $1,900,000 | $2,100,000 |\n  | Accrued operating expenses | $700,000 | $800,000 |\n\n  A buyer values Orion at 11.5 times its 2025 free cash flow to the firm. Orion has $22,000,000 of debt outstanding and no excess cash.\n\n* The Core Question:  \nUsing FCFF = EBIT \u00d7 (1 \u2212 Tax Rate) + Depreciation \u2212 Long-Term Investments \u2212 Investment in Working Capital, what is Orion\u2019s implied equity value, rounded to the nearest whole dollar?", "answer": "$23,310,000", "feedback": "Verdict: Correct\n\nAnalysis: The student's final answer of $23,310,000 matches my independently derived result exactly. Working through it internally: revenue of $30,000,000 less cash manufacturing costs ($14,400,000), cash SG&A ($5,100,000), and depreciation ($1,500,000 on the 8-year straight-line schedule) yields EBIT of $9,000,000. After-tax EBIT at 24% is $6,840,000; adding back depreciation ($1,500,000), subtracting capital expenditures ($3,800,000), and subtracting the working capital investment ($600,000 \u2014 increases in receivables and inventory of $400,000 and $500,000, offset by increases in payables of $200,000 and accruals of $100,000) gives FCFF of $3,940,000. Applying the 11.5\u00d7 multiple produces an enterprise value of $45,310,000, and subtracting the $22,000,000 of debt (with no excess cash to add back) yields an implied equity value of $23,310,000. The student handled every component correctly, including the often-missed signs on the working capital changes and the proper treatment of depreciation (subtracted to compute EBIT, then added back).\n\nAmbiguities: The question is largely precise, but two minor points merit note: (1) \"Orion's only depreciable assets at the start of 2025\" combined with the $3,800,000 equipment purchase could invite a student to depreciate the new equipment for a partial year; however, no in-service date or depreciation convention for the new asset is given, so the intended reading is that 2025 depreciation derives solely from the existing assets. (2) \"Long-Term Investments\" in the prescribed formula is non-standard phrasing for capital expenditures, though the scenario's \"$3,800,000 in cash for new long-term production equipment\" makes the mapping clear. Neither ambiguity affected this student's correct outcome.", "verdict": "Correct"}, {"entry_id": 53, "problem": "* Scenario: A specialty finance fund is evaluating the purchase of a distressed receivables portfolio. The seller requires a purchase price of **$9,700,000**, paid today. The fund would also pay **$150,000** in legal and closing costs today.  \n  All portfolio cash flows occur at the **end of each year**, and taxes are ignored.\n\n  Expected annual portfolio results are:\n\n  | Year | Gross Collections | Other Receipts | Servicing / Legal Costs |\n  |---:|---:|---:|---:|\n  | 1 | $4,800,000 | $0 | $1,200,000 |\n  | 2 | $5,500,000 | $0 | $1,100,000 |\n  | 3 | $4,000,000 | $900,000 residual collateral sale | $700,000 |\n\n  The fund is all-equity financed. The risk-free rate is **2.5%**, the expected return on the broad equity market is **7.5%**, and the portfolio\u2019s beta is estimated at **1.50**.\n\n* The Core Question: What is the **net dollar value created today** by purchasing the portfolio after subtracting the purchase price and closing costs, rounded to the nearest whole dollar?", "answer": "**$214,613**", "feedback": "Verdict: Correct\n\nAnalysis: The student's final answer of $214,613 matches my independently derived result exactly. Using CAPM, the discount rate is 2.5% + 1.50 \u00d7 (7.5% \u2212 2.5%) = 10%. The net annual cash flows are $3,600,000 (Year 1), $4,400,000 (Year 2), and $4,200,000 (Year 3, including the $900,000 residual collateral sale). Discounting these at 10% yields a present value of approximately $10,064,613, and subtracting the total initial outlay of $9,850,000 (purchase price plus closing costs) gives an NPV of $214,613 when rounded to the nearest whole dollar. The student correctly applied CAPM, properly netted the cash flows including the residual sale, included the closing costs in the initial outlay, and rounded appropriately.\n\nAmbiguities: The phrasing \"the expected return on the broad equity market is **7.5%**\" could conceivably be misread as the market *risk premium* rather than the total market return; a student making that error would use a discount rate of 2.5% + 1.5 \u00d7 7.5% = 13.75% and arrive at a different answer. However, the standard interpretation (market return of 7.5%, implying a 5% premium) is the most natural reading, and the student followed it correctly. Additionally, \"$900,000 residual collateral sale\" under \"Other Receipts\" is clearly a cash inflow, though one might question whether it is taxable or net of disposal costs \u2014 the question's instruction to ignore taxes resolves this adequately.", "verdict": "Correct"}, {"entry_id": 54, "problem": "* Scenario: A firm plans to issue new common stock. The investment bank estimates the offering will raise total gross proceeds of $60,000,000 from selling 1,200,000 shares. Underwriting fees will be $2.50 per share, and legal/registration costs will be $1.50 per share. The firm just paid an annual dividend of $2.30 per share. Going forward, management expects to maintain a 50% earnings retention ratio, and analysts estimate the firm\u2019s sustainable return on equity will be 12% per year. The firm\u2019s board has set a maximum acceptable cost of new equity of 11.00%.\n\n* The Core Question: Using the dividend growth model with flotation costs, by how many basis points does the firm\u2019s cost of new equity exceed the board\u2019s 11.00% maximum, rounded to the nearest whole basis point?", "answer": "30 basis points", "feedback": "Verdict: Correct\n\nAnalysis: The student's final answer of 30 basis points matches my independently derived result exactly. Working from the offering data, the gross price per share is $50 ($60,000,000 \u00f7 1,200,000 shares), and total flotation costs are $4.00 per share ($2.50 underwriting + $1.50 legal/registration), yielding net proceeds of $46.00 per share. The sustainable growth rate is 6% (50% retention \u00d7 12% ROE), making the expected dividend D\u2081 = $2.30 \u00d7 1.06 = $2.438. The cost of new equity is then $2.438/$46.00 + 6% = 5.30% + 6.00% = 11.30%. The notable feature of this problem is that the dividend yield component works out to exactly 5.30% (since 2.438/46 = 0.0530 precisely), so no rounding ambiguity arises. The excess over the board's 11.00% ceiling is exactly 30 basis points. The student correctly applied the constant-growth DDM adjusted for flotation costs (using net price in the denominator), correctly grew the dividend by one period, and correctly computed the sustainable growth rate.\n\nAmbiguities: The phrase \"just paid an annual dividend of $2.30 per share\" clearly establishes D\u2080, requiring growth to D\u2081 in the model; however, a careless reader could misinterpret it as D\u2081 and compute r = 2.30/46 + 6% = 11.00%, which would yield 0 basis points of excess. Additionally, the question relies on the convention that flotation costs are deducted from the share price in the denominator (net proceeds approach) rather than the alternative \"flotation cost adjustment to initial outlay\" method sometimes taught in corporate finance; the phrase \"dividend growth model with flotation costs\" reasonably signals the net-proceeds approach, but the alternative convention exists in some textbooks. Neither ambiguity affected this student's answer.", "verdict": "Correct"}, {"entry_id": 55, "problem": "* Scenario:  \nA manufacturing company has just completed fiscal year 2025. Its income statement and balance-sheet notes report the following, all in millions of dollars unless stated otherwise:\n\n  * Revenue was $950.0.\n  * Cash production costs, excluding depreciation, were $520.0.\n  * Cash SG&A expenses, excluding amortization, were $180.0.\n  * The company\u2019s combined statutory tax rate on operating income is 25%.\n  * Gross PP&E was $600.0 at the beginning of the year and $662.0 at year-end. During the year, fully depreciated equipment with an original cost of $18.0 was retired.\n  * Accumulated depreciation was $250.0 at the beginning of the year and $280.0 at year-end.\n  * Accumulated amortization on acquired intangibles was $60.0 at the beginning of the year and $72.0 at year-end, with no intangible disposals or impairments.\n  * Operating working-capital accounts were:\n\n    | Account | Beginning of Year | End of Year |\n    |---|---:|---:|\n    | Accounts receivable | $108.0 | $126.0 |\n    | Inventory | $142.0 | $150.0 |\n    | Prepaid operating expenses | $10.0 | $8.0 |\n    | Accounts payable | $95.0 | $102.0 |\n    | Accrued operating expenses | $35.0 | $30.0 |\n    | Deferred revenue | $20.0 | $28.0 |\n\nManagement values the company using a single-stage free-cash-flow-to-firm model. Next year\u2019s free cash flow is assumed to equal fiscal-year 2025 free cash flow grown by 4%. The WACC is 9%. The company\u2019s current market enterprise value is $2,200.0 million.\n\n* The Core Question:  \nUsing free cash flow derived from EBIT, by how many millions of dollars is the company undervalued relative to its current market enterprise value? Round to the nearest $0.1 million.", "answer": "$56.8 million undervalued", "feedback": "Verdict: Correct\n\nAnalysis: The student's final answer of $56.8 million undervalued matches my independently derived result exactly. Working internally through the problem: depreciation expense must be inferred from the accumulated depreciation roll-forward adjusted for the retirement of fully depreciated equipment, capital expenditures must be inferred from the gross PP&E roll-forward adjusted for the same retirement, amortization comes from the change in accumulated amortization, and the change in operating working capital nets to a use of cash. These yield an EBIT-based FCFF for FY2025, which, grown at 4% and capitalized at the WACC-minus-growth spread of 5%, produces an intrinsic enterprise value of $2,256.8 million. Comparing against the $2,200.0 million market enterprise value gives an undervaluation of exactly $56.8 million. The student correctly handled the two most common traps in this problem: (1) failing to add back the $18.0 retirement when deriving both depreciation expense and capex, and (2) misclassifying deferred revenue or accrued expenses in the working-capital change. The answer is fully correct.\n\nAmbiguities: The phrasing \"Next year's free cash flow is assumed to equal fiscal-year 2025 free cash flow grown by 4%\" is precise and removes the common ambiguity over whether the current-year FCF should be grown before discounting (i.e., FCF\u2081 = FCF\u2080 \u00d7 1.04). However, two minor points could invite alternative interpretations: (1) \"Cash production costs, excluding depreciation\" and \"Cash SG&A expenses, excluding amortization\" could conceivably be read as implying additional non-cash items exist beyond D&A, though none are provided; and (2) the statement that retired equipment was \"fully depreciated\" is essential to the roll-forward calculations, and a reader who overlooks it would compute depreciation of $30.0 and capex of $62.0\u2014notably, these errors offset in FCFF only partially through the tax shield on depreciation, so the question does discriminate between careful and careless solvers. Neither point constitutes a genuine ambiguity; the question is effectively precise.", "verdict": "Correct"}, {"entry_id": 56, "problem": "* Scenario: A manufacturing firm is reviewing its production mix for a component line. In two controlled one-day trials:\n  * Keeping machine-hours fixed, adding 8 labor-hours increased daily output from 4,200 units to 4,344 units.\n  * Keeping labor-hours fixed, adding 6 machine-hours increased daily output from 4,200 units to 4,272 units.\n\n  Labor costs $42 per labor-hour, and machine capacity costs $9 per machine-hour. Management is considering increasing labor usage by 15 labor-hours and reducing machine-hours just enough to keep output unchanged, using the marginal rate of technical substitution implied by the trials.\n\n* The Core Question: What is the resulting change in total daily input cost, in dollars, rounded to the nearest whole dollar? Use a negative value for cost savings and a positive value for cost increases.", "answer": "**-$180**", "feedback": "Verdict: Incorrect\n\nAnalysis: My independently derived answer is **+$428** (more precisely, +$427.50). The trials imply a marginal product of labor of 18 units per labor-hour and a marginal product of capital of 12 units per machine-hour, giving an MRTS of 1.5 machine-hours saved per labor-hour added. Adding 15 labor-hours therefore requires cutting 22.5 machine-hours to hold output constant, yielding a cost change of (15 \u00d7 $42) \u2212 (22.5 \u00d7 $9) = $630 \u2212 $202.50 = +$427.50 \u2248 +$428, a cost *increase*. The student's answer of \u2212$180 does not match. Their result is consistent with having (incorrectly) assumed that each added labor-hour substitutes for 6 machine-hours \u2014 likely by lifting the \"6 machine-hours\" figure directly from the second trial rather than computing the MRTS as the ratio of marginal products. That error gives a machine-hour reduction of 15 \u00d7 6 = 90 hours, and a cost change of $630 \u2212 (90 \u00d7 $9) = $630 \u2212 $810 = \u2212$180. Both the magnitude and the sign of the student's answer are wrong.\n\nAmbiguities: None. The phrase \"using the marginal rate of technical substitution implied by the trials\" clearly directs the solver to compute MRTS = MPL/MPK from the marginal products, and the sign convention for the answer is explicitly stated.", "verdict": "Incorrect"}, {"entry_id": 57, "problem": "* Scenario:  \nA trader expects Alton Robotics stock to remain above a support level through monthly option expiration. On trade date, the stock is quoted at $53.20. The trader enters a put credit spread using the following option market:\n\n| Put option strike | Bid | Ask |\n|---:|---:|---:|\n| $45 | $0.70 | $0.85 |\n| $50 | $2.40 | $2.55 |\n\nThe trader sells 120 contracts of the higher-strike put at the available bid and buys 120 contracts of the lower-strike put at the available ask. Each option contract controls 100 shares. Ignore commissions, fees, taxes, and margin interest.\n\nAt expiration, Alton Robotics\u2019 closing auction price is determined from a closing market capitalization of $4.710 billion and 100 million shares outstanding.\n\n* The Core Question:  \nWhat is the trader\u2019s total dollar profit or loss on the full spread position at expiration, rounded to the nearest whole dollar?", "answer": "-$15,000", "feedback": "Verdict: Incorrect\n\nAnalysis: The student's final answer of \u2212$15,000 does not match my independently derived result of **\u2212$16,200**. The correct workflow yields: an expiration price of $47.10 (from $4.710B \u00f7 100M shares), a net credit of $1.55 per share (selling the $50 put at the $2.40 bid, buying the $45 put at the $0.85 ask), a short put assignment loss of $2.90 per share ($50 \u2212 $47.10) with the long $45 put expiring worthless, for a net loss of $1.35 per share \u00d7 120 contracts \u00d7 100 shares = \u2212$16,200. The student's figure implies a per-share loss of $1.25 ($15,000 \u00f7 12,000 shares). This discrepancy of $0.10 per share most plausibly stems from one of two errors: (1) miscomputing the expiration price as $47.20 instead of $47.10 (e.g., an arithmetic slip in the market-cap division), giving an intrinsic value of $2.80 and a net of \u2212$1.25; or (2) miscalculating the net credit as $1.65 by using the wrong side of the bid/ask quotes on one leg. Either way, the final value is materially wrong and cannot be attributed to rounding.\n\nAmbiguities: None. The question precisely specifies the execution prices (\"sells... at the available bid and buys... at the available ask\"), the contract multiplier (\"Each option contract controls 100 shares\"), the expiration price inputs (\"closing market capitalization of $4.710 billion and 100 million shares outstanding\"), and instructs to ignore frictions, leaving no room for alternative interpretation.", "verdict": "Incorrect"}, {"entry_id": 58, "problem": "* Scenario: A military finance office is preparing next fiscal year\u2019s personnel budget for a unit of 35 identical service members. Each member holds a grade whose statutory basic-pay table lists an annualized pre-longevity rate of **$54,000**. Basic pay is paid monthly.  \n  Each member entered active duty on **July 1, 2016**, and the budget is being prepared as of **July 1, 2024**, so only completed years of service count. Under the unit\u2019s simplified compensation rule, monthly basic pay increases by **2% for each completed year of service**.  \n  The annual Employment Cost Index adjustment is based on the change from **160.0 to 167.2**, applied as a percentage increase to the resulting monthly basic pay.  \n  The unit\u2019s current budget assumes **$5,400 per member per month** for basic pay.\n\n* The Core Question: What is the unit\u2019s **annual basic-pay budget surplus or shortfall**, rounded to the nearest whole dollar?", "answer": "**$23,058 shortfall**", "feedback": "Verdict: Correct\n\nAnalysis: The student's final answer of a **$23,058 shortfall** matches my independently derived result exactly. The computation proceeds correctly: the monthly base rate from the annualized pay table, an 8-completed-year longevity adjustment applied at 2% per year (interpreted additively, i.e., a flat 16% increase), the ECI multiplier of 167.2/160.0 (a 4.5% increase) applied to the longevity-adjusted monthly pay, comparison against the assumed $5,400/month budget figure, and finally scaling by 12 months and 35 members. The resulting actual pay exceeds the budgeted amount, so the correct characterization is a shortfall, which the student also identified correctly. Both the magnitude and the direction (shortfall, not surplus) are correct.\n\nAmbiguities: The phrase \"monthly basic pay increases by **2% for each completed year of service**\" is ambiguous between an additive (simple) interpretation \u2014 base pay \u00d7 (1 + 0.02 \u00d7 8) \u2014 and a compounding interpretation \u2014 base pay \u00d7 (1.02)^8. Under the compounding interpretation, the answer would be a shortfall of approximately $46,086 instead. The student's answer is consistent with the additive reading, which is the more natural reading of \"2% for each completed year\" applied to the statutory pre-longevity rate, but the question would benefit from explicitly stating \"non-compounding\" or \"of the pre-longevity rate.\" Additionally, \"only completed years of service count\" is helpful, but the question could state the years-of-service figure (8) explicitly to remove date-arithmetic ambiguity.", "verdict": "Correct"}, {"entry_id": 59, "problem": "* Scenario:  \nAs of the market close on January 2, 2026, a non-dividend-paying firm has 1,000,000 common shares outstanding and an aggregate equity market value of $100,000,000. A European call option on this stock expires on January 2, 2027, using an ACT/365 convention. The option\u2019s exercise price is set at 125% of the firm\u2019s book value per common share; the firm\u2019s common shareholders\u2019 equity on the latest balance sheet is $80,000,000.  \n\nA one-year zero-coupon Treasury security with $100 face value trades for $95.12294245, with yields stated using continuous compounding. A risk system estimates the annual variance of the stock\u2019s continuously compounded return as 0.0400.  \n\nThe European call is quoted in the market at $11.00 per share. Each listed option contract controls 100 shares. A trader can sell 1,000 contracts at the quoted premium and simultaneously buy the exact dynamic replicating portfolio at its theoretical no-arbitrage cost. Ignore transaction costs, margin, and funding frictions.\n\n* The Core Question:  \nWhat is the net initial arbitrage profit, rounded to the nearest whole dollar?", "answer": "$54,942", "feedback": "Verdict: Correct\n\nAnalysis: The student's final answer of $54,942 matches my independently derived result exactly. Working through the problem internally: the stock price is $100 (market cap \u00f7 shares), the strike is $100 (125% of $80 book value per share), the implied continuously compounded risk-free rate from the Treasury price is 5.00%, volatility is 20% (square root of the 0.04 variance), and the time to maturity is exactly 1 year. The Black-Scholes model yields d\u2081 = 0.35 and d\u2082 = 0.15, with N(d\u2081) \u2248 0.63683 and N(d\u2082) \u2248 0.55962, producing a theoretical call value of approximately $10.4506 per share. Selling 1,000 contracts (100,000 shares of optionality) at $11.00 while buying the replicating portfolio at $10.4506 yields a net arbitrage profit of ($11.00 \u2212 $10.45058) \u00d7 100,000 \u2248 $54,942. The student clearly used full-precision normal CDF values (rather than two-decimal table values, which would give ~$54,950), so the answer is precise to the dollar.\n\nAmbiguities: The phrasing is generally precise, but two minor points invite alternative interpretations: (1) \"A risk system estimates the annual variance of the stock's continuously compounded return as 0.0400\" \u2014 a careless reader could mistake 0.0400 for the standard deviation rather than the variance, leading to \u03c3 = 0.04 and a materially different answer. (2) The precision of the normal CDF values is unspecified; students using standard z-tables rounded to four decimal places (e.g., N(0.35) = 0.6368, N(0.15) = 0.5596) would obtain answers in the neighborhood of $54,940\u2013$54,960, so small deviations from $54,942 could arguably merit \"Partially Correct due to rounding.\"", "verdict": "Correct"}, {"entry_id": 60, "problem": "* Scenario:  \nA trader establishes a bullish put credit spread on shares of Meridian Tech, which are currently trading at $103.50. The trader uses options with the same expiration date and executes the following trades at marketable prices:\n\n  | Put Option Strike | Bid Premium | Ask Premium |\n  |---:|---:|---:|\n  | $100 | $4.20 | $4.35 |\n  | $95 | $2.55 | $2.70 |\n\n  The trader sells 12 put contracts at the $100 strike and buys 12 put contracts at the $95 strike. Each option contract covers 100 shares. The broker charges $0.65 per option contract traded, paid at trade initiation. At expiration, Meridian Tech closes at $101.25.\n\n* The Core Question:  \nWhat is the trader\u2019s total net dollar profit after commissions, rounded to the nearest whole dollar?", "answer": "$1,784", "feedback": "Verdict: Correct\n\nAnalysis: My independently derived result matches the student's answer. The spread is executed at marketable prices (selling the $100 put at the bid of $4.20, buying the $95 put at the ask of $2.70), yielding a net credit of $1.50 per share, or $1,800 across 12 contracts (1,200 shares). With the stock closing at $101.25, both puts expire worthless, so the trader retains the full credit. Commissions total 24 contracts \u00d7 $0.65 = $15.60. Net profit = $1,800 \u2212 $15.60 = $1,784.40, which rounds to $1,784. The student correctly used the bid/ask sides for marketable orders, recognized both legs expire out-of-the-money, and accounted for commissions on all 24 contracts.\n\nAmbiguities: The phrase \"executes the following trades at marketable prices\" is the key interpretive element \u2014 it correctly implies selling at the bid and buying at the ask, but a careless reader might use mid-prices or the wrong side of the quote (e.g., selling at $4.35 and buying at $2.55 would give $2,160 \u2212 $15.60 = $2,144). Additionally, \"paid at trade initiation\" could invite questions about whether closing-side commissions apply, though since both options expire worthless, no closing trades occur and the question is effectively unambiguous on that point.", "verdict": "Correct"}, {"entry_id": 61, "problem": "* Scenario: An investor bought 2,000 shares of a stock at $64 per share in a margin account, using the maximum allowed initial margin of 50%. No interest has accrued on the margin loan. The stock has since fallen to $41 per share. The broker\u2019s maintenance equity requirement on this stock is 33% of its current market value. The broker permits the margin call to be satisfied by depositing marginable corporate bonds, which have a 40% house equity requirement. The investor owns $30,000 face value of these bonds, currently quoted at 96.25% of par. Bonds may be pledged in fractional market-value amounts; ignore accrued interest and commissions.\n\n* The Core Question: After meeting the margin call using as little of the bond position as possible, what market value of the bonds remains unpledged, rounded to the nearest dollar?", "answer": "$13,775", "feedback": "Verdict: Correct\n\nAnalysis: The student's final answer of $13,775 matches my independently derived result exactly. The chain of logic required: computing the loan balance from the initial purchase at 50% margin, determining the current equity after the price decline to $41, calculating the maintenance deficiency against the 33% requirement, recognizing that pledged bonds only contribute \"loan value\" net of their own 40% house requirement (i.e., 60 cents of usable equity per dollar of bond market value), grossing up the deficiency accordingly, and subtracting the pledged amount from the total bond market value at 96.25% of par. The student's figure is consistent with executing every one of these steps correctly, including the critical and frequently missed adjustment for the bonds' own 40% equity requirement (a common error would be dividing the deficiency by 0.40 instead of 0.60, or pledging bonds dollar-for-dollar, both of which would yield different remainders).\n\nAmbiguities: The phrase \"40% house equity requirement\" on the bonds could conceivably be read two ways: (1) the bonds, once deposited, must themselves be margined at 40%, so each dollar of bond value supplies $0.60 of excess equity (the intended and standard interpretation); or (2) the bonds have a loan value of 40%, supplying only $0.40 per dollar. The standard industry convention supports interpretation (1), which the student evidently used. Additionally, \"satisfy the margin call\" presumes the call is computed as the equity deficiency relative to the maintenance level (33% of current market value) rather than restoring equity to the initial 50% level \u2014 the question is consistent with the former, but a stricter broker policy interpretation could change the required deposit. Otherwise, the question is precise.", "verdict": "Correct"}, {"entry_id": 62, "problem": "* Scenario: A corporation has $10,000,000 face value of outstanding bonds that it wants to redeem today under a make-whole call provision. The bonds pay a 6.00% annual coupon, and today\u2019s coupon has just been paid, so there are exactly four remaining annual coupon dates: 1, 2, 3, and 4 years from today. The full principal is scheduled to be repaid with the final coupon 4 years from today. The make-whole provision requires discounting the remaining scheduled cash flows at the yield on a comparable Treasury security plus 50 basis points. The comparable Treasury yield is 3.20% per year. The issuer has already set aside $10,750,000 in cash for the redemption.\n\n* The Core Question: How much additional cash does the issuer need to complete the redemption, rounded to the nearest whole dollar?", "answer": "$90,813 shortfall", "feedback": "Verdict: Correct\n\nAnalysis: Discounting the four remaining annual coupons of $600,000 plus the $10,000,000 principal at the make-whole rate of 3.70% (3.20% Treasury yield + 50 bps) yields a make-whole redemption price of approximately $10,840,812.55. Subtracting the $10,750,000 already set aside leaves a shortfall of approximately $90,812.55, which rounds to $90,813. The student's final answer matches my independently derived result exactly under standard rounding to the nearest whole dollar. (Note: the unrounded value sits very close to the rounding boundary, so an answer of $90,812 could also arise from intermediate rounding, but $90,813 is the correct figure when full precision is carried through.)\n\nAmbiguities: \n1. \"discounting the remaining scheduled cash flows at the yield on a comparable Treasury security plus 50 basis points\" \u2014 this is clear in spirit, but the question does not explicitly state the compounding convention (annual compounding is the natural assumption given annual coupons, but semiannual bond-equivalent yield conventions are common for Treasury-based make-whole calculations in practice and would change the answer).\n2. The question does not state whether the make-whole price is the maximum of par and the discounted cash flow value (standard make-whole provisions typically specify the greater of the two). Here the PV exceeds par, so the answer is unaffected, but the phrasing leaves this implicit.\n3. \"today's coupon has just been paid\" helpfully removes accrued interest concerns, so no ambiguity there.", "verdict": "Correct"}, {"entry_id": 63, "problem": "* Scenario:  \nA manufacturer of cycling components is preparing its next-quarter operating plan. The firm expects to ship 38,000 units under signed retailer contracts and 7,000 units through its online channel. Each unit sells for $80. Variable manufacturing and fulfillment costs are $32 per unit, and the firm pays a sales commission equal to 5% of the selling price on every unit sold.  \n\n  Quarterly fixed operating costs are as follows: plant rent of $540,000, salaried production supervision of $210,000, equipment depreciation of $150,000, insurance of $60,000, and fixed advertising of $140,000.  \n\n  The firm\u2019s lender requires that its sales cushion relative to break-even sales be at least 40.00%.\n\n* The Core Question:  \nBy how many percentage points is the firm\u2019s projected sales cushion above or below the lender\u2019s required minimum, rounded to the nearest 0.01 percentage points?", "answer": "4.44 percentage points above the required minimum.", "feedback": "Verdict: Correct\n\nAnalysis: The student's final answer matches my independently derived result. Using the contribution margin per unit (selling price less variable costs and the per-unit commission), total fixed costs of $1,100,000, and total projected volume of 45,000 units, the break-even point works out to 25,000 units. The margin of safety is therefore (45,000 \u2212 25,000)/45,000 \u2248 44.44%, which exceeds the lender's 40.00% requirement by 4.44 percentage points. The student correctly treated the 5% commission as a variable cost, correctly aggregated both sales channels, and correctly expressed the result as a percentage-point difference (not a relative percentage difference), rounding properly to two decimal places.\n\nAmbiguities: The phrase \"sales cushion relative to break-even sales\" is a slightly non-standard term for the margin of safety percentage. It could conceivably be computed with break-even sales in the denominator, i.e., (Sales \u2212 BE)/BE = 20,000/25,000 = 80.00%, which would yield 40.00 points above the minimum. However, the conventional interpretation of a margin-of-safety ratio uses projected sales as the denominator, which the student correctly applied. Additionally, \"ship 38,000 units\" vs. \"sold\" could theoretically raise revenue-recognition questions, but the problem clearly intends all 45,000 units as sales volume.", "verdict": "Correct"}, {"entry_id": 64, "problem": "* Scenario: A macroeconomic analyst is evaluating Country X\u2019s open-economy spending multiplier using annual national accounts data, all measured in billions of dollars.\n\n  | Item | Year 0 | Year 1 |\n  |---|---:|---:|\n  | Household labor/proprietor income before tax | 5,200 | 5,550 |\n  | Net investment/property income received by households | 900 | 950 |\n  | Government transfer payments to households | 700 | 740 |\n  | Personal income taxes and social contributions | 1,500 | 1,540 |\n  | Goods imports | 1,100 | 1,210 |\n  | Services imports | 300 | 330 |\n\n  Disposable income is defined as household income before tax plus transfers minus personal taxes and social contributions. Total imports are goods imports plus services imports.\n\n  For the coming year, the analyst uses a simple open-economy Keynesian model with no induced taxes. The only induced leakages from additional income are household saving and imports. The marginal propensity to save is 0.25, and the marginal import leakage is estimated from the Year 0 to Year 1 national accounts data.\n\n  The government is considering an autonomous domestic investment program of $240 billion. Policymakers want equilibrium domestic output to rise by $450 billion.\n\n* The Core Question: What is the forecasted output impact relative to the $450 billion target, stated as a shortfall or excess and rounded to the nearest $1 billion?", "answer": "$50 billion shortfall", "feedback": "Verdict: Correct\n\nAnalysis: The student's final answer matches my independently derived result. Using the national accounts data, the change in disposable income between Year 0 and Year 1 is $400 billion and the change in total imports is $140 billion, yielding a marginal import leakage of 0.35. Combined with the marginal propensity to save of 0.25, the total marginal leakage is 0.60, giving a spending multiplier of 1/0.60 \u2248 1.667. The $240 billion autonomous investment program therefore raises equilibrium output by $400 billion, which falls $50 billion short of the $450 billion target. The student's answer of a \"$50 billion shortfall\" is exactly correct.\n\nAmbiguities: \n1. The phrase \"Disposable income is defined as household income before tax plus transfers minus personal taxes and social contributions\" does not explicitly state whether \"household income before tax\" includes the line item \"Net investment/property income received by households.\" If a student excluded property income, \u0394Yd would be $350 billion, the import leakage 0.40, and the forecast would imply roughly an $81 billion shortfall. The intended interpretation (including property income) is the more natural reading, but the definition could have been more precise.\n2. \"The marginal import leakage is estimated from the Year 0 to Year 1 national accounts data\" does not specify whether imports should be related to changes in disposable income or changes in total output/income; since output is not provided, disposable income is the only feasible base, but the wording leaves the denominator implicit.", "verdict": "Correct"}, {"entry_id": 65, "problem": "* Scenario: A structured-products trading desk currently purchases 18 intraday volatility-surface snapshots per trading day from a market-data vendor. The desk is considering upgrading to 30 snapshots per trading day. Assume 250 trading days per year.  \n  With the current snapshot frequency, the desk expects annual client spread revenue of $12,400,000 and annual option-hedging losses of $1,875,000. With the upgraded frequency, expected annual client spread revenue rises to $12,526,000, and expected annual option-hedging losses fall to $1,545,000.  \n  The vendor charges $155 for each additional snapshot consumed beyond the current plan.\n\n* The Core Question: After determining the dollar benefit per additional snapshot and comparing it with the vendor\u2019s incremental charge, what is the desk\u2019s net annual economic surplus from approving the upgrade, rounded to the nearest dollar?", "answer": "$45,000", "feedback": "Verdict: Incorrect\n\nAnalysis: My independently derived result is a net annual economic surplus of **\u2212$9,000** (i.e., a net loss of $9,000 per year). The incremental annual benefit is the revenue uplift ($126,000) plus the hedging-loss reduction ($330,000), totaling $456,000, while the incremental annual cost is 12 extra snapshots/day \u00d7 250 days \u00d7 $155 = $465,000. The difference is \u2212$9,000, meaning the upgrade actually destroys value. Equivalently, the benefit per additional snapshot is $456,000 / 3,000 = $152, which is below the $155 vendor charge. The student's answer of $45,000 does not match. The most likely errors leading to $45,000 are either (a) an arithmetic slip in computing the total benefit or cost (e.g., transposing digits or mis-multiplying the 3,000 incremental snapshots by $155), or (b) a sign/aggregation error such as adding rather than netting some component. There is no natural single misstep that cleanly produces +$45,000, suggesting a compounded calculation error; importantly, the student also got the sign wrong, concluding the upgrade is value-accretive when it is not.\n\nAmbiguities: The phrase \"$155 for each additional snapshot consumed beyond the current plan\" could conceivably be read as a per-day flat increment rather than per-snapshot-per-day, but the per-snapshot reading (12 \u00d7 250 \u00d7 $155) is the standard and clearly intended interpretation. Additionally, \"net annual economic surplus from approving the upgrade\" presumes the answer could be negative; the question's framing (\"surplus\") might mislead a student into expecting a positive result. Otherwise, the question is precise.", "verdict": "Incorrect"}, {"entry_id": 66, "problem": "* Scenario: A portfolio manager estimates the systematic risk of Orion Inc. using the last five monthly total returns for Orion and the broad market index:\n\n  | Month | Orion Return | Market Return |\n  |---|---:|---:|\n  | 1 | -6.20% | -4.00% |\n  | 2 | -2.60% | -1.00% |\n  | 3 | 1.00% | 2.00% |\n  | 4 | 4.60% | 5.00% |\n  | 5 | 8.20% | 8.00% |\n\n  Compute Orion\u2019s beta as the covariance of Orion\u2019s returns with market returns divided by the variance of market returns, using the same denominator for both covariance and variance. Then use CAPM with an annual risk-free rate of 3.00% and an expected annual market return of 9.00%. Orion\u2019s analyst-forecast annual return is 11.45%, and the fund is considering a $2,000,000 one-year position.\n\n* The Core Question: What is the expected one-year dollar excess return versus the CAPM-required return, rounded to the nearest whole dollar?", "answer": "$25,000", "feedback": "Verdict: Correct\n\nAnalysis: The student's final answer of $25,000 matches my independently derived result exactly. The data yield a beta of 1.2 (covariance and variance computed with matching denominators cancel, so the ratio is exact), a CAPM-required return of 3.00% + 1.2 \u00d7 (9.00% \u2212 3.00%) = 10.20%, an alpha of 11.45% \u2212 10.20% = 1.25%, and a dollar excess return of $2,000,000 \u00d7 1.25% = $25,000. The student arrived at the correct beta, correctly applied the CAPM equation with the market risk premium (not the raw market return), and scaled the alpha to the position size accurately.\n\nAmbiguities: The question is largely precise, but two minor points merit note. First, the phrase \"using the same denominator for both covariance and variance\" is a helpful clarification, though strictly the beta is invariant to whether the population (n) or sample (n\u22121) convention is used, as long as it is consistent \u2014 so this could mildly confuse students into thinking the choice matters for the final answer. Second, \"expected one-year dollar excess return versus the CAPM-required return\" could conceivably be misread as the excess over the risk-free rate or over the market return, though the phrase \"versus the CAPM-required return\" makes the intended interpretation (alpha \u00d7 position size) sufficiently clear.", "verdict": "Correct"}, {"entry_id": 67, "problem": "* Scenario: A manufacturer sells a single product for **$145 per unit**. For the coming year, it has firm orders for **28,000 units** from retailers and expects an additional **17,500 units** from direct corporate customers. Variable costs are **$52** for materials, **$24** for labor, **$7** for packaging and freight, plus a distribution fee equal to **4% of selling price**. Annual fixed operating costs consist of a plant lease of **$62,000 per month**, salaried supervisors of **$410,000**, a fixed marketing retainer of **$285,000**, equipment depreciation of **$196,000**, and insurance/property taxes of **$92,500**. A lender requires the company\u2019s sales cushion above operating break-even to be at least **30.00%** of budgeted sales.\n\n* The Core Question: What is the company\u2019s signed spread over the lender\u2019s required sales-cushion percentage, in **percentage points**, rounded to **two decimal places**? Use a positive number if it exceeds the requirement and a negative number if it falls short.", "answer": "**+2.44 percentage points**", "feedback": "Verdict: Correct\n\nAnalysis: The student's final answer of **+2.44 percentage points** matches my independently derived result exactly. My hidden calculation confirms: total variable cost per unit (including the 4% distribution fee on the $145 price) yields a contribution margin of $56.20 per unit; annualized fixed costs (including 12 months of lease) total $1,727,500; the resulting break-even point against budgeted volume of 45,500 units produces a margin of safety of approximately 32.44% of budgeted sales. Subtracting the lender's 30.00% requirement gives a signed spread of +2.44 percentage points. The student correctly annualized the monthly lease, treated the distribution fee as a variable cost tied to price, included depreciation as a fixed operating cost, and applied the correct sign convention.\n\nAmbiguities: The question is largely precise, but two phrasings invite minor alternative interpretations: (1) \"sales cushion above operating break-even... of budgeted sales\" \u2014 this is the standard margin-of-safety ratio, but a student could conceivably compute the cushion as a percentage of break-even sales rather than budgeted sales, which would yield a different result (~48.02%, spread +18.02). (2) \"equipment depreciation of $196,000\" \u2014 since depreciation is a non-cash fixed cost, some break-even formulations (e.g., cash break-even) exclude it; the question says \"fixed operating costs consist of,\" which signals inclusion, but a lender-covenant context could tempt a cash-basis interpretation. Neither ambiguity is severe, and the intended reading supports the student's answer.", "verdict": "Correct"}, {"entry_id": 68, "problem": "* Scenario: A state fiscal analyst is evaluating a one-time autonomous infrastructure spending package. In a recent pilot period, aggregate disposable income in the state rose from **$240.0 billion** to **$252.0 billion**, while aggregate household consumption rose from **$216.0 billion** to **$225.0 billion**. Assume the simple Keynesian expenditure model applies, with no crowding out, no induced taxes, no imports, and a constant marginal saving behavior inferred from the pilot data. The state currently estimates a recessionary output gap of **$7.5 billion**. The proposed infrastructure package would increase autonomous government purchases by **$2.4 billion**.\n\n* The Core Question: After accounting for the full expenditure effect of the proposed package, by how many **billions of dollars** will actual output exceed or fall short of closing the $7.5 billion gap? Report a positive value if output exceeds the gap and a negative value if it falls short, rounded to **2 decimal places**.", "answer": "**$0.50 billion**", "feedback": "Verdict: Incorrect\n\nAnalysis: My independently derived result is **+$2.10 billion** (output exceeds the gap). From the pilot data, the marginal propensity to consume is the change in consumption divided by the change in disposable income, which yields 0.75, implying a simple expenditure multiplier of 4. The $2.4 billion injection therefore raises output by $9.6 billion, which exceeds the $7.5 billion recessionary gap by $2.10 billion. The student's answer of $0.50 billion does not match. The most plausible source of error: the student appears to have compared the package size to the *required injection* rather than comparing the output effect to the gap \u2014 i.e., computing the needed autonomous spending as $7.5B \u00f7 4 = $1.875B and subtracting it from $2.4B (which gives $0.525B, carelessly rounded to $0.50). This conflates a comparison in \"injection space\" with the question's explicit request for a comparison in \"output space.\" Alternatively, a rounding of the multiplier or MPC mid-calculation could produce a similar small residual, but in any case the final figure is materially wrong both in magnitude and conceptual basis.\n\nAmbiguities: The question is largely precise, but two phrases merit note: (1) \"constant marginal saving behavior inferred from the pilot data\" \u2014 a careless reader might infer the *average* propensity to consume (216/240 = 0.90) rather than the marginal propensity (9/12 = 0.75), which would change the multiplier to 10 and the answer to +$16.50 billion; the word \"marginal\" does resolve this, but the juxtaposition with level data invites the error. (2) \"recessionary output gap of $7.5 billion\" \u2014 it is implicitly the required *change in output*, not a required change in autonomous spending; the question could state this explicitly to prevent exactly the type of mistake the student appears to have made.", "verdict": "Incorrect"}, {"entry_id": 69, "problem": "* Scenario: A manufacturer sells a single product. For the coming year, it has firm purchase orders for 180,000 units at a list price of $62 per unit. Based on historical experience, 2% of gross sales are expected to be refunded through customer returns and allowances. The product\u2019s variable manufacturing and selling cost is $34 per unit sold. Annual fixed operating costs are budgeted at $3,420,000.  \n  A lender requires the company\u2019s forecasted dollar sales cushion above break-even sales to be at least $1,000,000.\n\n* The Core Question: By how many dollars does the company exceed or fall short of the lender\u2019s required cushion, rounded to the nearest whole dollar? State whether it exceeds or falls short.", "answer": "Falls short by $62,429.", "feedback": "Verdict: Incorrect\n\nAnalysis: My independently derived result does not match the student's answer. Working in net sales terms: net revenue per unit is $60.76 (after the 2% returns/allowances), giving a unit contribution margin of $26.76 and a contribution margin ratio of approximately 0.4404. Break-even sales come to approximately $7,765,291. Forecasted net sales of $10,936,800 yield a margin of safety (cushion) of approximately $3,171,509 \u2014 well above the lender's $1,000,000 requirement. The company therefore **exceeds** the required cushion by approximately **$2,171,509**. (Even under the alternative treatment \u2014 keeping sales at the gross $62 price and treating the 2% returns as an additional variable cost of $1.24/unit \u2014 the cushion is roughly $3,236,233, exceeding the requirement by about $2,236,233.) The student's answer of \"falls short by $62,429\" implies a margin of safety of only about $937,571, which is not attainable under any defensible reading of the data. The most likely source of the error is a dramatic miscalculation of break-even sales \u2014 for example, misconstructing the contribution margin ratio (their implied break-even of roughly $10 million suggests dividing fixed costs by a ratio near 0.342, possibly from confusing the fixed-cost figure $3,420,000 with a percentage, or another structural error in setting up CM ratio). Additionally, the directional conclusion (\"falls short\") is wrong, which is a material conceptual failure given the lender-covenant framing of the question.\n\nAmbiguities: The phrase \"forecasted dollar sales cushion above break-even sales\" does not specify whether sales should be measured **gross** ($11,160,000) or **net of returns and allowances** ($10,936,800), and correspondingly whether the 2% refund should be treated as a revenue deduction or as a variable cost in the CM ratio. Also, \"variable manufacturing and selling cost is $34 per unit **sold**\" leaves slight room for debate about whether variable cost is avoided on returned units. However, under every reasonable interpretation the company exceeds the required cushion by over $2 million, so these ambiguities cannot rescue the student's answer.", "verdict": "Incorrect"}, {"entry_id": 70, "problem": "* Scenario:  \nA national accounts office reports that household disposable income increased from **$900 billion** last year to **$1,050 billion** this year. Over the same period, aggregate household consumption increased from **$810 billion** to **$930 billion**.  \n\n  In this economy, household saving is defined as disposable income minus consumption. Policymakers use a simple Keynesian model with no taxes, no imports, and no price-level changes, so the autonomous spending multiplier is determined by the household sector\u2019s marginal saving behavior.  \n\n  The government is considering a **$22 billion** increase in autonomous infrastructure spending. The current recessionary output gap is estimated at **$125 billion**.\n\n* The Core Question:  \nUsing the information above, after the proposed spending increase, what is the remaining output gap in **billions of dollars**, rounded to the nearest **$0.1 billion**?", "answer": "**$70.0 billion**", "feedback": "Verdict: Incorrect\n\nAnalysis: The student's final answer of $70.0 billion does not match my independently derived result of **$15.0 billion**. The correct approach uses the *marginal* propensity to consume (the change in consumption divided by the change in disposable income, i.e., $120B/$150B = 0.8), giving a marginal propensity to save of 0.2 and a multiplier of 5. The $22 billion spending increase therefore raises output by $110 billion, leaving a remaining gap of $125B \u2212 $110B = $15.0 billion. The student's answer of $70.0 billion implies an output increase of only $55 billion, which corresponds to a multiplier of 2.5 (i.e., assuming an MPS of 0.4 / MPC of 0.6). This suggests the student likely made a computational error in calculating the marginal propensities \u2014 possibly miscomputing the consumption or income changes, or inverting/mishandling the saving ratio \u2014 rather than using the correct marginal figures from the data. Note that even using *average* propensities (APS = 90/900 = 0.1, multiplier = 10) would not produce $70.0 billion, so the error appears to be arithmetic rather than the common marginal-vs-average conceptual mistake.\n\nAmbiguities: The question is largely precise, but one phrase invites mild interpretive risk: \"the autonomous spending multiplier is determined by the household sector's **marginal saving behavior**.\" A careless reader could interpret \"saving behavior\" as the *average* saving rate (S/Y) rather than the marginal propensity to save (\u0394S/\u0394Y), which would yield a different multiplier (10 instead of 5). However, the explicit word \"marginal\" resolves this for an attentive reader, and the question otherwise specifies all assumptions (no taxes, no imports, fixed prices) cleanly. The student's specific error does not appear to stem from this ambiguity in any case.", "verdict": "Incorrect"}, {"entry_id": 71, "problem": "* Scenario: A market technician is testing a short-term breadth rule on a split-adjusted price tape for AlphaTech Corp. The rule uses the most recent full trading week of observations as the moving-average window. AlphaTech completed a 2-for-1 stock split effective before the market opened on September 9, so all closing prices before September 9 must be divided by 2 before analysis. The raw closing prices were:\n\n  | Date | Raw Close |\n  |---|---:|\n  | Sep 2 | $196 |\n  | Sep 3 | $202 |\n  | Sep 4 | $204 |\n  | Sep 5 | $206 |\n  | Sep 8 | $210 |\n  | Sep 9 | $106 |\n  | Sep 10 | $104 |\n  | Sep 11 | $107 |\n  | Sep 12 | $109 |\n  | Sep 13 | $108 |\n  | Sep 16 | $110 |\n  | Sep 17 | $112 |\n\n  The firm\u2019s risk committee requires the calculated percentage-above-moving-average indicator to be at least 18.00% to permit a tactical long allocation. Use strict \u201cgreater than\u201d comparison when counting observations above the moving average.\n\n* The Core Question: What is the indicator\u2019s spread versus the 18.00% hurdle, in percentage points, rounded to two decimal places, and does the allocation pass or fail?", "answer": "**-1.33 percentage points; Fail**", "feedback": "Verdict: Correct\n\nAnalysis: The student's final answer matches my independently derived result. Adjusting the pre-split closes (Sep 2\u20138 divided by 2) yields the series 98, 101, 102, 103, 105, 106, 104, 107, 109, 108, 110, 112. The \"most recent full trading week\" window is the last five observations (Sep 11\u201317: 107, 109, 108, 110, 112), giving a moving average of 546/5 = 109.20. Applying the strict \"greater than\" test across the full 12-observation tape, only two closes (110 and 112) exceed 109.20, so the indicator is 2/12 = 16.67% (rounded to two decimals). The spread versus the 18.00% hurdle is 16.67% \u2212 18.00% = \u22121.33 percentage points, and since 16.67% < 18.00%, the allocation fails. The student's \"\u22121.33 percentage points; Fail\" is exactly correct, indicating proper split adjustment, correct window selection, correct strict-inequality counting, and correct rounding.\n\nAmbiguities: The question contains several phrasings that invite alternative interpretations:\n1. \"percentage-above-moving-average indicator\" \u2014 this could plausibly mean (a) the fraction of observations above the moving average (the intended reading), (b) the percentage distance of the latest close above the MA, i.e., (Close \u2212 MA)/MA, or (c) a rolling breadth measure counting each day's close against its own trailing 5-day MA. Reading (b) would give (112 \u2212 109.20)/109.20 \u2248 2.56%, and reading (c) would give 7/8 = 87.5%, both producing different pass/fail conclusions.\n2. \"the most recent full trading week of observations\" \u2014 it is unclear whether this means the last five listed observations (Sep 11\u201317), the last complete Monday\u2013Friday calendar week, or simply a 5-day window applied on a rolling basis. Note also that the listed dates are internally inconsistent as calendar trading days (if Sep 8 is a Monday, Sep 13 would be a Saturday, yet Sep 14\u201315 are skipped as if a weekend follows Sep 13).\n3. The denominator for the percentage is unstated \u2014 whether to count above-MA observations out of all 12 observations or only out of some subset (e.g., post-split days or the window itself) is left to inference.", "verdict": "Correct"}, {"entry_id": 72, "problem": "* Scenario: A consumer electronics retailer normally sells a wireless charger at a list price of **$64.50**. During a typical week before a promotional campaign, it sold **18,000 units**. In the first week of the campaign, the retailer reduced the selling price to **$61.20** and sold **23,500 units**. The variable production and fulfillment cost is **$43.75 per unit**, and the campaign required an incremental fixed advertising spend of **$62,000** for the week.\n\n* The Core Question: Using the change in total revenue and the change in units sold to evaluate the revenue earned per additional unit, what is the campaign\u2019s **net incremental operating profit or loss**, rounded to the nearest whole dollar? Report a loss as a negative dollar amount.", "answer": "**-$25,425**", "feedback": "Verdict: Correct\n\nAnalysis: The student's final answer of **-$25,425** matches my independently derived result exactly. The change in total revenue ($1,438,200 \u2212 $1,161,000 = $277,200) less the incremental variable costs on the 5,500 additional units ($240,625) yields an incremental contribution of $36,575; subtracting the $62,000 incremental fixed advertising spend produces a net incremental operating loss of \u2212$25,425. The student correctly recognized that the relevant variable cost applies only to the *incremental* units (since the marginal revenue framing already nets out the price cut's cannibalization of revenue on the base 18,000 units), and correctly treated the advertising spend as a fully incremental fixed cost. The answer is also correctly reported as a negative dollar amount per the instructions.\n\nAmbiguities: The phrase \"Using the change in total revenue and the change in units sold to evaluate the revenue earned per additional unit\" could mislead some students into computing marginal revenue per unit ($50.40) and then multiplying a per-unit margin ($50.40 \u2212 $43.75 = $6.65) by 5,500 units \u2014 though this path yields the identical result ($36,575 \u2212 $62,000 = \u2212$25,425), so the ambiguity is harmless here. A more substantive alternative interpretation: a student might compute incremental profit as (new total profit \u2212 old total profit) including variable costs on *all* units, i.e., [(61.20 \u2212 43.75) \u00d7 23,500 \u2212 62,000] \u2212 [(64.50 \u2212 43.75) \u00d7 18,000] = $410,075 \u2212 $62,000 \u2212 $373,500 = \u2212$25,425 \u2014 which again converges to the same answer, confirming the question is internally consistent despite the somewhat convoluted framing.", "verdict": "Correct"}, {"entry_id": 73, "problem": "* Scenario: An investor is evaluating a condominium under contract for **$768,000**. The unit\u2019s floor plan is a rectangle measuring **40 feet by 24 feet**.\n\n  The investor estimates resale market value using three recent comparable condo sales. For each comparable, compute its sale price per square foot and compare it with the target condo\u2019s contract price per square foot. Then apply the following per-square-foot feature adjustments for each comparable:\n\n  * Add **$0.05/sf \u00d7 (bedrooms \u2212 1)**\n  * Add **$0.05/sf \u00d7 (bathrooms \u2212 1)**\n  * Add **$0.10/sf** if it has a view; subtract **$0.10/sf** if it does not\n  * Add **$0.10/sf** if it has in-suite appliances; subtract **$0.10/sf** if it does not\n  * Subtract **$0.10/sf** if renovations are needed; add **$0.10/sf** if renovations are not needed\n\n  The average of the three comparable per-square-foot indications is then added to the target condo\u2019s contract price per square foot and multiplied by the target condo\u2019s square footage to estimate resale market value.\n\n  | Comparable | Sale Price | Square Feet | Bedrooms | Bathrooms | View? | In-Suite Appliances? | Renovations Needed? |\n  |---|---:|---:|---:|---:|---|---|---|\n  | A | $882,000 | 1,050 | 2 | 2 | Yes | Yes | No |\n  | B | $760,500 | 900 | 1 | 1 | No | Yes | Yes |\n  | C | $775,200 | 960 | 2 | 1 | Yes | No | No |\n\n  If the investor buys the condo, they will pay **1.00% of the contract price** in purchase closing costs and expects to resell immediately at the estimated resale market value, paying **2.00% of that resale value** in selling costs. Ignore financing costs and taxes.\n\n* The Core Question: What is the investor\u2019s **net dollar arbitrage profit**, rounded to the nearest whole dollar?", "answer": "**$6,109**", "feedback": "Verdict: Correct\n\nAnalysis: The student's final answer of **$6,109** matches my independently derived result exactly. Working through the problem: the target's contract price per square foot is $800 (on 960 sf). The per-square-foot differentials for the three comparables (sale price/sf minus $800), after applying the feature adjustments, average to approximately $30.9833/sf. Adding this to $800/sf and multiplying by 960 sf yields an estimated resale value of $797,744. Subtracting the contract price ($768,000), purchase closing costs (1% \u00d7 $768,000 = $7,680), and selling costs (2% \u00d7 $797,744 = $15,954.88) gives a net arbitrage profit of $6,109.12, which rounds to **$6,109**. The student executed all steps correctly, including the correct interpretation that the adjustments apply to the per-square-foot *differential* (the \"comparison\" with the target's price per square foot) before averaging.\n\nAmbiguities: The phrase \"compute its sale price per square foot and **compare it** with the target condo's contract price per square foot. Then apply the following per-square-foot feature adjustments\" is somewhat imprecise \u2014 it does not explicitly state whether the adjustments are applied to the price differential or to the comparable's raw price per square foot. However, the subsequent instruction that \"the average of the three comparable per-square-foot indications is then **added to** the target condo's contract price per square foot\" strongly implies the indications are differentials, which resolves the interpretation in favor of the method the student used. A secondary minor ambiguity is the directionality of feature adjustments (whether superior comparable features should be added or subtracted under standard appraisal logic \u2014 conventionally, a superior comparable feature warrants a *downward* adjustment); however, the question explicitly prescribes the signs, so the formulaic instructions override appraisal convention and leave no computational ambiguity.", "verdict": "Correct"}, {"entry_id": 74, "problem": "* Scenario: A portfolio manager is evaluating a one-year investment in Stock X. A one-year zero-coupon Treasury security with $1,000 face value trades today for $970.87378641. The broad equity market index is at 4,000 today; analysts expect it to be at 4,300 in one year and to distribute 100 index points of dividends over the year. Historical return data show that the covariance between Stock X\u2019s returns and market returns is 0.030, while the variance of market returns is 0.020. Stock X trades at $100 today; the manager forecasts a $111 price in one year and a $7 dividend during the year. The manager plans to invest $1,200,000 in Stock X. Assume annual effective returns and ignore taxes and transaction costs.\n* The Core Question: Using the CAPM-required return implied by the data, what is the forecasted one-year dollar alpha of the Stock X position, rounded to the nearest whole dollar?", "answer": "$54,000", "feedback": "Verdict: Correct\n\nAnalysis: The student's final answer of $54,000 matches my independently derived result exactly. Working through the problem internally: the Treasury price implies a risk-free rate of 3%, the index data imply a 10% expected market return, the covariance/variance ratio gives a beta of 1.5, yielding a CAPM-required return of 13.5%. The manager's forecast for Stock X implies an 18% expected return, producing an alpha of 4.5%, which on a $1,200,000 position equals $54,000. The student arrived at precisely this figure, indicating correct execution of every step: risk-free rate extraction, total-return calculation including dividends for both the market and the stock, beta computation, CAPM application, and conversion of percentage alpha into dollar terms.\n\nAmbiguities: The phrase \"forecasted one-year dollar alpha\" could conceivably be interpreted as the alpha measured on the end-of-year position value rather than the initial investment (i.e., applying 4.5% to a grown base), or as the difference in terminal dollar values under forecast vs. required returns \u2014 though both interpretations yield the same $54,000 here since alpha \u00d7 initial investment is the standard and consistent computation. Additionally, \"distribute 100 index points of dividends over the year\" requires the assumption that dividends are received at year-end (not reinvested mid-year); the question's instruction to \"assume annual effective returns\" mitigates but does not fully eliminate this timing ambiguity. These do not affect the answer in this case.", "verdict": "Correct"}, {"entry_id": 75, "problem": "* Scenario: A risk team is estimating the beta of Stock X relative to a broad market index using simple monthly holding-period returns derived from adjusted total-return price levels. There were no separate cash distributions beyond what is already reflected in the adjusted prices.\n\n  | Month-End Date | Stock X Adjusted Price | Market Index Total-Return Level |\n  |---|---:|---:|\n  | Jan 31 | 50.000000 | 100.00 |\n  | Feb 28 | 43.500000 | 90.00 |\n  | Mar 31 | 44.370000 | 90.00 |\n  | Apr 30 | 51.912900 | 99.00 |\n  | May 31 | 68.525028 | 118.80 |\n\n  Use the beta convention defined as: sample covariance of Stock X\u2019s monthly simple returns with market monthly simple returns divided by the sample variance of the market monthly simple returns.\n\n  For next year, the risk-free rate is 3.00%, the expected broad-market return is 9.00%, and the analyst\u2019s forecast return for Stock X is 13.25%. A portfolio manager is considering investing $40,000,000 in Stock X. Ignore taxes and transaction costs.\n\n* The Core Question: What is the expected annual dollar alpha of the proposed investment relative to Stock X\u2019s CAPM-required return, rounded to the nearest whole dollar?", "answer": "$500,000", "feedback": "Verdict: Correct\n\nAnalysis: My independent derivation yields monthly simple returns for Stock X of \u221213%, 2%, 17%, and 32%, and for the market of \u221210%, 0%, 10%, and 20%. The resulting sample covariance-to-variance ratio gives a beta of exactly 1.5. The CAPM-required return is 3.00% + 1.5 \u00d7 (9.00% \u2212 3.00%) = 12.00%, producing an alpha of 13.25% \u2212 12.00% = 1.25%. Applied to the $40,000,000 position, the expected annual dollar alpha is 0.0125 \u00d7 $40,000,000 = $500,000. The student's final answer of $500,000 matches my result exactly. The numbers in this problem were clearly constructed to produce clean returns and an exact beta, so no rounding tolerance issues arise.\n\nAmbiguities: The phrase \"sample covariance ... divided by the sample variance\" is well-specified, and conveniently the choice of population (n) versus sample (n\u22121) denominators does not affect beta since the divisor cancels in the ratio. The only mild ambiguity is \"expected annual dollar alpha,\" which could conceivably be interpreted as alpha relative to the analyst's forecast versus the market rather than CAPM, but the question explicitly anchors it to \"Stock X's CAPM-required return,\" resolving that. Effectively: None of consequence.", "verdict": "Correct"}, {"entry_id": 76, "problem": "* Scenario: A company needs a production machine on January 1, 2026. The vendor offers two alternatives:\n  * Buy the machine immediately for **$250,000 cash**.\n  * Enter a lease-to-own arrangement running from **January 1, 2026 through December 31, 2027**, with payments made **at the end of each calendar quarter**. The rent is quoted as **$8,000 per month during 2026**, increasing by **5% for all of 2027**. At the end of the lease, on **December 31, 2027**, the company must pay a purchase-option amount equal to **30% of the original $250,000 cash price** to obtain title to the machine.  \n   \n  The company discounts these lease-to-own cash flows using its borrowing rate, quoted as an **8.00% nominal annual rate compounded quarterly**. Ignore taxes, maintenance, and any other costs.\n\n* The Core Question: What is the **net present dollar advantage of choosing the lease-to-own arrangement instead of buying the machine immediately**, rounded to the nearest whole dollar? Report a positive number if leasing is cheaper and a negative number if leasing is more expensive.", "answer": "**$5,955**", "feedback": "Verdict: Correct\n\nAnalysis: The student's final answer of **$5,955** matches my independently derived result. Working internally: the lease cash flows are $24,000 per quarter (quarters 1\u20134), $25,200 per quarter (quarters 5\u20138, reflecting the 5% increase), plus a $75,000 purchase option at quarter 8, all discounted at 2% per quarter. The present value of the lease-to-own alternative comes to approximately $244,045, yielding a net advantage of $250,000 \u2212 $244,045 \u2248 $5,955 (unrounded \u2248 $5,955.36) in favor of leasing. The student correctly aggregated monthly rents into quarterly payments, applied the deferred annuity treatment for the 2027 payments, discounted the purchase option to quarter 8, and used the correct periodic rate. The sign convention (positive = leasing cheaper) was also followed correctly.\n\nAmbiguities: The phrase \"**$8,000 per month** during 2026\" with payments \"**at the end of each calendar quarter**\" requires the solver to assume rents simply accumulate without intra-quarter interest into a $24,000 quarterly payment. A stricter interpretation might accrue interest on the first two months' rent within each quarter (or value the rents monthly at an equivalent monthly rate), which would slightly raise the lease's PV and shrink the advantage. The intended convention \u2014 treating the quarterly payment as exactly 3 \u00d7 monthly rent \u2014 appears to be what the question expects, but the wording invites this alternative reading.", "verdict": "Correct"}, {"entry_id": 77, "problem": "* Scenario: A risk manager is estimating one-day historical VaR for a trading portfolio. For each of the last 20 trading days, the portfolio was reset to exactly $10,000,000 at the market open, with no intraday cash flows. The end-of-day marked values were:\n\n  $10,080,000; $9,890,000; $10,120,000; $9,760,000; $10,050,000;  \n  $9,960,000; $10,180,000; $9,690,000; $10,020,000; $9,930,000;  \n  $10,110,000; $9,850,000; $10,070,000; $9,980,000; $10,150,000;  \n  $9,910,000; $10,040,000; $9,790,000; $10,090,000; $9,970,000.\n\n  The risk policy sets VaR using a 5% lower-tail exception rate. The current live portfolio value is $12,500,000. The risk committee requires a capital reserve equal to 110% of the dollar VaR. The desk already has $240,000 reserved.\n\n* The Core Question: Using the historical VaR function\u2019s logic, what additional capital reserve must the desk deposit, rounded to the nearest dollar?", "answer": "$90,000", "feedback": "Verdict: Correct\n\nAnalysis: The student's final answer of $90,000 matches my independently derived result. The portfolio returns over the 20 days range from \u22123.1% (worst, the $9,690,000 day) to +1.8%. With a 5% exception rate on 20 observations, the policy permits exactly one exception (5% \u00d7 20 = 1 day), so the VaR threshold is set at the second-worst return of \u22122.4% (the $9,760,000 day), leaving exactly one observation (\u22123.1%) in the exception tail. Applying this to the live portfolio: 2.4% \u00d7 $12,500,000 = $300,000 dollar VaR. The required reserve is 110% \u00d7 $300,000 = $330,000. Subtracting the existing $240,000 reserve yields an additional deposit of $90,000. The student correctly handled all three potential traps: (a) using returns from the $10M base but scaling to the $12.5M live portfolio, (b) applying the exception-rate logic (second-worst observation) rather than naively taking the single worst loss, and (c) applying the 110% multiplier before netting the existing reserve.\n\nAmbiguities: The phrase \"Using the historical VaR function's logic\" is the principal source of ambiguity, as it does not specify which quantile convention applies. Competing interpretations yield materially different answers: (1) taking the single worst return (\u22123.1%, since 5% \u00d7 20 = 1st order statistic, the Jorion-style convention) gives VaR = $387,500, reserve = $426,250, and an additional deposit of $186,250; (2) Excel's PERCENTILE/linear-interpolation convention gives a return of \u22122.435%, VaR = $304,375, and an additional deposit of $94,813. However, the explicit phrasing \"5% lower-tail exception rate\" most strongly supports the convention where exactly one of twenty observations breaches VaR (the second-worst observation), which is the interpretation the student used. A more precise question would state explicitly whether VaR is the k-th worst observation, an interpolated quantile, or the threshold permitting exactly \u230a\u03b1n\u230b exceptions.", "verdict": "Correct"}, {"entry_id": 78, "problem": "* Scenario: In a single-price opening auction for XYZ stock, the auction price is $50.00 and every eligible buy and sell interest is entered with a $50.00 limit price. Three buy-side participants submit orders derived from mandates:\n  * Fund A must invest exactly $30,000 in XYZ at the auction price.\n  * Fund B must increase its XYZ exposure from $135,000 to $150,000 at the auction price.\n  * Fund C must buy exactly $5,000 of XYZ at the auction price.\n\n  Two sell-side participants submit sell orders derived from liquidation instructions:\n  * Seller X must liquidate exactly $15,000 of XYZ at the auction price.\n  * Seller Y must liquidate exactly $10,000 of XYZ at the auction price.\n\n  The exchange matches the resulting buy and sell orders using `match_orders_pro_rata` exactly as written. The exchange charges a clearing fee of $0.03 per share on every share count appearing as `executed_quantity` in the returned match records.\n\n* The Core Question: What is the exchange\u2019s total clearing-fee revenue in dollars, rounded to the nearest cent?", "answer": "$10.41", "feedback": "Verdict: Incorrect\n\nAnalysis: My independently derived result is **$15.00**, which does not match the student's answer of $10.41. Working through the order construction: Fund A buys 600 shares ($30,000 \u00f7 $50), Fund B buys 300 shares (the $15,000 exposure *increase* \u00f7 $50), and Fund C buys 100 shares, for total buy interest of 1,000 shares. Seller X offers 300 shares and Seller Y offers 200 shares, for total sell interest of 500 shares. The auction crosses min(1,000, 500) = 500 shares; with standard pro-rata allocation (50% fill ratio on the buy side: A gets 300, B gets 150, C gets 50, all of which split cleanly across the two sellers with no fractional-share truncation), the sum of all `executed_quantity` values across the match records is exactly 500 shares. The clearing fee is therefore 500 \u00d7 $0.03 = $15.00. The student's answer of $10.41 implies a total executed quantity of 347 shares ($10.41 \u00f7 $0.03), which does not correspond to any natural intermediate quantity in this problem. The most likely errors are: (a) misreading Fund B's order as something other than the $15,000 incremental purchase, combined with an allocation/rounding mistake, or (b) inventing truncation behavior in the matching function that does not arise here, since all pro-rata allocations are whole numbers. Even if the matcher splits fills across multiple records, the executed quantities must still sum to 500.\n\nAmbiguities: The question instructs that orders are matched \"using `match_orders_pro_rata` exactly as written,\" yet the function's code is **not provided** in the problem. This is a material ambiguity: if the function contains nonstandard logic (e.g., floor-based rounding that discards residual shares, double-counting of records, or per-record minimum sizes), the total `executed_quantity` could differ from the canonical 500 shares. Additionally, the phrase \"every share count appearing as `executed_quantity` in the returned match records\" could invite double-counting if a single fill appears in both a buy-side and a sell-side record \u2014 though under the standard single-record-per-match convention, the answer remains $15.00. Finally, \"Fund B must increase its XYZ exposure from $135,000 to $150,000\" requires the solver to infer the incremental $15,000 purchase rather than the full $150,000, which is a deliberate but potentially confusing framing.", "verdict": "Incorrect"}, {"entry_id": 79, "problem": "* Scenario:  \nAn investor opens a separately managed equity account on January 1, 2022 by purchasing 5,000 shares of a fund at $20.00 per share. There are no taxes, fees, or transaction costs.  \n  * On December 31, 2022, the fund pays a cash dividend of $1.40 per share, which the investor withdraws rather than reinvesting.  \n  * On December 31, 2023, the investor contributes an additional $15,000 of outside cash to the account to buy more shares. No dividend is paid in 2023.  \n  * On December 31, 2024, the investor liquidates the entire position of 5,600 shares at $26.52 per share.  \n\nThe investor\u2019s policy benchmark return over the same three-year horizon is 9.75% per year.\n\n* The Core Question:  \nWhat is the investor\u2019s annual money-weighted excess return over the policy benchmark, in basis points, rounded to the nearest whole basis point?", "answer": "225 bps", "feedback": "Verdict: Correct\n\nAnalysis: The student's final answer of 225 bps matches my independently derived result. The cash flow structure (initial outflow of $100,000; a $7,000 dividend withdrawal at end of year 1; a $15,000 contribution at end of year 2; and a $148,512 liquidation at end of year 3) yields a money-weighted return (IRR) of exactly 12.00% per year \u2014 the numbers in this problem are constructed to solve cleanly. Subtracting the 9.75% benchmark gives an arithmetic excess of 2.25%, i.e., 225 basis points. The student correctly identified that the dividend was withdrawn (a cash inflow to the investor, not reinvested) and that the contribution was an additional outflow, both of which are the most common conceptual traps in this problem. Final answer verified as correct.\n\nAmbiguities: The phrase \"annual money-weighted excess return over the policy benchmark\" does not specify whether the excess should be computed arithmetically (12.00% \u2212 9.75% = 2.25% \u2192 225 bps) or geometrically (1.12/1.0975 \u2212 1 \u2248 2.28% \u2192 228 bps). The conventional interpretation in practice is the arithmetic difference, which the student used, but a geometrically inclined candidate could defensibly answer 228 bps. Additionally, the question implicitly requires the solver to infer the December 31, 2023 share purchase price ($25.00, deduced from $15,000 buying the 600 shares needed to reach 5,600 total); while solvable, stating the purchase price explicitly would remove any inferential burden.", "verdict": "Correct"}, {"entry_id": 80, "problem": "* Scenario: A state treasury is evaluating the fiscal effect of a new infrastructure appropriation. In FY2025, before an emergency port-repair package, state domestic income was $512.800 billion. After the package was completed, state domestic income was $521.920 billion. Over the same period, qualifying state infrastructure spending rose from its normal annual level of $7.350 billion to $10.390 billion, and analysts attribute the income change solely to this spending increase.  \n  For FY2026, the treasury is considering an additional $1.875 billion rail-modernization appropriation. Assume the same multiplier effect applies. The state collects income tax equal to 4.8% of the induced increase in state domestic income. The net budget impact equals incremental income-tax revenue minus the new app
