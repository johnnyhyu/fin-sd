. Total benchmark return including dividends is 12.00%, total fund return including distributions is 14.00%, yielding an upside capture ratio of 116.67%. Compared against the 115% threshold, the manager exceeded it by 1.67 percentage points, and therefore passes the quarterly review. The student correctly included both the index dividend points and the fund's cash distribution in the total return calculations, and correctly expressed the difference in capture-ratio percentage points rather than return percentage points.\n\nAmbiguities: The phrase \"By how many percentage points did the manager exceed or fall short of the 115% policy threshold\" admits an alternative interpretation: one could compute the required return (115% \u00d7 12% = 13.80%) and compare it to the fund's 14.00% return, yielding an excess of 0.20 percentage points (in return space). However, since the threshold itself is stated as a capture percentage (115%), measuring the gap in capture-ratio space (116.67% \u2212 115% = 1.67 pp) is the more natural reading, and the student's answer is consistent with it. Additionally, \"capture at least 115% of the benchmark's gain\" could arguably refer to price-only gain (11.00%) rather than total return (12.00%), but the explicit mention of dividend cash flows strongly signals total return is intended.", "verdict": "Correct"}, {"entry_id": 191, "problem": "* Scenario: A lessee is evaluating a 12-month automobile lease. The vehicle has an MSRP of $48,000. The negotiated selling price is $45,500, and a $900 acquisition fee is rolled into the lease. A $2,400 manufacturer rebate is applied as a capitalized cost reduction at signing. The lessor sets the end-of-lease residual at 58% of MSRP. The quoted lease rate is 4.8% per year, expressed as a decimal when used in the lease-payment formula. The lessee\u2019s employer reimburses exactly $1,400 per month toward the lease payment. Ignore taxes and all other fees.  \n* The Core Question: Using the lease-payment rule embedded in the function, what is the total unreimbursed lease cost over the full 12-month term, rounded to the nearest cent?", "answer": "$696.32", "feedback": "Verdict: Incorrect\n\nAnalysis: My independently derived result is **$1,084.16**. The net capitalized cost (selling price plus rolled-in acquisition fee minus rebate) is $44,000, and the residual is 58% of MSRP = $27,840. Standard depreciation per month is $1,346.67, and the monthly finance charge \u2014 using the money factor convention of annual rate \u00f7 24 (i.e., 0.048/24 = 0.002) applied to the sum of cap cost and residual ($71,840) \u2014 is $143.68, giving a monthly payment of $1,490.35. After the $1,400 monthly reimbursement, the unreimbursed amount is $90.3467/month, totaling $1,084.16 over 12 months. The student's answer of $696.32 implies a monthly payment of roughly $1,458.03, i.e., a monthly finance charge of $111.36 instead of $143.68. Notably, $111.36 = $55,680 \u00d7 0.002, where $55,680 = 2 \u00d7 residual (equivalently, cap cost + residual \u2212 total depreciation). This suggests the student likely made a conceptual error in the rent-charge base \u2014 using the residual twice (or netting depreciation out of the financing base) rather than summing the capitalized cost and the residual. The depreciation component appears to have been handled correctly, but the finance-charge computation is wrong, so the final answer does not match.\n\nAmbiguities: The phrase \"the lease-payment rule embedded in the function\" references a function that is not provided in the problem statement, leaving the exact formula (e.g., money factor = rate/24 vs. rate/12) to be inferred from convention. Additionally, \"The quoted lease rate is 4.8% per year, expressed as a decimal when used in the lease-payment formula\" does not explicitly state whether the standard money-factor conversion (\u00f72400 on the percentage, equivalently \u00f724 on the decimal) applies. Finally, \"rounded to the nearest cent\" does not specify whether rounding occurs at the monthly-payment level before annualizing ($1,084.20) or only on the final total ($1,084.16) \u2014 though neither interpretation rescues the student's answer.", "verdict": "Incorrect"}, {"entry_id": 192, "problem": "* Scenario: Today, a default-free zero-coupon bill requires an investment of $1,000 and pays $1,040 exactly one year from today. A default-free zero-coupon STRIP requires an investment of $1,000 and pays $1,123.60 exactly two years from today. Assume annual effective compounding and use Expectations Theory to infer the one-year interest rate expected to prevail one year from today. Separately, a corporation can lock in a one-year borrowing rate starting one year from today at 7.75% on a $25,000,000 principal, with interest paid at the end of that future one-year borrowing period and no fees.\n* The Core Question: What is the corporation\u2019s expected dollar interest saving from locking in the 7.75% borrowing rate instead of paying the Expectations Theory forecasted rate, rounded to the nearest whole dollar?", "answer": "$72,115", "feedback": "Verdict: Correct\n\nAnalysis: The student's final answer of $72,115 matches my independently derived result. The implied spot rates from the two instruments lead to a forward (expected) one-year rate one year from today of approximately 8.0385% (specifically, 1.1236/1.04 \u2212 1). The spread between this forecasted rate and the locked-in 7.75% rate, applied to the $25,000,000 principal, yields an expected interest saving of $72,115.38, which rounds to $72,115. The student correctly computed the forward rate via Expectations Theory and applied the rate differential to the full principal with interest paid at the end of the future one-year period (no discounting required, since the question asks for the dollar saving at the time interest is paid).\n\nAmbiguities: The phrase \"expected dollar interest saving\" could arguably invite discounting the saving back to today (present value), since the saving is realized two years from today. A student discounting $72,115.38 at the two-year rate (or by the appropriate path of rates) would arrive at a different figure (e.g., \u2248 $64,182 if discounted by 1.1236). However, the most natural reading\u2014dollar saving at the time interest is paid\u2014supports the undiscounted figure. Additionally, \"interest paid at the end of that future one-year borrowing period\" confirms the timing but does not explicitly state whether the answer should be expressed in time-2 or time-0 dollars.", "verdict": "Correct"}, {"entry_id": 193, "problem": "* Scenario: A company is evaluating a 12-month automobile lease for an employee. The vehicle has an MSRP of $48,000. The negotiated selling price is $45,500. The lease capitalizes an $895 acquisition fee and a $350 documentation fee. A $2,000 manufacturer rebate is applied as a capitalized-cost reduction. The contractual residual value at the end of the 12-month lease is 82% of MSRP. The dealer quotes a money factor of 0.00250, and the nominal annual lease rate is defined as the money factor multiplied by 24. The lease\u2019s base annual cost is the expected depreciation plus the annual financing charge on the residual value, spread evenly over 12 monthly payments. Ignore taxes, insurance, title, registration, and any end-of-lease fees. The employee receives a fixed vehicle reimbursement of $700 per month.\n\n* The Core Question: What is the total 12-month reimbursement surplus or shortfall versus the lease payments, rounded to the nearest cent?", "answer": "$653.40 surplus", "feedback": "Verdict: Correct\n\nAnalysis: The student's final answer of $653.40 surplus matches my independently derived result exactly. The adjusted capitalized cost (selling price plus capitalized fees minus rebate), the residual at 82% of MSRP, the depreciation over the term, and the financing charge computed at the nominal annual rate (money factor \u00d7 24) applied to the residual value all combine to a total annual lease cost that, when compared against the $8,400 total annual reimbursement, yields precisely a $653.40 surplus. The student correctly followed the question's specific (and somewhat non-standard) definition of the financing charge as being applied to the residual value only, rather than the conventional lease formula that applies the money factor to the sum of the capitalized cost and residual.\n\nAmbiguities: The phrase \"the annual financing charge on the residual value\" is the primary source of potential confusion. Standard automotive lease mathematics computes the monthly finance charge as money factor \u00d7 (adjusted capitalized cost + residual value); a student trained on real-world lease conventions might apply that formula instead, arriving at a different (and per this question's definition, incorrect) result. Additionally, \"expected depreciation\" could conceivably be misread as depreciation from MSRP rather than from the adjusted capitalized cost, though the capitalization details strongly imply the latter. The phrase \"nominal annual lease rate is defined as the money factor multiplied by 24\" is explicit, but a careless reader might multiply by 12 instead. The question would benefit from an explicit formula to eliminate these interpretation risks.", "verdict": "Correct"}, {"entry_id": 194, "problem": "* Scenario: A lessee is evaluating a 36-month automobile lease. The car has an MSRP of $48,000. The negotiated selling price is $45,200, and an $800 acquisition fee is rolled into the lease balance. At signing, the lessee makes a $3,000 capital cost reduction and receives a $1,200 manufacturer lease rebate, also applied as a capital cost reduction. The lease contract states the vehicle\u2019s end-of-lease residual is 58% of MSRP, and the lease financing rate is 4.8% expressed annually. Ignore taxes, registration, insurance, and any end-of-lease fees. The dealer quotes a base monthly payment of $1,310.\n* The Core Question: Using the lease payment function, what is the total dollar amount by which the dealer\u2019s quoted payments exceed the function-implied payments over the full 36-month lease, rounded to the nearest whole dollar?", "answer": "$1,271", "feedback": "Verdict: Incorrect\n\nAnalysis: The student's final answer of $1,271 does not match my independently derived result. Working from the standard lease payment function: the net capitalized cost is $45,200 + $800 \u2212 $3,000 \u2212 $1,200 = $41,800, the residual is 0.58 \u00d7 $48,000 = $27,840, and the money factor is 0.048/24 = 0.002. The monthly depreciation charge is ($41,800 \u2212 $27,840)/36 \u2248 $387.78, and the rent charge is ($41,800 + $27,840) \u00d7 0.002 = $139.28, giving a function-implied payment of approximately $527.06. The dealer's quote of $1,310 exceeds this by about $782.94 per month, for a total overage of approximately **$28,186** over 36 months. (If one instead interprets \"lease payment function\" as the actuarial annuity PMT formula at 0.4% monthly, the implied payment is \u2248 $528.50 and the total difference \u2248 $28,134 \u2014 still nowhere near $1,271.) The student's figure of $1,271 implies a monthly discrepancy of only ~$35.31, suggesting they likely made a compounding of errors: possibly failing to subtract the residual value from the capitalized cost (treating the lease as a full purchase loan), mishandling the cap cost reductions, or comparing the dealer quote against an incorrectly amortized balance near $42,660. No standard or near-standard application of the lease payment formula to these inputs produces $1,271.\n\nAmbiguities: The phrase \"Using the lease payment function\" is not precisely defined \u2014 it could mean the conventional money-factor lease formula (depreciation + rent charge) or an actuarial annuity PMT calculation with the residual as future value; these yield slightly different payments (~$527.06 vs. ~$528.50) and thus different totals (~$28,186 vs. ~$28,134). Additionally, \"the lease financing rate is 4.8% expressed annually\" leaves open whether to convert via the money factor convention (rate/2400 on the percentage) or rate/12 as a periodic interest rate. Finally, the dealer quote of \"$1,310\" is implausibly high relative to any reasonable function-implied payment (~$527\u2013$529), which may indicate a typo in the problem (e.g., intended as $531 or similar), inviting confusion about the expected magnitude of the answer.", "verdict": "Incorrect"}, {"entry_id": 195, "problem": "* Scenario:  \nA manufacturing firm uses a two-bin inventory system for a low-cost consumable component. Over the last 80 operating days, the plant used 9,600 units of the component. Supplier records show that a replenishment order placed at 8:00 a.m. on May 1 was delivered and available for use at 8:00 a.m. on May 15. The firm operates every calendar day.  \n   \n  The firm\u2019s inventory policy requires a safety buffer equal to 2.5 days of average usage. The current reserve bin contains 1,800 units. Each unit costs $25, and the firm applies an annual inventory carrying charge of 18% of the inventory value.\n\n* The Core Question:  \nIf the firm adjusts the reserve bin to the policy-required level, what is the annual incremental carrying cost, rounded to the nearest dollar?", "answer": "$810", "feedback": "Verdict: Correct\n\nAnalysis: The student's final answer of $810 matches my independently derived result. Average daily usage is 120 units (9,600 \u00f7 80). The lead time from 8:00 a.m. May 1 to 8:00 a.m. May 15 is 14 days, giving lead-time demand of 1,680 units. Adding the safety buffer of 2.5 days \u00d7 120 = 300 units yields a policy-required reserve bin of 1,980 units. The increase from the current 1,800 units is 180 units, and the incremental annual carrying cost is 180 \u00d7 $25 \u00d7 18% = $810. The student correctly handled the most common pitfalls: counting the lead time as 14 days (not 15), and computing only the *incremental* carrying cost (not the full reserve bin's carrying cost of $8,910).\n\nAmbiguities: \n1. \"adjusts the reserve bin to the policy-required level\" \u2014 In a two-bin system, the reserve bin conventionally holds the reorder point quantity (lead-time demand + safety stock). However, a reader could misinterpret \"policy-required level\" as referring only to the safety buffer (300 units), which would imply *reducing* the bin and yield a cost *savings* rather than an incremental cost. The phrase \"incremental carrying cost\" steers toward the intended interpretation, but the question could state explicitly that the reserve bin must cover lead-time demand plus the safety buffer.\n2. \"carrying charge of 18% of the inventory value\" \u2014 It is implicitly assumed the carrying cost applies to the full incremental units held (appropriate for safety/reserve stock, which is held continuously), rather than to average inventory. This is the standard treatment, but stating \"applied to units held continuously\" would remove doubt.\n3. The lead-time calculation (\"8:00 a.m. on May 1... 8:00 a.m. on May 15\") is precise and unambiguous at exactly 14 days \u2014 a well-constructed detail.", "verdict": "Correct"}, {"entry_id": 196, "problem": "* Scenario: On January 1, 2026, a freelancer finances a work vehicle. The dealer invoice is $12,700. The freelancer receives a $1,500 trade-in credit and pays a $1,200 cash deposit, financing only the remaining balance. The fixed loan rate is set at the central-bank prime rate of 8.25% plus a lender spread of 3.75%. The loan contract has 12 scheduled monthly payments. Separately, the freelancer cancels a storage lease, freeing $625 per month, but must reserve $125 per month for vehicle maintenance; the remaining monthly cash flow is paid as an extra loan payment. Once the loan is fully paid off, a client reimburses the freelancer a fixed $11,400 equipment allowance. Use `calculate_total_loan_cost` exactly as written, including its treatment of the final payoff month.\n\n* The Core Question: What is the freelancer\u2019s net cash surplus from the $11,400 reimbursement after covering the total loan cost, rounded to the nearest whole dollar?", "answer": "$292 surplus", "feedback": "Verdict: Correct\n\nAnalysis: My independent derivation: the financed principal is $12,700 \u2212 $1,500 \u2212 $1,200 = $10,000. The annual rate is 8.25% + 3.75% = 12%, i.e., 1% monthly. The standard 12-month amortizing payment computes to \u2248 $888.49. The extra payment is $625 \u2212 $125 = $500/month, giving a total monthly outlay of \u2248 $1,388.49. Simulating the amortization with this combined payment, the balance falls below the combined payment during month 8 (remaining payoff \u2248 $712.49 after interest). Under the stated function's treatment \u2014 charging the full scheduled combined payment in the final payoff month rather than only the remaining balance \u2014 total loan cost = 8 \u00d7 $1,388.49 \u2248 $11,107.90. Net surplus = $11,400 \u2212 $11,107.90 \u2248 $292.10, which rounds to $292. The student's answer of $292 surplus matches my hidden result exactly. (Note: had the final month been truncated to the exact payoff amount, the total cost would be \u2248 $10,431.92, yielding a surplus of \u2248 $968 \u2014 the student correctly applied the full-final-payment convention implied by the question.)\n\nAmbiguities: The question instructs \"Use `calculate_total_loan_cost` exactly as written, including its treatment of the final payoff month,\" but the function's code is not actually provided in the problem text. Without it, the \"treatment of the final payoff month\" is genuinely ambiguous: it could mean (a) charging the full combined payment in the payoff month (yielding \u2248 $292 surplus) or (b) charging only the remaining balance plus interest (yielding \u2248 $968 surplus). Additionally, \"remaining monthly cash flow is paid as an extra loan payment\" could in principle be interpreted as the extra payment replacing rather than supplementing the scheduled payment, though the supplemental reading is the natural one.", "verdict": "Correct"}, {"entry_id": 197, "problem": "* Scenario:  \nA private-equity analyst is valuing HarborTech Components for an acquisition using a multiple of **underlying profit** from recurring operations.\n\nFor FY2025, HarborTech reported the following:\n\n1. **Customer billings and deductions**\n   * Gross product sales: **$52,400,000**\n   * Customer returns: **$1,150,000**\n   * Volume rebates granted to customers: **$850,000**\n\n2. **Recurring operating expenses**\n   * Raw materials: **$18,900,000**\n   * Direct labor: **$7,600,000**\n   * Factory overhead: **$4,250,000**\n   * Sales and administrative salaries: **$5,900,000**\n   * Recurring marketing expense: **$1,350,000**\n   * Rent and utilities: **$2,100,000**\n   * Depreciation on operating equipment: **$1,750,000**\n\n3. **One-time income items included in FY2025 reported income**\n   * Gain from sale of an unused warehouse: **$2,800,000**\n   * Insurance settlement from a prior-year flood claim: **$950,000**\n\nThe buyer defines HarborTech\u2019s underlying profit as net recurring revenue minus recurring operating expenses, excluding one-time income items. The buyer will value the company at **7.5\u00d7 underlying profit**. HarborTech has **$14,000,000** of interest-bearing debt and **$3,250,000** of excess cash. The seller is asking for an equity purchase price of **$63,000,000**.\n\n* The Core Question:  \nWhat is the buyer\u2019s implied equity value shortfall versus the seller\u2019s asking price, rounded to the nearest whole dollar?", "answer": "**$9,250,000**", "feedback": "Verdict: Incorrect\n\nAnalysis: The student's final answer of $9,250,000 does not match my independently derived result of **$9,625,000**. The correct path: net recurring revenue of $50,400,000 (gross sales less returns and rebates), total recurring expenses of $41,850,000, giving underlying profit of $8,550,000. Applying the 7.5\u00d7 multiple yields an enterprise value of $64,125,000; subtracting net debt of $10,750,000 ($14,000,000 debt less $3,250,000 excess cash) produces an implied equity value of $53,375,000, and a shortfall of $9,625,000 versus the $63,000,000 ask. The student's answer is exactly $375,000 too low, which corresponds precisely to a $50,000 understatement of recurring expenses amplified by the 7.5\u00d7 multiple ($50,000 \u00d7 7.5 = $375,000). This strongly suggests an arithmetic slip when summing the seven expense line items (e.g., totaling $41,800,000 instead of $41,850,000, perhaps misreading marketing as $1,300,000 or overhead as $4,200,000). The conceptual framework (excluding one-time items, bridging EV to equity via net debt) appears to have been applied correctly.\n\nAmbiguities: The question is largely precise, but two minor points could invite alternative interpretations: (1) the phrase \"**excess cash: $3,250,000**\" requires the solver to know it should be added back in the EV-to-equity bridge \u2014 a solver might omit it or net it differently; and (2) \"the buyer defines underlying profit as net recurring revenue minus recurring operating expenses\" implicitly requires treating depreciation as a recurring operating expense rather than excluding it (as in an EBITDA-style metric); a solver could plausibly argue for a $10,300,000 EBITDA-based underlying profit if depreciation were excluded. However, the explicit listing of depreciation under \"Recurring operating expenses\" makes the intended treatment reasonably clear.", "verdict": "Incorrect"}, {"entry_id": 198, "problem": "* Scenario: NovaMach Ltd. is testing its year-end bank covenant, which is based on **underlying profit** rather than accounting profit. During the fiscal year, NovaMach sold **240,000 units** at a list price of **$75 per unit**. Customers received a **3% sales discount**, and accepted product returns reduced sales by an additional **$210,000**. NovaMach also sold **1,200 annual maintenance subscriptions** at **$2,000 each** on July 1, with revenue recognized evenly over the 12-month service period.  \n  Its recurring operating costs were: manufacturing cost of **$31 per unit sold**, salaries of **$3,150,000**, facility rent of **$210,000 per month**, recurring marketing costs of **$1,275,000**, normal depreciation of **$890,000**, and customer-support software fees of **$55,000 per month**.  \n  The accounting records also included these non-recurring signed profit impacts: a **$1,100,000 gain** on sale of an unused warehouse, a **$650,000 lawsuit settlement expense**, a **$420,000 restructuring severance charge**, and a **$275,000 insurance recovery gain**.  \n  The bank covenant requires underlying profit to be at least **12.0% of recognized revenue**.\n\n* The Core Question: What is NovaMach\u2019s covenant headroom or shortfall in dollars, where a positive number means headroom and a negative number means shortfall? Round to the nearest whole dollar.", "answer": "**-$4,000**", "feedback": "Verdict: Incorrect\n\nAnalysis: My independently derived result is a covenant **headroom of +$301,000**. Recognized revenue should be $18,450,000 (net product sales of $17,250,000 after the 3% discount and $210,000 of returns, plus 6 months of the subscription revenue, $1,200,000, since the July 1 contracts span the fiscal year-end). Total recurring operating costs sum to $15,935,000, giving an underlying profit of $2,515,000 \u2014 note that the four non-recurring items are *excluded* by definition of underlying profit. The covenant threshold is 12.0% \u00d7 $18,450,000 = $2,214,000, leaving headroom of $301,000.\n\nThe student's answer of **\u2212$4,000** strongly suggests a specific double-adjustment error: they appear to have correctly computed the underlying profit of $2,515,000 (which already excludes non-recurring items) but then subtracted the *net* non-recurring gain of $305,000 ($1,100,000 + $275,000 \u2212 $650,000 \u2212 $420,000) a second time, yielding $2,210,000. Comparing $2,210,000 against the $2,214,000 requirement produces exactly \u2212$4,000. In other words, they removed the non-recurring effects from a figure that never contained them, converting a comfortable headroom into a phantom shortfall. The error is conceptual (misunderstanding the baseline from which \"underlying\" adjustments are made), not arithmetic or rounding-related.\n\nAmbiguities: The question contains one mild interpretive issue: it states subscriptions were sold \"on July 1, with revenue recognized evenly over the 12-month service period\" but never explicitly states the fiscal year-end date. The standard inference is a December 31 year-end (6 months of subscription revenue recognized), and the phrase \"year-end bank covenant\" combined with the mid-year subscription sale strongly implies this. Additionally, \"recognized revenue\" could conceivably be debated as gross vs. net of discounts/returns, though net revenue is the conventional and correct reading. Neither ambiguity explains or excuses the student's result, which stems from the double-counting of non-recurring items.", "verdict": "Incorrect"}, {"entry_id": 199, "problem": "* Scenario: A developer is completing a 260-unit apartment construction project. The total development budget consists of:\n  * Hard construction costs: $42,000,000  \n  * Soft costs: 15% of hard construction costs  \n  * Land acquisition cost: $9,500,000  \n  * Construction contingency: $3,200,000  \n  * Financing fees funded at closing: $1,100,000  \n\n  The sponsor contributes exactly $18,000,000 of cash equity at closing, and the remaining budget is financed with a senior construction loan.\n\n  Upon stabilization after completion, projected monthly rent is $2,400 per unit, expected occupancy is 94%, and other monthly income is $150 per unit, also collected at 94% occupancy. Operating expenses are 32% of effective gross income, and replacement reserves are $300 per unit per year. The market capitalization rate for comparable stabilized assets is 5.75%.\n\n  A take-out lender will allow senior debt up to a maximum completed-project LTV of 60.0%. Do not round intermediate values.\n\n* The Core Question: What is the maximum additional senior debt, if any, that could be added at completion before reaching the lender\u2019s 60.0% LTV limit? Round to the nearest whole dollar.", "answer": "$8,172,351", "feedback": "Verdict: Incorrect\n\nAnalysis: My independently derived result is **$8,151,915** (to the nearest whole dollar). The chain of values: total budget of $62,100,000 (hard $42.0M + soft $6.3M + land $9.5M + contingency $3.2M + financing fees $1.1M), less $18.0M equity, yields an existing senior construction loan of $44,100,000. Stabilized NOI is $5,007,475.20 (EGI of $7,478,640 from rent and other income both at 94% occupancy, less 32% operating expenses of $2,393,164.80, less $78,000 of reserves at $300 \u00d7 260 units). Capitalizing at 5.75% gives a completed value of $87,086,525.22, and 60% LTV permits total senior debt of $52,251,915.13. Subtracting the existing $44,100,000 loan leaves maximum additional debt of **$8,151,915**.\n\nThe student's answer of $8,172,351 overstates the result by approximately $20,436. This implies an overstated property value of roughly $34,060, which traces back to an NOI overstated by about $1,958 (equivalently, an EGI overstated by about $2,880/year). The most likely culprit is a small error in constructing effective gross income or in applying the 94% occupancy factor (e.g., a slightly mis-keyed other-income figure or a rounded intermediate value carried through the capitalization step), since the structural steps (budget, loan sizing, cap rate, 60% LTV) all appear to have been applied correctly given how close the answer is. The deviation is too large to be attributable to acceptable final rounding, particularly given the explicit instruction not to round intermediate values.\n\nAmbiguities: The question is largely precise, but two phrases invite minor alternative interpretations: (1) \"replacement reserves are $300 per unit per year\" \u2014 it is not stated whether reserves apply to all 260 units or only occupied units (260 \u00d7 94%); the standard convention (all units) yields my answer, while the occupied-unit interpretation yields ~$8,200,750 \u2014 neither matches the student. (2) \"Operating expenses are 32% of effective gross income\" \u2014 it is clear OpEx is computed on EGI, but whether replacement reserves sit inside or below the expense line could confuse some students (though mathematically it does not change the result here, since reserves are stated as a separate fixed amount). Neither ambiguity explains the student's specific figure.", "verdict": "Incorrect"}, {"entry_id": 200, "problem": "* Scenario: A small manufacturer buys CNC equipment with a list price of $125,000. It pays $20,000 cash at closing and receives a $5,000 manufacturer rebate applied directly against the amount financed. The loan is funded on January 1 and requires equal monthly end-of-month payments until the contractual maturity one year later. The lender\u2019s fixed annual rate is quoted as the current prime rate of 8.25% plus a 3.75% credit spread, with monthly compounding/payment calculations.  \n  The borrower also sets up an automatic monthly cash-sweep so that each month\u2019s total payment equals the fully amortizing monthly payment that would retire the same initial loan balance over exactly 6 months at the same fixed annual rate. Do not round intermediate calculations.\n\n* The Core Question: What is the dollar reduction in total installment payments compared with simply following the original 12-month amortization schedule, rounded to the nearest whole dollar?", "answer": "$3,090", "feedback": "Verdict: Correct\n\nAnalysis: The student's final answer matches my independently derived result. With the amount financed of $100,000 ($125,000 list \u2212 $20,000 cash \u2212 $5,000 rebate) at a 12% annual rate (8.25% prime + 3.75% spread, i.e., 1% monthly), the 12-month fully amortizing payment is approximately $8,884.88, giving total payments of about $106,618.55. The 6-month fully amortizing payment on the same $100,000 balance is approximately $17,254.84, giving total payments of about $103,529.02 and retiring the loan in 6 months. The difference is approximately $3,089.53, which rounds to $3,090. The student's answer of $3,090 is exactly correct.\n\nAmbiguities: \n1. \"the dollar reduction in total installment payments\" \u2014 this is computed on a nominal (undiscounted) basis. A strict financial-engineering reading might invite a present-value comparison of the two payment streams, which would yield a different figure. The question implicitly assumes simple summation of nominal payments.\n2. \"each month\u2019s total payment equals the fully amortizing monthly payment that would retire the same initial loan balance over exactly 6 months\" \u2014 the phrase \"same initial loan balance\" is clear, but a reader could momentarily question whether the sweep payment applies for only 6 months (until payoff) or continues; logically, the loan extinguishes at month 6, but the question does not explicitly state that payments cease upon payoff.\n3. \"manufacturer rebate applied directly against the amount financed\" \u2014 this is reasonably precise, though some readers might debate whether the rebate reduces the price before or after the cash down payment; in this case, the order does not change the financed amount of $100,000.", "verdict": "Correct"}, {"entry_id": 201, "problem": "* Scenario: A trader buys 180 cash-settled floating-strike lookback put option contracts on Orion Corp. Each contract covers 100 shares. The option\u2019s payoff is based on the most favorable observed intraday price during the option term, and because it is floating-strike, the strike is set equal to the official closing price at maturity.\n\n  The trader pays an upfront premium of $2.15 per share and a fixed clearing fee of $1,200 for the whole trade. Ignore financing, dividends, and taxes.\n\n  During the option term, Orion Corp. trades as follows:\n\n  | Date | Intraday High | Intraday Low | Official Close |\n  |---|---:|---:|---:|\n  | Apr 1 | $48.20 | $46.75 | $47.60 |\n  | Apr 2 | $47.10 | $45.90 | $46.40 |\n  | Apr 3 | $49.60 | $46.80 | $49.10 |\n  | Apr 4 | $50.25 | $48.15 | $48.90 |\n  | Apr 5 | $49.30 | $44.40 | $45.25 |\n  | Apr 8 | $46.70 | $43.85 | $46.10 |\n  | Apr 9 | $48.90 | $45.20 | $48.35 |\n  | Apr 10 | $51.15 | $47.70 | $50.80 |\n  | Apr 11, maturity | $50.40 | $48.30 | $49.75 |\n\n* The Core Question: What is the trader\u2019s net dollar profit after exercise payoff, premium, and clearing fee, rounded to the nearest whole dollar?", "answer": "$66,300", "feedback": "Verdict: Correct\n\nAnalysis: The student's final answer of $66,300 matches my independently derived result under the question's literal definition. Taking the strike as the official close at maturity ($49.75) and the underlying valuation as the most favorable observed intraday price for a put holder (the lowest low, $43.85), the per-share payoff is $5.90. Across 180 contracts \u00d7 100 shares = 18,000 shares, the gross payoff is $106,200. Subtracting the premium (18,000 \u00d7 $2.15 = $38,700) and the $1,200 clearing fee yields a net profit of $66,300. The arithmetic is exact \u2014 no rounding issues arise. I note, however, that this result depends on accepting the question's non-standard definition (see below); under the textbook convention for a floating-strike lookback put, the payoff would be S_max \u2212 S_T = $51.15 \u2212 $49.75 = $1.40 per share, yielding a net loss of \u2212$14,700. The student correctly followed the question as written rather than the standard convention.\n\nAmbiguities: The question contains a significant internal inconsistency. It states the option is a \"floating-strike lookback put\" but then says \"because it is floating-strike, the strike is set equal to the official closing price at maturity.\" This contradicts the standard definition, in which a floating-strike lookback put has its strike float to the observed maximum (payoff = S_max \u2212 S_T); a strike equal to the terminal price combined with valuation at the observed minimum (payoff = S_T-based strike \u2212 S_min) is economically the payoff structure of a floating-strike lookback **call**. Additionally, the phrase \"the most favorable observed intraday price\" is imprecise \u2014 it does not specify whether \"favorable\" means the intraday high (favorable selling price for a put holder under the conventional structure) or the intraday low (favorable underlying valuation against a fixed terminal strike). These two readings produce materially different answers (+$66,300 vs. \u2212$14,700), so the question should be rephrased to state the payoff formula explicitly.", "verdict": "Correct"}, {"entry_id": 202, "problem": "* Scenario:  \nA C-corporation generated a federal tax loss in fiscal year 2024. All amounts below are federal tax-basis amounts, and the 80% limitation on annual NOL utilization applies. Ignore carrybacks, state taxes, credits, inflation, and time value of money.\n\n  **2024 tax-basis items:**\n  - Sales receipts: $9,600,000  \n  - Taxable interest income: $350,000  \n  - Deductible cost of goods sold and operating expenses: $15,200,000  \n  - Immediately deductible R&D costs: $3,100,000  \n  - Tax depreciation: $4,400,000  \n  - Deductible interest expense: $1,200,000  \n\n  **Subsequent-year tax-basis items before any NOL deduction:**\n\n  | Year | Sales receipts | Taxable interest income | Deductible operating costs | Deductible interest expense |\n  |---|---:|---:|---:|---:|\n  | 2025 | $18,000,000 | $200,000 | $14,500,000 | $400,000 |\n  | 2026 | $22,000,000 | $150,000 | $16,600,000 | $550,000 |\n  | 2027 | $23,500,000 | $100,000 | $17,000,000 | $600,000 |\n  | 2028 | $21,000,000 | $0 | $19,000,000 | $500,000 |\n\n  At December 31, 2028, after applying the NOL carryforward through 2028, auditors conclude that any remaining NOL is not realizable and must be fully written down. The federal corporate tax rate is 21%.\n\n* The Core Question:  \nUsing the NOL carryforward function with the 80% limitation applied, what is the required deferred tax asset write-down at December 31, 2028, rounded to the nearest whole dollar?", "answer": "$275,100", "feedback": "Verdict: Correct\n\nAnalysis: The student's final answer of $275,100 matches my independently derived result exactly. My hidden computation confirms a 2024 NOL of $13,950,000, sequential utilization in 2025\u20132028 capped at 80% of each year's pre-NOL taxable income ($2,640,000; $4,000,000; $4,800,000; $1,200,000, respectively), leaving a residual carryforward of $1,310,000 at December 31, 2028. Applying the 21% federal rate yields a deferred tax asset write-down of $275,100. The student correctly applied the 80% limitation year-by-year (rather than incorrectly offsetting full taxable income) and correctly tax-effected only the unrealizable remainder.\n\nAmbiguities: The question is largely precise, but two minor points could invite alternative interpretations: (1) \"Immediately deductible R&D costs\" assumes away the Section 174 capitalization/amortization rules effective for 2024, which a tax-savvy student might question, though the phrasing \"immediately deductible\" resolves it; (2) the phrase \"any remaining NOL is not realizable and must be fully written down\" presumes the DTA was carried at full value (no prior valuation allowance), which is implicit rather than explicitly stated. Neither ambiguity changes the intended computation.", "verdict": "Correct"}, {"entry_id": 203, "problem": "* Scenario: A manufacturer is evaluating a 4-year equipment project starting on January 1. To place the equipment into service, the firm must pay a supplier invoice of $1,150,000, freight of $70,000, and installation costs of $180,000 at time 0. The full installed cost is depreciated straight-line over 4 years to zero residual value. Ignore working capital and financing costs.  \n  Expected annual incremental results are:\n\n  | Year | Incremental Revenue | Cash Operating Costs |\n  |---:|---:|---:|\n  | 1 | $900,000 | $480,000 |\n  | 2 | $980,000 | $515,000 |\n  | 3 | $1,040,000 | $560,000 |\n  | 4 | $860,000 | $490,000 |\n\n  Cash operating costs exclude depreciation. The corporate tax rate is 25%, and annual accounting profit is defined as after-tax operating income: revenue minus cash operating costs minus depreciation, then minus tax. Management\u2019s required accounting rate of return benchmark is 4.25%.\n* The Core Question: Using the accounting rate of return formula, what is the project\u2019s ARR spread over the 4.25% benchmark, in basis points, rounded to the nearest whole basis point?", "answer": "24 bps", "feedback": "Verdict: Correct\n\nAnalysis: The student's final answer of 24 bps matches my independently derived result. The fully installed cost capitalizes the invoice, freight, and installation ($1,400,000), yielding straight-line depreciation of $350,000 per year. The resulting pre-tax operating incomes across the four years average $83,750, which after the 25% tax becomes an average after-tax accounting profit of $62,812.50. Dividing by the initial investment of $1,400,000 gives an ARR of approximately 4.4866%. The spread over the 4.25% benchmark is approximately 0.2366%, or 23.66 basis points, which rounds to 24 bps. The student's value is consistent with this computation, including correct capitalization of all three cost components and correct rounding to the nearest whole basis point.\n\nAmbiguities: The phrase \"Using the accounting rate of return formula\" is ambiguous because ARR has two common conventions: dividing average accounting profit by the **initial investment** versus by the **average investment** ((initial + salvage)/2). Under the average-investment convention, the ARR would be roughly 8.97%, producing a spread of approximately 472 bps rather than 24 bps. The question does not explicitly specify the denominator. The intended answer (24 bps) implies the initial-investment convention, but a student using the equally legitimate average-investment formula would arrive at a very different result. Stating \"ARR is computed on the initial installed cost\" would remove this ambiguity.", "verdict": "Correct"}, {"entry_id": 204, "problem": "* Scenario: A manufacturer is considering buying a new automated packaging line. The supplier invoice is **$800,000**, and the firm must also pay **$20,000** for delivery and **$30,000** for installation before the equipment is ready for use. The machine will be depreciated on a straight-line basis over **4 years** to an expected residual value of **$50,000**.  \n\n  The project is expected to produce and sell the following units:\n\n  | Year | Units Sold | Selling Price per Unit | Variable Cost per Unit | Incremental Fixed Cash Costs |\n  |---:|---:|---:|---:|---:|\n  | 1 | 120,000 | $12 | $7 | $250,000 |\n  | 2 | 130,000 | $12 | $7 | $250,000 |\n  | 3 | 125,000 | $12 | $7 | $250,000 |\n  | 4 | 135,000 | $12 | $7 | $250,000 |\n\n  Ignore taxes and financing costs. Management\u2019s minimum required accounting return is **18.00%**.\n\n* The Core Question: What is the project\u2019s accounting return spread over management\u2019s minimum required return, in **percentage points**, rounded to **2 decimal places**?", "answer": "**4.06 percentage points**", "feedback": "Verdict: Incorrect\n\nAnalysis: My independently derived answer is **23.67 percentage points**. The depreciable basis is $850,000 (invoice plus delivery and installation), giving annual straight-line depreciation of $200,000 down to the $50,000 residual. Average annual net income works out to $187,500 (average contribution margin of $637,500 less $250,000 fixed costs less $200,000 depreciation). Under the standard Average Accounting Return convention, this is divided by the **average book value** of (850,000 + 50,000)/2 = $450,000, yielding an accounting return of 41.67%, and a spread of 41.67% \u2212 18.00% = **23.67 percentage points**. The student's answer of 4.06 percentage points corresponds exactly to dividing average net income by the **initial investment** ($187,500 / $850,000 = 22.06%; 22.06% \u2212 18.00% = 4.06%). The student therefore made the classic conceptual error (or adopted the non-standard convention) of using initial cost rather than average book value as the denominator. Under the textbook-standard AAR definition, the answer is incorrect.\n\nAmbiguities: The phrase \"**accounting return**\" is the primary source of ambiguity \u2014 the question does not explicitly state whether the denominator should be the **average book value** (the dominant textbook convention for AAR) or the **initial investment** (a variant sometimes called ROI on initial cost). The student's answer of 4.06 is internally consistent with the initial-investment interpretation. To eliminate this ambiguity, the question should specify \"average accounting return based on average book value\" or define the metric explicitly.", "verdict": "Incorrect"}, {"entry_id": 205, "problem": "* Scenario: A portfolio manager buys 25,000 shares of Orion Devices at $40.00 per share at the start of a 6-month evaluation period. By the end of the period, the stock price is $45.20 per share, and the investor has received a cash dividend of $0.80 per share. Over the same 6-month period, the risk-free return is 3.0%, the broad market return is 10.0%, and Orion Devices has a beta of 1.20. Use CAPM to derive the expected return, and assume no taxes, fees, or transaction costs.\n\n* The Core Question: What is the abnormal dollar performance of the Orion Devices position relative to its CAPM-expected performance, rounded to the nearest whole dollar?", "answer": "$36,000", "feedback": "Verdict: Correct\n\nAnalysis: The student's final answer of $36,000 matches my independently derived result. The total holding-period return on the position is 15.0% (combining the $5.20 capital gain and $0.80 dividend per share on a $40.00 cost basis), while the CAPM-expected return is 11.4% (3.0% + 1.20 \u00d7 (10.0% \u2212 3.0%)). The abnormal return of 3.6% applied to the $1,000,000 initial position value (25,000 shares \u00d7 $40.00) yields exactly $36,000. The student correctly included the dividend in the realized return, correctly used the market risk premium (not the raw market return) in the CAPM formula, and correctly scaled the alpha to the dollar position size.\n\nAmbiguities: The question is largely precise, but two phrasings invite minor alternative interpretations: (1) \"abnormal dollar performance... relative to its CAPM-expected performance\" could conceivably be computed on the ending position value or with the expected dollar return compounded differently, though the standard convention (alpha \u00d7 initial investment) is clearly intended; (2) the statement that \"the risk-free return is 3.0%, the broad market return is 10.0%\" over \"the same 6-month period\" is helpfully explicit, but a careless reader might mistake these for annualized rates requiring de-annualization \u2014 the question's wording (\"over the same 6-month period\") resolves this, so no adjustment is needed.", "verdict": "Correct"}, {"entry_id": 206, "problem": "* Scenario: A company is reviewing its 401(k) plan for the plan year. For this plan\u2019s Actual Contribution Percentage compliance screen, each employee\u2019s contribution rate equals:\n\n\\[\n\\frac{\\text{employer matching contributions + employee after-tax contributions}}{\\text{eligible annual compensation}} \\times 100\n\\]\n\nThe plan must satisfy both limits:  \n1. The average rate for highly compensated employees must not exceed the average rate for non-highly compensated employees by more than 2 percentage points.  \n2. The average rate for highly compensated employees must not be more than twice the average rate for non-highly compensated employees.\n\nThe employee data are:\n\n| Employee Group | Eligible Compensation | Matching + After-Tax Contributions |\n|---|---:|---:|\n| HCE 1 | $240,000 | $16,800 |\n| HCE 2 | $200,000 | $13,000 |\n| HCE 3 | $180,000 | $11,700 |\n| NHCE 1 | $75,000 | $3,750 |\n| NHCE 2 | $60,000 | $2,400 |\n| NHCE 3 | $50,000 | $2,250 |\n| NHCE 4 | $40,000 | $1,800 |\n| NHCE 5 | $80,000 | $3,200 |\n| NHCE 6 | $55,000 | $2,475 |\n\nIf the plan fails this compliance screen, the company must record a fixed remediation reserve of $50,000. If it passes, no reserve is recorded.\n\n* The Core Question: What remediation reserve should the company record, rounded to the nearest dollar?", "answer": "$50,000", "feedback": "Verdict: Correct\n\nAnalysis: My independently derived HCE average contribution rate is 6.6667% (rates of 7.0%, 6.5%, and 6.5%), and the NHCE average is 4.4167% (rates of 5.0%, 4.0%, 4.5%, 4.5%, 4.0%, and 4.5%). Testing the first limit: the HCE average (6.6667%) exceeds the NHCE average plus 2 percentage points (6.4167%), so the plan fails this prong. Testing the second limit: the HCE average (6.6667%) does not exceed twice the NHCE average (8.8333%), so this prong passes. Because the question requires the plan to satisfy **both** limits, failing the first limit means the compliance screen fails overall, triggering the fixed $50,000 remediation reserve. The student's answer of $50,000 matches my result exactly.\n\nAmbiguities: The phrasing \"The plan must satisfy both limits\" is slightly nonstandard relative to actual IRS ACP testing, where a plan passes if it satisfies **either** the 1.25\u00d7 test or the \"2 percentage points / 2 times\" alternative test. Under the real-world \"either\" interpretation, the plan would pass (since the 2\u00d7 prong is satisfied) and no reserve would be needed. However, as the question explicitly stipulates that **both** conditions must hold, the student's answer is correct within the stated framework. A test-taker relying on outside regulatory knowledge rather than the literal problem text could justifiably arrive at $0, so this wording invites alternative interpretation.", "verdict": "Correct"}, {"entry_id": 207, "problem": "* Scenario: A manufacturer is evaluating a new automated packaging line. On January 1, the supplier quotes a machine price of $820,000, offers a $20,000 trade discount, and charges $24,000 for freight plus $56,000 for installation and calibration. All of these amounts are paid upfront at commissioning. The equipment will be used for 4 years and is expected to have a $100,000 residual value at the end of year 4. The firm uses straight-line depreciation for internal project evaluation and defines annual accounting profit as incremental revenue minus incremental cash operating expenses minus depreciation. Ignore taxes, financing costs, and working-capital effects.\n\n  Expected incremental revenues and cash operating expenses are:\n\n  | Year | Revenue | Cash Operating Expenses |\n  |---:|---:|---:|\n  | 1 | $620,000 | $340,000 |\n  | 2 | $690,000 | $360,000 |\n  | 3 | $760,000 | $390,000 |\n  | 4 | $830,000 | $420,000 |\n\n  Management requires an average accounting return of at least 14.75%.\n\n* The Core Question: By how many basis points does the project\u2019s average accounting return exceed or fall short of management\u2019s 14.75% cutoff, rounded to the nearest basis point, and should the project be accepted?", "answer": "Exceeds by 164 basis points; Accept.", "feedback": "Verdict: Incorrect\n\nAnalysis: The student's final figure does not match my independently derived result. The capitalized cost of the machine must include the freight and installation charges and must be reduced by the trade discount, giving a depreciable basis of $880,000 with $100,000 salvage. Straight-line depreciation is then $195,000 per year, producing accounting profits of $85,000, $135,000, $175,000, and $215,000, for an average profit of $152,500. Under the standard Average Accounting Return convention (average profit \u00f7 average book value, where average book value = (initial cost + salvage)/2 = $490,000), the AAR is approximately 31.12%, exceeding the 14.75% hurdle by roughly 1,637 basis points. Even under the alternative convention (average profit \u00f7 initial investment of $880,000), the AAR is about 17.33%, exceeding the cutoff by roughly 258 basis points. The student's answer of \"exceeds by 164 basis points\" corresponds to an AAR of about 16.39%, which is exactly what one obtains by ignoring the $20,000 trade discount (cost basis of $900,000, depreciation of $200,000/year, average profit of $147,500) and dividing by the gross initial investment ($147,500 / $900,000 \u2248 16.39%). The likely error is therefore failing to net the trade discount against the purchase price when capitalizing the asset. The \"Accept\" decision is correct under any reasonable interpretation, but the requested quantitative answer (the basis-point spread) is wrong.\n\nAmbiguities: The question states \"Management requires an average accounting return of at least 14.75%\" but never defines the denominator of the AAR. \"Average accounting return\" can be computed as average profit divided by average investment/book value (the textbook AAR convention, yielding \u224831.12%) or as average profit divided by initial investment (yielding \u224817.33%). Since the question asks for a precise basis-point spread \"rounded to the nearest basis point,\" this undefined denominator materially changes the answer and should have been specified. The phrase \"uses straight-line depreciation for internal project evaluation\" is clear, but the question would also benefit from explicitly stating that the trade discount reduces the capitalized cost (standard accounting treatment, but the source of the student's apparent error).", "verdict": "Incorrect"}, {"entry_id": 208, "problem": "* Scenario: A calendar-year 401(k) plan is running its ADP compliance test for the plan year ending December 31, 2025. Elective deferral percentages are calculated as employee elective deferrals divided by eligible compensation, expressed as percentage points. The plan uses the ADP pass/fail logic in `calculate_adp`.\n\n  Year-end payroll records are:\n\n  **Highly Compensated Employees (HCEs)**  \n  - HCE 1: eligible compensation of $250,000; elective deferrals of $25,000  \n  - HCE 2: eligible compensation of $200,000; elective deferrals of $18,000  \n  - HCE 3: eligible compensation of $180,000; elective deferrals of $18,000  \n  - HCE 4: eligible compensation of $300,000; elective deferrals of $30,000  \n\n  **Non-Highly Compensated Employees (NHCEs)**  \n  - NHCE 1: eligible compensation of $60,000; elective deferrals of $3,000  \n  - NHCE 2: eligible compensation of $50,000; elective deferrals of $2,000  \n  - NHCE 3: eligible compensation of $45,000; elective deferrals of $1,800  \n  - NHCE 4: eligible compensation of $40,000; elective deferrals of $2,400  \n  - NHCE 5: eligible compensation of $55,000; elective deferrals of $2,750  \n  - NHCE 6: eligible compensation of $70,000; elective deferrals of $2,800  \n\n  If the ADP test fails, the employer will correct it by making a fully vested qualified nonelective contribution to NHCEs only. The correction must be just large enough for the plan to pass the same ADP test with HCE deferrals unchanged. The QNEC is allocated to NHCEs in proportion to eligible compensation, and QNEC dollars count as additional NHCE deferrals for ADP purposes. Ignore all statutory caps and use exact calculations until the final rounding. The recordkeeper charges a $2,000 correction setup fee only if the ADP test fails.\n\n* The Core Question: What is the employer\u2019s total correction cash outlay, including any QNEC and setup fee, rounded to the nearest whole dollar?", "answer": "$11,867", "feedback": "Verdict: Correct\n\nAnalysis: The student's final answer matches my independently derived result. Working through the problem: the HCE ADP comes to 9.75% (average of 10%, 9%, 10%, 10%) and the NHCE ADP comes to 4.6667% (average of 5%, 4%, 4%, 6%, 5%, 4%). Under the standard ADP test (HCE ADP must not exceed the greater of 1.25 \u00d7 NHCE ADP, or the lesser of 2 \u00d7 NHCE ADP and NHCE ADP + 2 percentage points), the limit is 6.6667%, so the test fails. Because the QNEC is allocated pro rata to compensation, every NHCE's deferral rate increases by the same uniform amount, so the required NHCE ADP is the minimum x satisfying the test for an HCE ADP of 9.75%, which is x = 7.75% (via the \"NHCE + 2\" prong; the 1.25\u00d7 prong would require 7.8%). The needed increase is 7.75% \u2212 4.6667% = 3.0833 percentage points applied to total NHCE compensation of $320,000, yielding a QNEC of $9,866.67. Adding the $2,000 setup fee gives $11,866.67, which rounds to $11,867. The student's answer is exactly correct, including proper rounding only at the final step.\n\nAmbiguities:\n1. The phrase \"the plan uses the ADP pass/fail logic in `calculate_adp`\" references a function whose code is not provided in the problem. The solver must assume it implements the standard IRC \u00a7401(k)(3) ADP test (the 1.25\u00d7 / \"lesser of 2\u00d7 or +2\" rule). If `calculate_adp` implemented only one prong (e.g., strictly 1.25 \u00d7 NHCE ADP), the required NHCE ADP would be 7.8%, changing the QNEC to $10,026.67 and the total to $12,027.\n2. \"Expressed as percentage points\" is slightly informal; it could invite confusion about whether comparisons happen on decimal fractions or percentage-point values, though the math is invariant either way as long as consistency is maintained.\n3. \"Just large enough for the plan to pass\" implicitly assumes passing at exact equality (HCE ADP exactly equal to the limit counts as passing). If the test required strict inequality, the minimal QNEC would be unattainable as a closed value (an infimum), so the intended interpretation must be \"\u2264 passes.\"", "verdict": "Correct"}, {"entry_id": 209, "problem": "* Scenario: A calendar-year 401(k) plan must apply the ACP test. For each employee, the ACP rate equals:\n\n  \\[\n  \\frac{\\text{employer matching contributions + employee after-tax contributions}}{\\text{testing compensation}} \\times 100\n  \\]\n\n  Elective deferrals and profit-sharing contributions are excluded from the ACP numerator.\n\n  The plan has the following eligible employees:\n\n  | Group | Employee | Testing Compensation | Employer Match | Employee After-Tax | Elective Deferrals | Profit Sharing |\n  |---|---:|---:|---:|---:|---:|---:|\n  | HCE | Alice | $300,000 | $9,000 | $9,000 | $23,000 | $12,000 |\n  | HCE | Bruno | $250,000 | $7,500 | $5,000 | $23,000 | $10,000 |\n  | HCE | Carmen | $200,000 | $6,000 | $2,000 | $20,000 | $8,000 |\n  | HCE | Daniel | $150,000 | $4,500 | $0 | $15,000 | $6,000 |\n  | NHCE | Eva | $80,000 | $800 | $0 | $6,000 | $1,600 |\n  | NHCE | Finn | $70,000 | $700 | $350 | $5,000 | $1,400 |\n  | NHCE | Grace | $60,000 | $1,200 | $0 | $4,000 | $1,200 |\n  | NHCE | Hugo | $50,000 | $1,000 | $250 | $3,000 | $1,000 |\n  | NHCE | Iris | $40,000 | $600 | $600 | $2,000 | $800 |\n  | NHCE | Jonah | $90,000 | $900 | $0 | $7,000 | $1,800 |\n  | NHCE | Kira | $55,000 | $825 | $275 | $3,500 | $1,100 |\n  | NHCE | Liam | $45,000 | $900 | $450 | $2,500 | $900 |\n\n  Under the plan\u2019s correction policy, if the ACP test fails, the employer will make an additional corrective contribution allocated to every NHCE as the same percentage of each NHCE\u2019s testing compensation. This corrective contribution is included in the NHCE ACP calculation and does not affect the HCE ACP calculation.\n\n* The Core Question: What is the minimum total corrective employer contribution required for the plan to pass the ACP test, rounded to the nearest whole dollar?", "answer": "$2,450", "feedback": "Verdict: Correct\n\nAnalysis: The student's final answer of $2,450 matches my independently derived result exactly. My hidden computation confirms the HCE ACP averages to 4.5% and the NHCE ACP averages to 2.0%, causing the test to fail under both the 1.25\u00d7 prong (limit 2.5%) and the alternative prong (limit min(2 \u00d7 2.0%, 2.0% + 2%) = 4.0%). The most efficient path to passing is satisfying the \"plus 2 percentage points\" prong, which requires raising the NHCE ACP average to 2.5%. Because the corrective contribution is allocated as a uniform percentage of each NHCE's testing compensation, it raises every individual NHCE's ACP rate \u2014 and therefore the NHCE average \u2014 by exactly that percentage. The required uniform rate is 0.5%, and applying it to the total NHCE testing compensation of $490,000 yields a minimum corrective contribution of $2,450. The student's answer is fully consistent with this solution, indicating they correctly identified the binding prong (the +2 percentage point limit rather than the 1.25\u00d7 multiple) and correctly recognized that a uniform percentage allocation shifts the NHCE average one-for-one.\n\nAmbiguities: The question is largely precise, but two minor points invite alternative interpretations: (1) The phrase \"for the plan to pass the ACP test\" does not explicitly state the statutory passing criteria (the 1.25\u00d7 test or the lesser of 2\u00d7 / +2 percentage points alternative); a solver must import this from regulatory knowledge under IRC \u00a7401(m). (2) The instruction that the corrective contribution be \"the same percentage of each NHCE's testing compensation\" forecloses targeted QNEC strategies that could, in other contexts, yield a lower total cost \u2014 the word \"minimum\" could mislead a reader into seeking a targeted allocation, though the stated correction policy clearly constrains the allocation method. Additionally, the question does not specify whether individual ACP rates should be rounded (e.g., to the nearest hundredth of a percent) before averaging, though all rates here are clean, so no rounding ambiguity materially affects the answer.", "verdict": "Correct"}, {"entry_id": 210, "problem": "* Scenario: A calendar-year freelance consultant has uneven taxable income across the estimated-tax periods. Her net taxable consulting profit is:\n  * Jan. 1\u2013Mar. 31: $72,000  \n  * Apr. 1\u2013May 31: $24,000  \n  * Jun. 1\u2013Aug. 31: $144,000  \n  * Sep. 1\u2013Dec. 31: $60,000  \n\n  Her total annual estimated tax liability is computed as 29% of annual net taxable profit, reduced by a fixed $3,000 tax credit.\n\n  Estimated-tax payments are due on Apr. 15, Jun. 15, Sep. 15, and Jan. 15. She actually pays:\n  * Apr. 15: $18,000  \n  * Jun. 15: $10,000  \n  * Sep. 15: $35,000  \n  * Jan. 15: $25,000  \n\n  Use the annualized-income installment method: calculate cumulative income percentages by each period-end date, use those cumulative percentages to compute the required installment for each period, and then compare cumulative required installments with cumulative payments after each due date.\n\n  If cumulative payments are below cumulative required installments, the shortfall accrues simple underpayment interest at 8.00% per year using a 365-day year. Use exactly 61 days from Apr. 15 to Jun. 15, 92 days from Jun. 15 to Sep. 15, and 122 days from Sep. 15 to Jan. 15. Overpayments carry forward and earn no interest.\n\n* The Core Question: What is the total underpayment interest charge, rounded to the nearest cent?", "answer": "$141.19", "feedback": "Verdict: Correct\n\nAnalysis: The student's final answer of $141.19 matches my independently derived result exactly. The annual tax liability works out to $84,000, and applying the cumulative income percentages (24%, 32%, 80%, 100%) yields cumulative required installments of $20,160, $26,880, $67,200, and $84,000. Comparing against cumulative payments ($18,000; $28,000; $63,000; $88,000) produces a $2,160 shortfall after April 15 (accruing 61 days of interest, \u2248 $28.88) and a $4,200 shortfall after September 15 (accruing 122 days of interest, \u2248 $112.31), with no shortfall at the June 15 or January 15 checkpoints. The unrounded sum is $141.1857..., which correctly rounds to $141.19. The student handled the overpayment carryforward at June 15 properly and correctly applied simple interest on each shortfall only until it was cured at the next due date.\n\nAmbiguities: The question labels the method the \"annualized-income installment method,\" but the actual IRS method annualizes period income (e.g., multiplying by 4, 2.4, 1.5, 1) rather than using \"cumulative income percentages\" of the full-year total. A student applying the true statutory method would get different required installments. However, the question explicitly instructs to \"calculate cumulative income percentages by each period-end date\" and \"use those cumulative percentages to compute the required installment,\" which overrides the standard definition and makes the intended calculation unambiguous. Additionally, the phrase \"shortfall accrues simple underpayment interest\" could in principle mean interest runs until actual payment rather than only until the next due date, but the explicit day counts provided (\"exactly 61 days... 92 days... 122 days\") between consecutive due dates make the intended interest periods clear.", "verdict": "Correct"}, {"entry_id": 211, "problem": "* Scenario: A municipal parking authority is building a capital replacement fund. Starting on January 1, 2027, and continuing at the beginning of every calendar quarter through October 1, 2031, it transfers that quarter\u2019s net operating cash into the fund. Each month, the authority sells 180 parking permits at $150 per permit. Monthly operating costs are $8,200 for security, $1,950 for utilities, and $2,350 for administration. In addition, a $4,500 insurance premium is paid once per quarter. The fund starts with a zero balance, earns a nominal annual rate of 8% compounded quarterly, and interest is credited at the end of each quarter. On December 31, 2031, immediately after the final quarter\u2019s interest is credited, the authority must pay a capital equipment invoice of $950,000.\n\n* The Core Question: What is the net dollar surplus or shortfall in the capital replacement fund after paying the invoice, rounded to the nearest whole dollar?", "answer": "$16,549 surplus", "feedback": "Verdict: Correct\n\nAnalysis: The student's final answer matches my independently derived result. The quarterly net deposit (monthly net cash flow of revenue minus the three monthly cost items, aggregated over three months, less the quarterly insurance premium) compounds as a 20-payment annuity-due at 2% per quarter, yielding a fund balance of approximately $966,549 on December 31, 2031. After paying the $950,000 invoice, the surplus is $16,549 (more precisely, $16,549.37 before rounding). The student correctly identified the annuity-due structure (beginning-of-quarter deposits earning that quarter's interest), correctly counted 20 quarterly deposits, and correctly netted the insurance premium quarterly rather than monthly.\n\nAmbiguities: The question is largely precise, but one phrase invites minor interpretive risk: \"a $4,500 insurance premium is paid once per quarter\" does not specify the timing within the quarter (beginning vs. end), which could matter if cash flows were modeled monthly rather than netted into the quarterly deposit. However, since the problem states the authority \"transfers that quarter's net operating cash\" at the beginning of each quarter, the natural reading is that all of the quarter's operating cash flows (including the premium) are netted into a single beginning-of-quarter deposit of $39,000, which is the interpretation the student correctly applied. Additionally, \"through October 1, 2031\" requires the reader to infer that this is the 20th and final deposit; the phrasing is clear enough but a careless reader might miscount the number of quarters.", "verdict": "Correct"}, {"entry_id": 212, "problem": "* Scenario: A bank is evaluating a one-year credit-risk protection contract on a leveraged loan portfolio. The contract pays **$10,000,000 exactly one year from today** if, during the next year, **at least one** of the following two non-mutually exclusive stress events occurs:\n  * Event A: the portfolio\u2019s average interest coverage ratio falls below 1.5x.\n  * Event B: the portfolio\u2019s weighted-average credit spread widens by more than 250 bps.\n\n  The bank runs **40,000 equally weighted Monte Carlo scenarios**. In the simulation results:\n  * Event A occurs in **9,600** scenarios.\n  * Event B occurs in **7,200** scenarios.\n  * Both Event A and Event B occur in **2,800** scenarios.\n\n  The protection contract costs **$3,000,000 today**, and the continuously compounded risk-free rate for one year is **5%**.\n\n* The Core Question: Using the probability of at least one stress event occurring, what is the contract\u2019s **expected net present value**, rounded to the nearest dollar?", "answer": "**-$337,953**", "feedback": "Verdict: Incorrect\n\nAnalysis: The student's final answer of **\u2212$337,953** does not match my independently derived result of approximately **+$329,303** (an expected NPV that is *positive*, indicating the protection contract is attractively priced relative to the simulated stress probabilities). The student's answer is wrong in both magnitude and, critically, in sign. The most likely conceptual error: the student appears to have computed the probability of **exactly one** event occurring (i.e., subtracting the overlap of 2,800 scenarios twice, yielding 11,200/40,000 = 0.28) rather than the probability of **at least one** event (using inclusion\u2013exclusion once: 14,000/40,000 = 0.35). Using 0.28 produces an expected payoff of $2,800,000, whose discounted value falls short of the $3,000,000 cost, generating an NPV of roughly \u2212$336,500 \u2014 very close to the student's figure. The small residual discrepancy (~$1,400) suggests an additional minor rounding or discount-factor error (e.g., using a truncated value of e^(\u22120.05)). The correct approach \u2014 P(A\u222aB) = 0.35, expected payoff $3,500,000, discounted at e^(\u22120.05) \u2248 0.9512294, less the $3,000,000 cost \u2014 yields approximately +$329,303.\n\nAmbiguities: The question is largely precise, but two minor points merit note: (1) the phrase \"at least one of the following two non-mutually exclusive stress events\" is clear, yet a careless reader could misread the payoff trigger as requiring exactly one event \u2014 which appears to be precisely the student's error; (2) the question says \"the contract costs $3,000,000 today,\" and it is unambiguous that the cost should *not* be discounted, though students sometimes erroneously compound the premium forward. Neither point rises to a genuine defect in the question; the inclusion\u2013exclusion intent is stated explicitly (\"Using the probability of at least one stress event occurring\"). Therefore, effectively: **None** of consequence.", "verdict": "Incorrect"}, {"entry_id": 213, "problem": "* Scenario:  \nA technical trading desk evaluates Orion Mining Corp. after the close on **2026-03-20** using a **10-session Aroon lookback window** consisting of the 10 trading sessions below.\n\nThe desk defines:\n\n\\[\n\\text{Aroon Up}=100 \\times \\frac{10-\\text{sessions since the highest high}}{10}\n\\]\n\n\\[\n\\text{Aroon Down}=100 \\times \\frac{10-\\text{sessions since the lowest low}}{10}\n\\]\n\nwhere \u201csessions since\u201d means the number of trading sessions between the session containing the extreme value and **2026-03-20**. The current session has \u201csessions since\u201d equal to 0.\n\n| Date | High | Low |\n|---|---:|---:|\n| 2026-03-09 | 48.20 | 46.90 |\n| 2026-03-10 | 49.10 | 47.40 |\n| 2026-03-11 | 48.80 | 46.10 |\n| 2026-03-12 | 50.30 | 47.80 |\n| 2026-03-13 | 51.70 | 48.60 |\n| 2026-03-16 | 50.90 | 49.20 |\n| 2026-03-17 | 52.40 | 49.80 |\n| 2026-03-18 | 51.60 | 50.10 |\n| 2026-03-19 | 53.20 | 50.70 |\n| 2026-03-20 | 52.80 | 51.30 |\n\nThe desk computes the Aroon Oscillator as:\n\n\\[\n\\text{Aroon Oscillator}=\\text{Aroon Up}-\\text{Aroon Down}\n\\]\n\nThe desk\u2019s bullish-entry rule requires the Aroon Oscillator to exceed a benchmark of **+60.00**.\n\n* The Core Question:  \nWhat is the Aroon Oscillator\u2019s spread over the bullish-entry benchmark, in oscillator points, rounded to **2 decimal places**?", "answer": "**10.00**", "feedback": "Verdict: Incorrect\n\nAnalysis: My independently derived result is a spread of **0.00** points. The highest high (53.20) occurred on 2026-03-19, which is 1 session before the evaluation date, giving Aroon Up = 100 \u00d7 (10 \u2212 1)/10 = 90.00. The lowest low (46.10) occurred on 2026-03-11, which is 7 sessions before 2026-03-20 (counting 03-12, 03-13, 03-16, 03-17, 03-18, 03-19, 03-20), giving Aroon Down = 100 \u00d7 (10 \u2212 7)/10 = 30.00. The oscillator is therefore 90.00 \u2212 30.00 = 60.00, and the spread over the +60.00 benchmark is 60.00 \u2212 60.00 = 0.00. The student's answer of 10.00 implies an oscillator of 70.00, which most plausibly arises from miscounting the sessions since the lowest low as 8 instead of 7 (e.g., counting calendar gaps or counting inclusively from the start of the window), producing an erroneous Aroon Down of 20.00. (An alternative error \u2014 setting Aroon Up to 100 by treating the current session as the high and Aroon Down correctly at 30 \u2014 would yield the same wrong answer of 70 \u2212 60 = 10.00.) Note also that an oscillator of exactly 60.00 does not \"exceed\" the benchmark, so the spread is zero and the entry rule is not triggered.\n\nAmbiguities: The phrase \"the number of trading sessions **between** the session containing the extreme value and 2026-03-20\" is mildly ambiguous, as \"between\" could be read exclusively (excluding both endpoint sessions) rather than as the elapsed session count. However, the clarifying clause \"The current session has 'sessions since' equal to 0\" resolves this in favor of the standard elapsed-index interpretation, so the intended computation is well defined. Additionally, \"spread over the benchmark\" could conceivably be read as requiring strict exceedance before reporting a spread, but as a simple arithmetic difference it is unambiguous (0.00 either way).", "verdict": "Incorrect"}, {"entry_id": 214, "problem": "* Scenario: A self-employed derivatives consultant uses an annualized-income estimated-tax method in which the full-year tax burden is allocated according to when net business income is earned. Each installment equals the additional tax needed so that cumulative estimated-tax payments match the cumulative share of full-year net business income earned by that installment date.\n\n  The installment periods and cash-basis results are:\n\n  | Period | Gross billings | Deductible business costs |\n  |---|---:|---:|\n  | Jan. 1\u2013Mar. 31 | $220,000 | $70,000 |\n  | Apr. 1\u2013May 31 | $80,000 | $20,000 |\n  | Jun. 1\u2013Aug. 31 | $300,000 | $90,000 |\n  | Sep. 1\u2013Dec. 31 | $240,000 | $60,000 |\n\n  The consultant has no other income. For the year, a $50,000 personal deduction applies before tax. Tax is then computed as:\n  * 10% on the first $50,000 of taxable income,\n  * 20% on the next $150,000,\n  * 30% on taxable income above $200,000.\n\n  No credits apply. The first and second estimated-tax payments were made exactly as required under this annualized-income method. For the September 15 third installment, the consultant has reserved $47,500.\n\n* The Core Question: By how many dollars is the September 15 cash reserve short of the required third estimated-tax installment? Round to the nearest whole dollar.", "answer": "$1,500 shortfall", "feedback": "Verdict: Correct\n\nAnalysis: The student's final answer of a $1,500 shortfall matches my independently derived result exactly. Working internally: the full-year net business income totals $600,000, yielding taxable income of $550,000 after the personal deduction, and a full-year tax of $140,000 under the bracket schedule. The cumulative income shares earned by the first three installment dates are 25%, 35%, and 70%, so cumulative required payments are $35,000, $49,000, and $98,000, respectively. The third installment is therefore $98,000 \u2212 $49,000 = $49,000, and the $47,500 reserve falls short by exactly $1,500. The student's number is consistent with a correct application of every step: period income aggregation, deduction timing, bracket tax computation, cumulative-share allocation, and netting prior payments.\n\nAmbiguities: The question is largely self-contained because it explicitly defines the method (\"Each installment equals the additional tax needed so that cumulative estimated-tax payments match the cumulative share of full-year net business income earned by that installment date\"), which forecloses the alternative real-world IRS annualization approach (annualizing period income, computing tax on the annualized amount, then applying period percentages). One minor point that could invite a different reading is the phrase \"a $50,000 personal deduction applies before tax\" \u2014 a student might wonder whether the deduction should be allocated proportionally to each period's income rather than applied only to the full-year figure; however, since the prescribed method allocates the *full-year tax burden* by income share, this interpretation question does not change the result. Effectively: None of material consequence.", "verdict": "Correct"}, {"entry_id": 215, "problem": "* Scenario: A trader is analyzing an ascending triangle in shares of Orison Micro Inc. All prices are per share. The horizontal resistance line is defined as the arithmetic average of the three reaction highs observed during the pattern: $84.72, $84.78, and $84.75. The lowest price at the widest part of the triangle was $78.10. On the breakout day, the first confirming 10-minute bar closed above resistance at $85.40, and the trader bought 1,500 shares at that closing price. The breakout is therefore to the upside. The broker charges $0.008 per share on both entry and exit. Later, the stop-loss order fills exactly at the stop-loss level produced by the ascending-triangle stop-loss rule, with no slippage and no taxes.\n\n* The Core Question: What is the total realized trading loss, net of all broker commissions, expressed as a positive dollar amount and rounded to the nearest whole dollar?", "answer": "$9,999", "feedback": "Verdict: Incorrect\n\nAnalysis: My independently derived result is **$999**, not $9,999. The resistance line averages to $84.75, which serves as the stop-loss level under the standard ascending-triangle rule (a close back below the breached resistance invalidates the breakout). The per-share loss is $85.40 \u2212 $84.75 = $0.65, plus round-trip commissions of $0.016 per share, giving $0.666 per share \u00d7 1,500 shares = $999. The student's answer of $9,999 contains an extra digit relative to the correct value, suggesting either a transcription/typo error (an inadvertent leading \"9\") or a decimal-place error in scaling the per-share loss to the position size. The answer is not consistent with any plausible alternative stop placement either (e.g., a stop at the pattern low of $78.10 would yield $10,974, not $9,999), so this cannot be attributed to a defensible alternative interpretation.\n\nAmbiguities: The phrase \"the ascending-triangle stop-loss rule\" is the main source of imprecision \u2014 textbooks differ on whether the stop belongs at the broken resistance line (now support), slightly below it, at the apex, or below the most recent reaction low. The question presumes a single canonical rule without defining it. Additionally, \"the lowest price at the widest part of the triangle was $78.10\" is supplied as if relevant, which could mislead a reader into using it as the stop level rather than (correctly) recognizing it as data for the measured-move price target, which is never actually needed here.", "verdict": "Incorrect"}, {"entry_id": 216, "problem": "* Scenario: A trader is analyzing an ascending triangle pattern in shares of Meridian Tech Corp. Over several weeks, the stock repeatedly fails to close above a horizontal resistance zone at **$72.40**. At the widest part of the triangle, the lowest reaction low is **$65.10**.  \n  The trader uses the standard classical charting method for an upside ascending-triangle breakout: measure the triangle\u2019s vertical height at its widest point and project that distance upward from the breakout level.  \n  On the breakout day, the trader\u2019s buy-stop order is placed **$0.35 above resistance** and is filled exactly at that stop price. The trader buys **1,500 shares**. Assume the projected price target is reached and there are no commissions, taxes, slippage, or financing costs.\n\n* The Core Question: What is the trader\u2019s gross dollar profit when the projected upside price target is reached? Round to the nearest whole dollar.", "answer": "**$10,950**", "feedback": "Verdict: Incorrect\n\nAnalysis: The student's final answer of $10,950 does not match my independently derived result of **$10,425**. The correct approach: the triangle height is $72.40 \u2212 $65.10 = $7.30, projected upward from the resistance breakout level gives a target of $79.70. The entry price, however, is $72.40 + $0.35 = $72.75, so the per-share gain is $79.70 \u2212 $72.75 = $6.95, and the gross profit is $6.95 \u00d7 1,500 = $10,425. The student's figure of $10,950 equals exactly $7.30 \u00d7 1,500, which reveals their error: they computed the full measured-move height as the profit per share, neglecting to account for the fact that the buy-stop entry was filled $0.35 above the resistance level from which the target
