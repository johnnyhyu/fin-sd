<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Feedback Visualizer</title>
<style>
  :root {
    --correct: #22c55e;
    --partial: #f59e0b;
    --incorrect: #ef4444;
    --bg: #0f172a;
    --card: #1e293b;
    --border: #334155;
    --text: #e2e8f0;
    --muted: #94a3b8;
    --accent: #3b82f6;
  }
  * { box-sizing: border-box; margin: 0; padding: 0; }
  body { background: var(--bg); color: var(--text); font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", sans-serif; font-size: 14px; line-height: 1.5; }
  
  header { padding: 20px 24px 16px; border-bottom: 1px solid var(--border); display: flex; align-items: center; gap: 16px; flex-wrap: wrap; }
  header h1 { font-size: 18px; font-weight: 700; color: var(--text); }
  
  .stats { display: flex; gap: 10px; flex-wrap: wrap; }
  .stat { padding: 6px 14px; border-radius: 20px; font-size: 12px; font-weight: 600; cursor: pointer; border: 2px solid transparent; transition: all .15s; user-select: none; }
  .stat.all { background: #1e293b; border-color: var(--border); color: var(--text); }
  .stat.correct { background: #14532d; border-color: var(--correct); color: var(--correct); }
  .stat.partial { background: #451a03; border-color: var(--partial); color: var(--partial); }
  .stat.incorrect { background: #450a0a; border-color: var(--incorrect); color: var(--incorrect); }
  .stat.active { opacity: 1; }
  .stat:not(.active) { opacity: 0.5; }
  
  .search-wrap { margin-left: auto; }
  .search-wrap input { background: var(--card); border: 1px solid var(--border); border-radius: 8px; padding: 7px 12px; color: var(--text); font-size: 13px; width: 260px; outline: none; }
  .search-wrap input:focus { border-color: var(--accent); }
  
  main { display: flex; height: calc(100vh - 64px); }
  
  .list-panel { width: 360px; min-width: 280px; border-right: 1px solid var(--border); overflow-y: auto; flex-shrink: 0; }
  .list-panel::-webkit-scrollbar { width: 6px; }
  .list-panel::-webkit-scrollbar-track { background: transparent; }
  .list-panel::-webkit-scrollbar-thumb { background: var(--border); border-radius: 3px; }
  
  .entry-row { padding: 12px 16px; border-bottom: 1px solid var(--border); cursor: pointer; transition: background .1s; display: flex; gap: 10px; align-items: flex-start; }
  .entry-row:hover { background: rgba(255,255,255,.03); }
  .entry-row.selected { background: rgba(59,130,246,.12); border-left: 3px solid var(--accent); padding-left: 13px; }
  .entry-id { font-size: 11px; color: var(--muted); flex-shrink: 0; padding-top: 2px; min-width: 28px; }
  .entry-preview { flex: 1; min-width: 0; }
  .entry-preview .snippet { font-size: 12px; color: var(--muted); white-space: nowrap; overflow: hidden; text-overflow: ellipsis; margin-top: 2px; }
  .badge { display: inline-flex; align-items: center; font-size: 10px; font-weight: 700; padding: 2px 7px; border-radius: 10px; letter-spacing: .03em; }
  .badge.correct { background: #14532d; color: var(--correct); }
  .badge.partial { background: #451a03; color: var(--partial); }
  .badge.incorrect { background: #450a0a; color: var(--incorrect); }
  
  .detail-panel { flex: 1; overflow-y: auto; padding: 24px 32px; }
  .detail-panel::-webkit-scrollbar { width: 6px; }
  .detail-panel::-webkit-scrollbar-track { background: transparent; }
  .detail-panel::-webkit-scrollbar-thumb { background: var(--border); border-radius: 3px; }
  
  .detail-empty { display: flex; height: 100%; align-items: center; justify-content: center; color: var(--muted); font-size: 15px; }
  
  .detail-header { display: flex; align-items: center; gap: 12px; margin-bottom: 20px; }
  .detail-header h2 { font-size: 16px; font-weight: 600; }
  
  .section { margin-bottom: 20px; }
  .section-label { font-size: 11px; font-weight: 700; text-transform: uppercase; letter-spacing: .08em; color: var(--muted); margin-bottom: 8px; }
  .section-body { background: var(--card); border: 1px solid var(--border); border-radius: 10px; padding: 16px 18px; font-size: 13px; line-height: 1.7; white-space: pre-wrap; word-break: break-word; }
  .section-body.answer { color: #67e8f9; font-weight: 600; font-size: 14px; }
  
  .feedback-block { background: var(--card); border: 1px solid var(--border); border-radius: 10px; overflow: hidden; }
  .feedback-section { padding: 14px 18px; border-bottom: 1px solid var(--border); font-size: 13px; line-height: 1.7; white-space: pre-wrap; word-break: break-word; }
  .feedback-section:last-child { border-bottom: none; }
  .feedback-section-label { font-size: 11px; font-weight: 700; text-transform: uppercase; letter-spacing: .08em; color: var(--muted); margin-bottom: 6px; }
  
  .count-label { font-size: 12px; color: var(--muted); padding: 8px 16px; }
  
  mark { background: #854d0e; color: #fde68a; border-radius: 2px; padding: 0 2px; }
</style>
</head>
<body>
<header>
  <h1>Feedback Visualizer</h1>
  <div class="stats" id="stats"></div>
  <div class="search-wrap"><input type="text" id="search" placeholder="Search problems or feedback…" /></div>
</header>
<main>
  <div class="list-panel" id="list-panel">
    <div class="count-label" id="count-label"></div>
  </div>
  <div class="detail-panel" id="detail-panel">
    <div class="detail-empty">Select an entry to view details</div>
  </div>
</main>

<script>
const RAW = [{"entry_id": 0, "problem": "* Scenario: On January 2, a portfolio manager is evaluating a one-year equity trade using CAPM. A one-year zero-coupon Treasury bill with $100 face value is trading at $95.2380952381. For the stock being evaluated, a return regression reports covariance with the market of 0.0018 and market return variance of 0.0015. The broad market index is currently 5,000, is expected to end the year at 5,350, and is expected to distribute 100 index points of dividends during the year.  \n  The stock is expected to pay a $2.94 dividend in one year and trade ex-dividend at $57.45 immediately afterward. The stock currently can be purchased for $53.70 per share. If the stock\u2019s price immediately converges to its CAPM-based fair value today, the manager will buy and then sell 18,000 shares, paying $0.05 per share in transaction costs on both the purchase and the sale.\n\n* The Core Question: What is the net dollar profit from the trade, rounded to the nearest whole dollar?", "answer": "$21,600", "feedback": "Verdict: Correct\n\nAnalysis: The student's final answer of $21,600 matches my independently derived result exactly. My hidden computation confirms a risk-free rate of 5% (implied by the T-bill price), a beta of 1.2, an expected market return of 9%, a CAPM required return of 9.8%, a fair value of $55.00 per share, a gross gain of $1.30 per share on 18,000 shares, and total round-trip transaction costs of $0.10 per share. The net profit is indeed $21,600. The student's value is precise to the dollar with no rounding discrepancies.\n\nAmbiguities: The phrase \"If the stock's price immediately converges to its CAPM-based fair value today, the manager will buy and then sell\" could be misread regarding sequencing \u2014 i.e., whether the manager buys at $53.70 *before* convergence and sells at fair value, or whether the trade occurs after convergence (yielding no profit). The intended interpretation (buy at the current market price of $53.70, sell at the fair value of $55.00) is the only one producing a meaningful arbitrage-style profit, but the wording \"buy and then sell\" without explicit prices invites momentary confusion. Additionally, \"paying $0.05 per share in transaction costs on both the purchase and the sale\" is clear, but a careless reader might apply $0.05 total rather than $0.10 round-trip. Otherwise, the question's inputs are precise.", "verdict": "Correct"}, {"entry_id": 1, "problem": "* Scenario:  \nA commercial borrower plans to repay a fixed-rate mortgage on April 1, 2026. The loan was originated on April 1, 2019 and matures on April 1, 2029.\n\n  The original principal was $18,000,000. Through March 31, 2026, the borrower has made $2,145,000 of scheduled principal repayments and one voluntary principal curtailment of $355,000. There have been no other principal changes.\n\n  The March 2026 interest bill was $67,812.50, calculated as one month of simple interest on the unpaid principal outstanding during March after all principal reductions above.\n\n  The mortgage\u2019s prepayment clause requires the borrower to pay the present value of the annual interest-rate differential over the remaining term. Specifically, the annual shortfall is treated as:\n\n  \\[\n  \\text{Unpaid Principal} \\times (\\text{Loan Coupon Rate} - \\text{Matched Treasury Yield})\n  \\]\n\n  and is discounted using an ordinary-annuity present value factor at the matched Treasury yield, with annual compounding, over the remaining time to maturity.\n\n  A zero-coupon Treasury STRIP maturing on April 1, 2029 is quoted at exactly $88.8996358671 per $100 of face value, with annual compounding.\n\n  At closing, the borrower must also pay a $42,500 administrative/release fee to the old lender and will receive a $125,000 escrow refund, netted against the cash due.\n\n* The Core Question:  \nWhat is the borrower\u2019s total net cash outflow at closing to repay the old mortgage, including the prepayment charge, rounded to the nearest whole dollar?", "answer": "**$15,955,174**", "feedback": "Verdict: Correct\n\nAnalysis: The student's final answer of **$15,955,174** matches my independently derived result exactly. Working backward: the unpaid principal is $15,500,000 ($18,000,000 less $2,145,000 scheduled and $355,000 curtailment). The March interest bill of $67,812.50 implies a loan coupon of 5.25% (since $67,812.50 \u00d7 12 \u00f7 $15,500,000 = 5.25%). The STRIP price of $88.8996358671 over a 3-year remaining term implies a matched Treasury yield of exactly 4.00% annually compounded. The annual interest-rate differential is therefore 1.25%, giving an annual shortfall of $193,750. Discounted at 4% via a 3-year ordinary annuity factor of approximately 2.7750910, the prepayment charge is roughly $537,673.89. Adding principal ($15,500,000), the prepayment charge, the $42,500 fee, and subtracting the $125,000 escrow refund yields $15,955,173.89, which rounds to $15,955,174. The student's answer is consistent with this calculation, indicating correct identification of the implied coupon, implied Treasury yield, annuity factor, and the proper netting of closing items.\n\nAmbiguities:\n1. \"The March 2026 interest bill was $67,812.50\" \u2014 the question does not explicitly state whether this interest has already been paid or is still due at closing on April 1, 2026. A reasonable alternative interpretation would add the $67,812.50 of accrued March interest to the closing payoff, yielding $16,022,986. The phrasing \"bill\" suggests it was invoiced (and presumably paid) in the ordinary course, but this is not unambiguous.\n2. \"over the remaining time to maturity\" \u2014 the remaining term must be inferred as exactly 3 years (April 1, 2026 to April 1, 2029); this is clean here, but the question relies on the reader matching the STRIP maturity to the loan maturity rather than stating \"3 years\" explicitly.\n3. \"Unpaid Principal\" in the prepayment formula could conceivably be interpreted differently if any portion of principal were amortizing during the remaining term, but the question's static treatment (level annual shortfall as an ordinary annuity) makes the intended calculation clear enough.", "verdict": "Correct"}, {"entry_id": 2, "problem": "* Scenario: On January 2, 2026, Helios Consumer Staples Corp. has an equity market capitalization of $20.88 billion and 400 million shares outstanding. An institutional portfolio holds 125,000 shares. The current CPI index is 300.0. To convert each past fiscal year\u2019s nominal EPS into current-date dollars, multiply nominal EPS by `current CPI / fiscal-year average CPI`.\n\n  | Fiscal Year | Nominal EPS | Fiscal-Year Avg. CPI |\n  |---|---:|---:|\n  | 2016 | $0.800 | 200.0 |\n  | 2017 | $0.924 | 210.0 |\n  | 2018 | $1.080 | 225.0 |\n  | 2019 | $1.248 | 240.0 |\n  | 2020 | $1.400 | 250.0 |\n  | 2021 | $1.560 | 260.0 |\n  | 2022 | $1.728 | 270.0 |\n  | 2023 | $1.904 | 280.0 |\n  | 2024 | $2.088 | 290.0 |\n  | 2025 | $2.280 | 300.0 |\n\n  The sector benchmark CAPE ratio is 25.0. Assume Helios\u2019s 10-year inflation-adjusted average EPS remains unchanged, and the stock price immediately re-rates so that its CAPE equals the sector benchmark.\n\n* The Core Question: What is the portfolio\u2019s dollar valuation impact from this re-rating, rounded to the nearest whole dollar? State the answer as a positive gain or negative loss.", "answer": "-$1,087,500", "feedback": "Verdict: Correct\n\nAnalysis: The student's final answer matches my independently derived result exactly. Adjusting each year's nominal EPS to current dollars yields a 10-year inflation-adjusted average EPS of $1.74. The current share price ($20.88B / 400M shares = $52.20) implies a current CAPE of 30.0. Re-rating to the sector benchmark CAPE of 25.0 gives a target price of $43.50, a decline of $8.70 per share. Applied to the portfolio's 125,000 shares, the impact is a loss of $1,087,500. The student correctly identified the direction (loss, stated as negative) and magnitude.\n\nAmbiguities: The phrase \"the portfolio\u2019s dollar valuation impact from this re-rating\" could in principle be misread as the change in the company's total market capitalization rather than the institutional holding, but the question explicitly anchors the impact to \"the portfolio's\" position and asks for sign convention (\"positive gain or negative loss\"), so the intended interpretation is sufficiently clear. Otherwise, none.", "verdict": "Correct"}, {"entry_id": 3, "problem": "* Scenario: A venture fund is evaluating a one-year asset that can be purchased today for **$405,000**. At year-end, the asset\u2019s cash flow depends on demand. In **100 equally weighted market simulations**, demand is low in 30 simulations, normal in 50 simulations, and high in 20 simulations.  \n  In the low, normal, and high demand cases, unit sales are **8,000**, **12,000**, and **18,000**, respectively. Each unit generates **$95** of cash revenue and requires **$50** of variable cash cost. The asset also has a fixed year-end cash operating cost of **$120,000** and a year-end salvage cash inflow of **$40,000**, regardless of demand.  \n  The one-year risk-free rate must be inferred from a Treasury bill that costs **$100,000** today and pays **$102,000** in one year. The asset\u2019s risk-adjusted required return must be inferred using CAPM: the expected market return is **9.5%**, and the asset beta is **1.40**.  \n  Use the certainty-equivalent cash flow method, where the certainty-equivalent cash flow is the probability-weighted expected cash flow divided by one plus the difference between the risk-adjusted rate and the risk-free rate. Then discount that certainty-equivalent cash flow at the risk-free rate to determine today\u2019s value.\n\n* The Core Question: What is the asset\u2019s net present value to the venture fund, in dollars, rounded to the nearest whole dollar?", "answer": "**$3,126**", "feedback": "Verdict: Partially Correct due to rounding or minor variations\n\nAnalysis: My independently derived NPV is **$3,127** (specifically, \u2248 $3,127.05 before final rounding). The student's answer of **$3,126** is off by exactly $1. Tracing the discrepancy: the correct path yields a risk-free rate of 2%, a risk-adjusted rate of 12.5% via CAPM, state cash flows of $280,000 / $460,000 / $730,000, an expected cash flow of $460,000, a certainty-equivalent of $460,000 \u00f7 1.105 \u2248 $416,289.59, and a present value of \u2248 $408,127.05, giving NPV \u2248 $3,127. The student almost certainly truncated or rounded the certainty-equivalent cash flow to a whole dollar (e.g., $416,289) before discounting at 2%, which produces $408,126.47 \u2212 $405,000 \u2248 $3,126. The methodology and all conceptual steps appear correct; the deviation is purely an intermediate-rounding artifact. Under strict grading where the final answer must be exact to the nearest dollar, this would lose a trivial amount of credit, but the economic reasoning is sound.\n\nAmbiguities: The phrasing \"the certainty-equivalent cash flow is the probability-weighted expected cash flow divided by one plus the difference between the risk-adjusted rate and the risk-free rate\" is a simplified (and non-standard) certainty-equivalent adjustment \u2014 the textbook-exact approach would multiply the expected cash flow by (1 + r_f)/(1 + r_risky), which gives a slightly different NPV (\u2248 $4,000 by that method). However, since the question explicitly prescribes the formula to use, the intended computation is unambiguous; the only minor imprecision is that the question does not specify whether intermediate values may be rounded, which is exactly what caused the student's $1 discrepancy.", "verdict": "Partially Correct due to rounding or minor variations"}, {"entry_id": 4, "problem": "* Scenario: An investor acquires a 12-unit apartment building on January 1 for $2,400,000. The building has 8 one-bedroom units rented at $1,650 per month each and 4 two-bedroom units rented at $2,250 per month each. Additional property income consists of 10 parking spaces leased at $75 per month each, 6 storage lockers leased at $40 per month each, and a laundry contract paying $650 per quarter. The investor underwrites annual vacancy loss as 5.0% of the apartment rent only. Annual operating expenses include property taxes of $31,200, insurance of $12,000, utilities of $15,600, repairs and maintenance of $18,750, administrative costs of $4,800, and a property management fee equal to 6.0% of effective gross income, where effective gross income equals scheduled apartment rent plus other income minus vacancy loss. The acquisition is financed with a 70% loan-to-value interest-only mortgage at a 6.30% annual interest rate. Cash paid at closing includes the down payment, closing costs equal to 2.25% of the purchase price, lender points equal to 1.00% of the loan amount, and an initial repair escrow of $38,500. The investment committee\u2019s minimum acceptable cash-on-cash return is 7.20%.\n\n* The Core Question: Using the cash-on-cash return formula, by how many basis points does the property\u2019s first-year cash-on-cash return exceed or fall short of the 7.20% hurdle rate? Round to the nearest basis point and state whether it exceeds or falls short.", "answer": "Exceeds by 43 basis points.", "feedback": "Verdict: Correct\n\nAnalysis: The student's final answer matches my independently derived result. Working through the problem internally: scheduled apartment rent is $266,400 annually, other income totals $14,480, vacancy loss is $13,320, yielding an EGI of $267,560. Total operating expenses (including the 6% management fee of $16,053.60 on EGI) come to $98,403.60, producing an NOI of $169,156.40. Interest-only debt service on the $1,680,000 loan at 6.30% is $105,840, leaving a before-tax cash flow of $63,316.40. Total cash invested equals $829,300 ($720,000 down payment + $54,000 closing costs + $16,800 points + $38,500 escrow). The resulting cash-on-cash return is approximately 7.6349%, which exceeds the 7.20% hurdle by roughly 43.49 basis points \u2014 rounding to 43 basis points. The student's answer of \"Exceeds by 43 basis points\" is correct. (Note: the unrounded value of ~43.49 bps sits very close to the rounding boundary; a student who rounded intermediate figures slightly differently could legitimately arrive at 44 bps, but 43 bps is the correct answer under exact computation.)\n\nAmbiguities: The question is largely precise, but two phrasings invite minor alternative interpretations: (1) \"effective gross income equals scheduled apartment rent plus other income minus vacancy loss\" \u2014 this is helpfully explicit, so the management fee base is unambiguous; however, (2) \"Cash paid at closing includes the down payment, closing costs..., lender points..., and an initial repair escrow\" uses the word \"includes,\" which could theoretically suggest the list is non-exhaustive, though in practice the four listed items clearly constitute the full initial equity. Additionally, \"Round to the nearest basis point\" applied to a true value of ~43.49 bps means small intermediate rounding choices could flip the answer between 43 and 44 bps, which is a latent precision sensitivity in the question design.", "verdict": "Correct"}, {"entry_id": 5, "problem": "* Scenario: A private investor is evaluating a one-year project that requires an upfront purchase price of **$415,000 today**. The project\u2019s cash flow will depend on next year\u2019s demand state. In a sample of **120 comparable product launches**, demand was weak in **24** cases, normal in **60** cases, and strong in **36** cases.  \n  If demand is weak, the project sells **8,000 units**; if normal, **12,000 units**; if strong, **16,000 units**. Each unit sells for **$100**, variable cash cost is **$45 per unit**, and annual fixed cash operating cost is **$200,000**.  \n  The current one-year Treasury zero-coupon bond has face value **$1,000** and trades for **$970.873786**. The project\u2019s beta is **1.20**, and the expected market return is **10.5%**.  \n  First derive the state cash flows and probabilities, then use the CAPM-implied risk-adjusted return and the Treasury-implied risk-free rate in the certainty-equivalent cash flow function. Finally, discount the certainty-equivalent cash flow at the risk-free rate and subtract the upfront purchase price.\n\n* The Core Question: What is the project\u2019s **net dollar value today**, rounded to the nearest whole dollar?", "answer": "**$14,322**", "feedback": "Verdict: Incorrect\n\nAnalysis: My independently derived result is **$15,357** (to the nearest dollar). The probabilities are 0.20/0.50/0.30, yielding state cash flows of $240,000, $460,000, and $680,000, an expected cash flow of $482,000, a Treasury-implied risk-free rate of 3%, and a CAPM rate of 12%. The certainty-equivalent cash flow is $482,000 \u00d7 (1.03/1.12) \u2248 $443,267.86, which discounted at 3% gives a present value of \u2248 $430,357.14; subtracting the $415,000 purchase price yields \u2248 $15,357. The student's answer of $14,322 implies a present value of $429,322 (i.e., an implied expected cash flow of roughly $480,841 at a 12% discount rate, or an equivalent distortion in the CE adjustment). This suggests the student likely made an arithmetic slip in computing the expected cash flow or in applying the certainty-equivalent ratio (1+rf)/(1+r) \u2014 possibly using a slightly mis-rounded risk-free or risk-adjusted rate (e.g., not recognizing the bond price implies exactly 3.0%, or rounding intermediate CE figures prematurely). The error is too large to be attributable to acceptable final rounding.\n\nAmbiguities: The question is largely precise, but two phrasings invite minor interpretive latitude: (1) \"use the CAPM-implied risk-adjusted return and the Treasury-implied risk-free rate in the certainty-equivalent cash flow function\" \u2014 the specific CE functional form is not stated (the multiplicative ratio CE = E[CF]\u00b7(1+rf)/(1+r) versus the covariance-based formula CE = E[CF] \u2212 \u03bb\u00b7Cov(CF, r_m)), though with a given beta both should be numerically equivalent; and (2) \"the expected market return is 10.5%\" \u2014 it is assumed this is the total expected market return rather than the market risk premium; if misread as the premium, CAPM would give 15.6% and a materially different answer.", "verdict": "Incorrect"}, {"entry_id": 6, "problem": "* Scenario:  \nNorthstar Components is preparing its 2025 operating cash flow statement using the indirect method and then applying its bank\u2019s mandatory cash-sweep clause.\n\nFor 2025, Northstar reported sales revenue of $92,400,000. Its cash cost of goods sold, excluding depreciation and depletion, was $52,800,000. Its cash SG&A expense was $18,600,000. Interest expense was $1,350,000. During the year, it recorded plant depreciation of $3,250,000, natural-resource depletion of $450,000, corporate equipment depreciation of $500,000, software amortization of $500,000, and customer-list amortization of $350,000. Income tax expense equals 24% of pretax income.\n\nFor tax-related operating cash flow adjustments, Northstar\u2019s deferred tax liability increased by $620,000, and $90,000 of investment tax credits was amortized into tax expense. In the indirect-method calculation, add increases in deferred tax liabilities and subtract amortized investment tax credits.\n\nThe relevant operating balance sheet accounts were:\n\n| Account | Beginning of 2025 | End of 2025 |\n|---|---:|---:|\n| Accounts receivable | $14,600,000 | $16,100,000 |\n| Operating liabilities | $8,400,000 | $10,050,000 |\n| Inventories | $11,200,000 | $9,850,000 |\n| Other operating current assets | $2,750,000 | $3,100,000 |\n\nFor the working-capital inputs to the operating cash flow function, use signed indirect-method adjustments: increases in operating assets are negative, decreases in operating assets are positive, increases in operating liabilities are positive, and decreases in operating liabilities are negative.\n\nAfter cash flow from operations is calculated, Northstar\u2019s credit agreement requires a mandatory debt prepayment equal to 30% of the amount by which cash flow from operations exceeds $16,000,000. If cash flow from operations does not exceed $16,000,000, no prepayment is required.\n\n* The Core Question:  \nWhat is Northstar\u2019s required mandatory debt prepayment, rounded to the nearest whole dollar?", "answer": "$547,800", "feedback": "Verdict: Correct\n\nAnalysis: The student's final answer of $547,800 matches my independently derived result exactly. Working internally through the indirect method: pretax income computes to $14,600,000, yielding tax expense of $3,504,000 and net income of $11,096,000. Adding back total non-cash depreciation, depletion, and amortization of $5,050,000, the deferred tax liability increase of $620,000, subtracting the $90,000 ITC amortization, and applying the net working-capital adjustments (AR \u2212$1,500,000; operating liabilities +$1,650,000; inventories +$1,350,000; other operating current assets \u2212$350,000, netting to +$1,150,000) gives cash flow from operations of $17,826,000. The excess over the $16,000,000 threshold is $1,826,000, and 30% of that is $547,800. The student's value is exact, with no rounding discrepancies.\n\nAmbiguities: The question is largely precise, but two phrasings merit note: (1) \"Income tax expense equals 24% of pretax income\" \u2014 a student could question whether interest expense is included in the pretax base, though standard accounting convention (and the inclusion of interest expense as an operating-statement item) makes it clearly deductible before tax. (2) The instruction to \"subtract amortized investment tax credits\" presumes a specific deferral-method treatment; without that explicit directive, students might have been uncertain of the sign. However, the question explicitly resolves both the ITC and deferred tax sign conventions, so no material ambiguity remains.", "verdict": "Correct"}, {"entry_id": 7, "problem": "* Scenario: A firm is deciding whether to retain a one-year risky project or accept a guaranteed buyout offer payable exactly one year from today. The project\u2019s year-end operating cash flow depends on demand. In a sample of 80 comparable product launches, 20 had weak demand, 40 had normal demand, and 20 had strong demand. If retained, the project will sell units at $50 each, incur variable cash cost of $30 per unit, and pay a fixed year-end cash cost of $1,000,000. Unit sales would be 100,000 in weak demand, 159,000 in normal demand, and 218,000 in strong demand. There are no taxes, depreciation, or working-capital effects.  \n  The one-year Treasury zero-coupon rate is 3.00% effective annual. The project\u2019s beta is 1.5, and the expected market excess return over Treasury bills is 6.00%. The investment committee converts the risky year-end payoff into a risk-premium-adjusted guaranteed year-end equivalent, then discounts any guaranteed year-end dollar difference at the Treasury zero-coupon rate. A third party offers to buy the project today in exchange for a guaranteed payment of $2,051,500 exactly one year from today.\n\n* The Core Question: What is the incremental present value today of accepting the guaranteed offer rather than retaining the risky project, rounded to the nearest whole dollar?", "answer": "$50,000", "feedback": "Verdict: Correct\n\nAnalysis: The student's final answer of $50,000 matches my independently derived result. The probability-weighted expected unit sales (using 0.25/0.50/0.25 weights from the 80-launch sample) yield an expected year-end operating cash flow of $2,180,000 after the $20 per-unit contribution margin and the $1,000,000 fixed cost. Applying the CAPM-derived risk premium (\u03b2 \u00d7 market excess return = 1.5 \u00d7 6.00% = 9.00%) to convert the risky payoff into a guaranteed year-end equivalent gives $2,000,000. The buyout offer exceeds this certainty equivalent by $51,500 at year-end, and discounting that guaranteed difference at the 3.00% Treasury rate produces exactly $50,000 today. The student's answer is consistent with the intended methodology and the construction of the offer amount.\n\nAmbiguities: The phrase \"converts the risky year-end payoff into a risk-premium-adjusted guaranteed year-end equivalent\" is open to alternative interpretation. One natural reading is to deflate the expected cash flow by only the risk premium, i.e., E[CF]/(1 + 0.09) = $2,000,000, which is the intended method here. However, a student could reasonably instead discount the risky cash flow at the full risk-adjusted rate (12%) to present value and then compound forward at the risk-free rate (\u00d71.03), yielding a year-end certainty equivalent of \u2248 $2,004,821 and an incremental PV of \u2248 $45,319. The question does not explicitly specify which certainty-equivalent convention to apply, though the round-number structure of the offer ($2,051,500) strongly signals the intended approach.", "verdict": "Correct"}, {"entry_id": 8, "problem": "* Scenario: An investor is evaluating a multifamily property. For the next year, the rent roll shows 80 units leased at $2,100 per month and 40 units leased at $1,950 per month. Additional annual income is expected to be $168,000. Vacancy and credit loss are projected at 5% of total potential income. Annual operating expenses are projected to total $1,364,000.  \n  The current market value is based on a negotiated base price of $23,500,000 plus $250,000 of buyer-paid acquisition costs that are treated as part of the asset\u2019s market value.  \n  The investor\u2019s required return is built from a 4.20% risk-free rate, a property beta of 0.85, a 5.60% real estate risk premium, and a 0.70% liquidity premium. Expected annual cash-flow growth is 3.10%.  \n  Using the Gordon-model capitalization rate returned by `calculate_cap_rate_from_gordon_model`, compute the Gordon-implied property value by capitalizing next year\u2019s net operating income. Then compare that implied value with the current market value.\n\n* The Core Question: What is the Gordon-model dollar valuation gap, defined as Gordon-implied property value minus current market value, rounded to the nearest whole dollar?", "answer": "$640,244", "feedback": "Verdict: Correct\n\nAnalysis: The student's final answer of $640,244 matches my independently derived result exactly. Working through the problem: the rent roll yields $2,952,000 in annual rental income, plus $168,000 of additional income, giving $3,120,000 of total potential income. After a 5% vacancy/credit loss deduction ($156,000) and $1,364,000 of operating expenses, next year's NOI is $1,600,000. The required return assembles to 9.66% (4.20% + 0.85 \u00d7 5.60% + 0.70%), and subtracting 3.10% growth gives a Gordon cap rate of 6.56%. Capitalizing the NOI yields an implied value of approximately $24,390,243.90. The market value including buyer-paid acquisition costs is $23,750,000, producing a gap of $640,243.90, which correctly rounds to $640,244. The student properly applied beta only to the risk premium (not the risk-free rate or liquidity premium) and correctly included the $250,000 acquisition costs in market value.\n\nAmbiguities: The phrase \"a property beta of 0.85, a 5.60% real estate risk premium\" could conceivably invite an alternative interpretation in which beta scales other components or is ignored entirely (i.e., simply summing 4.20% + 5.60% + 0.70%), though the CAPM-style convention of multiplying beta by the risk premium is the standard and intended reading. Additionally, \"Additional annual income is expected to be $168,000\" combined with \"Vacancy and credit loss are projected at 5% of total potential income\" could be read as applying the 5% only to rental income rather than to total potential income (rental plus additional); the question's explicit phrase \"total potential income\" resolves this, but a careless reader could deduct $147,600 instead of $156,000.", "verdict": "Correct"}, {"entry_id": 9, "problem": "* Scenario: A venture investor is evaluating a biotech milestone right that will pay exactly one year from today. If the clinical trial succeeds, which has a 60% probability, the payoff depends on market demand: strong demand has a 50% conditional probability and pays $2,400,000; normal demand has a 30% conditional probability and pays $1,800,000; weak demand has a 20% conditional probability and pays $1,200,000. If the trial fails, which has a 40% probability, the right pays only a $300,000 salvage amount.  \n  The one-year Treasury rate is 3.5%. The right has a beta of 1.5, and the expected market return is 9.5%. Using CAPM to determine the risk-adjusted required return, define the one-year certainty-equivalent cash flow as the probability-weighted expected cash flow divided by one plus the risk premium over the Treasury rate.  \n  A counterparty offers a guaranteed one-year payment of $1,175,000 for the right.\n\n* The Core Question: By how many dollars does the investor\u2019s certainty-equivalent one-year cash flow exceed the guaranteed offer? Round to the nearest whole dollar.", "answer": "$25,000", "feedback": "Verdict: Correct\n\nAnalysis: The student's final answer of $25,000 matches my independently derived result exactly. The probability-weighted expected cash flow works out to $1,308,000 (combining the success branch's conditional outcomes weighted at 60% with the 40% salvage scenario). The CAPM required return is 12.5%, giving a risk premium over the Treasury rate of 9%. Dividing the expected cash flow by one plus that risk premium yields a certainty-equivalent of exactly $1,200,000, which exceeds the guaranteed offer of $1,175,000 by $25,000. The student correctly applied the definition given in the problem (dividing by 1 + risk premium, not by 1 + total required return) and avoided the common error of discounting by the full 12.5%, which would have produced approximately $1,162,667 and an answer of roughly \u2013$12,333.\n\nAmbiguities: The phrase \"divided by one plus the risk premium over the Treasury rate\" could conceivably be misread in two ways: (1) the intended reading, dividing by (1 + 0.09), where the risk premium is \u03b2 \u00d7 (E[Rm] \u2013 Rf) = 9%; or (2) misinterpreting \"risk premium over the Treasury rate\" as the full CAPM return (12.5%), or even as just the market risk premium (6%) without the beta adjustment. The problem does define the procedure explicitly, which substantially mitigates the ambiguity, but the phrasing \"risk premium over the Treasury rate\" is slightly unconventional and could invite the 6% (unlevered market premium) interpretation, which would yield a CE of about $1,233,962 and an answer of roughly $58,962. The intended 9% interpretation produces the clean round-number result, confirming it is the expected reading.", "verdict": "Correct"}, {"entry_id": 10, "problem": "* Scenario:  \nA commercial property owner is selling a building. The sale will close on **May 1, 2026**, immediately after the monthly interest payment is made, so there is **no accrued interest** due at closing. The mortgage matures on **November 1, 2031**.\n\nThe borrower\u2019s balance sheet shows the mortgage at a net carrying amount of **$6,872,000**, after deducting **$128,000** of unamortized deferred financing costs. For payoff purposes, the lender uses the unpaid principal balance before subtracting deferred financing costs.\n\nThe most recent monthly interest invoice was **$35,000**, calculated as one month of simple interest on the current unpaid principal balance using the loan\u2019s fixed annual note rate.\n\nUnder the loan agreement, an early payoff requires a yield-maintenance payment equal to the present value of the annual interest-rate shortfall over the remaining term. The relevant Treasury yield is determined from the market desk\u2019s quote: **3.61% base Treasury rate plus 39 basis points**. The remaining term is measured in whole months from the payoff date to maturity.\n\nThe sale will generate **$8,100,000** of cash after all selling expenses but before paying off the mortgage.\n\n* The Core Question:  \nWhat is the borrower\u2019s **net cash remaining after paying the outstanding principal and the yield-maintenance amount**, rounded to the nearest whole dollar?", "answer": "**$420,880**", "feedback": "Verdict: Partially Correct due to rounding or minor variations\n\nAnalysis: The student's final answer of **$420,880** is within approximately $1 of my independently derived result of **$420,881** (with yield-maintenance \u2248 $679,119). The student clearly executed the correct solution path: grossing the net carrying amount back up to the unpaid principal balance of $7,000,000 (adding back the $128,000 of deferred financing costs), backing out the 6% note rate from the $35,000 monthly interest invoice, summing the Treasury quote components to a 4.00% reinvestment rate, computing a 2% annual rate shortfall ($140,000/year) over the 66-month (5.5-year) remaining term, and discounting that shortfall as an annuity at 4% before subtracting both principal and the yield-maintenance charge from the $8,100,000 of sale proceeds. The $1 discrepancy is attributable to intermediate rounding (e.g., truncating the discount factor or annuity factor at four or five decimal places) rather than any conceptual or methodological error.\n\nAmbiguities: The phrase \"a yield-maintenance payment equal to the present value of the annual interest-rate shortfall over the remaining term\" is materially ambiguous in several respects: (1) it does not specify whether the shortfall cash flows should be modeled as **annual or monthly** payments \u2014 a monthly annuity at 4%/12 over 66 months yields a meaningfully different result (\u2248 $690,168, giving net cash of \u2248 $409,832); (2) it does not state whether discounting uses **annual or monthly compounding**; (3) it does not specify **ordinary annuity vs. annuity due** timing; and (4) while \"the remaining term is measured in whole months\" (66 months = 5.5 years), the question is silent on how to handle the **fractional year** in an annual annuity framework (continuous exponent of 5.5 vs. 5 full years plus a stub period). The student's answer is only reproducible under one specific combination of these interpretations (annual shortfall, annual compounding, exponent of 5.5), which the problem text does not unambiguously mandate.", "verdict": "Partially Correct due to rounding or minor variations"}, {"entry_id": 11, "problem": "* Scenario: A bank is back-testing its one-year credit rating transition model for a portfolio that began the year with only BBB-rated corporate loans. Each loan had the same original principal of $5 million, and total original principal was $5.0 billion.  \n  The model\u2019s one-year predicted terminal distribution for the portfolio is:\n  - Upgrade to A-or-better: 6%\n  - Remain BBB: 78%\n  - Downgrade to BB: 10%\n  - Downgrade to B-or-lower but not defaulted: 4%\n  - Default: 2%\n\n  At year-end, the portfolio\u2019s principal amounts by terminal category were:\n  - A-or-better: $350 million\n  - BBB: $3,700 million\n  - BB: $625 million\n  - B-or-lower but not defaulted: $225 million\n  - Default: $100 million\n\n  The bank uses the chi-square statistic to test model fit across these five categories. For 4 degrees of freedom at the 5% significance level, the critical chi-square benchmark is 9.488.\n\n* The Core Question: What is the chi-square statistic\u2019s excess over the 5% critical benchmark, rounded to three decimal places, and should the bank reject the transition model?", "answer": "1.105; Reject the model", "feedback": "Verdict: Correct\n\nAnalysis: The student's final answer matches my independently derived result exactly. Working with the portfolio of 1,000 loans (or equivalently in principal terms, since loan sizes are uniform), the observed terminal counts compared against the model's expected counts yield a chi-square statistic of approximately 10.593. Subtracting the critical benchmark of 9.488 gives an excess of 1.105 when rounded to three decimal places. Since the computed statistic exceeds the 5% critical value, the null hypothesis that the model fits the data is rejected \u2014 the bank should reject the transition model. Both the numerical excess (1.105) and the qualitative conclusion (reject) submitted by the student are correct.\n\nAmbiguities: The phrasing \"the chi-square statistic's excess over the 5% critical benchmark\" is precise, but one subtle point merits mention: the question asks the test be performed \"across these five categories\" using counts derived implicitly from principal amounts. Because all loans share an identical $5 million principal, computing the statistic on dollar amounts directly would inflate it by a factor of 5; the question relies on the reader recognizing that the test must be performed on loan counts (or equivalently, normalized units). A student who ran the chi-square on raw dollar figures would obtain a wildly different answer, so the question could be made airtight by explicitly stating \"convert principal amounts to loan counts before computing the statistic.\" Otherwise, the question is well-specified.", "verdict": "Correct"}, {"entry_id": 12, "problem": "* Scenario: A private equity investor is evaluating a one-year exit from a portfolio company. The exit cash flow depends on the macroeconomic state one year from today. Based on 100 comparable historical observations, analysts observed 20 recession outcomes, 50 normal-growth outcomes, and 30 boom outcomes. The corresponding net exit cash flows would be $780,000, $1,050,000, and $1,400,000, respectively.  \n  The one-year Treasury rate is 4.0%. The portfolio company has an equity beta of 1.25, and the expected market return is 10.0%, so the required risk-adjusted return must be inferred using CAPM.  \n  Separately, a strategic buyer has offered a guaranteed one-year payment of $1,010,000 for the same asset.\n\n* The Core Question: Using the certainty-equivalent cash flow function, what is the investor\u2019s certainty-equivalent dollar advantage of holding the risky exit opportunity instead of accepting the guaranteed buyer offer, rounded to the nearest whole dollar?", "answer": "$14,186", "feedback": "Verdict: Incorrect\n\nAnalysis: My independently derived result differs from the student's. The probability-weighted expected exit cash flow is $1,101,000, and the CAPM required return is 11.5% (4% + 1.25 \u00d7 6%). Converting this expected cash flow into a certainty-equivalent at the one-year horizon requires multiplying by the ratio (1 + r_f)/(1 + r_risk-adjusted), i.e., $1,101,000 \u00d7 (1.04/1.115) \u2248 $1,026,942. The certainty-equivalent dollar advantage over the guaranteed $1,010,000 offer is therefore approximately **$16,942**, not $14,186. The student's figure of $14,186 corresponds exactly to dividing the expected cash flow by (1 + risk premium), i.e., $1,101,000 / 1.075 = $1,024,186, then subtracting $1,010,000. This reveals a conceptual error: the student treated the certainty-equivalent adjustment as simply removing the risk premium component (\u03b2 \u00d7 market risk premium = 7.5%) via division by (1 + 7.5%), rather than correctly discounting at the full risk-adjusted rate and re-compounding at the risk-free rate (or equivalently, scaling by (1+r_f)/(1+r)). This is an incorrect specification of the certainty-equivalent cash flow function.\n\nAmbiguities: The phrase \"certainty-equivalent dollar advantage\" could plausibly be interpreted two ways: (1) comparing future-value certainty equivalents at year one (CE \u2212 $1,010,000 \u2248 $16,942), or (2) comparing present values today ($1,101,000/1.115 \u2212 $1,010,000/1.04 \u2248 $16,290). The question says \"guaranteed one-year payment,\" and asks for the advantage \"of holding the risky exit opportunity instead of accepting the guaranteed buyer offer,\" which is most naturally read as a comparison of year-one certainty equivalents, but the timing convention is not explicitly stated. However, neither interpretation produces the student's answer of $14,186, so the ambiguity does not rescue the submission.", "verdict": "Incorrect"}, {"entry_id": 13, "problem": "* Scenario:  \nAn investor is acquiring a 12-unit apartment building on January 1 for **$2,400,000**. Each unit is expected to rent for **$1,850 per month**. The property is also expected to generate **$750 per month** from parking and laundry. The investor underwrites annual vacancy loss at **5% of gross scheduled rent**.\n\n  Annual operating expenses are projected as follows: property taxes **$31,200**, insurance **$8,400**, common-area utilities **$14,400**, and repairs/management/maintenance **$35,000**.\n\n  The acquisition is financed with a loan equal to **75% of the purchase price**. The annual mortgage payments will total **$122,400**. At closing, the investor must pay the down payment, acquisition closing costs equal to **2% of the purchase price**, an immediate roof repair costing **$70,000**, and a lender-required cash reserve of **$18,000**.\n\n  The investor\u2019s minimum acceptable first-year pre-tax cash yield on actual cash invested is **7.50%**.\n\n* The Core Question:  \nBy how many **percentage points** does the property\u2019s first-year pre-tax cash yield on actual cash invested exceed or fall short of the investor\u2019s 7.50% hurdle rate? Round to the nearest **0.01 percentage points**, and state whether it exceeds or falls short.", "answer": "**Falls short by 0.61 percentage points**", "feedback": "Verdict: Correct\n\nAnalysis: The student's final answer matches my independently derived result. My hidden calculation of effective gross income (gross scheduled rent of $266,400 plus $9,000 of other income, less a 5% vacancy loss of $13,320 applied to scheduled rent only) yields $262,080. Subtracting total operating expenses of $89,000 gives an NOI of $173,080, and subtracting annual debt service of $122,400 produces a pre-tax cash flow of $50,680. Total actual cash invested is $736,000 (the $600,000 down payment, $48,000 in closing costs, the $70,000 roof repair, and the $18,000 reserve). The resulting cash-on-cash yield is approximately 6.886%, which falls short of the 7.50% hurdle by approximately 0.614 percentage points \u2014 rounding to 0.61. The student's answer of \"falls short by 0.61 percentage points\" is exactly right, including the directional statement.\n\nAmbiguities: The question contains a few points that could invite alternative interpretations: (1) \"vacancy loss at 5% of gross scheduled rent\" \u2014 it is reasonably clear vacancy applies only to rental income, but some students might apply it to total gross income including the $750/month ancillary income; (2) the \"lender-required cash reserve of $18,000\" \u2014 some practitioners exclude refundable reserves from \"actual cash invested\" since they may be recoverable, though the phrase \"must pay... at closing\" supports including it; (3) \"$750 per month from parking and laundry\" could conceivably be read as $750 per unit per month rather than $750 total, though the property-level reading is the more natural one. The student's answer aligns with the most standard interpretations of all three points.", "verdict": "Correct"}, {"entry_id": 14, "problem": "* Scenario: An investor buys a 12-unit apartment building on January 1 for $1,600,000 using a 75% loan-to-value mortgage. The lender quotes a fixed monthly mortgage payment of $7,250. The building has 8 one-bedroom units renting for $1,450 per month each and 4 two-bedroom units renting for $1,850 per month each. Additional property income consists of laundry revenue of $850 per month, 10 parking spaces rented at $75 per month each, and storage income of $300 per month. Vacancy and credit loss are underwritten at 5% of gross scheduled rent only. Annual operating expenses, excluding debt service, are: property taxes of $32,400, insurance of $9,600, utilities of $25,200, repairs and maintenance of $17,400, and property management of $13,680. At acquisition, the investor pays the 25% down payment, closing costs equal to 2% of the purchase price, lender points equal to 1% of the loan amount, $58,000 of immediate capital improvements, and a $15,000 operating reserve. The investor\u2019s required cash-on-cash hurdle rate is 9.25%.\n* The Core Question: What is the spread between the property\u2019s cash-on-cash return and the 9.25% hurdle rate, in percentage points, rounded to two decimals? Report a positive number if the return exceeds the hurdle and a negative number if it falls short.", "answer": "+1.22 percentage points", "feedback": "Verdict: Correct\n\nAnalysis: The student's final answer of +1.22 percentage points matches my independently derived result exactly. My hidden calculation confirms an effective gross income (after applying the 5% vacancy loss to scheduled rent only and adding all ancillary income), annual operating expenses of $98,280, annual debt service of $87,000, and total initial cash outlay of $517,000 (down payment, closing costs, lender points, capital improvements, and operating reserve). This yields a cash-on-cash return of approximately 10.47%, producing a spread of +1.22 percentage points over the 9.25% hurdle. The student correctly applied vacancy only to scheduled rent, correctly computed points on the loan amount rather than the purchase price, and correctly included all five components of the initial equity investment.\n\nAmbiguities: The phrase \"a $15,000 operating reserve\" invites a defensible alternative interpretation: some practitioners exclude operating reserves from the denominator of cash-on-cash return on the grounds that reserves are not \"spent\" but held as liquid capital. Excluding the reserve would give a denominator of $502,000 and a return of ~10.78%, for a spread of +1.53. Similarly, \"Vacancy and credit loss are underwritten at 5% of gross scheduled rent only\" is precise, but the word \"only\" is doing important work \u2014 a careless reader might apply it to all income. The question as worded most naturally supports including the reserve (it is listed among items \"the investor pays\" at acquisition), so the standard interpretation yields +1.22.", "verdict": "Correct"}, {"entry_id": 15, "problem": "* Scenario: A risk desk is estimating the one-month volatility of a two-asset equity sleeve using five monthly total-return observations. For each month, the total simple return must be computed as:\n\n\\[\n\\text{Total return}=\\frac{\\text{Month-end price}+\\text{Cash distribution}-\\text{Month-start price}}{\\text{Month-start price}}\n\\]\n\nThe risk engine uses the sample covariance convention with denominator \\(n-1\\).\n\n| Month | Asset X Start Price | Asset X End Price | Asset X Cash Distribution | Asset Y Start Price | Asset Y End Price | Asset Y Cash Distribution |\n|---|---:|---:|---:|---:|---:|---:|\n| 1 | 100.00 | 101.50 | 0.50 | 50.00 | 50.30 | 0.20 |\n| 2 | 100.00 | 98.75 | 0.25 | 50.00 | 49.80 | 0.20 |\n| 3 | 100.00 | 102.40 | 0.60 | 50.00 | 50.70 | 0.30 |\n| 4 | 100.00 | 99.70 | 0.30 | 50.00 | 49.30 | 0.20 |\n| 5 | 100.00 | 103.20 | 0.80 | 50.00 | 51.10 | 0.40 |\n\nThe portfolio is rebalanced to 60% Asset X and 40% Asset Y. The portfolio market value is \\$25,000,000. The risk committee\u2019s one-month dollar volatility limit is \\$450,000.\n\nUse the sample variances and sample covariance from the five derived monthly return observations to compute portfolio variance:\n\n\\[\n\\sigma_p^2=w_X^2\\sigma_X^2+w_Y^2\\sigma_Y^2+2w_Xw_Y\\operatorname{Cov}(X,Y)\n\\]\n\n* The Core Question: What is the amount by which the portfolio\u2019s projected one-month dollar volatility exceeds the \\$450,000 limit, rounded to the nearest whole dollar?", "answer": "\\$10,163", "feedback": "Verdict: Correct\n\nAnalysis: The student's final answer matches my independently derived result exactly. Working through the problem internally: the five monthly total returns for Asset X are 2%, \u22121%, 3%, 0%, 4% (mean 1.6%), and for Asset Y are 1%, 0%, 2%, \u22121%, 3% (mean 1.0%). Using the n\u22121 convention, the sample variance of X is 0.00043, the sample variance of Y is 0.00025, and the sample covariance is 0.00030. Applying the two-asset portfolio variance formula with weights 0.6 and 0.4 yields a portfolio variance of 0.0003388, giving a monthly volatility of approximately 1.84065%. Scaled to the $25,000,000 portfolio, the dollar volatility is approximately $460,163, which exceeds the $450,000 limit by $10,163. The student's answer of $10,163 is exactly correct.\n\nAmbiguities: None of material consequence. The question is unusually precise: it specifies the total return formula explicitly, mandates the n\u22121 (sample) denominator convention, provides the exact portfolio variance formula, fixes the weights via rebalancing, and states the rounding rule (\"rounded to the nearest whole dollar\"). One could quibble that \"projected one-month dollar volatility\" implicitly assumes the historical sample volatility is used directly as the forward projection without adjustment, but the instruction to \"use the sample variances and sample covariance from the five derived monthly return observations\" removes any genuine interpretive doubt.", "verdict": "Correct"}, {"entry_id": 16, "problem": "* Scenario:  \nA manufacturer is evaluating a 4-year production-line upgrade. Today, it must buy equipment for $1,800,000, pay $200,000 for installation, and commit $250,000 of net working capital. The equipment plus installation is depreciated straight-line to zero over 4 years. The net working capital is fully recovered at the end of Year 4.  \n\n  Projected year-end operating data are:\n\n  | Year | Revenue | Cash Operating Costs |\n  |---:|---:|---:|\n  | 1 | $1,500,000 | $700,000 |\n  | 2 | $1,600,000 | $750,000 |\n  | 3 | $1,700,000 | $800,000 |\n  | 4 | $1,800,000 | $850,000 |\n\n  At the end of Year 4, the equipment is sold for $300,000. Since its tax book value is zero at that time, the entire sale price is taxable. The corporate tax rate is 25%, taxes are paid in the same year as the related cash flows, and there are no other fees or taxes.\n\n  The project\u2019s discount rate must be derived from market data. The firm has $50,000,000 of market-value equity and $50,000,000 of market-value debt. The risk-free rate is 2%, the equity beta is 1.5, the expected market risk premium is 8%, and the pre-tax cost of debt is 8%. Use the after-tax WACC as the annual discount rate.\n\n  The investment committee requires the project\u2019s NPV to exceed a $500,000 minimum value-creation threshold. Do not round intermediate calculations.\n\n* The Core Question:  \nWhat is the dollar amount by which the project\u2019s NPV exceeds or falls short of the $500,000 threshold, rounded to the nearest whole dollar? Report a positive number for an excess and a negative number for a shortfall.", "answer": "+$36,763", "feedback": "Verdict: Correct\n\nAnalysis: The student's final answer of +$36,763 matches my independently derived result. Working through the problem internally: the WACC comes to exactly 10% (cost of equity of 14% via CAPM, after-tax cost of debt of 6%, with equal 50/50 weights). The initial outlay is $2,250,000 (equipment + installation + NWC), annual depreciation is $500,000, and the after-tax operating cash flows for Years 1\u20134 are $725,000; $762,500; $800,000; and $837,500, respectively. Year 4 also includes the $250,000 NWC recovery and the $225,000 after-tax salvage value, bringing the Year 4 total to $1,312,500. Discounting at 10% yields an NPV of approximately $536,763.20, which exceeds the $500,000 threshold by $36,763 (when rounded to the nearest dollar). The student's answer is exactly right in both magnitude and sign.\n\nAmbiguities: None. The question is precise: it specifies straight-line depreciation to zero, full NWC recovery, the tax treatment of the salvage value (\"the entire sale price is taxable\"), the instruction to \"Use the after-tax WACC as the annual discount rate,\" the prohibition on rounding intermediate calculations, and the sign convention for reporting (\"Report a positive number for an excess and a negative number for a shortfall\"). All inputs are unambiguous.", "verdict": "Correct"}, {"entry_id": 17, "problem": "* Scenario:  \nAn analyst currently lives in Harbor City and earns a pre-tax salary of **$94,000 per year**. She is considering relocating to Metro City. To maintain the same standard of living, her employer compares the monthly cost of the same consumption basket in both cities.\n\n  The monthly basket is:\n\n  | Expense Item | Harbor City | Metro City |\n  |---|---:|---:|\n  | Apartment rent | $2,200 | $3,050 |\n  | Renter\u2019s insurance | $18 | $22 |\n  | Electricity | 450 kWh at $0.16/kWh | 450 kWh at $0.20/kWh |\n  | Gas, water, and internet bundle | $95 | $110 |\n  | Groceries | 4 weekly baskets at $95 each | 4 weekly baskets at $118 each |\n  | Work lunches | 8 lunches at $14 each | 8 lunches at $18 each |\n  | Transit pass | $132 | $156 |\n  | Ride-hailing | 6 rides at $18 each | 6 rides at $24 each |\n  | Health insurance premium | $180 | $210 |\n  | Prescriptions | $35 | $45 |\n  | Gym membership | $50 | $65 |\n  | Mobile phone plan | $60 | $60 |\n  | Entertainment | $260 | $310 |\n\n  The employer offers her a Metro City salary of **$121,500 per year**.\n\n* The Core Question:  \nUsing Harbor City as the base city, what is the **annual dollar surplus or shortfall** of the Metro City salary offer relative to the salary required to preserve her standard of living? Round to the nearest whole dollar and state whether it is a surplus or shortfall.", "answer": "**$2,361 shortfall**", "feedback": "Verdict: Correct\n\nAnalysis: The student's final answer matches my independently derived result. The Harbor City monthly basket totals $3,702 and the Metro City basket totals $4,878, giving a cost-of-living ratio of 4,878/3,702 \u2248 1.31767. Applying this ratio to the $94,000 base salary yields a required Metro City salary of approximately $123,860.62. Comparing this to the offered $121,500 produces a shortfall of about $2,360.62, which rounds to **$2,361 shortfall** \u2014 exactly the student's answer, including the correct direction (shortfall, not surplus).\n\nAmbiguities: The question is largely precise, but two minor points could invite alternative interpretations: (1) the phrase \"salary required to preserve her standard of living\" assumes a simple cost-of-living index ratio applied to gross pre-tax salary, even though the problem mentions \"pre-tax salary\" \u2014 a student might wonder whether tax differences should be considered, though no tax data is given; (2) \"Round to the nearest whole dollar\" could be applied at intermediate steps (e.g., rounding the required salary to $123,861 first, giving a $2,361 shortfall) versus only at the final step (also $2,361 here), but in this case both approaches converge to the same answer.", "verdict": "Correct"}, {"entry_id": 18, "problem": "* Scenario: A risk committee is evaluating a proposed equal-weight portfolio with 50% in Stock A and 50% in Stock B, rebalanced monthly. Neither stock paid dividends during the period. The analyst must estimate risk using the five most recent monthly simple total returns, computed from the following month-end prices:\n\n| Date | Stock A Price | Stock B Price |\n|---|---:|---:|\n| Month 0 | 100.000000 | 200.000000 |\n| Month 1 | 102.000000 | 202.000000 |\n| Month 2 | 100.980000 | 197.960000 |\n| Month 3 | 104.009400 | 205.878400 |\n| Month 4 | 104.009400 | 207.937184 |\n| Month 5 | 108.169776 | 214.17529952 |\n\nThe committee requires the estimated one-month portfolio variance, using unbiased sample variance and covariance estimates from the five monthly returns, to be no greater than `0.00040` in decimal-return variance units.\n\n* The Core Question: What is the portfolio\u2019s variance spread versus the risk limit, expressed in squared percentage points and rounded to the nearest `0.01`, and does the portfolio pass or fail the risk limit?", "answer": "Exceeds the limit by `0.50` squared percentage points; `Fail`.", "feedback": "Verdict: Correct\n\nAnalysis: Solving independently, the five monthly returns are A: (2%, \u22121%, 3%, 0%, 4%) and B: (1%, \u22122%, 4%, 1%, 3%). The unbiased sample statistics yield Var(A) = 0.00043, Var(B) = 0.00053, and Cov(A,B) = 0.00042. The equal-weight portfolio variance is 0.25(0.00043) + 0.25(0.00053) + 2(0.25)(0.00042) = 0.00045. The risk limit is 0.00040, so the portfolio exceeds the limit by 0.00005 in decimal-return variance units. Converting to squared percentage points (1 pp\u00b2 = 0.0001 in decimal variance units), the spread is 0.50 pp\u00b2, and since the variance exceeds the limit, the portfolio fails. The student's final answer \u2014 \"Exceeds the limit by 0.50 squared percentage points; Fail\" \u2014 matches my independently derived result exactly, including the correct unit conversion (a common pitfall where students incorrectly report 0.005 or 0.05 by mishandling the pp\u00b2 conversion factor of 10\u2074).\n\nAmbiguities: The phrase \"expressed in squared percentage points\" could trip up students unfamiliar with the convention that converting a decimal variance to squared percentage points requires multiplying by 10,000 (not 100). Additionally, \"variance spread versus the risk limit\" does not explicitly define sign convention (portfolio variance minus limit vs. limit minus variance), though the accompanying pass/fail requirement and the phrase \"no greater than\" make the intended direction recoverable. Otherwise, the question is precise: it specifies simple total returns, unbiased (n\u22121) estimators, exact prices, and rounding to the nearest 0.01.", "verdict": "Correct"}, {"entry_id": 19, "problem": "* Scenario: A fixed-income analyst is comparing two bonds that both mature exactly one year from today and have $1,000 face value. Each bond pays its only remaining coupon together with principal at maturity. There is no accrued interest, tax, transaction cost, or default before maturity.\n\n  * BBB-rated corporate bond: 6.00% annual coupon, current price $982.00 per $1,000 face value.\n  * Matching Treasury bond: 3.00% annual coupon, current price $997.50 per $1,000 face value.\n\n  The investment policy allows buying the corporate bond only if its yield spread over the matching Treasury is at least 425 basis points.\n\n* The Core Question: Using annual yield to maturity from the one-year cash flows, by how many basis points is the corporate bond\u2019s spread above or below the 425 bp policy minimum, and is the bond eligible for purchase? Round the spread cushion/shortfall to the nearest basis point.", "answer": "**43 bps above the minimum; eligible for purchase**.", "feedback": "Verdict: Correct\n\nAnalysis: My independently derived result matches the student's answer. The corporate bond's one-year YTM is approximately 7.9430% and the matching Treasury's YTM is approximately 3.2581%, producing a spread of roughly 468.48 bp. Against the 425 bp policy minimum, this leaves a cushion of approximately 43.48 bp, which rounds to 43 bp. The student correctly identified both the magnitude (43 bp above the minimum) and the eligibility conclusion (eligible for purchase). The rounding to 43 rather than 44 is correct under standard nearest-basis-point rounding since the cushion is below 43.5 bp.\n\nAmbiguities: \"Round the spread cushion/shortfall to the nearest basis point\" is precise, but one minor point worth noting: the cushion of ~43.48 bp sits close to the 43.5 boundary, so a student who rounded the individual YTMs or the spread to fewer decimal places before computing the cushion could plausibly arrive at 44 bp (e.g., rounding the spread to 468.5 bp first). The question does not specify whether intermediate values should be carried at full precision, which invites this alternative result. Otherwise, the question is well-specified: cash flows, timing, compounding convention (annual, one-year horizon), and the policy threshold are all unambiguous.", "verdict": "Correct"}, {"entry_id": 20, "problem": "* Scenario: At the end of Q4, a central bank is reviewing annualized nominal macroeconomic data for Country A. All values below are in **billions of dollars**.\n\n  National income accountants report:\n  - Household final consumption expenditures: 12,480  \n  - Nonresidential fixed investment: 2,080  \n  - Residential fixed investment: 870  \n  - Increase in private inventories: 170  \n  - Federal government consumption and investment: 1,550  \n  - State and local government consumption and investment: 2,350  \n  - Exports of goods and services: 3,000  \n  - Imports of goods and services: 3,550  \n\n  The central bank\u2019s broad-money aggregate for the same period consists of:\n  - Currency outside banks: 2,100  \n  - Demand deposits and other checkable deposits: 3,800  \n  - Savings deposits: 9,200  \n  - Small-denomination time deposits: 1,000  \n  - Retail money market funds: 1,400  \n\n  Policymakers define the broad-money turnover benchmark as **1.15**. They assume the broad-money stock remains unchanged and that any nominal demand support adds dollar-for-dollar to annualized nominal GDP.\n\n* The Core Question: What is the minimum increase in annualized nominal GDP required for broad-money turnover to reach the benchmark of 1.15, rounded to the nearest **billion dollars**?", "answer": "**$1,175 billion**", "feedback": "Verdict: Correct\n\nAnalysis: The student's final answer of $1,175 billion matches my independently derived result exactly. The solution requires computing nominal GDP via the expenditure approach (consumption, total investment including inventories, total government spending, and net exports, which are negative here), summing the broad-money components to obtain the money stock, multiplying that stock by the 1.15 velocity benchmark to find the required GDP level, and taking the difference between the required and current GDP. The student's figure indicates all components were aggregated correctly \u2014 including properly treating imports as a subtraction and including the inventory change in investment \u2014 and the velocity relationship (V = GDP/M) was applied correctly.\n\nAmbiguities: The phrase \"broad-money turnover\" is not a standard textbook term, though the context (\"turnover benchmark\" with the money aggregate) makes clear it refers to the velocity of money (GDP \u00f7 money stock). Additionally, the instruction that \"the broad-money stock remains unchanged\" is necessary to fix the denominator, and it is stated; without it, a student might consider adjusting M instead of GDP. Otherwise, the question's data and definitions are precise.", "verdict": "Correct"}, {"entry_id": 21, "problem": "* Scenario: A firm is evaluating a five-year infrastructure upgrade. All project cash flows occur at year-end, and there are no cash flows today. At the end of Year 1, the firm must pay a construction invoice of $2,000,000 and will receive a government rebate of $300,000 at the same time. In each of Years 2 through 5, the upgrade generates annual service revenue of $1,350,000, annual variable cash costs of $520,000, annual fixed cash operating costs of $280,000, and annual maintenance capital spending of $50,000. At the end of Year 5 only, the firm also expects to sell the equipment for $400,000. Ignore depreciation and any project-specific taxes in the cash-flow calculation.\n\n  The project has the same risk as the firm\u2019s existing assets. The firm\u2019s target capital structure is 50% debt and 50% equity by market value. The risk-free rate is 3%, the expected market return is 12%, and the project beta is 1.0. The firm can borrow at a 10% pre-tax rate, and its corporate tax rate is 20%. The investment committee requires the project\u2019s net present value to exceed $150,000.\n\n* The Core Question: Using the derived year-end cash flows and the derived discount rate, what is the project\u2019s signed NPV spread over the $150,000 committee threshold, rounded to the nearest whole dollar? A positive number means the project exceeds the threshold; a negative number means it falls short.", "answer": "-$6,237", "feedback": "Verdict: Partially Correct due to rounding or minor variations\n\nAnalysis: My independently derived solution proceeds as follows (conceptually): the discount rate is the WACC built from CAPM cost of equity (3% + 1.0 \u00d7 9% = 12%) and after-tax cost of debt (10% \u00d7 (1 \u2212 0.20) = 8%), giving 0.5(12%) + 0.5(8%) = 10%. The cash flows are \u2212$1,700,000 at Year 1 (invoice net of rebate), $500,000 in Years 2\u20134 (1,350,000 \u2212 520,000 \u2212 280,000 \u2212 50,000), and $900,000 in Year 5 ($500,000 operating flow plus $400,000 salvage). Discounting at 10%, the exact NPV is $143,761.91 (numerator 231,530 \u00f7 1.1\u2075 = 1.61051), so the signed spread over the $150,000 threshold is \u2212$6,238 when rounded to the nearest whole dollar.\n\nThe student's answer of \u2212$6,237 is $1 off from the exact result. This discrepancy almost certainly arises from rounding intermediate discount factors or individual present values (e.g., truncating each year's PV to the nearest dollar or cent before summing), which accumulated to a $1 difference in the final spread. The student clearly applied the correct cash-flow construction (correctly netting the rebate, identifying the $500,000 recurring flow, adding salvage in Year 5 only) and the correct 10% WACC \u2014 otherwise the answer would be off by far more than $1. The methodology is sound; only the final rounding precision is at fault.\n\nAmbiguities: The question is largely precise, but two phrasings could invite alternative interpretations: (1) \"The firm can borrow at a 10% pre-tax rate, and its corporate tax rate is 20%\" alongside \"Ignore depreciation and any project-specific taxes in the cash-flow calculation\" \u2014 a student might wonder whether the 20% tax rate should be ignored entirely (i.e., use pre-tax cost of debt in the WACC), since taxes are excluded from cash flows. The intended reading is that taxes are ignored only in the cash flows but applied in the after-tax cost of debt. (2) \"annual maintenance capital spending of $50,000\" \u2014 whether this is a cash outflow in the project cash flow or a capitalized item could be questioned, though treating it as an annual cash outflow is the natural reading here.", "verdict": "Partially Correct due to rounding or minor variations"}, {"entry_id": 22, "problem": "* Scenario: A firm is considering purchasing a 3-year product distribution right today for an upfront price of **$2,300,000**, paid immediately at closing. If acquired, all operating cash flows occur at the end of each year. There is no depreciation, no working capital requirement, no salvage value, and no additional capital expenditure.\n\n  Expected operating data:\n\n  | Year | Units Sold | Price per Unit | Variable Cash Cost per Unit | Fixed Cash Operating Cost |\n  |---:|---:|---:|---:|---:|\n  | 1 | 30,000 | $80 | $35 | $450,000 |\n  | 2 | 36,000 | $82 | $35 | $492,000 |\n  | 3 | 42,000 | $85 | $40 | $390,000 |\n\n  The corporate tax rate is **20%**, with taxes paid in the same year as the operating cash flows. The firm finances projects using market-value weights of **$12 million equity** and **$6 million debt**. The risk-free rate is **3%**, the firm\u2019s equity beta is **1.0**, the expected market risk premium is **7%**, and the pre-tax cost of debt is **5%**.\n\n* The Core Question: What is the net dollar value created today by purchasing the distribution right, after paying the upfront price, rounded to the nearest whole dollar?", "answer": "**$142,311**", "feedback": "Verdict: Correct\n\nAnalysis: The student's final answer of **$142,311** matches my independently derived result exactly. My hidden solution involved computing after-tax operating cash flows for each year (Year 1: $720,000; Year 2: $960,000; Year 3: $1,200,000), deriving a WACC of 8% (cost of equity of 10% via CAPM, after-tax cost of debt of 4%, with weights of 2/3 equity and 1/3 debt), discounting the three cash flows to a present value of approximately $2,442,311, and subtracting the $2,300,000 upfront cost to obtain an NPV of $142,310.64, which rounds to $142,311. The student correctly handled the tax treatment (no depreciation tax shield exists since there is no depreciation), correctly applied the tax adjustment to the cost of debt, used market-value capital structure weights properly, and rounded to the nearest whole dollar as instructed. Full marks.\n\nAmbiguities: The question is largely precise, but two minor points could invite alternative interpretations: (1) \"The firm finances projects using market-value weights of $12 million equity and $6 million debt\" \u2014 it is implied but not explicitly stated that these weights should be used to compute a WACC for discounting; a student might wonder whether project-specific risk adjustments are intended. (2) \"the firm's equity beta is 1.0\" \u2014 the question does not explicitly state whether the project's risk matches the firm's overall risk, so using the firm's WACC as the project discount rate is an implicit (though standard) assumption. Neither ambiguity affects the expected numerical answer.", "verdict": "Correct"}, {"entry_id": 23, "problem": "* Scenario: A European call option is written on a non-dividend-paying stock. The firm has 5,000,000 shares outstanding and a market capitalization of $500,000,000, and the option\u2019s exercise price is set equal to the current stock price. The option expires exactly 365 days from today. A one-year zero-coupon Treasury with $100 face value trades today at $95.12294245, and rates are quoted using continuous compounding. The option market\u2019s annualized variance quote for the stock is 0.0400. A trading desk is long 250 option contracts, each covering 100 shares. Immediately after the position is established, implied volatility increases by 1.50 percentage points. Use the Black\u2013Scholes vega-based first-order approximation with volatility expressed in decimal form.\n\n* The Core Question: What is the approximate dollar increase in the value of the option position, rounded to the nearest whole dollar?", "answer": "$14,072", "feedback": "Verdict: Correct\n\nAnalysis: My independently derived result matches the student's answer. The scenario implies a stock price of $100 (market cap divided by shares), a strike of $100 (at-the-money), a continuously compounded risk-free rate of 5% (from the Treasury price, since the price corresponds exactly to e^(\u22120.05)), a volatility of 20% (square root of the 0.04 variance), and a one-year maturity. The resulting d\u2081 is 0.35, giving a per-share vega of approximately 37.524 (S\u221aT\u00b7\u03c6(d\u2081)). Multiplying by the 0.015 volatility shock and the 25,000 shares underlying the position (250 contracts \u00d7 100 shares) yields approximately $14,071.5, which rounds to $14,072. The student's final answer of $14,072 is correct to the nearest whole dollar.\n\nAmbiguities: The phrase \"rounded to the nearest whole dollar\" combined with an exact result of approximately $14,071.51 sits very close to a rounding boundary; a student using a slightly less precise value of \u03c6(0.35) (e.g., a table value of 0.3752) could legitimately arrive at $14,070 or $14,071 instead. Additionally, \"implied volatility increases by 1.50 percentage points\" could conceivably be misread as a 1.50% relative increase in volatility, though the phrase \"percentage points\" and the instruction \"with volatility expressed in decimal form\" make the intended interpretation (\u0394\u03c3 = 0.015) reasonably clear.", "verdict": "Correct"}, {"entry_id": 24, "problem": "* Scenario: A technical analyst is evaluating the Volume Price Trend signal for AlderTech Corp. over five consecutive trading days. For each day, the stock\u2019s \u201cprice\u201d for VPT purposes is the price of the final regular-session trade print, and the day\u2019s \u201cvolume\u201d is the total number of shares across all listed regular-session prints. Use the first date as the VPT starting point with VPT = 0.\n\n| Date | Regular-session trade prints |\n|---|---|\n| Mon | 25,000 shares at $99.80; 40,000 shares at $100.20; 1,135,000 shares at $100.00 |\n| Tue | 300,000 shares at $101.50; 700,000 shares at $103.20; 1,000,000 shares at $105.00 |\n| Wed | 400,000 shares at $104.00; 600,000 shares at $103.50; 500,000 shares at $102.90 |\n| Thu | 200,000 shares at $103.90; 329,000 shares at $106.00; 500,000 shares at $108.00 |\n| Fri | 800,000 shares at $107.50; 700,000 shares at $107.10; 1,000,000 shares at $106.92 |\n\nThe desk\u2019s rule is: generate a bullish confirmation only if the final VPT is strictly greater than 100,000 VPT units.\n\n* The Core Question: What is the final VPT spread over or under the 100,000-unit confirmation threshold, and does the bullish confirmation trigger? Report the spread in VPT units, rounded to the nearest whole unit.", "answer": "-4,000 VPT units; No, the bullish confirmation does not trigger.", "feedback": "Verdict: Correct\n\nAnalysis: The student's final answer matches my independently derived result exactly. Working through the daily closes (last print) and total volumes, the cumulative VPT after Friday comes to 96,000 units, which is 4,000 units below the 100,000-unit threshold \u2014 a spread of \u22124,000 VPT units. Since the rule requires the final VPT to be strictly greater than 100,000, the bullish
