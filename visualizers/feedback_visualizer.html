id common dividends of $0.90, $0.94, $0.98, and $1.02 per share over four quarters. At year-end, Horizon had 125,000,000 common shares outstanding and an equity market capitalization of $6.000 billion. Management has authorized an aggregate common dividend payout of $506.88 million for the next fiscal year, with no expected change in shares outstanding. A comparable utility-sector equity benchmark return is 11.25%.\n\n* The Core Question: Using the Gordon Growth expected-return function, what is Horizon\u2019s model-implied spread over the benchmark, in basis points, rounded to the nearest whole basis point? State whether the spread is above or below the benchmark.", "answer": "235 basis points above the benchmark", "feedback": "Verdict: Incorrect\n\nAnalysis: My independently derived result is approximately **280 basis points above the benchmark** (the model-implied expected return is \u224814.05%, versus the 11.25% benchmark, a spread of \u2248279.8 bps \u2192 280 bps). The student's answer of 235 bps above does not match. The error is diagnosable: 235 bps results from using the *trailing* dividend yield (D\u2080/P\u2080 = $3.84/$48 = 8.00%) plus growth (5.6%), giving 13.60% and a spread of 2.35%. The Gordon Growth expected-return function requires the *forward* dividend, D\u2081/P\u2080 + g. Here D\u2081 is explicitly provided via the authorized $506.88 million payout ($4.05504 per share), yielding D\u2081/P\u2080 = 8.448%, plus g = 5.6% (implied by $4.05504/$3.84 \u2212 1), for an expected return of 14.048%. The student correctly extracted the growth rate and benchmark spread mechanics but used the wrong dividend in the yield term \u2014 a classic D\u2080 vs. D\u2081 conceptual error. The directional call (\"above the benchmark\") is correct, but the magnitude is wrong due to this conceptual mistake, not rounding.\n\nAmbiguities: The question is largely precise, but one could note that the phrase \"Using the Gordon Growth expected-return function\" assumes the student knows the convention r = D\u2081/P\u2080 + g; a student might argue that since the question provides both trailing dividends (\"paid common dividends of $0.90, $0.94, $0.98, and $1.02\") and the forward payout (\"authorized an aggregate common dividend payout of $506.88 million for the next fiscal year\"), it is ambiguous which belongs in the yield term. However, standard finance convention unambiguously requires the forward dividend, so this is a weak defense \u2014 the answer should be 280 bps, not 235 bps.", "verdict": "Incorrect"}, {"entry_id": 246, "problem": "* Scenario: A dividend-focused equity fund is evaluating Helios Regulated Utilities as of today\u2019s market close. Helios has 20,000,000 common shares outstanding and an equity market capitalization of $1,500,000,000. Over the last four quarters, Helios paid total common cash dividends of $10,000,000, $10,500,000, $11,000,000, and $10,500,000, respectively. There were no share issuances or repurchases during this period. In the prior fiscal year, Helios paid total common cash dividends of $40,000,000, also with 20,000,000 shares outstanding. The fund estimates Helios\u2019s dividend growth rate using the year-over-year growth in annual dividends per share. The fund\u2019s benchmark required return is 7.25% annually. If the Gordon Growth expected return exceeds the benchmark, the fund will buy 100,000 shares.\n\n* The Core Question: Using the Gordon Growth expected return formula, what is the fund\u2019s net dollar expected excess return over the benchmark on the 100,000-share position, rounded to the nearest whole dollar?", "answer": "$41,250", "feedback": "Verdict: Incorrect\n\nAnalysis: My independently derived result is **$51,750**, not $41,250. Working through it: the trailing four-quarter dividends sum to $42,000,000 ($2.10 per share on 20,000,000 shares), the prior year's dividends were $40,000,000 ($2.00 per share), giving a year-over-year DPS growth rate of 5.00%. The current share price is $1,500,000,000 / 20,000,000 = $75.00. The Gordon Growth expected return uses the *forward* dividend, D\u2081 = D\u2080 \u00d7 (1 + g) = $2.10 \u00d7 1.05 = $2.205, so expected return = $2.205 / $75 + 5.00% = 2.94% + 5.00% = 7.94%. The excess over the 7.25% benchmark is 0.69%, applied to a position value of 100,000 \u00d7 $75 = $7,500,000, yielding $51,750.\n\nThe student's answer of $41,250 corresponds exactly to using the **trailing** dividend yield (D\u2080/P\u2080 = $2.10/$75 = 2.80%) instead of the forward yield: 2.80% + 5.00% = 7.80%, excess of 0.55% \u00d7 $7,500,000 = $41,250. This is a classic conceptual error: the Gordon Growth Model is defined as P\u2080 = D\u2081/(r \u2212 g), which rearranges to r = D\u2081/P\u2080 + g. Failing to grow the current dividend one period forward (i.e., using D\u2080 rather than D\u2081 = D\u2080(1+g)) is the precise mistake that produces the student's figure.\n\nAmbiguities: The phrase \"Using the Gordon Growth expected return formula\" is the primary point of contention. While the canonical Gordon model unambiguously requires D\u2081 = D\u2080(1+g) in the numerator, some practitioner shorthand and certain textbook treatments approximate expected return as \"trailing dividend yield + growth\" (D\u2080/P\u2080 + g). A student relying on that simplified convention would arrive at $41,250. Additionally, \"Over the last four quarters\" implicitly asks the student to treat the trailing twelve-month dividend as D\u2080, which is standard but not explicitly stated. Under the strict, textbook Gordon Growth formula, however, the answer must be $51,750, so the student's response is marked incorrect rather than a matter of rounding.", "verdict": "Incorrect"}, {"entry_id": 247, "problem": "* Scenario: RidgeLine Components, Inc. must compute its fiscal-year 2025 excess cash flow under its senior credit agreement for the year ended December 31, 2025. All amounts below are in millions of U.S. dollars unless otherwise stated.\n\n  RidgeLine reported pretax income of $42.0 and income tax expense of $9.6. The income statement included the following non-cash charges: depreciation of $7.8, amortization of $2.1, stock-based compensation of $1.4, and a fixed-asset impairment charge of $0.9. It also included non-cash gains consisting of a $1.1 unrealized commodity-hedge gain and a $0.7 fair-value gain on contingent consideration.\n\n  The credit agreement defines operating working capital as accounts receivable plus inventory plus prepaid expenses, minus accounts payable and accrued expenses. A decrease in operating working capital is added in the excess-cash-flow calculation; an increase is subtracted. RidgeLine\u2019s balances were:\n\n  | Item | Dec. 31, 2024 | Dec. 31, 2025 |\n  |---|---:|---:|\n  | Accounts receivable | $18.0 | $15.5 |\n  | Inventory | $12.0 | $13.8 |\n  | Prepaid expenses | $2.4 | $2.0 |\n  | Accounts payable | $10.6 | $12.1 |\n  | Accrued expenses | $8.0 | $7.2 |\n\n  During 2025, RidgeLine paid cash for capital assets as follows: $11.2 for new manufacturing machinery, $1.6 for a capitalized ERP implementation, $2.0 for a roof replacement, and $0.4 for warehouse equipment. A separate $2.5 forklift package was financed directly by the seller with no cash paid in 2025.\n\n  Scheduled funded-debt principal payments consisted of four quarterly term-loan amortization payments of $1.25 each and twelve monthly equipment-loan principal installments of $0.10 each. RidgeLine also made a voluntary term-loan prepayment of $3.0 on November 30, 2025, from internally generated cash flow. For the excess-cash-flow calculation, only scheduled funded-debt principal payments are included; voluntary prepayments are handled only in the sweep credit described below.\n\n  RidgeLine also made a $4.6 cash contribution to a minority-owned joint venture using internally generated cash flow. An unrelated $8.0 acquisition deposit funded entirely with newly issued equity is excluded.\n\n  Under the credit agreement\u2019s annual cash sweep, RidgeLine must prepay term debt in an amount equal to 50% of positive excess cash flow, reduced dollar-for-dollar by eligible voluntary term-loan prepayments made during the same fiscal year from internally generated cash flow. If the result is negative, no sweep payment is required.\n\n* The Core Question: What is RidgeLine\u2019s net required mandatory term-loan prepayment for fiscal-year 2025, rounded to the nearest whole dollar?", "answer": "$6,300,000", "feedback": "Verdict: Correct\n\nAnalysis: The student's final answer of $6,300,000 matches my independently derived result exactly. Working through the calculation internally: starting from net income (pretax income less tax expense), adding back the four non-cash charges, deducting the two non-cash gains, adding the decrease in operating working capital (which, by coincidence of the figures, exactly offsets the non-cash gains deduction in magnitude), subtracting cash capital expenditures (correctly excluding the seller-financed forklift package), subtracting scheduled funded-debt amortization (quarterly term-loan payments plus monthly equipment-loan installments), and subtracting the joint-venture contribution funded with internal cash yields positive excess cash flow of $18.6 million. Applying the 50% sweep percentage gives $9.3 million, and reducing that dollar-for-dollar by the $3.0 million eligible voluntary prepayment produces a net required mandatory prepayment of $6.3 million. The student correctly excluded the non-cash financed asset purchase, the equity-funded acquisition deposit, and the voluntary prepayment from the ECF build-up itself (applying it only as a sweep credit). The answer is fully correct.\n\nAmbiguities: Minimal, but two phrasings merit note. First, \"income tax expense of $9.6\" \u2014 the calculation requires net income as the starting point, and the question implies (but does not explicitly state) that the ECF definition begins with net income; a reader might wonder whether to start from pretax income. However, the standard credit-agreement convention and the structure of the add-backs make net income the clearly intended base. Second, \"stock-based compensation of $1.4\" is listed among \"non-cash charges,\" removing any doubt about its treatment, and the working-capital sign convention is explicitly defined (\"A decrease... is added; an increase is subtracted\"), so no material interpretive risk remains. Effectively: None of consequence.", "verdict": "Correct"}, {"entry_id": 248, "problem": "* Scenario:  \nAn auto insurer is closing its 2025 accident-year reserve analysis. During 2025, it wrote $27,600,000 of premium. Its unearned premium reserve was $3,900,000 on January 1, 2025 and $7,500,000 on December 31, 2025.  \n\n  Actuaries estimate the accident year will produce 3.2 ultimate claims per 100 earned vehicle-years. The insurer recorded 62,500 earned vehicle-years, and the expected ultimate cost per claim is $8,400.  \n\n  Through December 31, 2025, the insurer has paid $5,950,000 in indemnity losses and $850,000 in allocated loss adjustment expenses. It has also collected $300,000 in salvage and subrogation recoveries related to paid claims, which reduce paid losses.  \n\n  The claims reserve account contains $1,750,000 in Treasury bills and $1,250,000 in demand deposits, but $250,000 of the demand deposits is pledged as restricted collateral and is unavailable for this accident year\u2019s claim reserves.  \n\n  The insurer has already booked a provisional IBNR liability of $7,200,000. Any additional reserve strengthening reduces pre-tax income dollar-for-dollar. The corporate tax rate is 21%.\n\n* The Core Question:  \nUsing the IBNR reserve calculation, what is the after-tax decrease in net income from the additional reserve strengthening required, rounded to the nearest dollar?", "answer": "$276,500", "feedback": "Verdict: Correct\n\nAnalysis: The student's final answer of $276,500 matches my independently derived result exactly. The correct solution path requires: (1) calculating ultimate losses from the frequency-severity estimate (62,500 earned vehicle-years \u00d7 3.2 claims per 100 vehicle-years \u00d7 $8,400 per claim = $16,800,000); (2) computing net paid losses including ALAE and netting salvage/subrogation ($5,950,000 + $850,000 \u2212 $300,000 = $6,500,000); (3) determining available case reserves by excluding the restricted collateral ($1,750,000 + $1,250,000 \u2212 $250,000 = $2,750,000); (4) computing indicated IBNR as ultimate minus paid minus case reserves ($16,800,000 \u2212 $6,500,000 \u2212 $2,750,000 = $7,550,000); (5) finding required strengthening over the booked provision ($7,550,000 \u2212 $7,200,000 = $350,000); and (6) applying the after-tax factor ($350,000 \u00d7 (1 \u2212 0.21) = $276,500). The student correctly ignored the premium and unearned premium reserve figures, which are distractors irrelevant to the IBNR calculation, and correctly handled the salvage offset and the restricted collateral exclusion.\n\nAmbiguities: \n1. \"The claims reserve account contains $1,750,000 in Treasury bills and $1,250,000 in demand deposits\" \u2014 this describes assets funding the reserve, not a booked case reserve liability. Treating an asset account balance as the case reserve in the IBNR formula (Ultimate \u2212 Paid \u2212 Case) is conceptually unconventional, and a careful student might question whether these assets should enter the IBNR calculation at all.\n2. \"the expected ultimate cost per claim is $8,400\" \u2014 it is not stated whether this severity figure includes ALAE. Since paid ALAE of $850,000 is subtracted as part of paid losses, an inconsistency arises if the $8,400 is indemnity-only; a student could defensibly exclude ALAE from paid amounts, yielding a different answer.\n3. The premium and unearned premium reserve data invite computation of earned premium ($24,000,000), which serves no purpose in the required answer \u2014 acceptable as a distractor, but it may signal to some students that a loss-ratio-based method (e.g., Bornhuetter-Ferguson) was intended rather than pure frequency-severity.", "verdict": "Correct"}, {"entry_id": 249, "problem": "* Scenario: On January 2, a portfolio manager deploys capital into four positions and liquidates all positions on June 30. For each position, the initial investment is the total cash paid to establish the position, including transaction fees and accrued interest where applicable. The final value is the total cash received by June 30, including sale proceeds, dividends, coupons, distributions, and FX conversion proceeds, net of selling or repatriation fees.\n\n  1. **Alpha ETF:** Bought 900 shares at $64.80 per share and paid an $18 commission. During the holding period, the ETF paid dividends of $0.75 per share. On June 30, all shares were sold at $70.25 per share with an $18 commission.\n  2. **Municipal Bond Fund:** Bought 1,500 shares at $38.40 per share with no purchase commission. During the holding period, the fund paid distributions of $0.52 per share. On June 30, all shares were redeemed at $39.10 per share, with a redemption fee equal to 0.10% of gross redemption proceeds.\n  3. **Corporate Bond:** Bought $100,000 face value at a clean price of 96.75% of par, paid $1,250 of accrued interest to the seller, and paid a $75 transaction fee. During the holding period, the bond paid one coupon equal to 2.00% of par. On June 30, the bond was sold at a clean price of 98.40% of par, the buyer paid $800 of accrued interest, and a $75 transaction fee was paid.\n  4. **Euro Deposit:** Wired $40,000 to buy euros at an exchange rate of 1.1000 USD/EUR and paid a $25 wire fee. The euro balance earned 1.50% simple interest over the holding period. On June 30, the euros were converted back to dollars at 1.1450 USD/EUR, and a $25 repatriation fee was deducted.\n\n  The benchmark for the same holding period is a Treasury bill return of **3.20%** applied to the portfolio\u2019s total initial cash outlay.\n\n* The Core Question: Using the portfolio return function as the intermediate step, what is the portfolio\u2019s **dollar excess profit over the Treasury-bill benchmark**, rounded to the nearest whole dollar?", "answer": "$4,447", "feedback": "Verdict: Correct\n\nAnalysis: The student's final answer of $4,447 matches my independently derived result. My hidden computation yields a total initial outlay of $254,038, a total final value of approximately $266,614.26, and thus a portfolio profit of about $12,576.26 (a portfolio return of roughly 4.9505%). The T-bill benchmark profit is 3.20% \u00d7 $254,038 \u2248 $8,129.22, giving an excess profit of approximately $4,447.04, which rounds to $4,447. The student correctly handled the subtle cash-flow items: commissions added to cost and subtracted from proceeds, the 0.10% redemption fee on gross proceeds, accrued interest paid and received on the corporate bond, the coupon receipt, and the wire/repatriation fees on the FX leg with simple interest on the euro balance.\n\nAmbiguities: A few phrasings could invite alternative interpretations, though none change the answer materially here:\n1. \"Wired $40,000 to buy euros at an exchange rate of 1.1000 USD/EUR and paid a $25 wire fee\" \u2014 it is slightly ambiguous whether the full $40,000 is converted to euros (with the $25 fee paid separately, making the outlay $40,025) or whether the fee is deducted from the $40,000 before conversion (converting only $39,975). The first interpretation is the more natural reading and is what the correct answer requires.\n2. \"1.50% simple interest over the holding period\" \u2014 this is clearly a period rate, not annualized, but a careless reader might attempt to pro-rate it for the roughly half-year holding period.\n3. \"Treasury bill return of 3.20% applied to the portfolio's total initial cash outlay\" \u2014 this clarifies the benchmark base well, but a student might mistakenly treat 3.20% as an annualized rate requiring de-annualization; the question intends it as the holding-period return.\n4. \"Using the portfolio return function as the intermediate step\" \u2014 this instructs computing the aggregate return first, but whether one aggregates dollar profits directly or computes the return and re-multiplies, the result is identical, so this is a procedural rather than substantive ambiguity.", "verdict": "Correct"}, {"entry_id": 250, "problem": "* Scenario: A fund manager begins the year with no cash and three equity positions:\n  * 800 shares of Alpha purchased at $50 per share\n  * 1,200 shares of Beta purchased at $25 per share\n  * 500 shares of Gamma purchased at $80 per share\n\n  By year-end:\n  * Alpha trades at $54 and paid a $1 dividend per share\n  * Beta trades at $23.50 and paid a $0.50 dividend per share\n  * Gamma trades at $92 and paid a $2 dividend per share\n\n  The fund\u2019s benchmark produced an 8.00% total return over the same year.\n\n* The Core Question: Using beginning-of-year market values as portfolio weights and each stock\u2019s total return as the values, what is the fund\u2019s dollar outperformance versus the benchmark, rounded to the nearest whole dollar?", "answer": "$1,000", "feedback": "Verdict: Correct\n\nAnalysis: The student's final answer of $1,000 matches my independently derived result exactly. The beginning market values total $110,000 ($40,000 Alpha + $30,000 Beta + $40,000 Gamma). Computing each stock's total return (price appreciation plus dividends) yields 10.00% for Alpha, \u20134.00% for Beta, and 17.50% for Gamma, producing a portfolio dollar gain of $9,800 (an 8.9091% total return). The benchmark at 8.00% on the same $110,000 base implies a benchmark dollar gain of $8,800. The difference, $9,800 \u2013 $8,800, is precisely $1,000. The student's answer is fully correct with no rounding issues.\n\nAmbiguities: The phrase \"Using beginning-of-year market values as portfolio weights and each stock's total return as the values\" is somewhat awkwardly worded \u2014 \"as the values\" is imprecise and could momentarily confuse a reader about whether returns or dollar amounts are being weighted. However, the intended methodology (a beginning-value-weighted total return compared against the benchmark, expressed in dollars on the beginning portfolio value of $110,000) is the only sensible interpretation, and both interpretations (dollar P&L difference vs. weighted-return difference \u00d7 base) converge to the same $1,000 answer. Additionally, the question implicitly assumes dividends are not reinvested mid-year and that the benchmark applies to the same $110,000 capital base, both standard conventions here.", "verdict": "Correct"}, {"entry_id": 251, "problem": "* Scenario: A life insurer issues 2,500 identical 5-year single-premium term life policies. For each policy, a $100,000 death benefit is payable at the end of the policy year of death. The unconditional probabilities of death in policy years 1 through 5 are 0.010, 0.012, 0.014, 0.016, and 0.018, respectively. If the insured survives 5 years, no benefit is paid. The annual effective discount rate is 4%. The insurer defines the net single premium as the present value of expected death benefits. The filed gross single premium charged at issue equals 135% of the net single premium plus a flat $1,000 policy fee. Expected expense cash flows per policy are $700 at issue and $90 at each of policy anniversaries 1, 2, 3, and 4, discounted at the same 4% rate. After applying the expense-loading present value formula, the insurer also incurs a one-time fixed onboarding cost of $300,000 for the full block of 2,500 policies.\n* The Core Question: What is the aggregate net dollar contribution from the block of policies after the fixed onboarding cost, rounded to the nearest whole dollar?", "answer": "$5,025,685", "feedback": "Verdict: Correct\n\nAnalysis: The student's final answer of $5,025,685 matches my independently derived result exactly. My hidden calculation yields a net single premium of approximately $6,162.76 per policy (discounting the probability-weighted $100,000 benefits at 4%), a gross single premium of approximately $9,319.72 (135% of NSP plus the $1,000 fee), and a present value of expenses of approximately $1,026.69 ($700 at issue plus $90 annuity-certain for years 1\u20134). The per-policy contribution of approximately $2,130.27, scaled to 2,500 policies, gives $5,325,685.35, and subtracting the $300,000 onboarding cost yields $5,025,685.35, which rounds to $5,025,685. The student has correctly executed every component: the discounting of unconditional death probabilities, the loading formula, the expense present value, the aggregation, and the fixed-cost deduction.\n\nAmbiguities: \n1. The phrase \"net dollar contribution\" is not a standard actuarial term and is not explicitly defined; the intended formula (Gross Premium \u2212 NSP \u2212 PV of Expenses, aggregated, minus the fixed cost) must be inferred. A reader could plausibly interpret \"contribution\" differently (e.g., excluding the expense PV or treating the policy fee differently).\n2. The expense cash flows of \"$90 at each of policy anniversaries 1, 2, 3, and 4\" could be interpreted as contingent on policy survival (requiring survival probabilities of 0.990, 0.978, 0.964, 0.948 as multipliers), rather than as certain payments. The phrase \"expected expense cash flows\" suggests the $90 figures are already expectation-adjusted, but this is not unambiguous; the contingent interpretation would yield a slightly different answer.\n3. The phrase \"after applying the expense-loading present value formula\" is awkward and does not clearly specify any formula, leaving the treatment of expenses to inference.", "verdict": "Correct"}, {"entry_id": 252, "problem": "* Scenario: Harbor Electric is a stable dividend-paying utility. At fiscal year-end, it reports 52,000,000 common shares issued and 3,000,000 treasury shares; there were no share count changes during the year, and treasury shares did not receive dividends. During the year, Harbor paid total common cash dividends of $156,800,000. At today\u2019s market close, the total market value of its outstanding common equity is $2,940,000,000. Management has announced that next year\u2019s total common dividend budget will be $166,208,000, with the same number of outstanding shares, and that this annual dividend growth rate is expected to continue indefinitely. A pension fund is considering buying 75,600 shares today and requires a benchmark annual return of 9.75%.\n\n* The Core Question: Using the Gordon Growth expected return implied by the data, what is the pension fund\u2019s expected annual dollar return advantage over its 9.75% benchmark, rounded to the nearest whole dollar?", "answer": "$71,820", "feedback": "Verdict: Incorrect\n\nAnalysis: The student's final answer of $71,820 does not match my independently derived result of **$86,335** (i.e., $86,335.20 rounded to the nearest dollar). The data clearly supports the following: outstanding shares of 49,000,000 (52M issued less 3M treasury), a current price of $60.00 per share, a trailing dividend per share of $3.20, a forward dividend per share of $3.392, and an implied perpetual growth rate of 6%. The Gordon Growth Model defines expected return as r = D\u2081/P\u2080 + g = $3.392/$60 + 6% = 11.6533%. On an investment of 75,600 \u00d7 $60 = $4,536,000, the expected dollar return is $528,595.20, versus a benchmark return of $4,536,000 \u00d7 9.75% = $442,260, for an advantage of $86,335.20 \u2248 $86,335.\n\nThe student's error is identifiable and diagnostic: $71,820 results from using the *trailing* dividend (D\u2080 = $3.20) instead of the *forward* dividend (D\u2081 = $3.392) in the yield component. That yields r = $3.20/$60 + 6% = 11.3333%, an advantage spread of 1.5833%, and $4,536,000 \u00d7 1.5833% = $71,820 exactly. This is a conceptual error: the Gordon Growth Model requires the next-period dividend D\u2081, which the problem explicitly provides via the announced $166,208,000 budget. Using D\u2080 in the numerator is a classic misapplication of the model.\n\nAmbiguities: The question states management announced \"next year's total common dividend budget will be $166,208,000\" and asks for \"the Gordon Growth expected return implied by the data.\" While the standard Gordon formulation unambiguously requires D\u2081 (which is explicitly given), the simultaneous presence of the trailing dividend figure ($156,800,000) could tempt a reader to compute a trailing yield and then add growth \u2014 precisely the error made here. A stricter phrasing such as \"use the announced next-year dividend as D\u2081 in the Gordon Growth Model\" would have eliminated this trap, though under conventional academic standards the question is sufficiently precise and the student's interpretation is not defensible as an alternative reading.", "verdict": "Incorrect"}, {"entry_id": 253, "problem": "* Scenario: A portfolio manager holds a callable bond position with total par value of **$25,000,000**. The bond is priced per **$100 of par** using an option-adjusted model. At the current benchmark yield curve level of **4.25%**, the position\u2019s full market value is **$26,125,000**. If the entire benchmark yield curve is shifted down to **4.05%**, the model values the position at **$26,900,000**. If the curve is shifted up to **4.45%**, the model values the position at **$25,550,000**. After computing the bond\u2019s effective duration from these model values, use a first-order duration approximation to estimate the dollar market value change if yields rise by an additional **15 basis points** from the current level.\n\n* The Core Question: What is the estimated dollar change in the position\u2019s market value for the additional 15 bp yield increase, rounded to the nearest whole dollar?", "answer": "**-$506,250**", "feedback": "Verdict: Correct\n\nAnalysis: The student's final answer of **\u2212$506,250** matches my independently derived result exactly. Computing the effective duration from the three model values (using the down-shift value, up-shift value, current full value, and the 20 bp shift size) yields a duration of approximately 12.92. Applying the first-order approximation \u0394V \u2248 \u2212Duration \u00d7 \u0394y \u00d7 V\u2080 with a 15 bp yield increase on the $26,125,000 full market value produces a dollar change of exactly \u2212$506,250 (the V\u2080 terms cancel cleanly, so no rounding is needed: \u2212$1,350,000 \u00d7 0.0015 / 0.004). The sign is correctly negative, reflecting a value decline for a yield increase, and the magnitude is exact.\n\nAmbiguities: The phrase \"if yields rise by an additional 15 basis points from the current level\" contains the word \"additional,\" which could be misread as 15 bp on top of the +20 bp shift already described (i.e., from 4.45% to 4.60%, or a 35 bp total move from 4.25%). However, the clarifying phrase \"from the current level\" anchors the shock at 4.25%, making the intended +15 bp interpretation reasonably clear. Additionally, the question instructs to use the \"full market value\" as the base, which is unambiguous here, though some students might erroneously attempt per-$100 price conversions using the $25,000,000 par value, which would introduce unnecessary complexity but should yield the same result if done correctly.", "verdict": "Correct"}, {"entry_id": 254, "problem": "* Scenario:  \nA pension fund holds the following four positions today:\n\n  - 18,000 shares of Alpha Corp., currently trading at $50 per share. Over the next year, analysts expect Alpha to pay a $1.00 dividend per share and end the year at $55 per share.  \n  - 10,000 shares of Beta Inc., currently trading at $80 per share. Over the next year, analysts expect Beta to pay a $2.40 dividend per share and end the year at $76 per share.  \n  - 25,000 shares of Gamma Ltd., currently trading at $20 per share. Gamma is expected to pay no dividend and end the year at $23 per share.  \n  - 3,000 shares of a Treasury ETF, currently trading at $100 per share. Over the next year, the ETF is expected to distribute $2.00 per share and end the year at $103 per share.\n\nThe pension board\u2019s required one-year return on the total portfolio is 6.75%. Ignore taxes, fees, and reinvestment of dividends.\n\n* The Core Question:  \nWhat is the portfolio\u2019s expected dollar surplus or shortfall relative to the board\u2019s required one-year dollar return, rounded to the nearest dollar?", "answer": "$13,250 expected surplus", "feedback": "Verdict: Correct\n\nAnalysis: The student's final answer of a $13,250 expected surplus matches my independently derived result exactly. The total portfolio value computes to $2,500,000, the expected total dollar return (capital gains/losses plus distributions across all four positions) computes to $182,000, and the required dollar return at 6.75% is $168,750. The difference is $182,000 \u2212 $168,750 = $13,250, a surplus. The student also correctly identified the direction (surplus, not shortfall), which is a common point of failure when one position (Beta, with an expected total return of \u2212$16,000) loses money.\n\nAmbiguities: None of consequence. The question is precise in its inputs and required rate. One could note that \"expected to distribute $2.00 per share\" for the Treasury ETF and \"pay a $1.00 dividend per share\" use slightly different verbs, but both unambiguously denote cash income to be added to price appreciation. The instruction to \"ignore taxes, fees, and reinvestment of dividends\" forecloses alternative compounding interpretations, so the calculation path is uniquely determined.", "verdict": "Correct"}, {"entry_id": 255, "problem": "* Scenario: A community bank is evaluating its fiscal-year 2025 interest profitability against a peer benchmark. All amounts below are in millions of dollars.\n\n  At the start of the year, the bank held:\n  - Commercial & industrial loans: $420.00  \n  - Residential mortgages: $310.00  \n  - Credit-card receivables: $85.00  \n  - Municipal and agency bonds: $120.00  \n  - Federal funds sold: $15.00  \n  - Non-interest-bearing cash and vault cash: $40.00  \n  - Premises and equipment: $35.00  \n\n  At the end of the year, the bank held:\n  - Commercial & industrial loans: $460.00  \n  - Residential mortgages: $330.00  \n  - Credit-card receivables: $95.00  \n  - Municipal and agency bonds: $110.00  \n  - Federal funds sold: $25.00  \n  - Non-interest-bearing cash and vault cash: $50.00  \n  - Premises and equipment: $36.00  \n\n  During the year, the bank earned:\n  - Interest on commercial & industrial loans: $28.40  \n  - Interest on residential mortgages: $17.85  \n  - Finance charges on credit-card balances: $12.10  \n  - Coupon income from municipal and agency bonds: $4.65  \n  - Interest on federal funds sold: $0.75  \n  - Deposit service fees: $3.20  \n  - Debit-card interchange revenue: $1.10  \n\n  During the year, the bank paid:\n  - Interest credited to savings and money-market deposits: $11.20  \n  - Interest on time certificates of deposit: $14.05  \n  - Interest on Federal Home Loan Bank advances: $3.10  \n  - Interest on overnight repurchase agreements: $0.65  \n  - Salaries and occupancy expense: $8.40  \n\n  The peer benchmark annual net interest margin is 3.40%.\n\n* The Core Question: What is the bank\u2019s annual net interest margin spread versus the peer benchmark, in basis points, rounded to two decimal places? Report a positive value if the bank outperformed the benchmark and a negative value if it underperformed.", "answer": "+12.79 basis points", "feedback": "Verdict: Correct\n\nAnalysis: The student's final answer of +12.79 basis points matches my independently derived result exactly. The correct approach requires: (1) identifying earning assets only (C&I loans, mortgages, credit-card receivables, bonds, and fed funds sold), averaging beginning and ending balances; (2) summing only interest income (excluding deposit service fees and interchange revenue, which are non-interest income); (3) summing only interest expense (excluding salaries and occupancy, which are non-interest expense); (4) computing NIM as net interest income over average earning assets; and (5) comparing against the 3.40% benchmark. The bank's NIM exceeds the benchmark by approximately 0.1279 percentage points, i.e., +12.79 basis points when rounded to two decimal places. The student correctly excluded non-interest items, correctly excluded non-earning assets (cash and premises) from the denominator, correctly used the average balance methodology, and applied the proper sign convention for outperformance.\n\nAmbiguities: The question does not explicitly state whether to use average earning assets or year-end (or beginning) earning assets as the denominator. The phrase \"annual net interest margin\" conventionally implies average earning assets, but a student using only end-of-year earning assets ($1,020.00) would get \u2248 \u22120.6863% (\u22126.86 bp relative spread... specifically 3.4069% \u2212 3.40% = +0.69 bp), and using beginning-of-year assets ($950.00) would get \u2248 +25.79 bp. Stating \"based on average earning assets\" would remove this ambiguity. Additionally, the question could clarify that \"net interest margin\" excludes fee income, though this is standard convention.", "verdict": "Correct"}, {"entry_id": 256, "problem": "* Scenario: The Republic of Aurelia reports its year-end external balance sheet in billions. Its domestic currency is the lira, denoted L. At the reporting date, the exchange rates are exactly 1 USD = L1.25 and 1 EUR = L1.50. Aurelia\u2019s residents hold the following claims on nonresidents: official reserve assets of USD 80.0 billion, euro-area bonds of EUR 40.0 billion, outward foreign direct investment of L110.0 billion, and bank loans to nonresident borrowers of USD 24.0 billion. Nonresidents hold the following claims on Aurelia\u2019s residents: domestic government bonds of L150.0 billion, inward foreign direct investment of EUR 70.0 billion, external bank borrowing of USD 32.0 billion, and listed domestic equities of L45.0 billion. Aurelia\u2019s nominal GDP is L250.0 billion. A policy rule requires the country\u2019s net foreign assets to be no lower than -15.0% of GDP. The government can use a domestic tax surplus to buy additional foreign reserve assets, leaving foreign liabilities and GDP unchanged.\n* The Core Question: What is the minimum additional purchase of foreign reserve assets required for Aurelia to meet the policy rule exactly, in L billions, rounded to the nearest 0.01 billion?", "answer": "L2.50 billion", "feedback": "Verdict: Correct\n\nAnalysis: My independently derived result matches the student's answer exactly. Converting all foreign assets to lira gives total external assets of L300.0 billion (reserves L100.0, euro bonds L60.0, outward FDI L110.0, bank loans L30.0). Total external liabilities are L340.0 billion (government bonds L150.0, inward FDI L105.0, external borrowing L40.0, equities L45.0). Net foreign assets are therefore L-40.0 billion, or -16.0% of GDP. The policy floor of -15.0% of GDP corresponds to L-37.5 billion. The shortfall \u2014 and hence the minimum additional reserve purchase, since buying reserves with a tax surplus raises assets one-for-one without changing liabilities or GDP \u2014 is L2.50 billion. The student's final answer of L2.50 billion is exactly correct.\n\nAmbiguities: None. The exchange rates, instrument classifications, and the policy rule (\"net foreign assets to be no lower than -15.0% of GDP\") are stated precisely, and the question explicitly specifies that foreign liabilities and GDP remain unchanged, removing any ambiguity about second-order effects of the reserve purchase.", "verdict": "Correct"}, {"entry_id": 257, "problem": "* Scenario: Orion Devices is evaluating a new expansion program. The project would be funded today with **$300,000,000 of idle cash already reflected in Orion\u2019s current equity market value**. No new debt or shares will be issued.\n\n  In the first full year after launch, the expansion is expected to generate **$180,000,000 in incremental revenue**. Its EBITDA margin is expected to be **22%**, annual depreciation will be **$8,000,000**, there is no incremental interest expense, and the corporate tax rate is **25%**. Orion has **60,000,000 shares outstanding**.\n\n  For the project\u2019s risk, analysts use CAPM. The risk-free rate is **4.20%**, Orion\u2019s relevant equity beta for this expansion is **1.15**, and the expected market return is **10.20%**. The expansion\u2019s long-run sustainable earnings growth is based on a **60% retention ratio** and a **7.5% return on reinvested equity**. Assume the first year\u2019s incremental equity earnings occur one year from today and then grow perpetually at the sustainable rate.\n\n* The Core Question: Assuming efficient markets and no signaling or financing frictions, what is the **net dollar change in Orion\u2019s total equity market value attributable to approving the expansion**, after accounting for the immediate use of idle cash? Round to the nearest whole dollar and state whether it is an increase or decrease.", "answer": "**$59,090,909 increase**", "feedback": "Verdict: Incorrect\n\nAnalysis: The student's final answer of a **$59,090,909 increase** does not match my independently derived result. My hidden calculation yields incremental net income of $23,700,000 in year one (revenue $180M \u00d7 22% EBITDA margin = $39.6M; less $8M depreciation = $31.6M EBIT; less 25% tax = $23.7M), a CAPM cost of equity of 11.10% (4.20% + 1.15 \u00d7 6.00%), and a sustainable growth rate of 4.50% (0.60 \u00d7 7.5%). The critical step is that with a 60% retention ratio, only 40% of earnings \u2014 $9,480,000 \u2014 is distributable free cash flow to equity in year one. Valuing this via the growing perpetuity: $9,480,000 / (0.1110 \u2212 0.0450) = $143,636,364. Netting against the $300,000,000 of idle cash deployed gives a **decrease of $156,363,636** in equity market value (intuitively sensible, since the project reinvests at 7.5%, well below the 11.1% required return, destroying value).\n\nThe student's specific figure reveals their error precisely: they discounted the **entire** $23,700,000 of earnings as the perpetuity cash flow ($23.7M / 0.066 = $359,090,909; less $300M = $59,090,909). This double-counts retained earnings \u2014 one cannot simultaneously apply growth funded by 60% retention *and* treat 100% of earnings as distributable cash flow. This is the classic Gordon Growth Model conceptual error of conflating earnings with dividends/FCFE.\n\nAmbiguities: The phrase *\"Assume the first year's incremental equity earnings occur one year from today and then grow perpetually at the sustainable rate\"* is the main source of ambiguity. By instructing the reader to grow \"earnings\" rather than \"dividends\" or \"free cash flow to equity,\" the question invites the (incorrect) interpretation of capitalizing full earnings \u2014 exactly the trap the student fell into. A more precise question would state: \"value the project as the present value of distributable equity cash flows (earnings \u00d7 payout ratio), growing at the sustainable rate.\" Additionally, *\"return on reinvested equity\"* could have been more conventionally labeled \"return on equity (ROE) on retained earnings\" to reinforce that retention reduces distributable cash flow.", "verdict": "Incorrect"}, {"entry_id": 258, "problem": "* Scenario:  \n  At year-end, the nation of Aurelia reports the following cross-border financial positions. The spot exchange rate is **1 U.S. dollar = 1.20 Aurelian crowns**.\n\n  Aurelia residents\u2019 claims on nonresidents are:\n  - Official foreign exchange reserves: **US$300 billion**\n  - Foreign sovereign bond portfolio: **144 billion crowns**\n  - Foreign equity holdings: **US$85 billion**\n  - Outward direct investment: **210 billion crowns**\n  - Loans to foreign borrowers: **US$60 billion**\n\n  Nonresidents\u2019 claims on Aurelia are:\n  - Foreign holdings of Aurelia government bonds: **480 billion crowns**\n  - Inward direct investment: **US$250 billion**\n  - Domestic equities held by foreign investors: **300 billion crowns**\n  - External bank debt owed to foreign lenders: **US$150 billion**\n  - Trade credit owed to foreign suppliers: **48 billion crowns**\n\n  Aurelia\u2019s GDP is **1,800 billion crowns**. A stabilization rule requires Aurelia\u2019s net external position to be **no worse than \u221210.0% of GDP**, measured in U.S. dollars. Assume Aurelia can acquire additional foreign reserve assets using domestic-currency fiscal resources, so the purchase increases foreign claims one-for-one and does not change foreign liabilities, GDP, or the exchange rate.\n\n* The Core Question:  \n  What is the **minimum additional amount of foreign reserve assets**, in **U.S. dollars**, that Aurelia must acquire to satisfy the stabilization rule, rounded to the nearest whole **US$ billion**?", "answer": "**US$200 billion**", "feedback": "Verdict: Correct\n\nAnalysis: The student's final answer of US$200 billion matches my independently derived result exactly. Converting all crown-denominated positions to U.S. dollars at 1.20 crowns per dollar yields total external assets of US$740 billion and total external liabilities of US$1,090 billion, producing a net international investment position of \u2212US$350 billion. GDP converts to US$1,500 billion, so the \u221210.0% floor corresponds to \u2212US$150 billion. The shortfall \u2014 and thus the minimum reserve acquisition needed (which raises assets one-for-one) \u2014 is US$350 billion \u2212 US$150 billion = US$200 billion. The student handled the currency conversions, the netting of positions, the GDP conversion, and the threshold computation correctly.\n\nAmbiguities: The phrase \"measured in U.S. dollars\" is slightly informal \u2014 strictly speaking, the ratio of net position to GDP is unit-free, so the question intends that both the net position and GDP be converted to dollars at the given spot rate (which yields the same ratio as a crown-based calculation, so no numerical ambiguity arises here). Additionally, \"no worse than \u221210.0% of GDP\" could pedantically be read as a strict versus weak inequality, but since the required purchase lands exactly at the boundary, the standard weak-inequality reading (\u2265 \u221210.0%) gives US$200 billion. Otherwise, the question is precise.", "verdict": "Correct"}, {"entry_id": 259, "problem": "* Scenario: Horizon Robotics is evaluating a one-year growth opportunity: launching an add-on sensor module. The module is expected to sell 200,000 units at a cash selling price of $150 per unit during the next year. Cash variable production costs are expected to be $45 per unit, and incremental annual cash fixed overhead will be $3,000,000. The corporate tax rate is 25%, paid at year-end, and for this screening model there are no depreciation deductions, residual values, discontinued operations, or nonrecurring items.  \n   \n  To launch the module, Horizon must pay $10,800,000 for specialized equipment, $700,000 for commissioning and installation, and permanently tie up $500,000 in incremental working capital at time 0.  \n   \n  Horizon\u2019s current market capitalization is based on 2,100,000 common shares trading at $40 per share. It also has debt with a current market value of $36,000,000. The risk-free rate is 3.5%, Horizon\u2019s equity beta is 1.20, and the expected market risk premium is 5.0%. Horizon\u2019s pre-tax borrowing rate is 6.0%, and the same 25% corporate tax rate applies to the interest tax shield. Assume the project is discounted at Horizon\u2019s market-value WACC. If accepted, the project\u2019s NPVGO is immediately reflected dollar-for-dollar in common equity value, with no new shares issued.\n\n* The Core Question: What is the expected increase in Horizon\u2019s intrinsic value per common share from this growth opportunity, rounded to the nearest cent?", "answer": "$0.24 per share", "feedback": "Verdict: Correct\n\nAnalysis: The student's final answer of $0.24 per share matches my independently derived result. Working internally: the project's after-tax operating cash flow at year-end, discounted at the firm's market-value WACC (which comes out to a clean 8.0% given the 70/30 capital structure, a 9.5% CAPM cost of equity, and a 4.5% after-tax cost of debt), yields a present value of $12.5 million against a total time-0 outlay of $12 million (equipment, installation, and permanently committed working capital). The resulting NPVGO of $500,000 spread over 2,100,000 existing shares gives $0.2381, which correctly rounds to $0.24. The student handled all the key traps properly: including installation in the capitalized cost, treating the working capital as a non-recoverable time-0 outflow (since it is \"permanently\" tied up), applying the tax shield to the cost of debt only, and dividing by existing shares with no dilution.\n\nAmbiguities: The phrase \"permanently tie up $500,000 in incremental working capital\" is the main point requiring interpretation \u2014 for a one-year project, students might conventionally assume working capital is recovered at year-end, which would change the NPV materially (recovering $500,000 at year 1 would add roughly $0.46 million in PV and change the answer to about $0.46 per share). The word \"permanently\" resolves this, but it sits in tension with the \"one-year growth opportunity\" framing. Additionally, \"the project's NPVGO is immediately reflected dollar-for-dollar in common equity value\" presumes the student knows to divide the full NPV by common shares only, which is stated but could be misread by students who attempt to allocate value between debt and equity.", "verdict": "Correct"}, {"entry_id": 260, "problem": "* Scenario: A limited partner commits **$125,000,000** to a private equity fund. The fund\u2019s cash flows occur exactly one year apart:\n  * At closing, the fund calls **80%** of the commitment.\n  * One year later, it calls an additional **16%** of the commitment.\n  * Two years after closing, it makes a gross distribution equal to **60%** of the commitment.\n  * Three years after closing, it makes a final gross distribution equal to **101.76%** of the commitment.\n\n  Under the fund terms, each positive gross distribution is reduced by a **2.00% fee deduction** and then by a **20.00% carried-interest deduction** before being evaluated from the LP\u2019s perspective. Capital calls are not reduced by these deductions. The LP\u2019s required minimum annual net return is **10.50%**.\n\n* The Core Question: What is the LP\u2019s after-fee, after-carry annual IRR spread over the 10.50% required minimum return, expressed in **basis points** and rounded to the nearest whole basis point?", "answer": "**150 bps**", "feedback": "Verdict: Correct\n\nAnalysis: The student's final answer of **150 bps** matches my independently derived result exactly. Working through the problem internally: the capital calls are $100M at closing and $20M at year 1; the gross distributions of $75M (year 2) and $127.2M (year 3) are reduced by the combined deduction factor of 0.98 \u00d7 0.80 = 0.784, yielding net distributions of $58.8M and $99.7248M. The net IRR of this cash flow stream solves exactly to 12.00% annually (the cash flows appear deliberately engineered to produce a clean root \u2014 the NPV at 12% nets to precisely zero). The spread over the 10.50% required minimum is 12.00% \u2212 10.50% = 1.50%, which equals 150 basis points. The student's answer is correct with no rounding discrepancy, since the IRR is exact.\n\nAmbiguities: The question is largely precise, but two phrasings merit note: (1) \"reduced by a 2.00% fee deduction and then by a 20.00% carried-interest deduction\" \u2014 the word \"then\" clarifies the sequential (multiplicative) application order, i.e., (1 \u2212 0.02)(1 \u2212 0.20) = 0.784, rather than an additive 22% reduction. A careless reader could apply 0.78 instead of 0.784, which would slightly lower the IRR and the spread. (2) \"spread over the 10.50% required minimum return\" \u2014 the question implies a simple arithmetic difference (12.00% \u2212 10.50%), but a geometric/compounded excess return interpretation (1.12/1.105 \u2212 1 \u2248 1.357%, i.e., ~136 bps) is theoretically defensible. The intended and conventional reading (arithmetic spread) gives 150 bps, which the student correctly provided.", "verdict": "Correct"}, {"entry_id": 261, "problem": "* Scenario: A firm is currently valued by the market at a no-growth share price of $38.00, with 500,000 shares outstanding. It is considering a one-year expansion project. If launched today, the project requires immediate spending of $1,100,000 for production rights, $350,000 for equipment customization, and $150,000 for launch tooling.  \n  At the end of one year, the project is expected to sell 120,000 units at $70 per unit. Variable cash cost is $42 per unit, and incremental fixed cash operating cost is $900,000. The corporate tax rate is 25%, and all project operating amounts are cash-based.  \n  The firm\u2019s target capital structure is 60% equity and 40% debt by market value. The risk-free rate is 4%, the project beta is 1.20, the market risk premium is 6%, and the firm can borrow at a 6% pre-tax rate. Assume the market immediately and fully capitalizes the project\u2019s incremental value into equity value.\n\n* The Core Question: What is the firm\u2019s total equity market capitalization immediately after announcing acceptance of the project, rounded to the nearest whole dollar?", "answer": "$19,100,147", "feedback": "Verdict: Correct\n\nAnalysis: The student's final answer of $19,100,147 matches my independently derived result exactly. The pre-project equity capitalization ($38.00 \u00d7 500,000 = $19,000,000) plus the project NPV (initial outlay of $1,600,000 against a year-one after-tax operating cash flow of $1,845,000 discounted at the firm's WACC of 8.52% \u2014 built from a CAPM cost of equity of 11.2% and an after-tax cost of debt of 4.5% at 60/40 weights) yields an NPV of approximately $100,147, giving a post-announcement market capitalization of $19,100,147. The student correctly treated all operating amounts as cash-based (no depreciation tax shield), applied the tax rate to operating income, and discounted at the WACC rather than the cost of equity.\n\nAmbiguities: \n1. \"all project operating amounts are cash-based\" \u2014 this implies no depreciation, but a student could reasonably ask whether the $350,000 equipment customization should be depreciated and generate a tax shield, which would change the year-one cash flow.\n2. \"If launched today, the project requires immediate spending\" \u2014 the question does not explicitly state whether the initial outlays are tax-deductible (expensed) or capitalized; treating the $1,600,000 as a deductible expense would create an immediate tax shield and a different NPV.\n3. \"the project is expected to sell 120,000 units\" \u2014 no salvage value or terminal effects are mentioned, so it is implied (but not stated) that the project terminates cleanly after one year with no recovery of the equipment or rights value.\n4. The phrase \"no-growth share price of $38.00\" is intended to anchor the pre-announcement equity value, but a student could question whether announcement effects on debt value or capital structure rebalancing should be considered; the instruction that the market \"fully capitalizes the project's incremental value into equity\" largely resolves this, though it implicitly assumes the entire NPV accrues to shareholders.", "verdict": "Correct"}, {"entry_id": 262, "problem": "* Scenario:  \n  Meridian Systems is evaluating the market value embedded in its approved future expansion projects. The projects are expected to generate, next fiscal year, incremental revenue of **$80,000,000**. Variable operating costs are expected to equal **50% of revenue**, incremental fixed cash operating costs will be **$12,000,000**, and incremental depreciation will be **$4,000,000**. The projects are all-equity financed, so there is no incremental interest expense. The corporate tax rate is **25%**.\n\n  Meridian has **no treasury stock**. Its common shares have a **$0.50 par value**, and the common stock account on its balance sheet is **$10,000,000**.\n\n  The appropriate equity discount rate should be estimated using CAPM. The risk-free rate is **4.0%**, Meridian\u2019s equity beta is **1.20**, and the expected market risk premium is **7.0%**.\n\n  Analysts expect the earnings from these expansion projects to grow at a constant long-run rate equal to Meridian\u2019s sustainable growth rate. Meridian\u2019s retention ratio is **60%**, and the expected ROE on reinvested expansion-project earnings is **10%**.\n\n  Meridian\u2019s assets-in-place are valued at **$34.00 per share**. A private bidder has offered to acquire all outstanding shares for **$47.00 per share**.\n\n* The Core Question:  \n  Based on the intrinsic equity value including the present value of future growth opportunities, by how many dollars is the bidder\u2019s total offer below intrinsic equity value? Round to the nearest whole dollar.", "answer": "**$21,250,000**", "feedback": "Verdict: Correct\n\nAnalysis: The student's final answer of **$21,250,000** matches my independently derived result. The solution path requires: (1) computing incremental pre-tax project income of $24,000,000 (revenue $80M \u2212 variable costs $40M \u2212 fixed costs $12M \u2212 depreciation $4M), yielding after-tax earnings of $18,000,000; (2) shares outstanding of 20,000,000 ($10,000,000 common stock \u00f7 $0.50 par, with no treasury stock); (3) CAPM required return of 12.4% (4.0% + 1.20 \u00d7 7.0%); (4) sustainable growth rate of 6.0% (0.60 \u00d7 10%); (5) capitalizing the growing earnings stream as $18,000,000 \u00f7 (0.124 \u2212 0.06) = $281,250,000, or $14.0625 per share as the PVGO component; (6) intrinsic value per share of $34.00 + $14.0625 = $48.0625; and (7) the shortfall of ($48.0625 \u2212 $47.00) \u00d7 20,000,000 = **$21,250,000**. The student's figure aligns exactly with this intended computation, indicating correct handling of the tax shield, share count derivation, CAPM, and Gordon growth mechanics.\n\nAmbiguities: The phrase \"Analysts expect the **earnings** from these expansion projects to grow at a constant long-run rate\" combined with a stated **retention ratio of 60%** creates a genuine valuation ambiguity. A strict dividend discount approach would value the growth component as D\u2081/(r \u2212 g) = ($18M \u00d7 0.40)/0.064 = $112.5M ($5.625/share), giving an intrinsic value of $39.625 per share \u2014 in which case the offer of $47.00 would *exceed* intrinsic value, and the question's premise (\"below intrinsic equity value\") would fail. The question implicitly requires capitalizing full earnings E\u2081/(r \u2212 g), treating the retention ratio purely as an input to the sustainable growth rate. A rigorous student could defensibly argue the dividend-based interpretation; the question should clarify whether the $18M represents distributable free cash flow or accounting earnings subject to a 60% plowback.", "verdict": "Correct"}, {"entry_id": 263, "problem": "* Scenario: On March 31, a pension fund holds a U.S. equity portfolio with the following positions:\n\n  | Stock | Shares Held | Price per Share | Index Beta |\n  |---|---:|---:|---:|\n  | A | 120,000 | $52.40 | 1.15 |\n  | B | 80,000 | $73.25 | 0.85 |\n  | C | 150,000 | $31.80 | 1.30 |\n\n  The fund wants to hedge its beta-adjusted market exposure using E-mini S&P 500 futures. The futures contract is trading at an index level of 5,240, and each contract has a $50 multiplier. The desk defines the required hedge ratio as:\n\n  \\[\n  \\text{Hedge Ratio}=\\frac{\\text{beta-adjusted cash market exposure}}{\\text{notional value of one futures contract}}\n  \\]\n\n  The fund shorts the nearest whole number of futures contracts implied by this hedge ratio. The next day, the index and the futures price both decrease by exactly 1.80%. Assume the portfolio\u2019s loss is equal to its beta-adjusted exposure times the index return, and ignore dividends, financing, margin, and transaction costs.\n\n* The Core Question: What is the fund\u2019s net dollar P&L after applying the rounded futures hedge, with losses shown as negative values, rounded to the nearest whole dollar?", "answer": "-$1,318", "feedback": "Verdict: Correct\n\nAnalysis: The student's final answer of \u2212$1,318 matches my independently derived result. Working through the problem internally: the beta-adjusted cash exposure totals $18,413,200, one futures contract has notional of $262,000, the hedge ratio comes to approximately 70.28, which rounds to 70 contracts shorted. The portfolio loses $331,437.60 (beta-adjusted exposure \u00d7 \u22121.80%), while the short futures position gains $330,120 (70 contracts \u00d7 $50 \u00d7 the 94.32-point index decline). The net P&L is \u2212$1,317.60, which rounds to \u2212$1,318. The student correctly handled the beta-weighting of each position, the rounding of the hedge ratio, and the sign convention. Full marks.\n\nAmbiguities: The phrase \"shorts the nearest whole number of futures contracts implied by this hedge ratio\" could in principle be read as either standard rounding or truncation (floor); however, since the unrounded ratio is ~70.28, both interpretations yield 70 contracts, so the ambiguity is immaterial here. Additionally, \"the index and the futures price both decrease by exactly 1.80%\" is stated cleanly, and the instruction to compute the loss as \"beta-adjusted exposure times the index return\" removes any ambiguity about whether to apply individual stock betas to actual price moves. Otherwise, the question is precise.", "verdict": "Correct"}, {"entry_id": 264, "problem": "* Scenario: On January 1, 2026, an insurer is evaluating a new block of 800 identical life insurance policies. For each policy, the policyholder pays a gross premium of $1,250 at the beginning of each of four policy years. Under the insurer\u2019s pricing interest and lapse assumptions, the actuarial present value factor for this four-payment annuity-due premium stream is exactly 3.60.  \n  The net-premium basis values only expected benefit costs. The time-0 actuarial present values of expected benefit payments per policy are $700, $850, $650, and $300 across the four policy years.  \n  The expected present values of future policy-related expenses per policy are: $320 for administration, $480 for commissions, $150 for premium collection, and $200 for claim settlement.  \n  The insurer requires the total present value of expense loadings for the 800-policy block to be at least $700,000.\n\n* The Core Question: Using the expense-loading function, what is the dollar surplus or shortfall versus the $700,000 requirement for the full block? Report a surplus as positive and a shortfall as negative, rounded to the nearest whole dollar.", "answer": "-$20,000", "feedback": "Verdict: Correct\n\nAnalysis: The student's final answer of \u2212$20,000 matches my independently derived result. Per policy, the present value of gross premiums is $1,250 \u00d7 3.60 = $4,500, the net-premium (benefits-only) present value is $700 + $850 + $650 + $300 = $2,500, yielding an expense loading of $2,000 per policy. Deducting the total expected expenses of $320 + $480 + $150 + $200 = $1,150 leaves a net margin of $850 per policy. Scaled across the 800-policy block, this gives $680,000, which falls $20,000 short of the $700,000 requirement. The student correctly reported this as a shortfall (negative value), so the sign convention was also handled properly.\n\nAmbiguities: The phrase \"the total present value of expense loadings for the 800-policy block to be at least $700,000\" is genuinely ambiguous. A strict reading of \"expense loadings\" (gross premium PV minus net premium PV) would give $2,000 \u00d7 800 = $1,600,000, yielding a surplus of +$900,000 \u2014 and would render the itemized expense data ($320, $480, $150, $200) entirely unused. The intended interpretation is evidently the loading *net of* expected expenses (i.e., the residual margin available after covering expenses), but the question never explicitly states that the listed expenses must be subtracted from the loading before comparison to the $700,000 threshold. Clearer phrasing such as \"the present value of expense loadings net of expected expenses\" would eliminate the alternative reading.", "verdict": "Correct"}, {"entry_id": 265, "problem": "* Scenario:  \nA central bank tracks its currency, the azur, using a nominal effective exchange-rate index. For each trading partner, the bilateral nominal exchange-rate index is calculated as:\n\n\\[\n100 \\times \\frac{\\text{current spot rate in azurs per partner-currency unit}}{\\text{base-date spot rate in azurs per partner-currency unit}}\n\\]\n\nThe overall index is the trade-weighted arithmetic average of the bilateral indices, where each partner\u2019s weight equals its share of total goods trade, defined as exports plus imports, across the four listed partners.\n\nBase-date and current spot quotes, along with annual trade flows, are:\n\n| Partner | Base Spot Rate | Current Spot Rate | Exports | Imports |\n|---|---:|---:|---:|---:|\n| Euro area | 8.00 azurs/EUR | 8.40 azurs/EUR | 420 million azurs | 580 million azurs |\n| Japan | 0.060 azurs/JPY | 0.057 azurs/JPY | 250 million azurs | 350 million azurs |\n| United Kingdom | 9.50 azurs/GBP | 10.45 azurs/GBP | 160 million azurs | 240 million azurs |\n| Canada | 5.00 azurs/CAD | 5.10 azurs/CAD | 300 million azurs | 200 million azurs |\n\nThe central bank\u2019s policy board has set an alert level at an index value of **101.50**.\n\n* The Core Question:  \nWhat is the current nominal effective exchange-rate index\u2019s gap relative to the 101.50 alert level, in index points, rounded to two decimals? Report a positive number if the index is above the alert level and a negative number if it is below.", "answer": "**+1.30 index points**", "feedback": "Verdict: Correct\n\nAnalysis: My independently derived result matches the student's final answer exactly. The bilateral indices come out to 105.00 (Euro area), 95.00 (Japan), 110.00 (UK), and 102.00 (Canada), with trade weights of 0.40, 0.24, 0.16, and 0.20 respectively (total trade of 2,500 million azurs). The trade-weighted average yields an effective index of 102.80, and the gap versus the 101.50 alert level is 102.80 \u2212 101.50 = +1.30 index points. The student also correctly reported the sign convention (positive, since the index exceeds the alert level) and the required two-decimal rounding.\n\nAmbiguities: The question is largely precise, but one phrase merits comment: \"trade-weighted arithmetic average\" could in principle be contrasted with a geometric average, which is the convention many actual central banks use for effective exchange-rate indices. However, the question explicitly specifies \"arithmetic,\" so no genuine ambiguity remains. Additionally, \"its share of total goods trade... across the four listed partners\" clearly restricts the weight denominator to the listed partners only, foreclosing any alternative weighting interpretation. Effectively: None.", "verdict": "Correct"}, {"entry_id": 266, "problem": "* Scenario: On January 2, 2026, a non-dividend-paying stock has an equity market capitalization of $250,000,000 and 2,500,000 shares outstanding. A European option expires on January 2, 2027 and gives the holder the right to buy 10,000 shares for a total exercise payment of $1,000,000. Use an ACT/365 year count. The matching-maturity continuously compounded risk-free zero rate is implied by a one-year Treasury zero-coupon bill priced at $95.12294245 per $100 face value. The stock\u2019s annualized continuously compounded return variance is estimated to be 0.0400. The option is quoted in the market at $9.90 per share-equivalent. A trading desk buys 50 standard option contracts, each covering 100 shares, and immediately marks the position to the Black-Scholes theoretical value, ignoring transaction costs.\n\n* The Core Question: What is the desk\u2019s net dollar mark-to-model profit from the purchase, rounded to the nearest whole dollar?", "answer": "$2,753", "feedback": "Verdict: Correct\n\nAnalysis: My independently derived result matches the student's answer. Solving in my head: the share price is $100 (market cap divided by shares outstanding), the per-share strike is $100, the T-bill price implies a continuously compounded rate of exactly 5%, the variance of 0.04 gives volatility of 20%, and the maturity is exactly one year under ACT/365. The Black-Scholes inputs yield d\u2081 = 0.35 and d\u2082 = 0.15, giving a theoretical call value of approximately $10.4506 per share. The mark-to-model gain is therefore $10.4506 \u2212 $9.90 \u2248 $0.5506 per share, and with 50 contracts \u00d7 100 shares = 5,000 shares, the net profit is approximately $2,752.9, which rounds to $2,753. The student's final answer is exactly correct.\n\nAmbiguities:\n1. \"The option is quoted in the market at $9.90 per share-equivalent\" \u2014 the term \"per share-equivalent\" is slightly nonstandard; a student could conceivably misread it as a total contract price rather than a per-share price, though the intended meaning is clear from context.\n2. \"gives the holder the right to buy 10,000 shares for a total exercise payment of $1,000,000\" \u2014 this describes a single large option used only to define the per-share strike; a careless reader might confuse this 10,000-share instrument with the desk's 5,000-share position when scaling the profit.\n3. \"Use an ACT/365 year count\" \u2014 January 2, 2026 to January 2, 2027 spans 365 days, giving T = 1 exactly, but a student could debate whether to count 365 or 366 days depending on day-inclusion conventions (it does not materially change the answer here, but the phrasing leaves a small interpretive gap).", "verdict": "Correct"}, {"entry_id": 267, "problem": "* Scenario:  \nA pension fund placed cash into a 1-year institutional deposit account on January 1. The opening balance was **$18,750,000**. On December 31, the account paid **$1,068,750** of interest. Over the same period, the CPI index increased from **250.0** to **257.5**.  \n\nFor its performance report, the fund measures the deposit\u2019s inflation-adjusted annual return using the standard short-horizon approximation: nominal annual return minus annual inflation. The fund\u2019s required real return hurdle for cash investments is **2.25%**.\n\n* The Core Question:  \nWhat is the fund\u2019s **dollar surplus over the real return hurdle**, rounded to the nearest whole dollar?", "answer": "**$84,375**", "feedback": "Verdict: Correct\n\nAnalysis: The student's final answer matches my independently derived result. The nominal return works out to 5.70%, annual inflation to 3.00%, giving an approximate real return of 2.70%. The surplus over the 2.25% hurdle is 0.45%, which applied to the $18,750,000 principal yields exactly $84,375. The student correctly used the additive (short-horizon approximation) method as instructed, rather than the exact Fisher relation, and correctly applied the surplus percentage to the opening balance.\n\nAmbiguities: The phrase \"dollar surplus over the real return hurdle\" leaves slightly open the question of which base the surplus percentage should be applied to \u2014 the question implies the opening balance ($18,750,000), but a pedantic reader could ask whether the surplus should be computed in \"real dollars\" (e.g., deflated end-of-year dollars). Additionally, had the question not explicitly mandated the \"standard short-horizon approximation,\" a student using the exact Fisher equation (real return \u2248 2.6214%) would obtain a different surplus (~$69,629), so the explicit instruction is what removes that ambiguity \u2014 but the instruction is clearly stated, so the question is effectively precise.", "verdict": "Correct"}, {"entry_id": 268, "problem": "* Scenario:  \nA derivatives desk is evaluating a European call option on a non-dividend-paying stock. The company has 5,000,000 shares outstanding and an equity market capitalization of $210,000,000. Each option contract covers 100 shares, and exercising one contract requires a total payment of $4,000.  \n\nThe valuation date is January 2 of a non-leap year, and the option expires at the close of trading on July 1 of the same year. Use an ACT/360 year-count convention. A zero-coupon government STRIP maturing on the option expiration date trades at $95.12294245 per $100 face value; infer the continuously compounded annual risk-free rate from this STRIP. The annualized variance quote for the stock over the same horizon is 0.0400.  \n\nThe desk can buy 1,000 of these call option contracts in the market at a premium of $4.20 per underlying share. Ignore transaction costs.\n\n* The Core Question:  \nUsing the Black-Scholes option price as the mark-to-model value, what is the desk\u2019s immediate total dollar gain or loss from buying the 1,000 contracts, rounded to the nearest whole dollar?", "answer": "$55,942", "feedback": "Verdict: Correct\n\nAnalysis: My independently derived result matches the student's answer. From the given data: the spot price is $210,000,000 / 5,000,000 = $42 per share; the strike is $4,000 / 100 = $40 per share; the day count from January 2 to July 1 (non-leap year) is exactly 180 days, giving T = 180/360 = 0.5 under ACT/360; the STRIP price implies a continuously compounded rate of exactly 10% (since 95.12294245 = 100\u00b7e^(\u22120.10\u00d70.5)); and the volatility is \u221a0.04 = 20%. Plugging into Black-Scholes yields d\u2081 \u2248 0.7693, d\u2082 \u2248 0.6278, N(d\u2081) \u2248 0.7791, N(d\u2082) \u2248 0.7349, giving a model call value of approximately $4.7594 per share. The desk pays $4.20 per share, so the per-share gain is \u2248 $0.5594. With 1,000 contracts \u00d7 100 shares = 100,000 shares, the total immediate mark-to-model gain is \u2248 $55,942. The student's answer of $55,942 is exactly correct (this scenario reproduces the classic textbook parameterization S = 42, K = 40, r = 10%, \u03c3 = 20%, T = 0.5, c \u2248 4.76).\n\nAmbiguities: The phrase \"expires at the close of trading on July 1\" combined with \"valuation date is January 2\" leaves slight room for interpretation on whether the day count should include or exclude the endpoint dates (i.e., 179, 180, or 181 days). However, the STRIP price of 95.12294245 is engineered so that only the 180-day interpretation yields a clean r = 10%, effectively resolving the ambiguity. Otherwise, the question is precise.", "verdict": "Correct"}, {"entry_id": 269, "problem": "* Scenario: An oil and gas company is testing its year-end reserve-replacement covenant. At the start of the year, it had 500.0 MMboe of proved reserves. At year-end, after all reserve accounting entries, it reports 502.8 MMboe of proved reserves. During the year, it sold a mature field package containing 10.0 MMboe of proved reserves. It made no reserve acquisitions and had no negative reserve revisions. Its production records show 26.0 million barrels of liquids and 228.0 Bcf of natural gas produced during the year. Use the standard conversion of 6 Mcf of gas = 1 boe. Under its credit agreement, if its reserve-replacement ratio is below 125.0%, it must pay a cash covenant fee of $2,000,000 for each percentage point of shortfall.\n\n* The Core Question: What cash covenant fee must the company pay, rounded to the nearest whole dollar?", "answer": "$10,000,000", "feedback": "Verdict: Correct\n\nAnalysis: The student's final answer of $10,000,000 matches my independently derived result. Converting the gas production (228.0 Bcf \u00f7 6) and adding liquids gives total production of 64.0 MMboe. Backing out organic reserve additions from the reserve roll-forward (ending reserves of 502.8 = 500.0 \u2212 64.0 production \u2212 10.0 sold + additions) yields 76.8 MMboe of additions. The reserve-replacement ratio is therefore 76.8 / 64.0 = 120.0%, a 5.0 percentage-point shortfall versus the 125.0% covenant threshold. At $2,000,000 per percentage point, the fee is exactly $10,000,000. The student correctly performed the gas-to-boe conversion, correctly adjusted the roll-forward for the divestiture (a common trap \u2014 failing to add back the 10.0 MMboe sold would yield additions of 66.8 MMboe, an RRR of 104.375%, and an incorrect fee of $41,250,000), and applied the fee formula properly.\n\nAmbiguities: The phrase \"reserve-replacement ratio\" is not explicitly defined in the problem. The standard organic definition (reserve additions \u00f7 production, with additions inferred net of sales from the roll-forward) is the intended one, but an alternative \"all-in\" interpretation using the simple net reserve change plus production, i.e., (502.8 \u2212 500.0 + 64.0) / 64.0, would treat the divestiture as a reserve loss and yield a different ratio (104.375%) and fee ($41,250,000). The statement that the company \"made no reserve acquisitions and had no negative reserve revisions\" strongly signals the organic-additions interpretation, but explicitly defining RRR (e.g., \"extensions and discoveries divided by production\") would remove all doubt. Additionally, \"for each percentage point of shortfall\" could conceivably be read as applying only to whole percentage points rather than pro-rata fractions; here the shortfall is exactly 5.0 points, so the readings coincide.", "verdict": "Correct"}, {"entry_id": 270, "problem": "* Scenario: An oil and gas producer is reviewing its year-end reserve sustainability. For the year just ended, proved reserve changes were as follows:\n  * Extensions and discoveries: 24.0 million barrels of oil plus 72 Bcf of natural gas\n  * Improved recovery: 8.5 million BOE\n  * Positive engineering revisions: 5.0 million BOE\n  * Purchases of proved reserves: 3.0 million barrels of oil plus 30 Bcf of natural gas\n  * Divestitures of proved reserves: 2.0 million BOE\n\n  During the same year, the company produced:\n  * Oil: 31.0 million barrels\n  * Natural gas: 132 Bcf\n\n  Use the conversion convention 6 Mcf of natural gas = 1 BOE. Management requires the company\u2019s annual reserve-replacement ratio to be at least 100.00%.\n\n* The Core Question: By how many percentage points did the company exceed or fall short of the 100.00% reserve-replacement benchmark? Report the spread in percentage points, rounded to 2 decimal places, and state whether the benchmark was met.", "answer": "4.72 percentage points above benchmark; benchmark met.", "feedback": "Verdict: Correct\n\nAnalysis: The student's final answer matches my independently derived result. Converting gas at 6 Mcf per BOE, total reserve additions (extensions and discoveries, improved recovery, revisions, and purchases, net of divestitures) sum to 55.5 MMBOE, while total production equals 53.0 MMBOE. The resulting reserve-replacement ratio is approximately 104.72%, which is 4.72 percentage points above the 100.00% benchmark. The student correctly identified both the spread (4.72 percentage points above) and the qualitative conclusion (benchmark met). The rounding to two decimal places is accurate.\n\nAmbiguities: The question contains a few points that could invite alternative interpretations:\n1. \"Reserve-replacement ratio\" is not explicitly defined in the problem. The standard \"all-sources\" definition (including purchases and netting divestitures) appears intended, but some practitioners compute an \"organic\" RRR excluding acquisitions and divestitures, which would yield a different result (49.5/53 \u2248 93.40%, falling short of the benchmark).\n2. \"Divestitures of proved reserves: 2.0 million BOE\" \u2014 it is implied but not explicitly stated that divestitures should be subtracted from additions rather than ignored or treated as production-adjusting.\n3. The phrase \"positive engineering revisions\" is clear in sign, but problems sometimes leave revision treatment ambiguous; here it is precise.\n\nOverall, under the most conventional all-sources interpretation, the student's answer is fully correct.", "verdict": "Correct"}, {"entry_id": 271, "problem": "* Scenario:  \n  As of the close on January 2, 2026, Orion Systems pays no dividends. Its total equity market capitalization is $7.500 billion, and it has 75.000 million shares outstanding.  \n\n  A European call option on Orion expires at the close on January 2, 2027. The contract\u2019s strike price is set equal to the prior 10-trading-day VWAP. Over those 10 days, Orion\u2019s aggregate traded dollar value was $1.250 billion across 12.500 million shares. Use an ACT/365 year-count convention.  \n\n  A zero-coupon Treasury maturing on January 2, 2027 trades today at $95.12294245 per $100 face value; use the continuously compounded annual risk-free rate implied by that price.  \n\n  Orion\u2019s volatility estimate is based on the prior 252 trading days of log returns. The sum of squared deviations of those daily log returns from their sample mean is 0.03984126984. Annualize the sample variance using 252 trading days per year.  \n\n  A dealer quotes this European call at a premium of $9.80 per share. A hedge fund can buy 2,000 option contracts, each covering 100 shares, at that quoted premium.\n\n* The Core Question:  \n  Using the standard no-dividend European option pricing model with continuous compounding, what is the hedge fund\u2019s tota
